# Non-production evidence only: read-only checkout, no deployment environment or secrets.
name: ACS repair evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acs-repair-evidence.yml'
      - 'acs-orchestrator/**'
      - 'server/**'
      - 'docs/engineering/acs-repair/**'
      - 'Dockerfile'

permissions:
  contents: read

concurrency:
  group: acs-repair-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Exact-source repair evidence (failures remain failures)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
      - name: Install locked development dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile
      - name: Record exact source and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/acs-repair-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/acs-repair-evidence/source-sha.txt"
          node --version > "$RUNNER_TEMP/acs-repair-evidence/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/acs-repair-evidence/toolchain.txt"
          python3 --version >> "$RUNNER_TEMP/acs-repair-evidence/toolchain.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/acs-repair-evidence/lockfile-sha256.txt"
          printf '%s\n' '{"runId":"${{ github.run_id }}","attempt":${{ github.run_attempt }},"headSha":"${{ github.event.pull_request.head.sha }}","productionActions":false}' > "$RUNNER_TEMP/acs-repair-evidence/run.json"
      - name: Server and orchestrator type checks
        id: types
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (pnpm -F server typecheck && pnpm -F acs-orchestrator typecheck) 2>&1 | tee "$RUNNER_TEMP/acs-repair-evidence/typecheck.log"
      - name: Actual baseline-module regressions
        id: regressions
        continue-on-error: true
        run: pnpm -F acs-orchestrator exec vitest run src/acsHangRegression.test.ts src/ownershipReaderRegression.test.ts --reporter=json --outputFile="$RUNNER_TEMP/acs-repair-evidence/regressions.json"
      - name: Ownership integration and protocol coverage
        id: primitives
        continue-on-error: true
        run: pnpm -F acs-orchestrator exec vitest run src/ownershipPrimitives.test.ts src/ownedWorkIntegration.test.ts src/ownedBudgetRegression.test.ts src/provisionBudgets.test.ts src/remoteAttemptProtocol.security.test.ts --reporter=json --outputFile="$RUNNER_TEMP/acs-repair-evidence/primitives.json"
      - name: Real Linux supervisor and durable receiver processes
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 120s python3 -m unittest discover -v -s acs-orchestrator/src/remote -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/acs-repair-evidence/native-processes.log"
      - name: Existing line and environment ratchets
        id: ratchets
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm check:ratchets 2>&1 | tee "$RUNNER_TEMP/acs-repair-evidence/ratchets.log"
      - name: Existing orchestrator bundle
        id: bundle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm -F acs-orchestrator build 2>&1 | tee "$RUNNER_TEMP/acs-repair-evidence/bundle.log"
          find acs-orchestrator/dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/acs-repair-evidence/bundle-sha256.txt"
      - name: Publish individual test verdicts without hiding a failed gate
        if: always()
        shell: bash
        run: |
          node --input-type=module - "$RUNNER_TEMP/acs-repair-evidence" <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.argv[2];
          const lines = [];
          for (const suite of ['regressions', 'primitives']) {
            const file = join(root, `${suite}.json`);
            if (!existsSync(file)) { lines.push(`${suite}: NOT_RUN (no test report)`); continue; }
            const report = JSON.parse(readFileSync(file, 'utf8'));
            lines.push(`${suite}: PASS=${report.numPassedTests} FAIL=${report.numFailedTests} PENDING=${report.numPendingTests}`);
            for (const fileResult of report.testResults ?? []) {
              for (const test of fileResult.assertionResults ?? []) {
                lines.push(`${test.status.toUpperCase()}: ${test.fullName}`);
                for (const message of test.failureMessages ?? []) lines.push(message.slice(0, 1800));
              }
            }
          }
          const text = lines.join('\n') + '\n';
          console.log(text);
          writeFileSync(join(root, 'verdicts.txt'), text);
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acs-repair-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acs-repair-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the aggregate failure verdict
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          PRIMITIVES: ${{ steps.primitives.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          RATCHETS: ${{ steps.ratchets.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
        run: |
          test "$TYPES" = success && test "$REGRESSIONS" = success && test "$PRIMITIVES" = success && test "$NATIVE" = success && test "$RATCHETS" = success && test "$BUNDLE" = success
