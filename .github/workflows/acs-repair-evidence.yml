# Non-production source regressions. No environments, secrets or deployment steps.
name: ACS repair evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acs-repair-evidence.yml'
      - 'acs-orchestrator/**'
      - 'server/**'
      - 'docs/engineering/acs-repair/**'

permissions:
  contents: read

concurrency:
  group: acs-repair-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Actual-source hang and ownership regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
      - name: Install locked development dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile
      - name: Record exact source and execute real modules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/acs-repair-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/acs-repair-evidence/source-sha.txt"
          node --version > "$RUNNER_TEMP/acs-repair-evidence/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/acs-repair-evidence/toolchain.txt"
          pnpm -F acs-orchestrator exec vitest run src/acsHangRegression.test.ts src/ownershipReaderRegression.test.ts --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/acs-repair-evidence/regressions.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acs-repair-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acs-repair-evidence/
          if-no-files-found: error
          retention-days: 14
