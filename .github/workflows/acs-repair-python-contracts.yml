name: ACS remote Python contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'acs-orchestrator/src/remote/**'
      - 'acs-orchestrator/src/remoteAttempt*'
      - 'acs-orchestrator/src/sandboxRunner*'
      - 'Dockerfile'
      - '.github/workflows/acs-repair-python-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'acs-orchestrator/src/remote/**'
      - 'acs-orchestrator/src/remoteAttempt*'
      - 'acs-orchestrator/src/sandboxRunner*'
      - 'Dockerfile'
      - '.github/workflows/acs-repair-python-contracts.yml'

permissions:
  contents: read

concurrency:
  group: acs-python-contracts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Actual isolated remote process and receive spool
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source and interpreter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acs-python-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/acs-python-evidence/source-sha.txt"
          python3 --version > "$RUNNER_TEMP/acs-python-evidence/python-version.txt"
          printf '%s\n' '${{ github.run_id }}' > "$RUNNER_TEMP/acs-python-evidence/run-id.txt"
          printf '%s\n' '${{ github.run_attempt }}' > "$RUNNER_TEMP/acs-python-evidence/run-attempt.txt"
          find acs-orchestrator/src/remote -maxdepth 1 -name '*.py' -type f -print0 |
            sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/acs-python-evidence/source-digests.txt"
      - name: Execute actual remote worker modules in temporary directories
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s acs-orchestrator/src/remote -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/acs-python-evidence/contracts.log"
      - name: Retain evidence even when a contract fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acs-python-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acs-python-evidence/
          if-no-files-found: error
          retention-days: 14
