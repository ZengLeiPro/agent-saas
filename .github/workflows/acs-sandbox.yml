name: ACS CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.npmrc'
      - 'patches/**'
      - 'acs-orchestrator/**'
      - 'server/src/agent/**'
      - 'server/src/runtime/handProtocol.ts'
      - 'server/src/runtime/httpTransport.ts'
      - 'server/src/runtime/inProcessTransport.ts'
      - 'server/src/runtime/clientDaemonTransport.ts'
      - 'server/src/runtime/networkPolicy.ts'
      - 'server/src/runtime/rawAgentLoop.ts'
      - 'server/src/runtime/rawRuntimeRunDispatch.ts'
      - 'server/src/runtime/handStore.ts'
      - 'server/src/data/tenants/types.ts'
      - 'server/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/acs-sandbox.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/acs-classify.sh'
      - '.github/scripts/redeliver_acr_webhook.py'
      - 'scripts/apply-orchestrator-env.py'
      - 'scripts/deploy-acs-orchestrator.sh'
      - 'scripts/release/upload-oss-object-immutable.sh'
      - 'scripts/release/runtime-dependency.mjs'
      - 'scripts/release/artifact-lib.mjs'
      - 'config/runtime-dependency-contract.json'
      - 'scripts/acs-browser-lease-e2e.mjs'
      - 'workspace-shared/.ky-agent/skills-pool/browser/scripts/acs_browser.py'
      - 'scripts/acs-verify-per-session.py'
      - 'scripts/test_acs_operational_scripts.py'
      - 'scripts/test_acr_webhook_redelivery.py'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even when no ACS-relevant change since the production SHA'
        type: boolean
        default: false

env:
  NODE_VERSION: '22.23.1'
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REGION_ID: cn-shenzhen
  ECS_DEPLOY_ROOT: /opt/agent-saas
  ACS_SERVICE_NAME: agent-saas-acs-orchestrator.service

jobs:
  acs-impact-gate:
    name: ACS Impact Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify ACS impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"

          changed_files="$RUNNER_TEMP/acs-pr-changed-files.txt"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          out="$RUNNER_TEMP/acs-pr-classification.out"
          bash .github/scripts/acs-classify.sh "$changed_files" "$BASE_SHA" > "$out"
          cat "$out"

          publish="$(sed -n 's/^publish=//p' "$out")"
          contract_check="$(sed -n 's/^contract_check=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped="$(sed -n 's/^skipped=//p' "$out")"
          case "$publish:$contract_check" in
            true:*|*:true) required=true ;;
            false:false) required=false ;;
            *) echo "::error title=ACS classifier contract::Invalid classifier result"; exit 1 ;;
          esac
          {
            echo "required=$required"
            echo "publish=$publish"
            echo "contract_check=$contract_check"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ACS Impact Gate"
            echo
            if [ "$required" = "true" ]; then
              echo "- result: \`required\`"
              echo "- reasons: $reason"
            else
              echo "- result: \`not_required\`"
              echo "- skipped inputs: $skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        if: steps.impact.outputs.required == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.impact.outputs.required == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.impact.outputs.required == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck server and orchestrator
        if: steps.impact.outputs.required == 'true'
        run: |
          pnpm -F server typecheck
          pnpm -F acs-orchestrator typecheck

      - name: Test orchestrator
        if: steps.impact.outputs.required == 'true'
        run: pnpm -F acs-orchestrator test

      - name: Test ACS operational scripts
        if: steps.impact.outputs.required == 'true'
        run: >-
          python3 -m unittest
          scripts/test_acs_operational_scripts.py
          scripts/test_acr_webhook_redelivery.py

  changes:
    name: Classify ACS Impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request'

    outputs:
      publish: ${{ steps.filter.outputs.publish }}
      contract_check: ${{ steps.filter.outputs.contract_check }}
      reason: ${{ steps.filter.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 分类逻辑与 build-deploy 的部署必要性门禁共用 .github/scripts/acs-classify.sh，
      # 避免两处判定漂移。
      - name: Classify changed files
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "publish=true"
              echo "contract_check=false"
              echo "reason=manual workflow_dispatch"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### ACS impact classification"
              echo
              echo "- publish: \`true\`"
              echo "- publish reasons: manual workflow_dispatch"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ACS publish=true reason=manual workflow_dispatch"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/acs-changed-files.txt"
          before="${BEFORE_SHA:-}"
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "$before" ] && [ "$before" != "$zero_sha" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            git diff --name-only "$before" "$GITHUB_SHA" > "$changed_files"
            base_sha="$before"
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$changed_files"
            base_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi

          out="$RUNNER_TEMP/acs-classify.out"
          bash .github/scripts/acs-classify.sh "$changed_files" "$base_sha" > "$out"
          cat "$out"

          publish="$(sed -n 's/^publish=//p' "$out")"
          contract_check="$(sed -n 's/^contract_check=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped_reason="$(sed -n 's/^skipped=//p' "$out")"

          {
            echo "publish=$publish"
            echo "contract_check=$contract_check"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### ACS impact classification"
            echo
            echo "- publish: \`$publish\`"
            echo "- contract_check: \`$contract_check\`"
            echo "- publish reasons: $reason"
            echo "- skipped inputs: $skipped_reason"
          } >> "$GITHUB_STEP_SUMMARY"

  contract-check:
    name: ACS Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.contract_check == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server and orchestrator
        run: |
          pnpm -F server typecheck
          pnpm -F acs-orchestrator typecheck

      - name: Test orchestrator
        run: pnpm -F acs-orchestrator test

      - name: Test ACS operational scripts
        run: >-
          python3 -m unittest
          scripts/test_acs_operational_scripts.py
          scripts/test_acr_webhook_redelivery.py

  # ── 方案 C（2026-07-04 曾磊拍板）: 镜像构建全部在阿里云 ACR EE 源码构建完成 ──
  # GitHub Actions 只做两件事:
  #   gate: typecheck + test（push/dispatch 都跑, 代码门禁）
  #   build-deploy (dispatch only): 等待 push webhook 触发的 ACR 云端构建 → 轮询到
  #     SUCCESS → scp orchestrator 源码到 ECS → drain 旧进程(SIGUSR2) →
  #     systemd 自动拉起新代码+新镜像 env → health/smoke → 失败自动回滚 env。
  # 收益: push 零跨境镜像流量、零 GitHub artifact、build 5-10min(原 25-35min)、
  #   全部日志在 GitHub Actions 单一界面。
  # ACR 侧一次性配置(2026-07-04 完成): GitHub OAuth 绑定 + source repo
  #   ZengLeiPro/agent-saas + build rule crbr-xgrdo809of1uj6in
  #   (branches:main, Dockerfile /, tag=${GIT_PUSH_DATE:yyyyMMddHHmm}-${GIT_COMMIT_ID:6},
  #   linux/amd64, push webhook 自动构建、海外源智能加速开启、缓存开启)。
  gate:
    name: Gate (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck orchestrator and server
        run: |
          pnpm -F acs-orchestrator typecheck
          pnpm -F server typecheck

      - name: Test orchestrator
        run: pnpm -F acs-orchestrator test

      - name: Test ACS operational scripts
        run: >-
          python3 -m unittest
          scripts/test_acs_operational_scripts.py
          scripts/test_acr_webhook_redelivery.py

  build-deploy:
    name: ACR Cloud Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, gate]
    concurrency:
      group: production-runtime
      cancel-in-progress: false
    # 生产部署只走手动 dispatch，并与 App/Promotion 共用生产写锁。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'

    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ALIYUN_AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
      ACR_REPO_ID: crr-csx99pbexlsw5qqv
      ACR_BUILD_RULE_ID: crbr-xgrdo809of1uj6in
      ACR_REGION_ID: cn-shenzhen
      RELEASE_RECORD_OSS_URI: oss://agent-saas-release-records
      RELEASE_RECORD_OSS_REGION: cn-shenzhen

    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify dispatch still targets latest main
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          latest_main_sha=$(git rev-parse refs/remotes/origin/main)
          if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=Stale ACS deploy dispatch::This run targets $GITHUB_SHA, but origin/main is now $latest_main_sha. Dispatch ACS CI / Deploy again from the latest main commit."
            exit 1
          fi
          echo "Dispatch target is current main: $GITHUB_SHA"

      - name: Configure SSH
        run: |
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      # ── 部署必要性门禁（2026-07-30 曾磊拍板）─────────────────────
      # 全量部署 = orchestrator drain-restart + 换 ACS_SANDBOX_IMAGE env +
      # 所有旧镜像 Paused sandbox 全量 prewarm 重建。镜像 tag 含构建时间戳,
      # 即使内容未变 tag 也必变 → 每次部署必然全量 prewarm。因此 dispatch
      # 时先读生产在跑镜像的 SHA: 若生产以来的全部变更都不是 ACS publish
      # 路径, 明确 skip（不部署、不 prewarm）。任何读取/解析失败一律
      # fail-open 继续部署——门禁失效不得阻塞发布。
      # 强制部署: gh workflow run acs-sandbox.yml -f force=true
      - name: Deploy necessity gate
        id: necessity
        env:
          FORCE_DEPLOY: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- \`force=true\` — deploying unconditionally"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "force=true — deploying unconditionally"
            exit 0
          fi

          fail_open() {
            echo "::warning title=ACS necessity gate inconclusive::$1 — proceeding with deploy (fail-open)."
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- inconclusive: $1 — proceeded with deploy (fail-open)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          prod_sha="$(ssh -i ~/.ssh/ecs_deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$ECS_USER@$ECS_HOST" \
            "node -e \"const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('/etc/agent-saas/acs-release-identity.json','utf8'));process.stdout.write(v.sourceSha||'')\"" \
            2>/dev/null || true)"
          printf '%s' "$prod_sha" | grep -Eq '^[a-f0-9]{40}$' \
            || fail_open "cannot read an attested ACS source SHA from production identity"
          prod_sha6="${prod_sha:0:6}"
          git merge-base --is-ancestor "$prod_sha" "$GITHUB_SHA" \
            || fail_open "production commit $prod_sha is not an ancestor of HEAD"

          if [ "$prod_sha" = "$GITHUB_SHA" ]; then
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- **deploy skipped**: production already runs HEAD (\`$prod_sha6\`)"
              echo "- override: \`gh workflow run acs-sandbox.yml -f force=true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy skipped: production already runs HEAD ($prod_sha6)"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/acs-prod-diff.txt"
          git diff --name-only "$prod_sha" "$GITHUB_SHA" > "$changed_files"
          out="$RUNNER_TEMP/acs-necessity.out"
          bash .github/scripts/acs-classify.sh "$changed_files" "$prod_sha" > "$out" \
            || fail_open "acs-classify.sh failed"
          cat "$out"

          publish="$(sed -n 's/^publish=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped="$(sed -n 's/^skipped=//p' "$out")"

          if [ "$publish" = "true" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- deploy needed: ACS publish paths changed since production \`$prod_sha6\`"
              echo "- reasons: $reason"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy needed since $prod_sha6: $reason"
          else
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- **deploy skipped**: no ACS publish path changed since production \`$prod_sha6\`"
              echo "- non-ACS changes: $skipped"
              echo "- override: \`gh workflow run acs-sandbox.yml -f force=true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy skipped: no ACS-relevant change since $prod_sha6"
          fi

      - name: Install aliyun CLI
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          # 下载/解包放 RUNNER_TEMP: 本 step 已在 checkout 之后, 落在工作目录
          # 会被 Pack 打进 release 包
          curl -fsSL "https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz" -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/aliyun" /usr/local/bin/
          aliyun version

      # 不主动触发构建: build rule 的 tag 变量 ${GIT_PUSH_DATE}/${GIT_COMMIT_ID}
      # 只在 push 事件自动构建时有值, API 手动触发会解析为空 tag "-"（2026-07-04
      # 首次实测踩坑）。因此 ACR 侧开启「代码变更自动构建」, push main 即自动
      # build; 本 job 只接受当前 main 的 exact SHA 镜像，禁止用后继镜像替代，
      # 避免 orchestrator 源码与 sandbox image 版本错配。ACR 若没有为本 SHA
      # 创建记录，3 分钟内快速失败；记录进入队列后最多等待 20 分钟，开始
      # 构建后另给 30 分钟，避免排队时间提前耗尽实际构建预算。
      - name: Wait for ACR auto-build of HEAD (poll every 30s)
        id: wait
        if: steps.necessity.outputs.deploy_needed == 'true'
        env:
          ACR_GITHUB_HOOK_ID: '649018221'
          ACR_WEBHOOK_REDELIVERY_TOKEN: ${{ secrets.ACS_WEBHOOK_REDELIVERY_TOKEN }}
        run: |
          set -euo pipefail
          : "${ALIYUN_AK:?Missing secret ALIYUN_ACCESS_KEY_ID}"
          : "${ALIYUN_SK:?Missing secret ALIYUN_ACCESS_KEY_SECRET}"
          SHA6="${GITHUB_SHA:0:6}"
          MAX_PENDING_POLLS=40
          MAX_BUILDING_POLLS=60
          MAX_MISSING_POLLS=6
          MAX_QUERY_ERRORS=3
          poll_index=0
          pending_polls=0
          building_polls=0
          missing_polls=0
          query_errors=0
          build_record_found=false
          redelivery_checked=false
          echo "Looking for ACR build record with tag suffix -$SHA6 (HEAD $GITHUB_SHA) ..."
          while true; do
            poll_index=$((poll_index + 1))
            aliyun cr ListRepoBuildRecord \
              --mode AK --access-key-id "$ALIYUN_AK" --access-key-secret "$ALIYUN_SK" \
              --region "$ACR_REGION_ID" \
              --InstanceId "$ACR_INSTANCE_ID" \
              --RepoId "$ACR_REPO_ID" \
              --PageNo 1 --PageSize 20 >/tmp/records.json 2>/dev/null || true
            result=$(python3 - "$SHA6" <<'PY'
          import json, sys
          sha6 = sys.argv[1]
          try:
              data = json.load(open('/tmp/records.json'))
          except Exception:
              print('PARSE_ERROR'); raise SystemExit
          for r in data.get('BuildRecords', []):
              tag = (r.get('Image') or {}).get('ImageTag', '')
              if tag.endswith('-' + sha6):
                  print(f"{r.get('BuildStatus','')}\t{tag}")
                  break
          else:
              print('NOT_FOUND')
          PY
            )
            bstatus=$(echo "$result" | cut -f1)
            btag=$(echo "$result" | cut -f2 -s)
            echo "  [$poll_index] $bstatus ${btag:-}"
            case "$bstatus" in
              SUCCESS)
                echo "image_tag=$btag" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CANCELED)
                echo "ACR build $bstatus — 构建日志: https://cr.console.aliyun.com/repository/cn-shenzhen/$ACR_INSTANCE_ID/agent-saas/acs-sandbox/build" >&2
                exit 1
                ;;
              NOT_FOUND)
                query_errors=0
                if [ "$build_record_found" = "true" ]; then
                  echo "::error title=ACR build record disappeared::The exact SHA build record for $GITHUB_SHA disappeared after it was discovered. Refusing to substitute another image."
                  exit 1
                fi
                git fetch --quiet --no-tags origin main
                latest_main_sha=$(git rev-parse refs/remotes/origin/main)
                if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
                  echo "::error title=Stale ACS deploy dispatch::main advanced to $latest_main_sha before an ACR build record appeared for image $SHA6. Dispatch again from latest main."
                  exit 1
                fi
                missing_polls=$((missing_polls + 1))
                if [ "$missing_polls" -eq 2 ] && [ "$redelivery_checked" = "false" ]; then
                  redelivery_checked=true
                  if [ -z "${ACR_WEBHOOK_REDELIVERY_TOKEN:-}" ]; then
                    echo "::warning title=ACR webhook recovery disabled::Missing secret ACS_WEBHOOK_REDELIVERY_TOKEN; exact-SHA auto-redelivery is unavailable."
                  elif redelivery_output=$(python3 .github/scripts/redeliver_acr_webhook.py \
                    --repository "$GITHUB_REPOSITORY" \
                    --hook-id "$ACR_GITHUB_HOOK_ID" \
                    --sha "$GITHUB_SHA" 2>&1); then
                    echo "$redelivery_output"
                  else
                    redelivery_exit=$?
                    echo "$redelivery_output"
                    echo "::warning title=ACR webhook auto-redelivery skipped::No safe exact-SHA delivery was redelivered (exit $redelivery_exit); polling continues."
                  fi
                fi
                if [ "$missing_polls" -ge "$MAX_MISSING_POLLS" ]; then
                  echo "::error title=ACR build record missing::No ACR build record for current main $GITHUB_SHA appeared after $missing_polls checks. Verify the ACR source webhook/build rule, then dispatch again; a later image will not be substituted."
                  exit 1
                fi
                ;;
              PARSE_ERROR)
                query_errors=$((query_errors + 1))
                if [ "$query_errors" -ge "$MAX_QUERY_ERRORS" ]; then
                  echo "::error title=ACR query failed::Unable to parse ACR build records for $query_errors consecutive checks."
                  exit 1
                fi
                ;;
              PENDING)
                # 真实记录已出现后，锁定 exact SHA 构建继续等待；
                # 后续 main 推进不影响本次代码与镜像仍使用同一个 GITHUB_SHA。
                build_record_found=true
                missing_polls=0
                query_errors=0
                pending_polls=$((pending_polls + 1))
                if [ "$pending_polls" -ge "$MAX_PENDING_POLLS" ]; then
                  echo "::error title=ACR build queue timeout::The exact SHA build remained PENDING for 20 minutes. Check the ACR build queue."
                  exit 1
                fi
                ;;
              BUILDING)
                build_record_found=true
                missing_polls=0
                query_errors=0
                building_polls=$((building_polls + 1))
                if [ "$building_polls" -ge "$MAX_BUILDING_POLLS" ]; then
                  echo "::error title=ACR build timeout::The exact SHA build remained BUILDING for 30 minutes. Check the ACR build logs."
                  exit 1
                fi
                ;;
              *)
                echo "::error title=Unexpected ACR build status::The exact SHA build returned status '$bstatus'."
                exit 1
                ;;
            esac
            sleep 30
          done

      - name: Resolve immutable ACS image
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          image_tag='${{ steps.wait.outputs.image_tag }}'
          aliyun cr GetRepoTag \
            --mode AK --access-key-id "$ALIYUN_AK" --access-key-secret "$ALIYUN_SK" \
            --region "$ACR_REGION_ID" --InstanceId "$ACR_INSTANCE_ID" \
            --RepoId "$ACR_REPO_ID" --Tag "$image_tag" > "$RUNNER_TEMP/acr-tag.json"
          raw_digest="$(jq -r .Digest "$RUNNER_TEMP/acr-tag.json")"
          case "$raw_digest" in sha256:*) image_digest="$raw_digest" ;; *) image_digest="sha256:$raw_digest" ;; esac
          printf '%s' "$image_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          test "$(jq -r .Status "$RUNNER_TEMP/acr-tag.json")" = NORMAL
          image="$ACR_REGISTRY/$ACR_REPOSITORY@$image_digest"
          {
            echo "ACS_IMAGE_REFERENCE=$image"
            echo "ACS_IMAGE_DIGEST=$image_digest"
            echo "ACS_IMAGE_TAG=$image_tag"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.necessity.outputs.deploy_needed == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.necessity.outputs.deploy_needed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deployment dependencies
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pack and identify orchestrator release
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          pnpm -F acs-orchestrator build
          stage="$RUNNER_TEMP/acs-release-stage"
          mkdir -p "$stage/scripts/release" \
            "$stage/workspace-shared/.ky-agent/skills-pool/browser/scripts"
          pnpm --config.allowUnusedPatches=true --filter acs-orchestrator --prod deploy \
            "$stage/acs-orchestrator"
          rm -rf "$stage/acs-orchestrator/dist" "$stage/acs-orchestrator/descriptions"
          cp -R acs-orchestrator/dist acs-orchestrator/descriptions \
            "$stage/acs-orchestrator/"
          node scripts/release/runtime-dependency.mjs \
            --create=true --contract=config/runtime-dependency-contract.json \
            --source-sha="$GITHUB_SHA" --output="$stage/acs-orchestrator/runtime-dependencies.json"
          install -m 0444 scripts/release/runtime-dependency.mjs \
            scripts/release/artifact-lib.mjs "$stage/acs-orchestrator/dist/"
          mkdir -p "$stage/acs-orchestrator/config"
          install -m 0444 acs-orchestrator/config/production.env \
            "$stage/acs-orchestrator/config/production.env"
          install -m 0555 scripts/apply-orchestrator-env.py \
            scripts/acs-browser-lease-e2e.mjs \
            scripts/acs-tool-content-json.mjs \
            scripts/check-acs-shared-rollback-compatibility.mjs "$stage/scripts/"
          install -m 0555 \
            workspace-shared/.ky-agent/skills-pool/browser/scripts/acs_browser.py \
            "$stage/workspace-shared/.ky-agent/skills-pool/browser/scripts/acs_browser.py"
          install -m 0444 scripts/release/artifact-lib.mjs \
            scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs \
            scripts/release/seal-compatibility-release.mjs \
            scripts/release/verify-installed-release.mjs \
            scripts/release/write-compatibility-acs-identity.mjs \
            scripts/release/write-live-production-identity.mjs "$stage/scripts/release/"
          tar --no-xattrs -czf "$RUNNER_TEMP/acs-orchestrator.tgz" -C "$stage" .
          node scripts/release/create-component-artifact-index.mjs \
            --sha "$GITHUB_SHA" --name acsOrchestrator \
            --file "$RUNNER_TEMP/acs-orchestrator.tgz" \
            --image-reference "$ACS_IMAGE_REFERENCE" \
            --output "$RUNNER_TEMP/acs-artifact-index.json"
          orchestrator_digest="$(jq -r .artifacts.acsOrchestrator.digest "$RUNNER_TEMP/acs-artifact-index.json")"
          release_id="rc-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          {
            echo "ORCHESTRATOR_ARTIFACT_DIGEST=$orchestrator_digest"
            echo "COMPAT_RELEASE_ID=$release_id"
          } >> "$GITHUB_ENV"

      - name: Persist immutable ACS baseline
        if: steps.necessity.outputs.deploy_needed == 'true'
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          destination="$RELEASE_RECORD_OSS_URI/baselines/acs-${GITHUB_SHA}-${ORCHESTRATOR_ARTIFACT_DIGEST#sha256:}"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/acs-orchestrator.tgz" "$destination/acs-orchestrator.tgz"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/acs-artifact-index.json" "$destination/artifact-index.json"

      - name: Upload orchestrator release
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          scp -i ~/.ssh/ecs_deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$RUNNER_TEMP/acs-orchestrator.tgz" \
            "$ECS_USER@$ECS_HOST:/tmp/agent-saas-acs-release.tgz"

      - name: Deploy orchestrator with drain and smoke
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          ssh -i ~/.ssh/ecs_deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$ECS_USER@$ECS_HOST" \
            "IMAGE='$ACS_IMAGE_REFERENCE' IMAGE_TAG='$ACS_IMAGE_TAG' IMAGE_DIGEST='$ACS_IMAGE_DIGEST' ORCHESTRATOR_ARTIFACT_DIGEST='$ORCHESTRATOR_ARTIFACT_DIGEST' COMPAT_RELEASE_ID='$COMPAT_RELEASE_ID' ECS_DEPLOY_ROOT='$ECS_DEPLOY_ROOT' ACS_SERVICE_NAME='$ACS_SERVICE_NAME' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_SHA='$GITHUB_SHA' bash -s" < scripts/deploy-acs-orchestrator.sh

      - name: Refresh trusted Production identity
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          remote="/tmp/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-acs"
          cleanup() {
            ssh -i ~/.ssh/ecs_deploy_key "$ECS_USER@$ECS_HOST" "rm -rf -- '$remote'" || true
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_deploy_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/ecs_deploy_key \
            scripts/release/artifact-lib.mjs \
            scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs \
            scripts/release/verify-installed-release.mjs \
            scripts/release/write-live-production-identity.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/ecs_deploy_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$remote/read-live-production-components.mjs' --output '$remote/live.json' >/dev/null && \
             sudo node '$remote/write-live-production-identity.mjs' --input '$remote/live.json' >/dev/null && \
             sudo node '$remote/read-production-state.mjs' --output '$remote/confirmed.json' >/dev/null"
          echo "Production identity refreshed after ACS deployment"
