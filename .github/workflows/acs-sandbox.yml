name: ACS CI / Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.npmrc'
      - 'patches/**'
      - 'acs-orchestrator/**'
      - 'server/src/agent/**'
      - 'server/src/runtime/handProtocol.ts'
      - 'server/src/runtime/httpTransport.ts'
      - 'server/src/runtime/inProcessTransport.ts'
      - 'server/src/runtime/clientDaemonTransport.ts'
      - 'server/src/runtime/networkPolicy.ts'
      - 'server/src/runtime/rawAgentLoop.ts'
      - 'server/src/runtime/rawRuntimeRunDispatch.ts'
      - 'server/src/runtime/handStore.ts'
      - 'server/src/data/tenants/types.ts'
      - 'server/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/acs-sandbox.yml'
      - '.github/scripts/acs-classify.sh'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even when no ACS-relevant change since the production SHA'
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REGION_ID: cn-shenzhen
  ECS_DEPLOY_ROOT: /opt/agent-saas
  ACS_SERVICE_NAME: agent-saas-acs-orchestrator.service

jobs:
  changes:
    name: Classify ACS Impact
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      publish: ${{ steps.filter.outputs.publish }}
      contract_check: ${{ steps.filter.outputs.contract_check }}
      reason: ${{ steps.filter.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 分类逻辑与 build-deploy 的部署必要性门禁共用 .github/scripts/acs-classify.sh，
      # 避免两处判定漂移。
      - name: Classify changed files
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "publish=true"
              echo "contract_check=false"
              echo "reason=manual workflow_dispatch"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### ACS impact classification"
              echo
              echo "- publish: \`true\`"
              echo "- publish reasons: manual workflow_dispatch"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ACS publish=true reason=manual workflow_dispatch"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/acs-changed-files.txt"
          before="${BEFORE_SHA:-}"
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "$before" ] && [ "$before" != "$zero_sha" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            git diff --name-only "$before" "$GITHUB_SHA" > "$changed_files"
            base_sha="$before"
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$changed_files"
            base_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi

          out="$RUNNER_TEMP/acs-classify.out"
          bash .github/scripts/acs-classify.sh "$changed_files" "$base_sha" > "$out"
          cat "$out"

          publish="$(sed -n 's/^publish=//p' "$out")"
          contract_check="$(sed -n 's/^contract_check=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped_reason="$(sed -n 's/^skipped=//p' "$out")"

          {
            echo "publish=$publish"
            echo "contract_check=$contract_check"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### ACS impact classification"
            echo
            echo "- publish: \`$publish\`"
            echo "- contract_check: \`$contract_check\`"
            echo "- publish reasons: $reason"
            echo "- skipped inputs: $skipped_reason"
          } >> "$GITHUB_STEP_SUMMARY"

  contract-check:
    name: ACS Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.publish != 'true' && needs.changes.outputs.contract_check == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server and orchestrator
        run: |
          pnpm -F server typecheck
          pnpm -F acs-orchestrator typecheck

      - name: Test orchestrator
        run: pnpm -F acs-orchestrator test

  # ── 方案 C（2026-07-04 曾磊拍板）: 镜像构建全部在阿里云 ACR EE 源码构建完成 ──
  # GitHub Actions 只做两件事:
  #   gate: typecheck + test（push/dispatch 都跑, 代码门禁）
  #   build-deploy (dispatch only): 调 ACR OpenAPI 触发云端构建 → 轮询到
  #     SUCCESS → scp orchestrator 源码到 ECS → drain 旧进程(SIGUSR2) →
  #     systemd 自动拉起新代码+新镜像 env → health/smoke → 失败自动回滚 env。
  # 收益: push 零跨境镜像流量、零 GitHub artifact、build 5-10min(原 25-35min)、
  #   全部日志在 GitHub Actions 单一界面。
  # ACR 侧一次性配置(2026-07-04 完成): GitHub OAuth 绑定 + source repo
  #   ZengLeiPro/agent-saas + build rule crbr-xgrdo809of1uj6in
  #   (branches:main, Dockerfile /, tag=${GIT_PUSH_DATE:yyyyMMddHHmm}-${GIT_COMMIT_ID:6},
  #   linux/amd64, 自动构建关闭、海外源智能加速开启、缓存开启)。
  gate:
    name: Gate (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck orchestrator and server
        run: |
          pnpm -F acs-orchestrator typecheck
          pnpm -F server typecheck

      - name: Test orchestrator
        run: pnpm -F acs-orchestrator test

  build-deploy:
    name: ACR Cloud Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, gate]
    concurrency:
      group: acs-production-deploy
      cancel-in-progress: false
    # 生产部署只走手动 dispatch（与主服务 ci.yml 同一纪律: push 归 push, 部署归部署）
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'

    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ALIYUN_AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
      ACR_REPO_ID: crr-csx99pbexlsw5qqv
      ACR_BUILD_RULE_ID: crbr-xgrdo809of1uj6in
      ACR_REGION_ID: cn-shenzhen

    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify dispatch still targets latest main
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          latest_main_sha=$(git rev-parse refs/remotes/origin/main)
          if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=Stale ACS deploy dispatch::This run targets $GITHUB_SHA, but origin/main is now $latest_main_sha. Dispatch ACS CI / Deploy again from the latest main commit."
            exit 1
          fi
          echo "Dispatch target is current main: $GITHUB_SHA"

      - name: Configure SSH
        run: |
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      # ── 部署必要性门禁（2026-07-30 曾磊拍板）─────────────────────
      # 全量部署 = orchestrator drain-restart + 换 ACS_SANDBOX_IMAGE env +
      # 所有旧镜像 Paused sandbox 全量 prewarm 重建。镜像 tag 含构建时间戳,
      # 即使内容未变 tag 也必变 → 每次部署必然全量 prewarm。因此 dispatch
      # 时先读生产在跑镜像的 SHA: 若生产以来的全部变更都不是 ACS publish
      # 路径, 明确 skip（不部署、不 prewarm）。任何读取/解析失败一律
      # fail-open 继续部署——门禁失效不得阻塞发布。
      # 强制部署: gh workflow run acs-sandbox.yml -f force=true
      - name: Deploy necessity gate
        id: necessity
        env:
          FORCE_DEPLOY: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- \`force=true\` — deploying unconditionally"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "force=true — deploying unconditionally"
            exit 0
          fi

          fail_open() {
            echo "::warning title=ACS necessity gate inconclusive::$1 — proceeding with deploy (fail-open)."
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- inconclusive: $1 — proceeded with deploy (fail-open)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          prod_env_line="$(ssh -i ~/.ssh/ecs_deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$ECS_USER@$ECS_HOST" \
            "grep '^ACS_SANDBOX_IMAGE=' /etc/agent-saas/acs-orchestrator.env" 2>/dev/null | head -n1 || true)"
          [ -n "$prod_env_line" ] || fail_open "cannot read ACS_SANDBOX_IMAGE from production env file"

          prod_image="${prod_env_line#ACS_SANDBOX_IMAGE=}"
          prod_tag="${prod_image##*:}"
          prod_sha6="${prod_tag##*-}"
          case "$prod_sha6" in
            "") fail_open "unexpected production image tag: $prod_tag" ;;
            *[!0-9a-f]*) fail_open "unexpected production image tag: $prod_tag" ;;
          esac

          prod_sha="$(git rev-parse --verify --quiet "${prod_sha6}^{commit}" || true)"
          [ -n "$prod_sha" ] || fail_open "cannot resolve production SHA6 $prod_sha6 to a commit"
          git merge-base --is-ancestor "$prod_sha" "$GITHUB_SHA" \
            || fail_open "production commit $prod_sha is not an ancestor of HEAD"

          if [ "$prod_sha" = "$GITHUB_SHA" ]; then
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- **deploy skipped**: production already runs HEAD (\`$prod_sha6\`)"
              echo "- override: \`gh workflow run acs-sandbox.yml -f force=true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy skipped: production already runs HEAD ($prod_sha6)"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/acs-prod-diff.txt"
          git diff --name-only "$prod_sha" "$GITHUB_SHA" > "$changed_files"
          out="$RUNNER_TEMP/acs-necessity.out"
          bash .github/scripts/acs-classify.sh "$changed_files" "$prod_sha" > "$out" \
            || fail_open "acs-classify.sh failed"
          cat "$out"

          publish="$(sed -n 's/^publish=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped="$(sed -n 's/^skipped=//p' "$out")"

          if [ "$publish" = "true" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- deploy needed: ACS publish paths changed since production \`$prod_sha6\`"
              echo "- reasons: $reason"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy needed since $prod_sha6: $reason"
          else
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ACS deploy necessity gate"
              echo
              echo "- **deploy skipped**: no ACS publish path changed since production \`$prod_sha6\`"
              echo "- non-ACS changes: $skipped"
              echo "- override: \`gh workflow run acs-sandbox.yml -f force=true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy skipped: no ACS-relevant change since $prod_sha6"
          fi

      - name: Install aliyun CLI
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          # 下载/解包放 RUNNER_TEMP: 本 step 已在 checkout 之后, 落在工作目录
          # 会被 Pack 打进 release 包
          curl -fsSL "https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz" -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/aliyun" /usr/local/bin/
          aliyun version

      # 不主动触发构建: build rule 的 tag 变量 ${GIT_PUSH_DATE}/${GIT_COMMIT_ID}
      # 只在 push 事件自动构建时有值, API 手动触发会解析为空 tag "-"（2026-07-04
      # 首次实测踩坑）。因此 ACR 侧开启「代码变更自动构建」, push main 即自动
      # build; 本 job 只接受当前 main 的 exact SHA 镜像，禁止用后继镜像替代，
      # 避免 orchestrator 源码与 sandbox image 版本错配。ACR 若没有为本 SHA
      # 创建记录，3 分钟内快速失败；记录进入队列后最多等待 20 分钟，开始
      # 构建后另给 30 分钟，避免排队时间提前耗尽实际构建预算。
      - name: Wait for ACR auto-build of HEAD (poll every 30s)
        id: wait
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          : "${ALIYUN_AK:?Missing secret ALIYUN_ACCESS_KEY_ID}"
          : "${ALIYUN_SK:?Missing secret ALIYUN_ACCESS_KEY_SECRET}"
          SHA6="${GITHUB_SHA:0:6}"
          MAX_PENDING_POLLS=40
          MAX_BUILDING_POLLS=60
          MAX_MISSING_POLLS=6
          MAX_QUERY_ERRORS=3
          poll_index=0
          pending_polls=0
          building_polls=0
          missing_polls=0
          query_errors=0
          build_record_found=false
          echo "Looking for ACR build record with tag suffix -$SHA6 (HEAD $GITHUB_SHA) ..."
          while true; do
            poll_index=$((poll_index + 1))
            aliyun cr ListRepoBuildRecord \
              --mode AK --access-key-id "$ALIYUN_AK" --access-key-secret "$ALIYUN_SK" \
              --region "$ACR_REGION_ID" \
              --InstanceId "$ACR_INSTANCE_ID" \
              --RepoId "$ACR_REPO_ID" \
              --PageNo 1 --PageSize 20 >/tmp/records.json 2>/dev/null || true
            result=$(python3 - "$SHA6" <<'PY'
          import json, sys
          sha6 = sys.argv[1]
          try:
              data = json.load(open('/tmp/records.json'))
          except Exception:
              print('PARSE_ERROR'); raise SystemExit
          for r in data.get('BuildRecords', []):
              tag = (r.get('Image') or {}).get('ImageTag', '')
              if tag.endswith('-' + sha6):
                  print(f"{r.get('BuildStatus','')}\t{tag}")
                  break
          else:
              print('NOT_FOUND')
          PY
            )
            bstatus=$(echo "$result" | cut -f1)
            btag=$(echo "$result" | cut -f2 -s)
            echo "  [$poll_index] $bstatus ${btag:-}"
            case "$bstatus" in
              SUCCESS)
                echo "image_tag=$btag" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CANCELED)
                echo "ACR build $bstatus — 构建日志: https://cr.console.aliyun.com/repository/cn-shenzhen/$ACR_INSTANCE_ID/agent-saas/acs-sandbox/build" >&2
                exit 1
                ;;
              NOT_FOUND)
                query_errors=0
                if [ "$build_record_found" = "true" ]; then
                  echo "::error title=ACR build record disappeared::The exact SHA build record for $GITHUB_SHA disappeared after it was discovered. Refusing to substitute another image."
                  exit 1
                fi
                git fetch --quiet --no-tags origin main
                latest_main_sha=$(git rev-parse refs/remotes/origin/main)
                if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
                  echo "::error title=Stale ACS deploy dispatch::main advanced to $latest_main_sha before an ACR build record appeared for image $SHA6. Dispatch again from latest main."
                  exit 1
                fi
                missing_polls=$((missing_polls + 1))
                if [ "$missing_polls" -ge "$MAX_MISSING_POLLS" ]; then
                  echo "::error title=ACR build record missing::No ACR build record for current main $GITHUB_SHA appeared after $missing_polls checks. Verify the ACR source webhook/build rule, then dispatch again; a later image will not be substituted."
                  exit 1
                fi
                ;;
              PARSE_ERROR)
                query_errors=$((query_errors + 1))
                if [ "$query_errors" -ge "$MAX_QUERY_ERRORS" ]; then
                  echo "::error title=ACR query failed::Unable to parse ACR build records for $query_errors consecutive checks."
                  exit 1
                fi
                ;;
              PENDING)
                # 真实记录已出现后，锁定 exact SHA 构建继续等待；
                # 后续 main 推进不影响本次代码与镜像仍使用同一个 GITHUB_SHA。
                build_record_found=true
                missing_polls=0
                query_errors=0
                pending_polls=$((pending_polls + 1))
                if [ "$pending_polls" -ge "$MAX_PENDING_POLLS" ]; then
                  echo "::error title=ACR build queue timeout::The exact SHA build remained PENDING for 20 minutes. Check the ACR build queue."
                  exit 1
                fi
                ;;
              BUILDING)
                build_record_found=true
                missing_polls=0
                query_errors=0
                building_polls=$((building_polls + 1))
                if [ "$building_polls" -ge "$MAX_BUILDING_POLLS" ]; then
                  echo "::error title=ACR build timeout::The exact SHA build remained BUILDING for 30 minutes. Check the ACR build logs."
                  exit 1
                fi
                ;;
              *)
                echo "::error title=Unexpected ACR build status::The exact SHA build returned status '$bstatus'."
                exit 1
                ;;
            esac
            sleep 30
          done

      - name: Pack orchestrator release
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./*/node_modules' \
            --exclude='./server/data' \
            --exclude='./logs' \
            --exclude='./config.json' \
            --exclude='./config.json.*' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./mobile/ios' \
            --exclude='./mobile/android' \
            -czf "$RUNNER_TEMP/agent-saas-acs-release.tgz" .
          # 输出必须放 RUNNER_TEMP：写进 checkout 目录会让 tar 读到 "." 目录
          # mtime 变化，报 "file changed as we read it" 并 exit 1（2026-07-04 首跑实测）

      - name: Upload orchestrator release
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          scp -i ~/.ssh/ecs_deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$RUNNER_TEMP/agent-saas-acs-release.tgz" "$ECS_USER@$ECS_HOST:/tmp/"

      - name: Deploy orchestrator with drain and smoke
        if: steps.necessity.outputs.deploy_needed == 'true'
        run: |
          IMAGE_TAG='${{ steps.wait.outputs.image_tag }}'
          IMAGE="agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com/agent-saas/acs-sandbox:${IMAGE_TAG}"
          ssh -i ~/.ssh/ecs_deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$ECS_USER@$ECS_HOST" \
            "IMAGE='$IMAGE' IMAGE_TAG='$IMAGE_TAG' ECS_DEPLOY_ROOT='$ECS_DEPLOY_ROOT' ACS_SERVICE_NAME='$ACS_SERVICE_NAME' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          : "${IMAGE:?missing IMAGE}"
          : "${IMAGE_TAG:?missing IMAGE_TAG}"
          : "${ECS_DEPLOY_ROOT:?missing ECS_DEPLOY_ROOT}"
          : "${ACS_SERVICE_NAME:?missing ACS_SERVICE_NAME}"

          APP_DIR="$ECS_DEPLOY_ROOT"
          ENV_FILE="/etc/agent-saas/acs-orchestrator.env"
          RELEASE_TGZ="/tmp/agent-saas-acs-release.tgz"
          # 07-05：SMOKE_SESSION 提前定型（改进 1A）。历史残留 CI sandbox（3d8h 前那批）
          # 是因为 SMOKE_SESSION 之前在第 5 步 smoke 阶段才赋值——provision/deploy 阶段失败时
          # cleanup 走到、SMOKE_SESSION 还是空 → cleanup 什么也不删 → sandbox 残留 7 天 TTL。
          # 现在提前赋值，无论后续哪步失败，都能按 annotation 找到并清理 smoke sandbox。
          SMOKE_SESSION="ci-acr-${GITHUB_RUN_ID}"
          SMOKE_WS="ws_ci_acr_${GITHUB_RUN_ID}"
          SMOKE_MOUNT="workspaces/_ci/${SMOKE_WS}"
          SMOKE_WORKSPACE_DIR="/mnt/agent-saas/${SMOKE_MOUNT}"
          SMOKE_CLEANUP_ERROR="/tmp/acs-smoke-workspace-cleanup-${GITHUB_RUN_ID}.err"

          cleanup() {
            # EXIT trap 只做资源回收，不能用清理竞态覆盖真实部署结果。
            local deploy_status=$?
            set +e
            if [ -n "${SMOKE_SESSION:-}" ] && command -v kubectl >/dev/null 2>&1; then
              if [ -n "${ACS_KUBECONFIG:-}" ]; then KCFG_ARGS="--kubeconfig ${ACS_KUBECONFIG}"; else KCFG_ARGS=""; fi
              # shellcheck disable=SC2086
              kubectl $KCFG_ARGS -n "${ACS_NAMESPACE:-agent-saas-coding}" get sandbox \
                -l "app.kubernetes.io/managed-by=agent-saas-acs-orchestrator" \
                -o json >/tmp/acs-cleanup-sandboxes.json 2>/dev/null || true
              if [ -s /tmp/acs-cleanup-sandboxes.json ] && command -v node >/dev/null 2>&1; then
                sandbox_names="$(
                  SMOKE_SESSION="$SMOKE_SESSION" SMOKE_MOUNT="$SMOKE_MOUNT" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/acs-cleanup-sandboxes.json', 'utf8') || '{"items":[]}');
          const items = Array.isArray(body.items) ? body.items : [];
          const sessionId = process.env.SMOKE_SESSION;
          const mountSubPath = process.env.SMOKE_MOUNT;
          for (const item of items) {
            const annotations = item?.metadata?.annotations || {};
            if (
              annotations['agent-saas.kaiyan.net/session-id'] === sessionId
              || annotations['agent-saas.kaiyan.net/mount-subpath'] === mountSubPath
            ) {
              console.log(item.metadata.name);
            }
          }
          NODE
                )"
                if [ -n "$sandbox_names" ]; then
                  printf '%s\n' "$sandbox_names" | while IFS= read -r sandbox_name; do
                    [ -n "$sandbox_name" ] || continue
                    # shellcheck disable=SC2086
                    kubectl $KCFG_ARGS -n "${ACS_NAMESPACE:-agent-saas-coding}" delete sandbox "$sandbox_name" \
                      --ignore-not-found=true >/dev/null 2>&1 || true
                  done
                fi
              fi
            fi
            if [ -n "${SMOKE_WORKSPACE_DIR:-}" ]; then
              case "$SMOKE_WORKSPACE_DIR" in
                /mnt/agent-saas/workspaces/_ci/ws_ci_acr_*|/mnt/agent-saas/workspaces/_ci/ws_ci_acs_*)
                  # Sandbox CR 删除后 Pod/NFS 写入可能短暂滞后；单次 rm -rf 会因
                  # __pycache__ 等目录被并发写回而报 Directory not empty。
                  for cleanup_attempt in 1 2 3 4 5; do
                    rm -rf -- "$SMOKE_WORKSPACE_DIR" 2>"$SMOKE_CLEANUP_ERROR"
                    [ ! -e "$SMOKE_WORKSPACE_DIR" ] && break
                    sleep "$cleanup_attempt"
                  done
                  if [ -e "$SMOKE_WORKSPACE_DIR" ]; then
                    echo "::warning::smoke workspace cleanup incomplete after retries: $SMOKE_WORKSPACE_DIR" >&2
                    if [ -s "$SMOKE_CLEANUP_ERROR" ]; then
                      printf '  last error: ' >&2
                      tr '\n' ' ' <"$SMOKE_CLEANUP_ERROR" >&2
                      printf '\n' >&2
                    fi
                  fi
                  ;;
                *)
                  echo "skip smoke workspace cleanup: unexpected path $SMOKE_WORKSPACE_DIR" >&2
                  ;;
              esac
            fi
            rm -f "$RELEASE_TGZ" "$SMOKE_CLEANUP_ERROR"
            return "$deploy_status"
          }
          trap cleanup EXIT

          # ── 1. 更新 orchestrator 源码（旧进程还在跑, 零影响）──
          mkdir -p "$APP_DIR"
          tar -xzf "$RELEASE_TGZ" -C "$APP_DIR"
          cd "$APP_DIR"
          if command -v corepack >/dev/null 2>&1; then
            corepack enable
            corepack prepare pnpm@10.18.3 --activate
          fi
          NODE_ENV=development pnpm install --frozen-lockfile --filter acs-orchestrator... --filter server... --filter shared...
          # 2026-08-03 P3a：生产 orchestrator 改为 esbuild bundle + node dist 运行
          # （`pnpm start` 已指向 dist/index.js）。build 失败即中止部署（set -e），
          # 旧进程照常运行，无影响。
          pnpm -F acs-orchestrator build
          test -f "$APP_DIR/acs-orchestrator/dist/index.js"
          test -f "$APP_DIR/acs-orchestrator/dist/backgroundShellWorker.js"
          test -f "$APP_DIR/acs-orchestrator/descriptions/Edit.md"

          # ── 2. 备份并更新镜像 env（新进程拉起时生效）──
          test -f "$ENV_FILE"
          ENV_BAK="${ENV_FILE}.bak.${GITHUB_RUN_ID}-${GITHUB_SHA:0:7}"
          cp "$ENV_FILE" "$ENV_BAK"
          if grep -q '^ACS_SANDBOX_IMAGE=' "$ENV_FILE"; then
            sed -i "s|^ACS_SANDBOX_IMAGE=.*|ACS_SANDBOX_IMAGE=${IMAGE}|" "$ENV_FILE"
          else
            printf '\nACS_SANDBOX_IMAGE=%s\n' "$IMAGE" >> "$ENV_FILE"
          fi

          # ── 3. Drain 旧进程: SIGUSR2 → 排空 inflight 后自退 →
          #      systemd Restart=always 5s 后自动拉起新代码+新 env ──
          # 2026-07-15 修复：SIGUSR2 必须送达注册了 handler 的 node 本体。
          # ExecStart 是 pnpm wrapper 时 MainPID 是 wrapper 的 node 进程——它不
          # 转发 SIGUSR2 且收到即被默认动作终止（drain 静默失效、inflight 被
          # cgroup 清场硬杀）。优先读 orchestrator 自写 pidfile（ACS_ORCH_PIDFILE），
          # 并用 journal 断言 drain 真实生效；未确认一律 restart 兜底。
          ORCH_PIDFILE="/run/agent-saas-acs-orchestrator.pid"
          DRAIN_PID=""
          RESTART_FALLBACK=0
          if [ -f "$ORCH_PIDFILE" ] && kill -0 "$(cat "$ORCH_PIDFILE")" 2>/dev/null; then
            DRAIN_PID=$(cat "$ORCH_PIDFILE")
            echo "draining orchestrator pid=$DRAIN_PID (SIGUSR2 via pidfile)..."
          else
            MAIN_PID=$(systemctl show -p MainPID --value "$ACS_SERVICE_NAME" 2>/dev/null || echo 0)
            if [ -n "$MAIN_PID" ] && [ "$MAIN_PID" != "0" ]; then
              DRAIN_PID="$MAIN_PID"
              echo "WARN: pidfile missing/stale; SIGUSR2 to MainPID=$MAIN_PID (wrapper may swallow it)"
            else
              RESTART_FALLBACK=1
            fi
          fi
          if [ "$RESTART_FALLBACK" = "0" ]; then
            kill -USR2 "$DRAIN_PID" 2>/dev/null || true
            sleep 3
            if journalctl -u "$ACS_SERVICE_NAME" --since "-45 seconds" --no-pager 2>/dev/null | grep -q "entering drain mode"; then
              echo "drain confirmed via journal"
              for _ in $(seq 1 135); do
                kill -0 "$DRAIN_PID" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$DRAIN_PID" 2>/dev/null; then
                echo "drain deadline exceeded, falling back to systemctl restart"
                RESTART_FALLBACK=1
              fi
            else
              echo "WARN: drain not confirmed in journal (signal may have hit a wrapper); falling back to systemctl restart"
              RESTART_FALLBACK=1
            fi
          fi
          if [ "$RESTART_FALLBACK" = "1" ]; then
            systemctl restart "$ACS_SERVICE_NAME"
          fi

          # ── 4. 等新进程 health 且 image 已切换 ──
          HEALTH_OK=false
          for _ in $(seq 1 120); do
            if curl -fsS -m 5 http://127.0.0.1:3400/health >/tmp/acs-health.json 2>/dev/null; then
              if grep -F "$IMAGE" /tmp/acs-health.json >/dev/null; then
                HEALTH_OK=true
                break
              fi
            fi
            sleep 1
          done

          rollback() {
            echo "ROLLING BACK env to previous image..."
            cp "$ENV_BAK" "$ENV_FILE"
            systemctl restart "$ACS_SERVICE_NAME"
            for _ in $(seq 1 60); do
              if curl -fsS -m 5 http://127.0.0.1:3400/health >/dev/null 2>&1; then
                echo "rollback health ok"
                return 0
              fi
              sleep 1
            done
            echo "ROLLBACK HEALTH ALSO FAILED — manual intervention required" >&2
            return 1
          }

          if [ "$HEALTH_OK" != "true" ]; then
            echo "health/image check failed after 120s" >&2
            journalctl -u "$ACS_SERVICE_NAME" -n 100 --no-pager || true
            rollback
            exit 1
          fi

          # ── 5. Smoke: provision + execute 真实拉新镜像跑通 ──
          set -a
          # shellcheck disable=SC1090
          . "$ENV_FILE"
          set +a
          : "${ACS_ORCH_AUTH_TOKEN:?missing ACS_ORCH_AUTH_TOKEN in env file}"

          # SMOKE_SESSION/SMOKE_WS/SMOKE_MOUNT 已在 cleanup 定义前赋值，确保任何失败路径都能清理。
          AUTH_HEADER="Authorization: Bearer ${ACS_ORCH_AUTH_TOKEN}"

          SMOKE_OK=true
          if ! curl -fsS -m 420 -X POST http://127.0.0.1:3400/provision \
            -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
            -d "{\"workspaceId\":\"${SMOKE_WS}\",\"recipe\":{\"workspaceId\":\"${SMOKE_WS}\",\"sessionId\":\"${SMOKE_SESSION}\",\"mountSubPath\":\"${SMOKE_MOUNT}\"}}" \
            >/tmp/acs-provision.json; then
            SMOKE_OK=false
          elif ! grep -F '"status":"ok"' /tmp/acs-provision.json >/dev/null; then
            SMOKE_OK=false
          fi

          if [ "$SMOKE_OK" = "true" ]; then
            printf '%s' "{\"toolName\":\"Shell\",\"input\":{\"command\":\"set -eu; test \\\"\$(id -u)\\\" = 501; test \\\"\$(pwd)\\\" = /workspace; command -v aliyun; aliyun version; command -v gh; gh --version; command -v ntn; ntn --version; command -v gws; gws --version; command -v dws; dws --version; command -v lark-cli; lark-cli --version; echo ACR_BUILD_DEPLOY_SMOKE_OK\",\"timeoutMs\":120000},\"context\":{\"workspace\":{\"id\":\"${SMOKE_WS}\",\"sessionId\":\"${SMOKE_SESSION}\",\"mountSubPath\":\"${SMOKE_MOUNT}\"}}}" >/tmp/acs-execute-payload.json
            if ! curl -fsS -m 420 -X POST http://127.0.0.1:3400/execute \
              -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
              --data-binary @/tmp/acs-execute-payload.json >/tmp/acs-execute.json; then
              SMOKE_OK=false
            elif ! grep -F 'ACR_BUILD_DEPLOY_SMOKE_OK' /tmp/acs-execute.json >/dev/null; then
              SMOKE_OK=false
            fi
          fi

          if [ "$SMOKE_OK" != "true" ]; then
            echo "SMOKE FAILED — dumping diagnostics" >&2
            cat /tmp/acs-provision.json 2>/dev/null || true
            cat /tmp/acs-execute.json 2>/dev/null || true
            if command -v kubectl >/dev/null 2>&1; then
              if [ -n "${ACS_KUBECONFIG:-}" ]; then KCFG_ARGS="--kubeconfig ${ACS_KUBECONFIG}"; else KCFG_ARGS=""; fi
              # imagePullSecret 401 是历史高发根因(2026-06-29), events 里最直观
              # shellcheck disable=SC2086
              kubectl $KCFG_ARGS -n "${ACS_NAMESPACE:-agent-saas-coding}" get events --sort-by=.lastTimestamp 2>/dev/null | tail -20 || true
            fi
            rollback
            exit 1
          fi

          if command -v kubectl >/dev/null 2>&1; then
            if [ -n "${ACS_KUBECONFIG:-}" ]; then KCFG_ARGS="--kubeconfig ${ACS_KUBECONFIG}"; else KCFG_ARGS=""; fi
            # shellcheck disable=SC2086
            kubectl $KCFG_ARGS -n "${ACS_NAMESPACE:-agent-saas-coding}" get sandbox \
              -l "app.kubernetes.io/managed-by=agent-saas-acs-orchestrator" \
              -o json >/tmp/acs-sandboxes.json 2>/dev/null || true
            if [ -s /tmp/acs-sandboxes.json ]; then
              CURRENT_IMAGE="$IMAGE" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/acs-sandboxes.json', 'utf8') || '{"items":[]}');
          const items = Array.isArray(body.items) ? body.items : [];
          const currentImage = process.env.CURRENT_IMAGE;
          const byPhaseImage = new Map();
          let stalePaused = 0;
          for (const item of items) {
            const phase = item?.status?.phase || 'Unknown';
            const containers = item?.spec?.template?.spec?.containers || [];
            const image = containers.find((container) => !container.name || container.name === 'sandbox')?.image || 'unknown';
            if (phase === 'Paused' && image !== currentImage) stalePaused += 1;
            const key = `${phase}\t${image}`;
            byPhaseImage.set(key, (byPhaseImage.get(key) || 0) + 1);
          }
          console.log(`ACS sandbox inventory: total=${items.length} stalePaused=${stalePaused}`);
          for (const [key, count] of [...byPhaseImage.entries()].sort()) {
            const [phase, image] = key.split('\t');
            console.log(`  ${phase} x${count} ${image}`);
          }
          NODE
            fi

            # ── 5.5 发布门禁：假暂停必须收敛为 0（2026-08-01，07-22/08-01 事故）──
            # 假暂停 = phase=Paused 但 SandboxPaused condition != True（如卡 False/
            # ImageChanged）或 spec.paused != true 的半状态；ACS 对其持续按运行态计费。
            # 新 orchestrator startup 会 retire stale Paused + lifecycle 回收 broken
            # （回收宽限默认 5min），给最多 8 分钟收敛。门禁失败不回滚（旧版行为更差），
            # 只 fail 提醒人工介入。
            GATE_OK=false
            for _ in $(seq 1 48); do
              # shellcheck disable=SC2086
              kubectl $KCFG_ARGS -n "${ACS_NAMESPACE:-agent-saas-coding}" get sandbox \
                -l "app.kubernetes.io/managed-by=agent-saas-acs-orchestrator" \
                -o json >/tmp/acs-gate-sandboxes.json 2>/dev/null || true
              BROKEN_COUNT="$(node <<'NODE'
          const fs = require('node:fs');
          let body = { items: [] };
          try { body = JSON.parse(fs.readFileSync('/tmp/acs-gate-sandboxes.json', 'utf8') || '{"items":[]}'); } catch {}
          const items = Array.isArray(body.items) ? body.items : [];
          let broken = 0;
          for (const item of items) {
            if ((item?.status?.phase || '') !== 'Paused') continue;
            const conditions = Array.isArray(item?.status?.conditions) ? item.status.conditions : [];
            const paused = conditions.find((c) => c && c.type === 'SandboxPaused');
            const pausedOk = paused && paused.status === 'True';
            const specPaused = item?.spec?.paused === true;
            if (!pausedOk || !specPaused) {
              broken += 1;
              console.error(`broken paused: ${item?.metadata?.name} specPaused=${item?.spec?.paused} cond=${paused ? `${paused.status}/${paused.reason}` : 'missing'}`);
            }
          }
          console.log(broken);
          NODE
              )"
              if [ "$BROKEN_COUNT" = "0" ]; then
                GATE_OK=true
                break
              fi
              echo "false-paused gate: ${BROKEN_COUNT} broken paused sandbox(es) remaining, waiting..."
              sleep 10
            done
            if [ "$GATE_OK" != "true" ]; then
              echo "FALSE-PAUSED GATE FAILED: broken paused sandboxes did not converge to 0 within 8min" >&2
              echo "these sandboxes keep billing as running (see 07-22/08-01 incidents); investigate orchestrator lifecycle logs" >&2
              exit 1
            fi
            echo "false-paused gate passed: 0 broken paused sandboxes"
          fi

          # ── 6. ImageCache: 为本次镜像提交缓存制作 + 清理旧缓存（2026-07-31 方案3-P0）──
          # 命中缓存的新 Sandbox 镜像拉取官方口径省 90%+。整段子 shell 容错：
          # 缓存制作失败只告警，绝不影响部署结果（无缓存时 Pod 回退正常拉取）。
          # ECS 侧凭据=EcsRamRole（policy AgentSaasAccImageCache，仅 acc 镜像缓存四个 API）。
          (
            set +e
            if ! command -v aliyun >/dev/null 2>&1; then echo "WARN: aliyun CLI missing, skip image cache"; exit 0; fi
            CACHE_NAME="agent-saas-acs-sandbox-$(printf '%s' "$IMAGE_TAG" | tr 'A-Z._' 'a-z--')"
            EXISTING=$(aliyun acc list-image-caches --biz-region-id cn-shenzhen 2>/dev/null)
            if printf '%s' "$EXISTING" | grep -F "\"$IMAGE\"" >/dev/null 2>&1; then
              echo "image cache already exists for $IMAGE_TAG"
            else
              if aliyun acc create-image-cache \
                --biz-region-id cn-shenzhen \
                --image-cache-name "$CACHE_NAME" \
                --images "$IMAGE" \
                --network-config '{"SecurityGroupId":"sg-wz97utch71p1mo0etbg9","VSwitchIds":["vsw-wz99c9ukqjjwn8xlzg5h5"]}' \
                --acr-registry-infos InstanceId=cri-tapxtcyd6odwj3m4 RegionId=cn-shenzhen >/tmp/acs-imc-create.json 2>&1; then
                echo "image cache creation submitted: $CACHE_NAME"
              else
                echo "WARN: image cache creation failed (non-fatal)"
                cat /tmp/acs-imc-create.json 2>/dev/null || true
              fi
            fi
            # 只清理本前缀且不是最近 3 个的缓存（免费额度 20/地域，防堆积）
            aliyun acc list-image-caches --biz-region-id cn-shenzhen 2>/dev/null | node -e '
              let raw = ""; process.stdin.on("data", (c) => raw += c).on("end", () => {
                const caches = (JSON.parse(raw || "{}").ImageCaches || [])
                  .filter((c) => (c.ImageCacheName || "").startsWith("agent-saas-acs-sandbox-"))
                  .sort((a, b) => String(b.CreateTime).localeCompare(String(a.CreateTime)));
                for (const c of caches.slice(3)) console.log(c.ImageCacheId);
              });
            ' | while IFS= read -r cache_id; do
              [ -n "$cache_id" ] || continue
              if aliyun acc delete-image-cache --biz-region-id cn-shenzhen --image-cache-id "$cache_id" >/dev/null 2>&1; then
                echo "pruned old image cache $cache_id"
              else
                echo "WARN: failed to prune image cache $cache_id"
              fi
            done
            exit 0
          )

          echo "ACS deploy OK: $IMAGE"
          REMOTE
