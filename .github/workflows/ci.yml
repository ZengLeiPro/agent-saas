# ============================================================================
# CI/CD Pipeline: install → typecheck → test + mobile contract → build → optional ECS → Web OSS
# ============================================================================
# 触发:
#   - push to main: 只构建 + 测试 + 打包 artifact（不部署生产）
#   - workflow_dispatch: 仅保留 Web-only 人工兼容发布。若生产 active ECS SHA→目标 SHA
#     存在任何 ECS 相关差异（或无法证明无差异），部署计划在生产 mutation 前 fail closed；
#     Server/API/Runtime Worker 必须走 RC + Production Promotion，禁止跨 job 非原子发布。
# 蓝绿部署脚本: 读 /etc/agent-saas/active-color 定位 idle 色 → 解包新 release →
#   只改 idle 色 symlink（active 色 symlink 永不动）→ start idle 实例 →
#   ready(180s) 门禁 + warmup(420s 软门禁) + 冒烟 → 重写 nginx upstream +
#   reload 切流 → 更新 active-color → 固化版本化 rollback.sh 与旧部署状态 →
#   SIGUSR2 精确 drain 旧色（活跃流清空后自退，Restart=on-failure 不复活）。
#   切流前任何失败只回收 idle 色并还原 current/previous/idle 色 symlink，
#   老色全程在服务，用户零影响。
# 零停机门禁(P2): 部署期间 runner 持续探测公网 healthz、业务 API 与 WS；
#   HTTP 传输错误先即时重试 1 次，逻辑样本仍要求 health/API/WS 全部成功。
# ============================================================================

name: App CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_only_compatibility:
        description: 'Confirm Web-only compatibility publish; Server/API/Worker changes require RC Promotion'
        required: true
        type: boolean
        default: false

# 手动生产发布与 ACS/Promotion 共用生产写锁且不可取消；普通 push/PR 按
# workflow + PR/ref 分组，只取消该组旧 run，避免陈旧门禁继续占用 Runner。
concurrency:
  # PR/push 只取消同一 workflow + PR/ref 的旧 run；run_attempt 不参与分组，重跑仍是一次独立门禁而非 retry 掩盖。
  group: ${{ github.event_name == 'workflow_dispatch' && 'production-runtime' || format('agent-saas-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_VERSION: '22.23.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight_checks:
    name: Preflight / Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: bash scripts/pr-preflight-task.sh checks

  coverage_scope:
    name: Preflight / Coverage scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.plan.outputs.workspaces }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select affected coverage workspaces
        id: plan
        run: >-
          node scripts/coverage-workspace-plan.mjs
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output "$GITHUB_OUTPUT"

  coverage:
    name: Preflight / Coverage (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: coverage_scope
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.coverage_scope.outputs.workspaces) }}

    # 只有 Server 覆盖率包含 PostgreSQL 测试；空 image 会让 GitHub Actions 跳过该服务，
    # 避免 Web/Shared 为未使用的数据库多付容器初始化时间。
    services:
      postgres:
        image: ${{ matrix.workspace == 'server' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        if: matrix.workspace != 'none'
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: matrix.workspace != 'none'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: matrix.workspace != 'none'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: matrix.workspace != 'none'
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.workspace }} coverage
        if: matrix.workspace != 'none'
        env:
          COVERAGE_REPORT_MODE: ci
          TEST_DATABASE_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
          MEMORY_CONSOLIDATION_TEST_PG_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
        run: bash scripts/pr-preflight-task.sh coverage "${{ matrix.workspace }}"

      # 跨 Runner 汇总 PR diff coverage 所需的最小文件；中间 artifact 仅保留一天。
      - name: Upload ${{ matrix.workspace }} coverage part
        if: always() && matrix.workspace != 'none'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-part-${{ matrix.workspace }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.workspace }}/coverage/lcov.info
            ${{ matrix.workspace }}/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 1

  postgres_contracts:
    name: Preflight / PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL contracts
        env:
          TEST_DATABASE_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
          MEMORY_CONSOLIDATION_TEST_PG_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
        run: bash scripts/pr-preflight-task.sh postgres

  web_production:
    name: Preflight / Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web production checks
        run: bash scripts/pr-preflight-task.sh web

  mobile_contract:
    name: Preflight / Mobile + native release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm 10.18.3
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js 22.23.1 with workspace cache
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Export real iOS and Android Router bundles
        run: pnpm -F mobile check:router-export

      - name: Lint native Maestro flows and test M60-02 receipt contracts
        run: pnpm -F mobile lint:maestro && pnpm -F mobile test:m60-02

      - name: Run M60-03 native mutation contracts and clean prebuild policy gate
        env:
          M60_03_ARTIFACT_DIR: .ci-artifacts/native-policy
        run: pnpm -F mobile test:m60-03 && pnpm -F mobile test:m60-03:prebuild

      - name: Run M60-04 workflow, schema, mock evidence and tamper contracts
        run: pnpm -F mobile test:m60-04

      - name: Run M60-05 schema, redaction, intake config and release evidence contracts
        run: pnpm -F @agent/shared exec vitest run src/telemetry/mobileTelemetry.test.ts && pnpm -F mobile test:m60-05 && pnpm -F server exec vitest run src/telemetry/mobileTelemetry.test.ts

      - name: Run M70-01 plan/schema/mock validator, negative, YAML and security contracts
        run: pnpm -F mobile test:m70-01

      - name: Run M70-02 rehearsal and M70-03 staged rollout contract/mock/negative/YAML/security gates
        run: pnpm -F mobile test:m70-02 && pnpm -F mobile test:m70-03

      - name: Upload bounded normalized M60-03 failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: m60-03-native-policy-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/native-policy/*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Run deterministic Shared and Mobile contract gate
        env:
          FORCE_COLOR: '0'
          NO_COLOR: '1'
        run: |
          set +e
          raw="$RUNNER_TEMP/mobile-contract.raw.log"
          sanitized="$RUNNER_TEMP/mobile-contract.sanitized.log"
          pnpm mobile-contract > "$raw" 2>&1
          status=$?
          set -e

          sed -E \
            -e "s#${GITHUB_WORKSPACE}#<workspace>#g" \
            -e "s#${HOME}#<home>#g" \
            -e 's#/(tmp|workspace|__w|github)/[^[:space:]]+#<path>#g' \
            -e 's/((authorization|token|secret|password)[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig' \
            -e 's/((bearer|gh[pousr]_)[[:space:]]*)[A-Za-z0-9._~+\/=:-]+/\1<redacted>/Ig' \
            "$raw" > "$sanitized"
          cat "$sanitized"

          if [ "$status" -ne 0 ]; then
            mkdir -p .ci-artifacts
            {
              echo "mobile-contract exit_code=$status"
              echo "last 300 sanitized lines:"
              tail -n 300 "$sanitized"
            } > .ci-artifacts/mobile-contract-failure.log
          fi
          rm -f "$raw" "$sanitized"
          exit "$status"

      - name: Upload bounded sanitized failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-contract-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/mobile-contract-failure.log
          if-no-files-found: warn
          retention-days: 1

  # 保留仓库 Ruleset 使用的唯一 required check 名称。任一并行门禁失败或取消，
  # 本汇总 Job 都会明确失败；生产部署仍只依赖 build，不会绕过任何子门禁。
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight_checks, coverage, postgres_contracts, web_production, mobile_contract]
    if: always()

    # 评论 PR diff coverage 需要 pull-requests: write；
    # push/dispatch 事件下该权限未使用不产生副作用。
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # coverage-diff.mjs 需要对比 base branch。fetch-depth=0 稳妥拿全历史；
          # 若担心 clone 时长，可改成 fetch-depth: 50 + 脚本内 fetch base。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 下载失败不掩盖测试结果：覆盖率测试本身由 coverage 矩阵守门，artifact
      # 仅用于汇总与评论，沿用原先“报告上传失败不判红”的策略。
      - name: Download server coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: coverage-part-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/coverage

      - name: Download web coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: coverage-part-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/coverage

      - name: Download shared coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: coverage-part-shared-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared/coverage

      - name: Report coverage summary
        if: always()
        run: pnpm coverage:summary

      - name: Compute PR diff coverage
        # 只在 PR 事件跑；push main / dispatch 不做 diff 评论（曾磊 07-18 起
        # 生产 deploy 已收敛到 dispatch，push 事件价值有限）。
        if: always() && github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: pnpm coverage:diff -- --write="$RUNNER_TEMP/coverage-diff.md"

      - name: Comment PR diff coverage
        # fork PR 的 GITHUB_TOKEN 只有只读权限，跳过评论，避免 403 把正常 CI 判红。
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/coverage-diff.md';
            if (!fs.existsSync(path)) {
              core.info('coverage-diff.md missing; skip comment');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- agent-saas-diff-coverage -->';
            const finalBody = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('no PR number in context; skip comment');
              return;
            }
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prev = existing.find(c => (c.body || '').includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: finalBody });
              core.info(`updated existing comment ${prev.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
              core.info('created new coverage comment');
            }

      - name: Upload coverage artifact
        if: always()
        # 仓库 artifact 配额长期紧张（2026-07-03 曾爆配额全线 CI 红，deploy 链因此
        # 不走 artifact）。上传失败不判红：覆盖率主消费路径是 Step Summary 与
        # PR 评论，artifact 只是补充。只传小体积 lcov + json-summary，
        # html 报告本地 pnpm test:coverage 随时可再生成，不占配额。
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server/coverage/lcov.info
            server/coverage/coverage-summary.json
            web/coverage/lcov.info
            web/coverage/coverage-summary.json
            shared/coverage/lcov.info
            shared/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify parallel preflight results
        if: always()
        env:
          PREFLIGHT_CHECKS_RESULT: ${{ needs.preflight_checks.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          POSTGRES_CONTRACTS_RESULT: ${{ needs.postgres_contracts.result }}
          WEB_PRODUCTION_RESULT: ${{ needs.web_production.result }}
          MOBILE_CONTRACT_RESULT: ${{ needs.mobile_contract.result }}
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "preflight_checks=$PREFLIGHT_CHECKS_RESULT" \
            "coverage=$COVERAGE_RESULT" \
            "postgres_contracts=$POSTGRES_CONTRACTS_RESULT" \
            "web_production=$WEB_PRODUCTION_RESULT" \
            "mobile_contract=$MOBILE_CONTRACT_RESULT"; do
            name="${gate%%=*}"
            result="${gate#*=}"
            if [ "$result" != "success" ]; then
              echo "::error title=Parallel preflight failed::$name concluded with $result"
              failed=1
            fi
          done
          exit "$failed"

  deploy_plan:
    name: Plan production deployment
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    outputs:
      ecs_required: ${{ steps.plan.outputs.ecs_required }}
      production_ecs_sha: ${{ steps.plan.outputs.production_ecs_sha }}

    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # 必须覆盖生产 active SHA 到目标 SHA 的累计差异，不能只看最后一个 commit。
          fetch-depth: 0

      - name: Confirm Web-only compatibility scope
        if: inputs.web_only_compatibility != true
        run: |
          {
            echo "### Compatibility deployment blocked"
            echo
            echo "- This legacy entrypoint is Web-only."
            echo "- Re-run with web_only_compatibility=true only for a Web-only target."
            echo "- Server/API/Runtime Worker changes must use RC + Production Promotion."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Compatibility scope::Explicit Web-only confirmation is required"
          exit 1

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          scan_path="$RUNNER_TEMP/production-known-host"
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$scan_path"
          test -s "$scan_path"
          test "$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$scan_path" >> ~/.ssh/known_hosts

      - name: Determine ECS deployment necessity
        id: plan
        run: |
          set -euo pipefail

          block_server_compatibility() {
            echo "ecs_required=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Compatibility deployment blocked"
              echo
              echo "- $1"
              echo "- This entrypoint cannot atomically compensate ECS + Web across jobs."
              echo "- Publish Server/API/Runtime Worker changes through RC + Production Promotion."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Web-only compatibility::$1"
            exit 1
          }

          production_ecs_sha="$(ssh -i ~/.ssh/ecs_deploy_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$ECS_USER@$ECS_HOST" '
              set -e
              marker=/etc/agent-saas/active-color
              root=/opt/agent-saas-app/color
              [ -f "$marker" ] || exit 0
              color=$(tr -d "[:space:]" < "$marker")
              case "$color" in blue|green) ;; *) exit 0 ;; esac
              release_env="/etc/agent-saas/server-$color.release.env"
              [ -f "$release_env" ] || exit 0
              sed -n "s/^AGENT_SAAS_RELEASE_SHA=//p" "$release_env" | head -n1
            ' 2>/dev/null || true)"

          printf '%s' "$production_ecs_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || block_server_compatibility "cannot prove the active ECS release SHA"
          git cat-file -e "$production_ecs_sha^{commit}" 2>/dev/null \
            || block_server_compatibility "production ECS commit $production_ecs_sha is outside checkout history"
          git merge-base --is-ancestor "$production_ecs_sha" "$GITHUB_SHA" \
            || block_server_compatibility "production ECS commit $production_ecs_sha is not an ancestor of target"

          echo "production_ecs_sha=$production_ecs_sha" >> "$GITHUB_OUTPUT"
          if [ "$production_ecs_sha" = "$GITHUB_SHA" ]; then
            echo "ecs_required=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ECS deploy necessity gate"
              echo
              echo "- **ECS skipped**: production already runs target \`${production_ecs_sha:0:8}\`"
              echo "- Web OSS may still publish or repair the same target independently"
              echo "- compatibility scope: Web-only; Server/API/Worker must use RC Promotion"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/ecs-prod-diff.txt"
          git diff --name-only "$production_ecs_sha" "$GITHUB_SHA" > "$changed_files"
          out="$RUNNER_TEMP/ecs-release-classification.out"
          bash .github/scripts/ecs-release-classify.sh "$changed_files" > "$out" \
            || block_server_compatibility "ECS release classification failed"
          cat "$out"

          required="$(sed -n 's/^required=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped="$(sed -n 's/^skipped=//p' "$out")"
          case "$required" in true|false) ;; *) block_server_compatibility "classifier returned invalid required=$required" ;; esac
          echo "ecs_required=$required" >> "$GITHUB_OUTPUT"

          if [ "$required" = "true" ]; then
            block_server_compatibility "ECS changes are required since production ${production_ecs_sha:0:8}: $reason"
          else
            {
              echo "### Web-only compatibility gate"
              echo
              echo "- **ECS mutation prohibited**: only Web/Mobile/docs/test paths changed since production `${production_ecs_sha:0:8}`"
              echo "- non-ECS paths: $skipped"
              echo "- Web OSS may publish without rolling Web/API or Runtime Worker"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: production
    # 覆盖构建打包 + Web/Runtime Worker 双蓝绿部署最坏路径
    timeout-minutes: 55
    needs: [build, deploy_plan]
    # 保留旧 job 定义只为历史可追溯；绑定 production 的 deploy_plan 对任何
    # ecs_required=true 或无法证明 Web-only 的 dispatch 都先失败，因此该 job 不再可达。
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.deploy_plan.outputs.ecs_required == 'true'
    outputs:
      server_artifact_digest: ${{ steps.pack.outputs.server_artifact_digest }}

    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      RELEASE_RECORD_OSS_URI: oss://agent-saas-release-records
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      DEPLOY_ROOT: /opt/agent-saas-app
      # systemd 模板单元前缀：实际实例为 agent-saas-server@blue / agent-saas-server@green
      SERVICE_NAME: agent-saas-server

    steps:
      # 部署产物不走 GitHub artifact（存储配额有限且用量重算延迟 6-12h，
      # 2026-07-03 曾因配额爆掉全线 CI 红）；deploy job 自构建后直接 scp。
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Runtime Worker 必要性门禁要和生产当前 worker SHA 做完整 diff。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server production bundle
        run: pnpm -F server build

      - name: Pack and identify ECS release
        id: pack
        run: |
          set -euo pipefail
          test -s server/dist/index.js
          stage="$RUNNER_TEMP/server-release-stage"
          mkdir -p "$stage/scripts/release" "$stage/workspace-shared"
          pnpm --config.allowUnusedPatches=true --filter server --prod deploy "$stage/server"
          rm -rf "$stage/server/dist" "$stage/server/descriptions"
          cp -R server/dist "$stage/server/dist"
          cp -R server/src/agent/descriptions "$stage/server/descriptions"
          node scripts/release/runtime-dependency.mjs \
            --create=true --contract=config/runtime-dependency-contract.json \
            --source-sha="$GITHUB_SHA" --output="$stage/server/runtime-dependencies.json"
          install -m 0444 scripts/release/runtime-dependency.mjs \
            scripts/release/artifact-lib.mjs "$stage/server/dist/"
          cp -R daemon-packaging "$stage/daemon-packaging"
          install -m 0444 scripts/release/artifact-lib.mjs \
            scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs \
            scripts/release/rollback-compatibility-app.sh \
            scripts/release/compatibility-deploy-transaction.sh \
            scripts/release/seal-compatibility-release.mjs \
            scripts/release/verify-installed-release.mjs \
            scripts/release/write-compatibility-app-env.mjs \
            scripts/release/write-live-production-identity.mjs "$stage/scripts/release/"
          tar --no-xattrs -czf server-bundle.tgz -C "$stage" .
          node scripts/release/create-component-artifact-index.mjs \
            --sha "$GITHUB_SHA" --name serverBundle --file server-bundle.tgz \
            --runtime-dependencies "$stage/server/runtime-dependencies.json" \
            --output "$RUNNER_TEMP/server-artifact-index.json"
          server_digest="$(jq -r .artifacts.serverBundle.digest "$RUNNER_TEMP/server-artifact-index.json")"
          echo "server_artifact_digest=$server_digest" >> "$GITHUB_OUTPUT"
          server_size="$(jq -r .artifacts.serverBundle.size "$RUNNER_TEMP/server-artifact-index.json")"
          release_id="rc-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          {
            echo "SERVER_ARTIFACT_DIGEST=$server_digest"
            echo "SERVER_ARTIFACT_SIZE=$server_size"
            echo "COMPAT_RELEASE_ID=$release_id"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          scan_path="$RUNNER_TEMP/production-known-host"
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$scan_path"
          test -s "$scan_path"
          test "$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$scan_path" >> ~/.ssh/known_hosts

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz \
            -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: Persist immutable Server baseline
        run: |
          set -euo pipefail
          : "${RELEASE_RECORD_OSS_URI:?Missing Release Record OSS URI}"
          destination="$RELEASE_RECORD_OSS_URI/baselines/app-${GITHUB_SHA}-${SERVER_ARTIFACT_DIGEST#sha256:}"
          bash scripts/release/upload-oss-object-immutable.sh \
            server-bundle.tgz "$destination/server-bundle.tgz"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/server-release-stage/server/runtime-dependencies.json" \
            "$destination/runtime-dependencies.json"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/server-artifact-index.json" "$destination/artifact-index.json"

      - name: Determine runtime worker rollout
        run: |
          # API 与 Runtime Worker 共享同一份 Server bundle。兼容部署若只切 API，
          # 新的生产身份契约就会立即变成混合版本，因此旧入口也必须成对滚动。
          echo "RUNTIME_WORKER_DEPLOY_REQUIRED=true" >> "$GITHUB_ENV"
          echo "runtime worker rollout: required to converge the shared Server bundle identity"

      - name: Upload release
        run: |
          scp -i ~/.ssh/ecs_deploy_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            server-bundle.tgz \
            "$ECS_USER@$ECS_HOST:/tmp/agent-saas-${GITHUB_RUN_ID}-${GITHUB_SHA}.tgz"

      - name: Start zero-downtime probe
        run: |
          # 部署期零停机探测（P2 门禁）：每轮同时探测 healthz、只读业务 API、WS 建连，
          # 每行记录 "epoch health_code api_status ws_status" 到 probe.log；
          # Deploy 结束后由 Assert zero downtime 步骤统计并守门。
          # 注意：前端域 agent.kaiyan.net 已 CNAME 到 OSS（2026-07-15 分域），
          # API/WS 生产入口是 api.agent.kaiyan.net → ECS nginx，探测必须打 API 域。
          HEALTH_URL=https://api.agent.kaiyan.net/api/healthz
          BUSINESS_API_URL=https://api.agent.kaiyan.net/api/signup/status
          WS_URL='wss://api.agent.kaiyan.net/ws?probe=1'
          WS_PROBE_SCRIPT=server/scripts/zero-downtime-ws-probe.mjs

          # 首次发布探针端点时，旧版本会返回 401。bootstrap 模式只在本次发布允许
          # 切流前的 legacy-auth，且切流后必须至少观察到一次新版本 WS 探针成功。
          # 一旦生产已有探针，后续发布自动进入 strict，legacy-auth 也算失败。
          set +e
          ws_preflight=$(node "$WS_PROBE_SCRIPT" "$WS_URL" 4000 2>&1)
          ws_preflight_rc=$?
          set -e
          case "$ws_preflight_rc" in
            0) WS_MODE=strict ;;
            2) WS_MODE=bootstrap ;;
            *)
              echo "WS probe preflight failed: $ws_preflight"
              exit 1
              ;;
          esac
          echo "$WS_MODE" > "$RUNNER_TEMP/probe.ws-mode"
          echo "WS probe mode=$WS_MODE preflight=$ws_preflight"

          : > "$RUNNER_TEMP/probe.log"
          : > "$RUNNER_TEMP/probe-details.log"
          (
            set +e

            # GitHub runner 到生产入口偶发单次传输超时，且请求可能根本未到 nginx。
            # 只对 curl 非零退出（DNS/TCP/TLS/timeout）即时重试一次；HTTP 4xx/5xx、
            # 200 非法正文等应用层失败不重试，仍由严格门禁直接计失败。
            probe_http() {
              local url="$1"
              local body_file="$2"
              local label="$3"
              local attempt code rc error_text

              for attempt in 1 2; do
                code=$(curl -sS -o "$body_file" -m 4 -w '%{http_code}' "$url" 2>"${body_file}.error")
                rc=$?
                if [ "$rc" -eq 0 ]; then
                  printf '%s' "${code:-000}"
                  return 0
                fi

                error_text=$(tr '\n' ' ' < "${body_file}.error" | cut -c1-300)
                if [ "$attempt" -eq 1 ]; then
                  printf '%s %s transport retry rc=%s error=%s\n' \
                    "$(date +%s)" "$label" "$rc" "$error_text" >> "$RUNNER_TEMP/probe-details.log"
                else
                  printf '%s %s transport failed rc=%s error=%s\n' \
                    "$(date +%s)" "$label" "$rc" "$error_text" >> "$RUNNER_TEMP/probe-details.log"
                fi
              done

              printf '%s' "${code:-000}"
              return "$rc"
            }

            while true; do
              sample_epoch=$(date +%s)

              health_body="$RUNNER_TEMP/probe-health-body.txt"
              health_code=$(probe_http "$HEALTH_URL" "$health_body" health)
              if [ "$health_code" != "200" ]; then
                printf '%s health validation failed http=%s\n' \
                  "$sample_epoch" "${health_code:-000}" >> "$RUNNER_TEMP/probe-details.log"
              fi

              api_body="$RUNNER_TEMP/probe-api-body.json"
              api_code=$(probe_http "$BUSINESS_API_URL" "$api_body" api)
              if [ "$api_code" = "200" ] && grep -Eq '"enabled"[[:space:]]*:[[:space:]]*(true|false)' "$api_body"; then
                api_status=ok
              else
                api_status=failed
                api_excerpt=$(tr '\n' ' ' < "$api_body" | cut -c1-300)
                printf '%s api validation failed http=%s body=%s\n' \
                  "$sample_epoch" "${api_code:-000}" "$api_excerpt" >> "$RUNNER_TEMP/probe-details.log"
              fi

              ws_output=$(node "$WS_PROBE_SCRIPT" "$WS_URL" 4000 2>&1)
              ws_rc=$?
              case "$ws_rc" in
                0) ws_status=ok ;;
                2) ws_status=legacy-auth ;;
                *)
                  ws_status=failed
                  printf '%s ws failed rc=%s detail=%s\n' \
                    "$sample_epoch" "$ws_rc" "$(printf '%s' "$ws_output" | tr '\n' ' ' | cut -c1-300)" \
                    >> "$RUNNER_TEMP/probe-details.log"
                  ;;
              esac

              echo "$sample_epoch $health_code $api_status $ws_status"
              sleep 1
            done
          ) >> "$RUNNER_TEMP/probe.log" 2>/dev/null &
          echo $! > "$RUNNER_TEMP/probe.pid"
          echo "probe started pid=$(cat "$RUNNER_TEMP/probe.pid") log=$RUNNER_TEMP/probe.log"

      - name: Deploy and restart
        id: deploy
        timeout-minutes: 46
        run: |
          # 覆盖冷安装、Web idle 排空、worker idle 排空、双 ready/warmup 与旧实例观察。
          REMOTE_DEPLOY_TIMEOUT_SECONDS=2600
          REMOTE_DEPLOY_START_EPOCH=$(date +%s)
          echo "Remote deploy timeout: ${REMOTE_DEPLOY_TIMEOUT_SECONDS}s"
          timeout "${REMOTE_DEPLOY_TIMEOUT_SECONDS}s" ssh -i ~/.ssh/ecs_deploy_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$ECS_USER@$ECS_HOST" \
            "REMOTE_DEPLOY_TIMEOUT_SECONDS='$REMOTE_DEPLOY_TIMEOUT_SECONDS' REMOTE_DEPLOY_START_EPOCH='$REMOTE_DEPLOY_START_EPOCH' DEPLOY_ROOT='$DEPLOY_ROOT' SERVICE_NAME='$SERVICE_NAME' RELEASE_TGZ='/tmp/agent-saas-${GITHUB_RUN_ID}-${GITHUB_SHA}.tgz' RELEASE_ID='${SERVER_ARTIFACT_DIGEST#sha256:}' RELEASE_SHA='${GITHUB_SHA}' COMPAT_RELEASE_ID='${COMPAT_RELEASE_ID}' SERVER_ARTIFACT_DIGEST='${SERVER_ARTIFACT_DIGEST}' WORKER_DEPLOY_REQUIRED='${RUNTIME_WORKER_DEPLOY_REQUIRED}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' GITHUB_RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' bash -s" <<'REMOTE'
          # -E: 函数内失败也触发 ERR trap，保证任何失败都有 on_error 日志
          set -Eeuo pipefail

          : "${REMOTE_DEPLOY_TIMEOUT_SECONDS:?missing REMOTE_DEPLOY_TIMEOUT_SECONDS}"
          : "${REMOTE_DEPLOY_START_EPOCH:?missing REMOTE_DEPLOY_START_EPOCH}"
          : "${DEPLOY_ROOT:?missing DEPLOY_ROOT}"
          : "${SERVICE_NAME:?missing SERVICE_NAME}"
          : "${RELEASE_TGZ:?missing RELEASE_TGZ}"
          : "${RELEASE_ID:?missing RELEASE_ID}"
          : "${RELEASE_SHA:?missing RELEASE_SHA}"
          : "${COMPAT_RELEASE_ID:?missing COMPAT_RELEASE_ID}"
          : "${SERVER_ARTIFACT_DIGEST:?missing SERVER_ARTIFACT_DIGEST}"
          : "${WORKER_DEPLOY_REQUIRED:?missing WORKER_DEPLOY_REQUIRED}"
          : "${GITHUB_RUN_ID:?missing GITHUB_RUN_ID}"
          : "${GITHUB_RUN_ATTEMPT:?missing GITHUB_RUN_ATTEMPT}"
          case "$REMOTE_DEPLOY_TIMEOUT_SECONDS" in ''|*[!0-9]*) echo "invalid REMOTE_DEPLOY_TIMEOUT_SECONDS=$REMOTE_DEPLOY_TIMEOUT_SECONDS"; exit 1 ;; esac
          case "$REMOTE_DEPLOY_START_EPOCH" in ''|*[!0-9]*) echo "invalid REMOTE_DEPLOY_START_EPOCH=$REMOTE_DEPLOY_START_EPOCH"; exit 1 ;; esac
          case "$WORKER_DEPLOY_REQUIRED" in true|false) ;; *) echo "invalid WORKER_DEPLOY_REQUIRED=$WORKER_DEPLOY_REQUIRED"; exit 1 ;; esac
          DEPLOY_LOCK_FILE="/run/lock/agent-saas/promotion.lock"
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is required for production deploy serialization" >&2
            rm -f -- "$RELEASE_TGZ"
            exit 1
          fi
          mkdir -p "$(dirname "$DEPLOY_LOCK_FILE")"
          exec 9>"$DEPLOY_LOCK_FILE"
          if ! flock -n 9; then
            echo "another production deploy holds $DEPLOY_LOCK_FILE" >&2
            rm -f -- "$RELEASE_TGZ"
            exit 1
          fi
          actual_archive_digest="sha256:$(sha256sum "$RELEASE_TGZ" | cut -d' ' -f1)"
          test "$actual_archive_digest" = "$SERVER_ARTIFACT_DIGEST"
          RUNTIME_IDENTITY_FILE="/etc/agent-saas/runtime-identity.json"
          test -s "$RUNTIME_IDENTITY_FILE"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" \
            "$RUNTIME_IDENTITY_FILE"
          RUNTIME_IDENTITY_BAK="/tmp/runtime-identity.before-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cp "$RUNTIME_IDENTITY_FILE" "$RUNTIME_IDENTITY_BAK"
          identity_probe="/etc/agent-saas/.runtime-identity-write-probe-${GITHUB_RUN_ID}"
          printf '{}\n' > "$identity_probe.candidate"
          mv "$identity_probe.candidate" "$identity_probe"
          rm -f "$identity_probe"

          APP_LINK="$DEPLOY_ROOT/current"
          PREV_LINK="$DEPLOY_ROOT/previous"
          RELEASES_DIR="$DEPLOY_ROOT/releases"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"
          COLOR_DIR="$DEPLOY_ROOT/color"
          WORKER_DIR="$DEPLOY_ROOT/worker"
          DATA_DIR="/mnt/agent-saas/server-data"
          ACTIVE_COLOR_FILE="/etc/agent-saas/active-color"
          WORKER_ACTIVE_COLOR_FILE="/etc/agent-saas/runtime-worker-active-color"
          WORKER_SERVICE="agent-saas-runtime-worker"
          UPSTREAM_CONF="/etc/nginx/conf.d/agent-saas-upstream.conf"
          API_SITE_CONF="/etc/nginx/conf.d/agent-api-kaiyan.conf"
          MAINTENANCE_SERVICE="agent-saas-deploy-maintenance.service"
          MAINTENANCE_TIMER="agent-saas-deploy-maintenance.timer"

          START_EPOCH=$REMOTE_DEPLOY_START_EPOCH
          DEPLOY_ROLLBACK_RESERVE_SECONDS=300
          DEPLOY_FAILSAFE_DEADLINE_EPOCH=$((START_EPOCH + REMOTE_DEPLOY_TIMEOUT_SECONDS - DEPLOY_ROLLBACK_RESERVE_SECONDS))
          LEGACY_DRAIN_DEADLINE_EPOCH=$((START_EPOCH + 1600))
          elapsed_seconds() {
            echo $(( $(date +%s) - START_EPOCH ))
          }
          log() {
            printf '[remote %s +%ss] %s\n' "$(date -Is)" "$(elapsed_seconds)" "$*"
          }
          write_color_marker() {
            local file="$1" color="$2" candidate="${1}.candidate"
            rm -f "$candidate" || return 1
            printf '%s\n' "$color" > "$candidate" || return 1
            chmod 0644 "$candidate" || { rm -f "$candidate"; return 1; }
            mv -f "$candidate" "$file" || { rm -f "$candidate"; return 1; }
          }
          write_worker_active_color() {
            write_color_marker "$WORKER_ACTIVE_COLOR_FILE" "$1"
          }
          INSTALL_CLEANUP_ARMED=0
          ROLLBACK_STATE_COMMITTED=0
          ROLLBACK_STATE_DIR=''
          ROLLBACK_STATE_PRESERVE=0
          SYSTEMD_UNITS_DIRTY=0
          UNIT_RESTORE_FAILED=0
          FAILURE_RECOVERY_ACTIVE=0
          FAILURE_RECOVERY_COMPLETED=0
          FAILURE_STATUS=1
          FAILURE_LINE=unknown
          TRAFFIC_SWITCHED=0
          SYMLINKS_DIRTY=0
          WORKER_SYMLINK_DIRTY=0
          WEB_IDLE_ENABLEMENT_DIRTY=0
          WEB_IDLE_WAS_ENABLED=0
          PREV_CURRENT=''
          PREV_PREVIOUS=''
          PREV_IDLE_TARGET=''
          PREVIOUS_UPDATED=0
          restore_predeploy_symlinks() {
            [ "$SYMLINKS_DIRTY" -eq 1 ] || [ "$WORKER_SYMLINK_DIRTY" -eq 1 ] || return 0
            if ! DEPLOY_ROOT="$DEPLOY_ROOT" \
              ROLLBACK_STATE_DIR="$ROLLBACK_STATE_DIR" \
              SYMLINKS_DIRTY="$SYMLINKS_DIRTY" \
              WORKER_SYMLINK_DIRTY="$WORKER_SYMLINK_DIRTY" \
              PREV_LINK="$APP_LINK" \
              PREV_CURRENT="$PREV_CURRENT" \
              PREVIOUS_UPDATED="$PREVIOUS_UPDATED" \
              PREVIOUS_LINK="$PREV_LINK" \
              PREV_PREVIOUS="$PREV_PREVIOUS" \
              COLOR_IDLE_LINK="$COLOR_DIR/$IDLE" \
              PREV_IDLE_TARGET="$PREV_IDLE_TARGET" \
              WORKER_IDLE_LINK="$WORKER_DIR/${WORKER_IDLE:-none}" \
              PREV_WORKER_IDLE_TARGET="${PREV_WORKER_IDLE_TARGET:-}" \
              bash "$RELEASE_DIR/scripts/release/compatibility-deploy-transaction.sh" \
                restore-symlinks; then
              ROLLBACK_STATE_PRESERVE=1
              return 70
            fi
            SYMLINKS_DIRTY=0
            WORKER_SYMLINK_DIRTY=0
            log "symlinks restored: current=${PREV_CURRENT:-<none>} color/$IDLE=${PREV_IDLE_TARGET:-<none>} worker/${WORKER_IDLE:-none}=${PREV_WORKER_IDLE_TARGET:-<none>}"
          }
          restore_predeploy_systemd_units() {
            [ "$SYSTEMD_UNITS_DIRTY" -eq 1 ] || return 0
            if ! DEPLOY_ROOT="$DEPLOY_ROOT" \
              ROLLBACK_STATE_DIR="$ROLLBACK_STATE_DIR" \
              SERVER_UNIT_PATH="/etc/systemd/system/${SERVICE_NAME}@.service" \
              WORKER_UNIT_PATH="/etc/systemd/system/${WORKER_SERVICE}@.service" \
              NGINX_DROP_IN_PATH="/etc/systemd/system/nginx.service.d/agent-saas-nas.conf" \
              SYSTEMCTL_BIN=systemctl \
              bash "$RELEASE_DIR/scripts/release/compatibility-deploy-transaction.sh" restore-units; then
              UNIT_RESTORE_FAILED=1
              ROLLBACK_STATE_PRESERVE=1
              return 1
            fi
            return 0
          }
          mark_manual_recovery() {
            DEPLOY_ROOT="$DEPLOY_ROOT" \
              ROLLBACK_STATE_DIR="$ROLLBACK_STATE_DIR" \
              RELEASE_ID="$RELEASE_ID" \
              FAILED_STATUS="$FAILURE_STATUS" \
              FAILED_LINE="$FAILURE_LINE" \
              bash "$RELEASE_DIR/scripts/release/compatibility-deploy-transaction.sh" \
                mark-manual-recovery
          }
          recover_previous_nginx() {
            FAILURE_STATUS=1
            FAILURE_LINE="$1"
            DEPLOY_ROOT="$DEPLOY_ROOT" \
              ROLLBACK_STATE_DIR="$ROLLBACK_STATE_DIR" \
              RELEASE_ID="$RELEASE_ID" \
              FAILED_STATUS="$FAILURE_STATUS" \
              FAILED_LINE="$FAILURE_LINE" \
              UPSTREAM_CONF="$UPSTREAM_CONF" \
              UPSTREAM_BAK="$UPSTREAM_BAK" \
              API_SITE_CONF="$API_SITE_CONF" \
              API_SITE_BAK="$API_SITE_BAK" \
              NGINX_BIN=nginx \
              SYSTEMCTL_BIN=systemctl \
              bash "$RELEASE_DIR/scripts/release/compatibility-deploy-transaction.sh" \
                recover-nginx-switch
          }
          on_error() {
            local status=$?
            trap - ERR
            FAILURE_STATUS="$status"
            FAILURE_LINE="$1"
            log "ERROR status=$status line=$1 release=$RELEASE_ID"
            if [ "$TRAFFIC_SWITCHED" -eq 0 ] && [ "$FAILURE_RECOVERY_ACTIVE" -eq 0 ] \
              && declare -F rollback_idle_and_exit >/dev/null; then
              rollback_idle_and_exit "$status"
            fi
            exit "$status"
          }
          on_exit() {
            local status=$? final_status
            trap - ERR EXIT
            [ "$status" -ne 0 ] || return 0
            final_status="$status"
            if [ "$FAILURE_LINE" = unknown ]; then
              FAILURE_STATUS="$status"
            fi
            if [ "$TRAFFIC_SWITCHED" -eq 0 ] && [ "$SYSTEMD_UNITS_DIRTY" -eq 1 ] \
              && [ "$UNIT_RESTORE_FAILED" -eq 0 ]; then
              if ! restore_predeploy_systemd_units; then
                final_status=70
                log "ERROR: previous systemd units could not be restored; rollback state preserved"
              else
                SYSTEMD_UNITS_DIRTY=0
              fi
            fi
            if [ "$TRAFFIC_SWITCHED" -eq 0 ] \
              && { [ "$SYMLINKS_DIRTY" -eq 1 ] || [ "$WORKER_SYMLINK_DIRTY" -eq 1 ]; }; then
              if ! restore_predeploy_symlinks; then
                ROLLBACK_STATE_PRESERVE=1
                final_status=70
                log "ERROR: pre-switch symlinks could not be restored; rollback state preserved"
              fi
            fi
            if [ "$FAILURE_RECOVERY_ACTIVE" -eq 1 ] && [ "$FAILURE_RECOVERY_COMPLETED" -eq 0 ]; then
              ROLLBACK_STATE_PRESERVE=1
              final_status=70
              log "ERROR: pre-switch recovery did not complete; rollback state preserved"
            fi
            if [ "$TRAFFIC_SWITCHED" -eq 1 ] && [ "$ROLLBACK_STATE_COMMITTED" -eq 0 ] \
              && [ -n "$ROLLBACK_STATE_DIR" ]; then
              ROLLBACK_STATE_PRESERVE=1
              final_status=70
              if [ -f "$ROLLBACK_STATE_DIR/manual-recovery-required" ] \
                && [ ! -L "$ROLLBACK_STATE_DIR/manual-recovery-required" ]; then
                log "manual recovery marker already recorded for failure line $FAILURE_LINE"
              elif ! mark_manual_recovery; then
                log "ERROR: failed to write manual recovery marker; rollback snapshot remains preserved"
              fi
            fi
            if [ "$TRAFFIC_SWITCHED" -eq 0 ] && [ "$ROLLBACK_STATE_PRESERVE" -eq 0 ]; then
              if [ "$INSTALL_CLEANUP_ARMED" -eq 1 ]; then
                case "$RELEASE_DIR" in
                  "$RELEASES_DIR"/*)
                    log "remove failed release: $RELEASE_DIR"
                    rm -rf -- "$RELEASE_DIR" || log "WARN: failed release cleanup failed"
                    ;;
                  *)
                    log "WARN: refuse failed release cleanup outside $RELEASES_DIR: $RELEASE_DIR"
                    ;;
                esac
              fi
              rm -f -- "$RELEASE_TGZ" || log "WARN: failed upload cleanup failed"
            fi
            if [ "$ROLLBACK_STATE_COMMITTED" -eq 0 ] && [ -n "$ROLLBACK_STATE_DIR" ] \
              && [ "$ROLLBACK_STATE_PRESERVE" -eq 0 ]; then
              case "$ROLLBACK_STATE_DIR" in
                "$DEPLOY_ROOT/rollback-states/"*)
                  rm -rf -- "$ROLLBACK_STATE_DIR" || log "WARN: failed rollback state cleanup failed"
                  ;;
                *) log "WARN: refuse rollback state cleanup outside managed root: $ROLLBACK_STATE_DIR" ;;
              esac
            fi
            exit "$final_status"
          }
          trap 'on_error $LINENO' ERR
          trap on_exit EXIT

          log "deploy start release=$RELEASE_ID root=$DEPLOY_ROOT service=$SERVICE_NAME"

          # GitHub concurrency 管整条 workflow；共享 ECS flock 覆盖 Promotion、ACS 与手工 SSH。
          # fd 9 自远端脚本开头持有至退出，基线探测和所有生产写入都在锁内。
          log "deploy lock acquired: $DEPLOY_LOCK_FILE"

          # 每小时清理被 SIGKILL、断网等硬中断遗留的超龄上传包。正常成功、
          # 可捕获失败仍由本次部署即时删除；timer 只处理超过 24h 的精确命名文件。
          cat > "/etc/systemd/system/$MAINTENANCE_SERVICE" <<'MAINTENANCE_SERVICE_UNIT'
          [Unit]
          Description=Clean stale agent-saas deploy archives

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/find /tmp -maxdepth 1 -type f -name agent-saas-*.tgz -mmin +1440 -print -delete
          Nice=10
          IOSchedulingClass=idle
          MAINTENANCE_SERVICE_UNIT
          cat > "/etc/systemd/system/$MAINTENANCE_TIMER" <<'MAINTENANCE_TIMER_UNIT'
          [Unit]
          Description=Run agent-saas deploy archive cleanup hourly

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1h
          RandomizedDelaySec=5min
          Persistent=true
          Unit=agent-saas-deploy-maintenance.service

          [Install]
          WantedBy=timers.target
          MAINTENANCE_TIMER_UNIT
          systemctl daemon-reload
          systemctl enable --now "$MAINTENANCE_TIMER"
          systemctl start "$MAINTENANCE_SERVICE"
          systemctl is-enabled --quiet "$MAINTENANCE_TIMER"
          systemctl is-active --quiet "$MAINTENANCE_TIMER"
          log "stale archive cleanup timer active: age>24h interval=1h"

          # ── 1. 前置校验：蓝绿标记与 active 实例必须就绪 ──
          if [ ! -f "$ACTIVE_COLOR_FILE" ]; then
            log "ERROR: $ACTIVE_COLOR_FILE missing; finish the one-time manual blue-green migration first"
            exit 1
          fi
          ACTIVE=$(tr -d '[:space:]' < "$ACTIVE_COLOR_FILE")
          case "$ACTIVE" in
            blue)  IDLE="green"; IDLE_PORT=3201; ACTIVE_PORT=3200 ;;
            green) IDLE="blue";  IDLE_PORT=3200; ACTIVE_PORT=3201 ;;
            *)
              log "ERROR: invalid active color '$ACTIVE' in $ACTIVE_COLOR_FILE (expect blue|green); finish the manual blue-green migration first"
              exit 1
              ;;
          esac
          if ! systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}"; then
            log "ERROR: ${SERVICE_NAME}@${ACTIVE} is not active; finish the one-time manual blue-green migration first"
            exit 1
          fi
          log "colors resolved: active=$ACTIVE:$ACTIVE_PORT idle=$IDLE:$IDLE_PORT"

          READY_URL="http://127.0.0.1:$IDLE_PORT/api/healthz/ready"
          HEALTHZ_URL="http://127.0.0.1:$IDLE_PORT/api/healthz"
          DRAINZ_URL="http://127.0.0.1:$IDLE_PORT/api/healthz/drain"

          # ── 2. 发布前清理与容量门禁：先腾空间，再开始不可复用的安装工作 ──
          mkdir -p "$RELEASES_DIR" "$DATA_DIR" "$COLOR_DIR" "$WORKER_DIR"
          KEEP_CURRENT=$(readlink "$APP_LINK" 2>/dev/null || true)
          KEEP_PREV=$(readlink "$PREV_LINK" 2>/dev/null || true)
          KEEP_BLUE=$(readlink "$COLOR_DIR/blue" 2>/dev/null || true)
          KEEP_GREEN=$(readlink "$COLOR_DIR/green" 2>/dev/null || true)
          KEEP_WORKER_BLUE=$(readlink "$WORKER_DIR/blue" 2>/dev/null || true)
          KEEP_WORKER_GREEN=$(readlink "$WORKER_DIR/green" 2>/dev/null || true)

          is_protected_release() {
            local candidate="$1"
            [ "$candidate" = "$KEEP_CURRENT" ] || [ "$candidate" = "$KEEP_PREV" ] \
              || [ "$candidate" = "$KEEP_BLUE" ] || [ "$candidate" = "$KEEP_GREEN" ] \
              || [ "$candidate" = "$KEEP_WORKER_BLUE" ] || [ "$candidate" = "$KEEP_WORKER_GREEN" ]
          }

          log "release cleanup start before install: keep newest 4 existing releases plus current/previous/color targets"
          (ls -dt "$RELEASES_DIR"/*/ 2>/dev/null || true) | tail -n +5 | while read -r old; do
            old="${old%/}"
            if [ -n "$old" ] && ! is_protected_release "$old"; then
              case "$old" in
                "$RELEASES_DIR"/*)
                  if [ -L "$old" ]; then
                    log "ERROR: refuse to prune release symlink: $old"
                    exit 1
                  fi
                  log "pruning old release: $old"
                  rm -rf -- "$old"
                  ;;
                *)
                  log "ERROR: refuse to prune path outside $RELEASES_DIR: $old"
                  exit 1
                  ;;
              esac
            fi
          done
          log "release cleanup done"

          if [ -e "$RELEASE_DIR" ]; then
            if [ "$RELEASE_DIR" = "$KEEP_CURRENT" ] && [ "$RELEASE_DIR" = "$(readlink "$COLOR_DIR/$ACTIVE" 2>/dev/null || true)" ]; then
              log "release is already active; remove duplicate upload and finish as idempotent no-op"
              rm -f -- "$RELEASE_TGZ"
              exit 0
            fi
            if is_protected_release "$RELEASE_DIR"; then
              log "ERROR: existing release is protected by previous/color target; use rollback instead of overwriting it: $RELEASE_DIR"
              rm -f -- "$RELEASE_TGZ"
              exit 1
            fi
            log "remove stale partial release: $RELEASE_DIR"
            rm -rf -- "$RELEASE_DIR"
          fi

          FREE_BYTES=$(df -B1 --output=avail "$RELEASES_DIR" | tail -n 1 | tr -d '[:space:]')
          FREE_INODES=$(df --output=iavail "$RELEASES_DIR" | tail -n 1 | tr -d '[:space:]')
          MIN_FREE_BYTES=$((8 * 1024 * 1024 * 1024))
          MIN_FREE_INODES=250000
          log "capacity preflight: free_bytes=$FREE_BYTES minimum=$MIN_FREE_BYTES free_inodes=$FREE_INODES minimum=$MIN_FREE_INODES"
          df -h "$RELEASES_DIR"
          df -i "$RELEASES_DIR"
          if [ "$FREE_BYTES" -lt "$MIN_FREE_BYTES" ] || [ "$FREE_INODES" -lt "$MIN_FREE_INODES" ]; then
            log "ERROR: insufficient disk capacity for isolated dependency install"
            rm -f -- "$RELEASE_TGZ"
            exit 1
          fi

          # ── 3. 解包并封存 runner 上已完成 production deploy 的 Server bundle ──
          log "prepare release dir: $RELEASE_DIR"
          INSTALL_CLEANUP_ARMED=1
          mkdir -p "$RELEASE_DIR"
          log "extract release archive: $RELEASE_TGZ"
          tar -xzf "$RELEASE_TGZ" -C "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/.release"
          install -m 0444 "$RELEASE_TGZ" "$RELEASE_DIR/.release/server-bundle.tgz"
          install -m 0444 /dev/null "$RELEASE_DIR/.release/runtime-worker-authority-refresh-v1"
          install -m 0444 /dev/null "$RELEASE_DIR/.release/runtime-worker-execution-fencing-v1"
          install -m 0444 /dev/null "$RELEASE_DIR/.release/org-group-agent-background-v2"
          mkdir -p "$RELEASE_DIR/server/data" "$RELEASE_DIR/workspace-shared"
          node "$RELEASE_DIR/scripts/release/seal-compatibility-release.mjs" \
            --root "$RELEASE_DIR" --component server \
            --release-id "$COMPAT_RELEASE_ID" --sha "$RELEASE_SHA" >/dev/null

          # 在覆盖 unit 或发布身份前持久保存旧部署拓扑。rollback-state 指针仅在本次
          # 发布完全收敛后原子切换，因此失败发布不会污染上一份可用回滚状态。
          ROLLBACK_STATE_DIR="$DEPLOY_ROOT/rollback-states/$RELEASE_ID"
          ROLLBACK_STATE_LINK="$DEPLOY_ROOT/rollback-state"
          install -d -m 0700 "$DEPLOY_ROOT/rollback-states"
          EXISTING_ROLLBACK_STATE=$(readlink -f "$ROLLBACK_STATE_LINK" 2>/dev/null || true)
          if [ "$EXISTING_ROLLBACK_STATE" = "$ROLLBACK_STATE_DIR" ]; then
            log "ERROR: current rollback state unexpectedly targets candidate release: $ROLLBACK_STATE_DIR"
            exit 1
          fi
          rm -rf -- "$ROLLBACK_STATE_DIR"
          install -d -m 0700 "$ROLLBACK_STATE_DIR"
          snapshot_required_file() {
            local source="$1" name="$2" mode="$3"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              log "ERROR: required rollback source is missing or unsafe: $source"
              return 1
            fi
            install -m "$mode" "$source" "$ROLLBACK_STATE_DIR/$name"
          }
          snapshot_optional_file() {
            local source="$1" name="$2" mode="$3" marker="$4"
            if [ -L "$source" ]; then
              log "ERROR: optional rollback source must not be a symlink: $source"
              return 1
            fi
            if [ -f "$source" ]; then
              install -m "$mode" "$source" "$ROLLBACK_STATE_DIR/$name"
              printf 'true\n' > "$ROLLBACK_STATE_DIR/$marker"
            else
              printf 'false\n' > "$ROLLBACK_STATE_DIR/$marker"
            fi
            chmod 0600 "$ROLLBACK_STATE_DIR/$marker"
          }
          OLD_API_TARGET=$(readlink -f "$COLOR_DIR/$ACTIVE")
          case "$OLD_API_TARGET" in
            "$RELEASES_DIR"/*) [ -d "$OLD_API_TARGET" ] ;;
            *) log "ERROR: old API target escapes release root: $OLD_API_TARGET"; exit 1 ;;
          esac
          printf '%s\n' "$ACTIVE" > "$ROLLBACK_STATE_DIR/api-active-color"
          printf '%s\n' "$OLD_API_TARGET" > "$ROLLBACK_STATE_DIR/api-release-target"
          snapshot_required_file "/etc/systemd/system/${SERVICE_NAME}@.service" server@.service 0644
          snapshot_required_file "$RUNTIME_IDENTITY_FILE" runtime-identity.json 0444
          snapshot_optional_file "/etc/agent-saas/server-${ACTIVE}.release.env" \
            api.release.env 0600 api-env-present
          snapshot_optional_file "/etc/systemd/system/${WORKER_SERVICE}@.service" \
            runtime-worker@.service 0644 worker-unit-present
          snapshot_optional_file "/etc/systemd/system/nginx.service.d/agent-saas-nas.conf" \
            nginx-agent-saas-nas.conf 0644 nginx-drop-in-present
          snapshot_optional_file "$API_SITE_CONF" api-site.conf 0644 api-site-present
          OLD_WORKER_ACTIVE=$(tr -d '[:space:]' < "$WORKER_ACTIVE_COLOR_FILE" 2>/dev/null || true)
          case "$OLD_WORKER_ACTIVE" in
            blue|green)
              OLD_WORKER_TARGET=$(readlink -f "$WORKER_DIR/$OLD_WORKER_ACTIVE")
              case "$OLD_WORKER_TARGET" in
                "$RELEASES_DIR"/*) [ -d "$OLD_WORKER_TARGET" ] ;;
                *) log "ERROR: old Worker target escapes release root: $OLD_WORKER_TARGET"; exit 1 ;;
              esac
              printf 'true\n' > "$ROLLBACK_STATE_DIR/worker-was-active"
              printf '%s\n' "$OLD_WORKER_ACTIVE" > "$ROLLBACK_STATE_DIR/worker-active-color"
              printf '%s\n' "$OLD_WORKER_TARGET" > "$ROLLBACK_STATE_DIR/worker-release-target"
              snapshot_optional_file "/etc/agent-saas/runtime-worker-${OLD_WORKER_ACTIVE}.release.env" \
                worker.release.env 0600 worker-env-present
              ;;
            '') printf 'false\n' > "$ROLLBACK_STATE_DIR/worker-was-active" ;;
            *) log "ERROR: invalid old Runtime Worker color: $OLD_WORKER_ACTIVE"; exit 1 ;;
          esac
          chmod 0600 "$ROLLBACK_STATE_DIR"/*
          log "pre-deploy rollback state captured: $ROLLBACK_STATE_DIR"

          # 每次发布都以仓库模板刷新 unit；systemd 仅 reload 定义，不重启当前 active
          # 进程。蓝绿 Web 固定 ws-only，runtime worker 由独立蓝绿 unit 承担。
          # 在第一处覆盖前标记事务为 dirty，任一后续失败都必须先恢复旧 unit。
          SYSTEMD_UNITS_DIRTY=1
          install -m 0644 "$RELEASE_DIR/daemon-packaging/systemd/agent-saas-server@.service.template" \
            "/etc/systemd/system/${SERVICE_NAME}@.service"
          install -m 0644 "$RELEASE_DIR/daemon-packaging/systemd/agent-saas-runtime-worker@.service.template" \
            "/etc/systemd/system/${WORKER_SERVICE}@.service"
          install -d -m 0755 /etc/systemd/system/nginx.service.d
          install -m 0644 "$RELEASE_DIR/daemon-packaging/systemd/nginx-agent-saas-nas.conf" \
            /etc/systemd/system/nginx.service.d/agent-saas-nas.conf
          systemctl daemon-reload
          log "systemd units refreshed: web=ws-only worker=runtime-worker nginx=nas-ordered"

          # ── 4. idle 色残留处理：上次部署的旧色可能仍在 drain 未退 ──
          if systemctl is-active --quiet "${SERVICE_NAME}@${IDLE}"; then
            log "idle unit ${SERVICE_NAME}@${IDLE} still active (previous drain not finished); waiting up to 600s"
            IDLE_DRAIN_WAITED=0
            while systemctl is-active --quiet "${SERVICE_NAME}@${IDLE}"; do
              if [ "$IDLE_DRAIN_WAITED" -ge 600 ]; then
                IDLE_DRAIN_BODY=$(curl -sS -m 5 "$DRAINZ_URL" 2>/dev/null || true)
                IDLE_ACTIVE_UPLOADS=$(node -e '
                  try { console.log(Number(JSON.parse(process.argv[1]).activeUploads ?? 0)); }
                  catch { console.log(-1); }
                ' "$IDLE_DRAIN_BODY")
                if [ "$IDLE_ACTIVE_UPLOADS" -eq -1 ]; then
                  IDLE_DRAIN_MARKER="/run/${SERVICE_NAME}-${IDLE}.draining"
                  IDLE_DRAIN_SNAPSHOT=$(cat "$IDLE_DRAIN_MARKER" 2>/dev/null || true)
                  IDLE_ACTIVE_UPLOADS=$(node -e '
                    try { console.log(Number(JSON.parse(process.argv[1]).activeUploads ?? -1)); }
                    catch { console.log(-1); }
                  ' "$IDLE_DRAIN_SNAPSHOT")
                  log "idle drain endpoint unavailable; marker snapshot reports activeUploads=$IDLE_ACTIVE_UPLOADS"
                fi
                if [ "$IDLE_ACTIVE_UPLOADS" -ne 0 ]; then
                  log "ERROR: idle unit still has activeUploads=$IDLE_ACTIVE_UPLOADS after 600s; refusing to interrupt or overwrite it"
                  exit 1
                fi
                log "WARN: idle unit still active after 600s with no active uploads; forcing systemctl stop (durable runs recover via lease)"
                systemctl stop "${SERVICE_NAME}@${IDLE}"
                break
              fi
              if [ $((IDLE_DRAIN_WAITED % 30)) -eq 0 ]; then
                log "idle unit still draining waited=${IDLE_DRAIN_WAITED}s"
              fi
              sleep 5
              IDLE_DRAIN_WAITED=$((IDLE_DRAIN_WAITED + 5))
            done
            log "idle unit ${SERVICE_NAME}@${IDLE} is now inactive"
          fi

          # ── 5. 更新 symlink：只动 idle 色；current/previous 仅作 bookkeeping ──
          PREV_CURRENT=$(readlink "$APP_LINK" 2>/dev/null || true)
          PREV_PREVIOUS=$(readlink "$PREV_LINK" 2>/dev/null || true)
          PREV_IDLE_TARGET=$(readlink "$COLOR_DIR/$IDLE" 2>/dev/null || true)
          PREVIOUS_UPDATED=0
          WORKER_CANDIDATE_STARTED=0
          WORKER_CANDIDATE_PROCESS_STARTED=0
          WORKER_PROCESS_READY=0
          WORKER_ACTIVE_DRAIN_STARTED=0
          WORKER_ACTIVE_DRAIN_COMPLETED=0
          WORKER_LEGACY_PRE_DRAINED=0
          WORKER_BOOTSTRAP_ALL_DRAIN_COMPLETED=0
          WORKER_PREVIOUS_SERVICE_CONFIG_DIRTY=0
          WORKER_PREACTIVATED=0
          WORKER_IDLE=""
          PREV_WORKER_IDLE_TARGET=""
          log "switch color/$IDLE: $(readlink "$COLOR_DIR/$IDLE" 2>/dev/null || echo '<none>') -> $RELEASE_DIR"
          SYMLINKS_DIRTY=1
          ln -sfn "$RELEASE_DIR" "$COLOR_DIR/$IDLE"
          log "switch current: ${PREV_CURRENT:-<none>} -> $RELEASE_DIR"
          ln -sfn "$RELEASE_DIR" "$APP_LINK"
          if [ -n "$PREV_CURRENT" ] && [ "$PREV_CURRENT" != "$RELEASE_DIR" ]; then
            PREVIOUS_UPDATED=1
            ln -sfn "$PREV_CURRENT" "$PREV_LINK"
          fi

          preserve_candidate_authority_and_exit() {
            local candidate_pid candidate_ready_pid candidate_main_pid candidate_ack
            candidate_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_IDLE}.pid" 2>/dev/null || true)
            candidate_ready_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready" 2>/dev/null || true)
            candidate_main_pid=$(systemctl show "${WORKER_SERVICE}@${WORKER_IDLE}" -p MainPID --value 2>/dev/null || true)
            if ! systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_IDLE}" \
              || [ -z "$candidate_pid" ] || [ "$candidate_pid" != "$candidate_ready_pid" ] \
              || [ "$candidate_pid" != "$candidate_main_pid" ] || ! kill -0 "$candidate_pid" 2>/dev/null; then
              log "ERROR: candidate identity invalid while preserving authority"
              exit 1
            fi
            candidate_ack="/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.authority"
            rm -f "$candidate_ack"
            for _ in $(seq 1 30); do
              kill -HUP "$candidate_pid" 2>/dev/null || break
              sleep 1
              [ "$(cat "$candidate_ack" 2>/dev/null || true)" != "$candidate_pid" ] || {
                log "candidate authority preserved after marker rollback failure: color=$WORKER_IDLE"
                exit 1
              }
            done
            log "ERROR: candidate authority could not be preserved after marker rollback failure"
            exit 1
          }

          restore_bootstrap_all_authority() {
            local bootstrap_target bootstrap_all_pid bootstrap_all_ready_pid bootstrap_all_main_pid
            local bootstrap_all_ack bootstrap_all_ack_pid
            bootstrap_target=$(readlink "$COLOR_DIR/$ACTIVE" 2>/dev/null || true)
            if [ ! -f "$bootstrap_target/.release/org-group-agent-background-v2" ]; then
              log "bootstrap all is below org group Agent protocol floor; preserving v2 candidate"
              preserve_candidate_authority_and_exit
            fi
            if [ ! -f "$bootstrap_target/.release/runtime-worker-authority-refresh-v1" ]; then
              log "bootstrap all cannot reclaim runtime retention authority; preserving candidate"
              preserve_candidate_authority_and_exit
            fi
            bootstrap_all_pid=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.pid" 2>/dev/null || true)
            bootstrap_all_ready_pid=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.ready" 2>/dev/null || true)
            bootstrap_all_main_pid=$(systemctl show "${SERVICE_NAME}@${ACTIVE}" -p MainPID --value 2>/dev/null || true)
            if ! systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}" \
              || [ -z "$bootstrap_all_pid" ] || [ "$bootstrap_all_pid" != "$bootstrap_all_ready_pid" ] \
              || [ "$bootstrap_all_pid" != "$bootstrap_all_main_pid" ] || ! kill -0 "$bootstrap_all_pid" 2>/dev/null; then
              log "ERROR: bootstrap all identity invalid during authority rollback: color=$ACTIVE"
              preserve_candidate_authority_and_exit
            fi
            bootstrap_all_ack="/run/${SERVICE_NAME}-${ACTIVE}.ready.authority"
            rm -f "$bootstrap_all_ack"
            if ! kill -HUP "$bootstrap_all_pid" 2>/dev/null; then
              log "ERROR: bootstrap all authority reclaim signal failed: color=$ACTIVE"
              preserve_candidate_authority_and_exit
            fi
            WORKER_ACTIVE_RESTORED=0
            for _ in $(seq 1 30); do
              bootstrap_all_ack_pid=$(cat "$bootstrap_all_ack" 2>/dev/null || true)
              bootstrap_all_ready_pid=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.ready" 2>/dev/null || true)
              if [ "$bootstrap_all_ack_pid" = "$bootstrap_all_pid" ] \
                && [ "$bootstrap_all_ready_pid" = "$bootstrap_all_pid" ]; then
                WORKER_ACTIVE_RESTORED=1
                break
              fi
              sleep 1
            done
            if [ "$WORKER_ACTIVE_RESTORED" -ne 1 ]; then
              log "ERROR: bootstrap all authority reclaim timed out; preserving candidate"
              preserve_candidate_authority_and_exit
            fi
            log "bootstrap all runtime retention authority reclaimed before candidate stop: color=$ACTIVE"
          }

          restore_previous_runtime_service_configuration() {
            local previous_target previous_template previous_unit
            if [ -n "${WORKER_ACTIVE:-}" ]; then
              previous_target=$(readlink "$WORKER_DIR/$WORKER_ACTIVE" 2>/dev/null || true)
              previous_template="$previous_target/daemon-packaging/systemd/agent-saas-runtime-worker@.service.template"
              previous_unit="${WORKER_SERVICE}@${WORKER_ACTIVE}"
              if [ -z "$previous_target" ] || [ ! -f "$previous_template" ]; then
                log "ERROR: previous runtime worker template is unavailable during rollback"
                exit 1
              fi
              install -m 0644 "$previous_template" "/etc/systemd/system/${WORKER_SERVICE}@.service"
            else
              previous_target=$(readlink "$COLOR_DIR/$ACTIVE" 2>/dev/null || true)
              previous_template="$previous_target/daemon-packaging/systemd/agent-saas-server@.service.template"
              previous_unit="${SERVICE_NAME}@${ACTIVE}"
              if [ -z "$previous_target" ] || [ ! -f "$previous_template" ]; then
                log "ERROR: previous bootstrap all template is unavailable during rollback"
                exit 1
              fi
              install -m 0644 "$previous_template" "/etc/systemd/system/${SERVICE_NAME}@.service"
            fi
            systemctl daemon-reload
            if ! systemctl enable "$previous_unit"; then
              log "ERROR: failed to re-enable previous runtime unit during rollback: $previous_unit"
              exit 1
            fi
            WORKER_PREVIOUS_SERVICE_CONFIG_DIRTY=0
            log "previous runtime service template and enablement restored before rollback: unit=$previous_unit"
          }

          restore_pre_drained_legacy_runtime() {
            local restored_pid restored_ready_pid restored_main_pid legacy_worker_target legacy_bootstrap_target
            if [ -n "${WORKER_ACTIVE:-}" ]; then
              legacy_worker_target=$(readlink "$WORKER_DIR/$WORKER_ACTIVE" 2>/dev/null || true)
            else
              legacy_worker_target=$(readlink "$COLOR_DIR/$ACTIVE" 2>/dev/null || true)
            fi
            if [ "$WORKER_CANDIDATE_STARTED" -eq 1 ] \
              && [ ! -f "$legacy_worker_target/.release/org-group-agent-background-v2" ]; then
              log "rollback target is below org group Agent protocol floor; preserving v2 candidate"
              preserve_candidate_authority_and_exit
            fi
            if [ "$WORKER_CANDIDATE_STARTED" -eq 1 ] && [ -n "$WORKER_IDLE" ]; then
              log "stop runtime worker candidate before legacy rollback: ${WORKER_SERVICE}@${WORKER_IDLE}"
              if ! systemctl disable --now "${WORKER_SERVICE}@${WORKER_IDLE}"; then
                log "ERROR: failed to stop candidate before restoring legacy runtime source"
                exit 1
              fi
              rm -f "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.authority" \
                "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.org-group-agent-background-v2"
              WORKER_CANDIDATE_STARTED=0
              WORKER_CANDIDATE_PROCESS_STARTED=0
              WORKER_PROCESS_READY=0
            fi
            if [ "$WORKER_PREACTIVATED" -eq 1 ] && [ -n "${WORKER_ACTIVE:-}" ]; then
              if ! write_worker_active_color "$WORKER_ACTIVE"; then
                log "ERROR: failed to restore legacy runtime worker marker: color=$WORKER_ACTIVE"
                exit 1
              fi
              WORKER_PREACTIVATED=0
            elif [ "$WORKER_PREACTIVATED" -eq 1 ]; then
              rm -f "$WORKER_ACTIVE_COLOR_FILE"
              WORKER_PREACTIVATED=0
            fi
            if [ -n "${WORKER_ACTIVE:-}" ]; then
              legacy_worker_target=$(readlink "$WORKER_DIR/$WORKER_ACTIVE" 2>/dev/null || true)
              if [ -z "$legacy_worker_target" ] \
                || [ ! -f "$legacy_worker_target/daemon-packaging/systemd/agent-saas-runtime-worker@.service.template" ]; then
                log "ERROR: legacy runtime worker service template is unavailable during rollback"
                exit 1
              fi
              install -m 0644 "$legacy_worker_target/daemon-packaging/systemd/agent-saas-runtime-worker@.service.template" \
                "/etc/systemd/system/${WORKER_SERVICE}@.service"
              systemctl daemon-reload
              rm -f "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid" \
                "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" \
                "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready.org-group-agent-background-v2" \
                "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.draining"
              systemctl reset-failed "${WORKER_SERVICE}@${WORKER_ACTIVE}" 2>/dev/null || true
              systemctl enable "${WORKER_SERVICE}@${WORKER_ACTIVE}"
              systemctl restart "${WORKER_SERVICE}@${WORKER_ACTIVE}"
              WORKER_ACTIVE_RESTORED=0
              for _ in $(seq 1 180); do
                restored_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid" 2>/dev/null || true)
                restored_ready_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" 2>/dev/null || true)
                restored_main_pid=$(systemctl show "${WORKER_SERVICE}@${WORKER_ACTIVE}" -p MainPID --value 2>/dev/null || true)
                if systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}" \
                  && [ -n "$restored_pid" ] && [ "$restored_pid" = "$restored_ready_pid" ] \
                  && [ "$restored_pid" = "$restored_main_pid" ] && kill -0 "$restored_pid" 2>/dev/null; then
                  WORKER_ACTIVE_RESTORED=1
                  break
                fi
                sleep 1
              done
              if [ "$WORKER_ACTIVE_RESTORED" -ne 1 ]; then
                log "ERROR: legacy runtime worker failed readiness during rollback"
                exit 1
              fi
              log "legacy runtime worker and its service template restored only after candidate stop: color=$WORKER_ACTIVE"
            elif [ "$WORKER_BOOTSTRAP_ALL_DRAIN_COMPLETED" -eq 1 ]; then
              legacy_bootstrap_target=$(readlink "$COLOR_DIR/$ACTIVE" 2>/dev/null || true)
              if [ -z "$legacy_bootstrap_target" ] \
                || [ ! -f "$legacy_bootstrap_target/daemon-packaging/systemd/agent-saas-server@.service.template" ]; then
                log "ERROR: legacy bootstrap all service template is unavailable during rollback"
                exit 1
              fi
              install -m 0644 "$legacy_bootstrap_target/daemon-packaging/systemd/agent-saas-server@.service.template" \
                "/etc/systemd/system/${SERVICE_NAME}@.service"
              systemctl daemon-reload
              rm -f "/run/${SERVICE_NAME}-${ACTIVE}.pid" "/run/${SERVICE_NAME}-${ACTIVE}.ready" \
                "/run/${SERVICE_NAME}-${ACTIVE}.draining"
              systemctl reset-failed "${SERVICE_NAME}@${ACTIVE}" 2>/dev/null || true
              systemctl enable "${SERVICE_NAME}@${ACTIVE}"
              systemctl restart "${SERVICE_NAME}@${ACTIVE}"
              WORKER_ACTIVE_RESTORED=0
              for _ in $(seq 1 180); do
                restored_pid=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.pid" 2>/dev/null || true)
                restored_ready_pid=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.ready" 2>/dev/null || true)
                restored_main_pid=$(systemctl show "${SERVICE_NAME}@${ACTIVE}" -p MainPID --value 2>/dev/null || true)
                if systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}" \
                  && [ -n "$restored_pid" ] && [ "$restored_pid" = "$restored_ready_pid" ] \
                  && [ "$restored_pid" = "$restored_main_pid" ] && kill -0 "$restored_pid" 2>/dev/null; then
                  WORKER_ACTIVE_RESTORED=1
                  break
                fi
                sleep 1
              done
              if [ "$WORKER_ACTIVE_RESTORED" -ne 1 ]; then
                log "ERROR: legacy bootstrap all failed readiness during rollback"
                exit 1
              fi
              log "legacy bootstrap all and its service template restored only after candidate stop: color=$ACTIVE"
            else
              log "ERROR: legacy pre-drain rollback has no runtime source to restore"
              exit 1
            fi
            WORKER_ACTIVE_DRAIN_STARTED=0
            WORKER_ACTIVE_DRAIN_COMPLETED=0
            WORKER_BOOTSTRAP_ALL_DRAIN_COMPLETED=0
            WORKER_PREVIOUS_SERVICE_CONFIG_DIRTY=0
            WORKER_LEGACY_PRE_DRAINED=0
          }

          # 切流前失败：legacy 先停候选再恢复旧来源；新版旧 worker 仍按 authority reclaim。
          # 首次 bootstrap 在候选停止前由仍在服务的 all 进程 reclaim；不支持 reclaim 时保留候选。
          rollback_idle_and_exit() {
            local deploy_status="${1:-1}"
            FAILURE_RECOVERY_ACTIVE=1
            ROLLBACK_STATE_PRESERVE=1
            if ! restore_predeploy_systemd_units; then
              log "ERROR: failed to restore previous systemd units before process topology"
              exit 70
            fi
            log "deploy FAILED before traffic switch; restoring the previous runtime source and Web color"
            if [ "$WORKER_PREVIOUS_SERVICE_CONFIG_DIRTY" -eq 1 ] \
              && [ "$WORKER_LEGACY_PRE_DRAINED" -ne 1 ]; then
              restore_previous_runtime_service_configuration
            fi
            if [ "$WORKER_LEGACY_PRE_DRAINED" -eq 1 ]; then
              restore_pre_drained_legacy_runtime
            fi
            if [ "$WORKER_ACTIVE_DRAIN_STARTED" -eq 1 ] && [ "$WORKER_ACTIVE_DRAIN_COMPLETED" -ne 1 ]; then
              log "ERROR: previous runtime worker has not completed drain; preserving candidate and refusing restart"
              preserve_candidate_authority_and_exit
            fi
            if [ "$WORKER_ACTIVE_DRAIN_COMPLETED" -eq 1 ] && [ -n "${WORKER_ACTIVE:-}" ]; then
              WORKER_ACTIVE_TARGET=$(readlink "$WORKER_DIR/$WORKER_ACTIVE" 2>/dev/null || true)
              if [ ! -f "$WORKER_ACTIVE_TARGET/.release/org-group-agent-background-v2" ]; then
                log "drained rollback target is below org group Agent protocol floor; preserving v2 candidate"
                preserve_candidate_authority_and_exit
              fi
              log "restart drained runtime worker after pre-Web failure: ${WORKER_SERVICE}@${WORKER_ACTIVE}"
              rm -f "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid" \
                "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" \
                "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready.org-group-agent-background-v2" \
                "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.draining"
              systemctl reset-failed "${WORKER_SERVICE}@${WORKER_ACTIVE}" 2>/dev/null || true
              systemctl enable "${WORKER_SERVICE}@${WORKER_ACTIVE}"
              systemctl restart "${WORKER_SERVICE}@${WORKER_ACTIVE}"
              WORKER_ACTIVE_RESTORED=0
              for _ in $(seq 1 180); do
                restored_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid" 2>/dev/null || true)
                restored_ready_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" 2>/dev/null || true)
                if systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}" \
                  && [ -n "$restored_pid" ] && [ "$restored_pid" = "$restored_ready_pid" ] \
                  && kill -0 "$restored_pid" 2>/dev/null; then
                  WORKER_ACTIVE_RESTORED=1
                  break
                fi
                sleep 1
              done
              if [ "$WORKER_ACTIVE_RESTORED" -ne 1 ]; then
                log "ERROR: previous runtime worker failed readiness during rollback; preserving candidate release for recovery"
                exit 1
              fi
            elif [ "$WORKER_CANDIDATE_PROCESS_STARTED" -eq 1 ] && [ -n "${WORKER_ACTIVE:-}" ]; then
              WORKER_ACTIVE_TARGET=$(readlink "$WORKER_DIR/$WORKER_ACTIVE" 2>/dev/null || true)
              if [ -f "$WORKER_ACTIVE_TARGET/.release/runtime-worker-authority-refresh-v1" ]; then
                old_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid" 2>/dev/null || true)
                old_main_pid=$(systemctl show "${WORKER_SERVICE}@${WORKER_ACTIVE}" -p MainPID --value 2>/dev/null || true)
                if ! systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}" \
                  || [ -z "$old_pid" ] || [ "$old_pid" != "$old_main_pid" ] || ! kill -0 "$old_pid" 2>/dev/null; then
                  log "ERROR: previous runtime worker identity invalid during authority rollback: color=$WORKER_ACTIVE"
                  exit 1
                fi
                old_ack="/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready.authority"
                rm -f "$old_ack"
                if ! kill -HUP "$old_pid" 2>/dev/null; then
                  log "ERROR: previous runtime worker authority reclaim signal failed: color=$WORKER_ACTIVE"
                  exit 1
                fi
                WORKER_ACTIVE_RESTORED=0
                for _ in $(seq 1 30); do
                  old_ack_pid=$(cat "$old_ack" 2>/dev/null || true)
                  old_ready_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" 2>/dev/null || true)
                  if [ "$old_ack_pid" = "$old_pid" ] && [ "$old_ready_pid" = "$old_pid" ]; then
                    WORKER_ACTIVE_RESTORED=1
                    break
                  fi
                  sleep 1
                done
                if [ "$WORKER_ACTIVE_RESTORED" -ne 1 ]; then
                  log "ERROR: previous runtime worker authority reclaim timed out; preserving candidate for recovery"
                  exit 1
                fi
                log "previous runtime worker reclaimed authority without restart: color=$WORKER_ACTIVE"
              else
                log "legacy runtime worker kept running without restart; awaiting its native status write: color=$WORKER_ACTIVE"
              fi
            fi
            if [ "$WORKER_CANDIDATE_PROCESS_STARTED" -eq 1 ] && [ "$WORKER_PROCESS_READY" -eq 1 ] \
              && [ -z "${WORKER_ACTIVE:-}" ]; then
              restore_bootstrap_all_authority
            fi
            if [ "$WORKER_PREACTIVATED" -eq 1 ] && [ -n "${WORKER_ACTIVE:-}" ]; then
              if ! write_worker_active_color "$WORKER_ACTIVE"; then
                log "ERROR: failed to restore previous runtime worker marker: color=$WORKER_ACTIVE"
                preserve_candidate_authority_and_exit
              fi
              log "previous runtime worker marker restored before candidate stop: color=$WORKER_ACTIVE"
            elif [ "$WORKER_PREACTIVATED" -eq 1 ]; then
              rm -f "$WORKER_ACTIVE_COLOR_FILE"
              log "remove bootstrap runtime worker authority before candidate stop"
            fi
            if [ "$WORKER_CANDIDATE_STARTED" -eq 1 ] && [ -n "$WORKER_IDLE" ]; then
              log "runtime worker candidate diagnostics: ${WORKER_SERVICE}@${WORKER_IDLE}"
              systemctl status "${WORKER_SERVICE}@${WORKER_IDLE}" --no-pager -l || true
              journalctl -u "${WORKER_SERVICE}@${WORKER_IDLE}" -n 120 --no-pager || true
              log "stop runtime worker candidate: ${WORKER_SERVICE}@${WORKER_IDLE}"
              if ! systemctl disable --now "${WORKER_SERVICE}@${WORKER_IDLE}"; then
                log "ERROR: failed to stop runtime worker candidate during rollback"
                exit 70
              fi
              rm -f "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.authority" \
                "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.org-group-agent-background-v2"
            fi
            log "Web idle diagnostics: ${SERVICE_NAME}@${IDLE}"
            journalctl -u "${SERVICE_NAME}@${IDLE}" -n 120 --no-pager || true
            log "stop idle unit ${SERVICE_NAME}@${IDLE}"
            if ! systemctl stop "${SERVICE_NAME}@${IDLE}"; then
              log "ERROR: failed to stop idle Server unit during rollback"
              exit 70
            fi
            if [ "$WEB_IDLE_ENABLEMENT_DIRTY" -eq 1 ]; then
              if [ "$WEB_IDLE_WAS_ENABLED" -eq 1 ]; then
                systemctl enable "${SERVICE_NAME}@${IDLE}"
              elif ! systemctl disable "${SERVICE_NAME}@${IDLE}"; then
                log "ERROR: failed to restore idle Server disablement during rollback"
                exit 70
              fi
              WEB_IDLE_ENABLEMENT_DIRTY=0
            fi
            if ! restore_predeploy_symlinks; then
              log "ERROR: failed to restore pre-deploy symlinks"
              exit 70
            fi
            # legacy 恢复可能需要旧 release template 才能重启进程；进程复活后再次
            # 恢复持久快照，确保磁盘上的最终 unit 与部署前精确一致。
            if ! restore_predeploy_systemd_units; then
              log "ERROR: failed to restore exact pre-deploy systemd unit snapshot"
              exit 70
            fi
            SYSTEMD_UNITS_DIRTY=0
            case "$RELEASE_DIR" in
              "$RELEASES_DIR"/*)
                log "remove failed release: $RELEASE_DIR"
                rm -rf -- "$RELEASE_DIR" || log "WARN: failed release cleanup failed"
                ;;
            esac
            rm -f -- "$RELEASE_TGZ" || log "WARN: failed upload cleanup failed"
            FAILURE_RECOVERY_COMPLETED=1
            ROLLBACK_STATE_PRESERVE=0
            exit "$deploy_status"
          }

          ensure_pre_switch_budget() {
            local phase="$1"
            if [ "$(date +%s)" -ge "$DEPLOY_FAILSAFE_DEADLINE_EPOCH" ]; then
              log "ERROR: deployment failsafe deadline reached before traffic switch: phase=$phase reserve=${DEPLOY_ROLLBACK_RESERVE_SECONDS}s"
              rollback_idle_and_exit
            fi
          }

          recover_interrupted_runtime_worker_drain() {
            local color="$1"
            local guard="/run/agent-saas-runtime-worker-${color}.draining"
            local interrupted_candidate=""
            local INTERRUPTED_CANDIDATE_WAITED=0
            local ACTIVE_WORKER_RECOVERED=0
            local active_pid="" active_ready_pid="" recovered_pid="" recovered_ready_pid="" interrupted_pid=""
            active_pid=$(cat "/run/agent-saas-runtime-worker-${color}.pid" 2>/dev/null || true)
            active_ready_pid=$(cat "/run/agent-saas-runtime-worker-${color}.ready" 2>/dev/null || true)
            if systemctl is-active --quiet "${WORKER_SERVICE}@${color}" \
              && [ ! -f "$guard" ] && [ -n "$active_pid" ] \
              && [ "$active_pid" = "$active_ready_pid" ] && kill -0 "$active_pid" 2>/dev/null; then
              if ! systemctl enable "${WORKER_SERVICE}@${color}"; then
                log "ERROR: failed to preserve runtime worker boot ownership: color=$color"
                return 1
              fi
              log "runtime worker marker target is ready and enabled: color=$color"
            else
              if [ ! -f "$guard" ]; then
                log "ERROR: active runtime worker ${WORKER_SERVICE}@${color} is not ready without an interrupted-drain guard"
                return 1
              fi
              log "recover interrupted runtime worker drain before rollout: ${WORKER_SERVICE}@${color}"
              if ! rm -f "/run/agent-saas-runtime-worker-${color}.pid" \
                "/run/agent-saas-runtime-worker-${color}.ready" \
                "/run/agent-saas-runtime-worker-${color}.ready.org-group-agent-background-v2" \
                "$guard"; then
                log "ERROR: failed to clear interrupted runtime worker guard: color=$color"
                return 1
              fi
              systemctl reset-failed "${WORKER_SERVICE}@${color}" 2>/dev/null || true
              if ! systemctl enable "${WORKER_SERVICE}@${color}"; then
                log "ERROR: failed to enable interrupted runtime worker: color=$color"
                return 1
              fi
              if ! systemctl restart "${WORKER_SERVICE}@${color}"; then
                log "ERROR: failed to restart interrupted runtime worker: color=$color"
                return 1
              fi
              ACTIVE_WORKER_RECOVERED=0
              for _ in $(seq 1 180); do
                recovered_pid=$(cat "/run/agent-saas-runtime-worker-${color}.pid" 2>/dev/null || true)
                recovered_ready_pid=$(cat "/run/agent-saas-runtime-worker-${color}.ready" 2>/dev/null || true)
                if systemctl is-active --quiet "${WORKER_SERVICE}@${color}" \
                  && [ -n "$recovered_pid" ] && [ "$recovered_pid" = "$recovered_ready_pid" ] \
                  && kill -0 "$recovered_pid" 2>/dev/null; then
                  ACTIVE_WORKER_RECOVERED=1
                  break
                fi
                sleep 1
              done
              if [ "$ACTIVE_WORKER_RECOVERED" -ne 1 ]; then
                log "ERROR: interrupted runtime worker drain recovery failed readiness"
                return 1
              fi
              log "interrupted runtime worker drain recovered: color=$color"
            fi

            case "$color" in blue) interrupted_candidate="green" ;; green) interrupted_candidate="blue" ;; esac
            if ! systemctl disable "${WORKER_SERVICE}@${interrupted_candidate}"; then
              log "ERROR: failed to disable non-marker runtime worker candidate: color=$interrupted_candidate"
              return 1
            fi
            if systemctl is-active --quiet "${WORKER_SERVICE}@${interrupted_candidate}"; then
              interrupted_pid=$(cat "/run/agent-saas-runtime-worker-${interrupted_candidate}.pid" 2>/dev/null || true)
              interrupted_ready_pid=$(cat "/run/agent-saas-runtime-worker-${interrupted_candidate}.ready" 2>/dev/null || true)
              interrupted_main_pid=$(systemctl show "${WORKER_SERVICE}@${interrupted_candidate}" -p MainPID --value 2>/dev/null || true)
              if [ -z "$interrupted_pid" ] || [ "$interrupted_pid" != "$interrupted_ready_pid" ] \
                || [ "$interrupted_pid" != "$interrupted_main_pid" ] || ! kill -0 "$interrupted_pid" 2>/dev/null; then
                log "ERROR: interrupted runtime worker candidate identity is inconsistent: color=$interrupted_candidate"
                return 1
              fi
              if ! install -m 0644 /dev/null "/run/agent-saas-runtime-worker-${interrupted_candidate}.draining"; then
                log "ERROR: failed to arm interrupted runtime worker candidate drain guard: color=$interrupted_candidate"
                return 1
              fi
              if ! kill -USR2 "$interrupted_pid" 2>/dev/null; then
                log "ERROR: interrupted runtime worker candidate drain signal failed: color=$interrupted_candidate"
                return 1
              fi
              while systemctl is-active --quiet "${WORKER_SERVICE}@${interrupted_candidate}"; do
                if [ "$INTERRUPTED_CANDIDATE_WAITED" -ge 960 ]; then
                  log "ERROR: interrupted runtime worker candidate did not drain within 960s: color=$interrupted_candidate"
                  return 1
                fi
                sleep 5
                INTERRUPTED_CANDIDATE_WAITED=$((INTERRUPTED_CANDIDATE_WAITED + 5))
              done
              log "interrupted runtime worker candidate drained after active recovery: color=$interrupted_candidate"
            fi
            return 0
          }

          # ── 5.5 Runtime Worker 候选：在 Web readiness 前完成接管 ──
          # 支持 execution fencing 的旧 runtime 走候选优先；legacy runtime 必须先完全退出再启动候选。
          # 旧 runtime 完全退出后才启动 Web；失败回退按 capability 恢复旧来源或 authority。
          WORKER_ACTIVE=""
          if [ "$WORKER_DEPLOY_REQUIRED" = "true" ]; then
            # ClientDaemonGateway 目前仍是进程内连接表，不能跨 ws-only/runtime-worker
            # 转发。生产若显式启用，必须在 Web 切流前停止，保留旧 all 进程继续服务。
            CLIENT_DAEMON_PREFLIGHT=0
            (
              cd "$RELEASE_DIR/server"
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                import { parse } from "jsonc-parser";
                const errors = [];
                const path = process.env.AGENT_SAAS_CONFIG_PATH || "/etc/agent-saas/config.json";
                const config = parse(readFileSync(path, "utf8"), errors, { allowTrailingComma: true });
                if (errors.length > 0) process.exit(3);
                if (config?.clientDaemon) process.exit(42);
                if (config?.runtimeEventStore?.backend === "pg") {
                  const prefix = config.runtimeEventStore.tablePrefix || "runtime";
                  if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(prefix)) process.exit(3);
                  const table = `${prefix}_client_daemon_devices`;
                  const pg = await import("pg");
                  const client = new pg.Client({ connectionString: config.runtimeEventStore.connectionString });
                  await client.connect();
                  try {
                    const exists = await client.query("SELECT to_regclass($1)::text AS name", [table]);
                    if (exists.rows[0]?.name) {
                      const active = await client.query(`SELECT 1 FROM "${table}" WHERE status = $1 LIMIT 1`, ["active"]);
                      if (active.rowCount > 0) process.exitCode = 43;
                    }
                  } finally {
                    await client.end();
                  }
                }
              '
            ) || CLIENT_DAEMON_PREFLIGHT=$?
            if [ "$CLIENT_DAEMON_PREFLIGHT" -eq 42 ]; then
              log "ERROR: runtime worker split blocked because production clientDaemon is configured"
              rollback_idle_and_exit
            elif [ "$CLIENT_DAEMON_PREFLIGHT" -eq 43 ]; then
              log "ERROR: runtime worker split blocked because active clientDaemon devices exist"
              rollback_idle_and_exit
            elif [ "$CLIENT_DAEMON_PREFLIGHT" -ne 0 ]; then
              log "ERROR: runtime worker config preflight failed with status=$CLIENT_DAEMON_PREFLIGHT"
              rollback_idle_and_exit
            fi

            if [ -f "$WORKER_ACTIVE_COLOR_FILE" ]; then
              WORKER_ACTIVE=$(tr -d '[:space:]' < "$WORKER_ACTIVE_COLOR_FILE")
              case "$WORKER_ACTIVE" in
                blue) WORKER_IDLE="green" ;;
                green) WORKER_IDLE="blue" ;;
                *)
                  log "ERROR: invalid runtime worker active color '$WORKER_ACTIVE'"
                  rollback_idle_and_exit
                  ;;
              esac
              if ! recover_interrupted_runtime_worker_drain "$WORKER_ACTIVE"; then
                rollback_idle_and_exit
              fi
            else
              for candidate_color in blue green; do
                if systemctl is-active --quiet "${WORKER_SERVICE}@${candidate_color}"; then
                  log "ERROR: runtime worker marker missing but ${WORKER_SERVICE}@${candidate_color} is active; refusing ambiguous bootstrap"
                  rollback_idle_and_exit
                fi
              done
              WORKER_IDLE="blue"
            fi

            if systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_IDLE}"; then
              log "runtime worker idle unit ${WORKER_SERVICE}@${WORKER_IDLE} still draining; waiting up to 600s"
              WORKER_IDLE_WAITED=0
              while systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_IDLE}"; do
                if [ "$WORKER_IDLE_WAITED" -ge 600 ]; then
                  log "ERROR: runtime worker idle unit still active after 600s; refusing force-stop of durable runs"
                  rollback_idle_and_exit
                fi
                sleep 5
                WORKER_IDLE_WAITED=$((WORKER_IDLE_WAITED + 5))
              done
            fi

            PREV_WORKER_IDLE_TARGET=$(readlink "$WORKER_DIR/$WORKER_IDLE" 2>/dev/null || true)
            log "switch worker/$WORKER_IDLE: ${PREV_WORKER_IDLE_TARGET:-<none>} -> $RELEASE_DIR"
            WORKER_SYMLINK_DIRTY=1
            ln -sfn "$RELEASE_DIR" "$WORKER_DIR/$WORKER_IDLE"
            WORKER_CANDIDATE_STARTED=1
            log "runtime worker candidate prepared: color=$WORKER_IDLE (process readiness precedes Web readiness)"
          else
            if [ ! -f "$WORKER_ACTIVE_COLOR_FILE" ]; then
              log "ERROR: classifier skipped runtime worker but active marker is missing"
              rollback_idle_and_exit
            fi
            WORKER_ACTIVE=$(tr -d '[:space:]' < "$WORKER_ACTIVE_COLOR_FILE")
            case "$WORKER_ACTIVE" in blue|green) ;; *) log "ERROR: invalid runtime worker active color '$WORKER_ACTIVE'"; rollback_idle_and_exit ;; esac
            if ! recover_interrupted_runtime_worker_drain "$WORKER_ACTIVE"; then
              log "ERROR: classifier skipped runtime worker but active unit is unavailable"
              rollback_idle_and_exit
            fi
            log "runtime worker unchanged: active=$WORKER_ACTIVE (pure Web/non-runtime release)"
          fi

          if [ "$WORKER_DEPLOY_REQUIRED" = "true" ]; then
            if [ -n "${WORKER_ACTIVE:-}" ]; then
              LEGACY_RUNTIME_TARGET=$(readlink "$WORKER_DIR/$WORKER_ACTIVE" 2>/dev/null || true)
            else
              LEGACY_RUNTIME_TARGET=$(readlink "$COLOR_DIR/$ACTIVE" 2>/dev/null || true)
            fi
            if [ ! -f "$LEGACY_RUNTIME_TARGET/.release/runtime-worker-execution-fencing-v1" ]; then
              WORKER_PREVIOUS_SERVICE_CONFIG_DIRTY=1
              if [ "$(date +%s)" -ge "$LEGACY_DRAIN_DEADLINE_EPOCH" ]; then
                log "ERROR: insufficient remote deployment budget for legacy drain; rolling back before signal"
                rollback_idle_and_exit
              fi
              log "legacy runtime lacks execution fencing; complete drain is required before candidate start: target=${LEGACY_RUNTIME_TARGET:-<unknown>}"
              if [ -n "${WORKER_ACTIVE:-}" ]; then
                OLD_WORKER_PID=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid" 2>/dev/null || true)
                OLD_WORKER_READY_PID=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" 2>/dev/null || true)
                OLD_WORKER_MAIN_PID=$(systemctl show "${WORKER_SERVICE}@${WORKER_ACTIVE}" -p MainPID --value 2>/dev/null || true)
                if ! systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}" \
                  || [ -z "$OLD_WORKER_PID" ] || [ "$OLD_WORKER_PID" != "$OLD_WORKER_READY_PID" ] \
                  || [ "$OLD_WORKER_PID" != "$OLD_WORKER_MAIN_PID" ] || ! kill -0 "$OLD_WORKER_PID" 2>/dev/null; then
                  log "ERROR: legacy runtime worker identity is inconsistent before pre-candidate drain"
                  rollback_idle_and_exit
                fi
                if ! systemctl disable "${WORKER_SERVICE}@${WORKER_ACTIVE}"; then
                  log "ERROR: failed to disable legacy runtime worker before pre-candidate drain"
                  rollback_idle_and_exit
                fi
                if ! install -m 0644 /dev/null "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.draining"; then
                  log "ERROR: failed to arm legacy runtime worker pre-candidate drain"
                  rollback_idle_and_exit
                fi
                WORKER_ACTIVE_DRAIN_STARTED=1
                if ! kill -USR2 "$OLD_WORKER_PID" 2>/dev/null; then
                  WORKER_ACTIVE_DRAIN_STARTED=0
                  rm -f "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.draining"
                  log "ERROR: failed to signal legacy runtime worker before candidate start"
                  rollback_idle_and_exit
                fi
                WORKER_OLD_WAITED=0
                while systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}"; do
                  if [ "$WORKER_OLD_WAITED" -ge 960 ] \
                    || [ "$(date +%s)" -ge "$LEGACY_DRAIN_DEADLINE_EPOCH" ]; then
                    log "ERROR: legacy runtime worker graceful drain timed out; forcing rollback before remote timeout"
                    if ! systemctl stop "${WORKER_SERVICE}@${WORKER_ACTIVE}" \
                      || systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}"; then
                      log "ERROR: legacy runtime worker could not be stopped for safe single-writer rollback"
                      exit 1
                    fi
                    WORKER_ACTIVE_DRAIN_COMPLETED=1
                    WORKER_LEGACY_PRE_DRAINED=1
                    rollback_idle_and_exit
                  fi
                  sleep 5
                  WORKER_OLD_WAITED=$((WORKER_OLD_WAITED + 5))
                done
                WORKER_ACTIVE_DRAIN_COMPLETED=1
                WORKER_LEGACY_PRE_DRAINED=1
                log "legacy runtime worker exited before candidate start: color=$WORKER_ACTIVE"
              else
                LEGACY_ALL_PID=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.pid" 2>/dev/null || true)
                LEGACY_ALL_READY_PID=$(cat "/run/${SERVICE_NAME}-${ACTIVE}.ready" 2>/dev/null || true)
                LEGACY_ALL_MAIN_PID=$(systemctl show "${SERVICE_NAME}@${ACTIVE}" -p MainPID --value 2>/dev/null || true)
                if ! systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}" \
                  || [ -z "$LEGACY_ALL_PID" ] || [ "$LEGACY_ALL_PID" != "$LEGACY_ALL_READY_PID" ] \
                  || [ "$LEGACY_ALL_PID" != "$LEGACY_ALL_MAIN_PID" ] || ! kill -0 "$LEGACY_ALL_PID" 2>/dev/null; then
                  log "ERROR: legacy bootstrap all identity is inconsistent before pre-candidate drain"
                  rollback_idle_and_exit
                fi
                if ! install -m 0644 /dev/null "/run/${SERVICE_NAME}-${ACTIVE}.draining"; then
                  log "ERROR: failed to arm legacy bootstrap all pre-candidate drain"
                  rollback_idle_and_exit
                fi
                if ! kill -USR2 "$LEGACY_ALL_PID" 2>/dev/null; then
                  rm -f "/run/${SERVICE_NAME}-${ACTIVE}.draining"
                  log "ERROR: failed to signal legacy bootstrap all before candidate start"
                  rollback_idle_and_exit
                fi
                LEGACY_ALL_WAITED=0
                while systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}"; do
                  if [ "$LEGACY_ALL_WAITED" -ge 960 ] \
                    || [ "$(date +%s)" -ge "$LEGACY_DRAIN_DEADLINE_EPOCH" ]; then
                    log "ERROR: legacy bootstrap all graceful drain timed out; forcing rollback before remote timeout"
                    if ! systemctl stop "${SERVICE_NAME}@${ACTIVE}" \
                      || systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}"; then
                      log "ERROR: legacy bootstrap all could not be stopped for safe single-writer rollback"
                      exit 1
                    fi
                    WORKER_BOOTSTRAP_ALL_DRAIN_COMPLETED=1
                    WORKER_LEGACY_PRE_DRAINED=1
                    rollback_idle_and_exit
                  fi
                  sleep 5
                  LEGACY_ALL_WAITED=$((LEGACY_ALL_WAITED + 5))
                done
                WORKER_BOOTSTRAP_ALL_DRAIN_COMPLETED=1
                WORKER_LEGACY_PRE_DRAINED=1
                log "legacy bootstrap all exited before candidate start: color=$ACTIVE"
              fi
            else
              log "active runtime supports execution fencing; candidate-first handoff is allowed"
            fi
          fi

          if ! node "$RELEASE_DIR/scripts/release/write-compatibility-app-env.mjs" \
            --identity /etc/agent-saas/runtime-identity.json \
            --api-output "/etc/agent-saas/server-${IDLE}.release.env" \
            --worker-output "/etc/agent-saas/runtime-worker-${WORKER_IDLE}.release.env" \
            --release-id "$COMPAT_RELEASE_ID" --sha "$RELEASE_SHA" \
            --server-digest "$SERVER_ARTIFACT_DIGEST" >/dev/null; then
            log "ERROR: failed to write compatibility env after runtime preflight"
            rollback_idle_and_exit
          fi


          if [ "$WORKER_DEPLOY_REQUIRED" = "true" ]; then
            if ! rm -f "/run/agent-saas-runtime-worker-${WORKER_IDLE}.pid" \
              "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready" \
              "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.org-group-agent-background-v2" \
              "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready.authority" \
              "/run/agent-saas-runtime-worker-${WORKER_IDLE}.draining"; then
              log "ERROR: failed to clear candidate runtime markers"
              rollback_idle_and_exit
            fi
            if ! systemctl enable --now "${WORKER_SERVICE}@${WORKER_IDLE}"; then
              WORKER_CANDIDATE_PROCESS_STARTED=1
              log "ERROR: runtime worker candidate failed to start: ${WORKER_SERVICE}@${WORKER_IDLE}"
              rollback_idle_and_exit
            fi
            WORKER_CANDIDATE_PROCESS_STARTED=1

            WORKER_PROCESS_READY=0
            for _ in $(seq 1 180); do
              worker_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_IDLE}.pid" 2>/dev/null || true)
              worker_ready_pid=$(cat "/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready" 2>/dev/null || true)
              if systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_IDLE}" \
                && [ -n "$worker_pid" ] && [ "$worker_pid" = "$worker_ready_pid" ] \
                && kill -0 "$worker_pid" 2>/dev/null; then
                WORKER_PROCESS_READY=1
                break
              fi
              sleep 1
            done
            if [ "$WORKER_PROCESS_READY" -ne 1 ]; then
              log "ERROR: runtime worker candidate process failed readiness before Web start"
              rollback_idle_and_exit
            fi
            WORKER_CANDIDATE_INITIAL_PID="$worker_pid"

            if [ -n "${WORKER_ACTIVE:-}" ] && [ "$WORKER_LEGACY_PRE_DRAINED" -ne 1 ]; then
              OLD_WORKER_PIDFILE="/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.pid"
              if [ ! -f "$OLD_WORKER_PIDFILE" ]; then
                log "ERROR: active runtime worker pidfile is missing: $OLD_WORKER_PIDFILE"
                rollback_idle_and_exit
              fi
              OLD_WORKER_PID=$(cat "$OLD_WORKER_PIDFILE")
              OLD_WORKER_READY_PID=$(cat "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.ready" 2>/dev/null || true)
              OLD_WORKER_MAIN_PID=$(systemctl show "${WORKER_SERVICE}@${WORKER_ACTIVE}" -p MainPID --value 2>/dev/null || true)
              if ! systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}" \
                || [ "$OLD_WORKER_PID" != "$OLD_WORKER_READY_PID" ] \
                || [ "$OLD_WORKER_PID" != "$OLD_WORKER_MAIN_PID" ] || ! kill -0 "$OLD_WORKER_PID" 2>/dev/null; then
                log "ERROR: active runtime worker identity is inconsistent before drain: color=$WORKER_ACTIVE"
                rollback_idle_and_exit
              fi
            fi
            ensure_pre_switch_budget "runtime-worker-preactivation"
            if ! write_worker_active_color "$WORKER_IDLE"; then
              log "ERROR: failed to promote runtime worker authority: color=$WORKER_IDLE"
              rollback_idle_and_exit
            fi
            WORKER_PREACTIVATED=1
            log "runtime worker authority promoted before old drain: color=$WORKER_IDLE release=$RELEASE_ID"

            if [ -n "${WORKER_ACTIVE:-}" ] && [ "$WORKER_LEGACY_PRE_DRAINED" -ne 1 ]; then
              ensure_pre_switch_budget "runtime-worker-pre-drain"
              WORKER_PREVIOUS_SERVICE_CONFIG_DIRTY=1
              if ! systemctl disable "${WORKER_SERVICE}@${WORKER_ACTIVE}"; then
                log "ERROR: failed to disable active runtime worker before drain"
                rollback_idle_and_exit
              fi
              if ! install -m 0644 /dev/null "/run/agent-saas-runtime-worker-${WORKER_ACTIVE}.draining"; then
                log "ERROR: failed to arm active runtime worker drain guard"
                rollback_idle_and_exit
              fi
              WORKER_ACTIVE_DRAIN_STARTED=1
              log "runtime worker drain restart guard armed after disable: /run/agent-saas-runtime-worker-${WORKER_ACTIVE}.draining"
              if ! kill -USR2 "$OLD_WORKER_PID" 2>/dev/null; then
                log "ERROR: failed to drain active runtime worker $WORKER_ACTIVE pid=$OLD_WORKER_PID"
                rollback_idle_and_exit
              fi
              WORKER_DRAIN_TIMEOUT=960
              WORKER_OLD_WAITED=0
              while systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_ACTIVE}"; do
                if [ "$WORKER_OLD_WAITED" -ge "$WORKER_DRAIN_TIMEOUT" ]; then
                  log "ERROR: active runtime worker did not drain within ${WORKER_DRAIN_TIMEOUT}s"
                  rollback_idle_and_exit
                fi
                ensure_pre_switch_budget "runtime-worker-drain"
                sleep 5
                WORKER_OLD_WAITED=$((WORKER_OLD_WAITED + 5))
              done
              WORKER_ACTIVE_DRAIN_COMPLETED=1
              log "active runtime worker drained before Web start: color=$WORKER_ACTIVE waited=${WORKER_OLD_WAITED}s"
            fi
            ensure_pre_switch_budget "runtime-worker-post-drain"

            WORKER_CANDIDATE_PIDFILE="/run/agent-saas-runtime-worker-${WORKER_IDLE}.pid"
            WORKER_CANDIDATE_READYFILE="/run/agent-saas-runtime-worker-${WORKER_IDLE}.ready"
            WORKER_POST_DRAIN_READY=0
            WORKER_POST_DRAIN_WAITED=0
            WORKER_POST_DRAIN_DEADLINE_EPOCH=$(( $(date +%s) + 180 ))
            for _ in $(seq 1 180); do
              worker_pid=$(cat "$WORKER_CANDIDATE_PIDFILE" 2>/dev/null || true)
              worker_ready_pid=$(cat "$WORKER_CANDIDATE_READYFILE" 2>/dev/null || true)
              worker_main_pid=$(systemctl show "${WORKER_SERVICE}@${WORKER_IDLE}" -p MainPID --value 2>/dev/null || true)
              if systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_IDLE}" \
                && [ -n "$worker_pid" ] && [ "$worker_pid" = "$worker_ready_pid" ] \
                && [ "$worker_pid" = "$worker_main_pid" ] && kill -0 "$worker_pid" 2>/dev/null; then
                WORKER_POST_DRAIN_READY=1
                break
              fi
              if [ "$(date +%s)" -ge "$WORKER_POST_DRAIN_DEADLINE_EPOCH" ] \
                || [ "$(date +%s)" -ge "$DEPLOY_FAILSAFE_DEADLINE_EPOCH" ]; then
                break
              fi
              sleep 1
              WORKER_POST_DRAIN_WAITED=$((WORKER_POST_DRAIN_WAITED + 1))
            done
            if [ "$WORKER_POST_DRAIN_READY" -ne 1 ]; then
              log "ERROR: runtime worker candidate failed readiness after old drain: color=$WORKER_IDLE waited=${WORKER_POST_DRAIN_WAITED}s"
              rollback_idle_and_exit
            fi
            ensure_pre_switch_budget "runtime-worker-recovered"
            if [ "$worker_pid" != "$WORKER_CANDIDATE_INITIAL_PID" ]; then
              log "runtime worker candidate restarted during old drain and recovered: color=$WORKER_IDLE old_pid=$WORKER_CANDIDATE_INITIAL_PID current_pid=$worker_pid waited=${WORKER_POST_DRAIN_WAITED}s"
            fi
            WORKER_AUTHORITY_ACK="${WORKER_CANDIDATE_READYFILE}.authority"
            rm -f "$WORKER_AUTHORITY_ACK"
            if ! kill -USR1 "$worker_pid" 2>/dev/null; then
              log "ERROR: failed to request runtime worker authority refresh: color=$WORKER_IDLE pid=$worker_pid"
              rollback_idle_and_exit
            fi
            WORKER_AUTHORITY_REFRESHED=0
            for _ in $(seq 1 30); do
              worker_authority_pid=$(cat "$WORKER_AUTHORITY_ACK" 2>/dev/null || true)
              if [ "$worker_authority_pid" = "$worker_pid" ]; then
                WORKER_AUTHORITY_REFRESHED=1
                break
              fi
              ensure_pre_switch_budget "runtime-worker-authority-refresh"
              sleep 1
            done
            if [ "$WORKER_AUTHORITY_REFRESHED" -ne 1 ]; then
              log "ERROR: runtime worker authority refresh timed out: color=$WORKER_IDLE pid=$worker_pid"
              rollback_idle_and_exit
            fi
            worker_current_pid=$(cat "$WORKER_CANDIDATE_PIDFILE" 2>/dev/null || true)
            worker_ready_pid=$(cat "$WORKER_CANDIDATE_READYFILE" 2>/dev/null || true)
            worker_main_pid=$(systemctl show "${WORKER_SERVICE}@${WORKER_IDLE}" -p MainPID --value 2>/dev/null || true)
            if ! systemctl is-active --quiet "${WORKER_SERVICE}@${WORKER_IDLE}" \
              || [ "$worker_current_pid" != "$worker_pid" ] || [ "$worker_ready_pid" != "$worker_pid" ] \
              || [ "$worker_main_pid" != "$worker_pid" ] || ! kill -0 "$worker_pid" 2>/dev/null; then
              log "ERROR: runtime worker candidate changed after authority refresh: color=$WORKER_IDLE pid=$worker_pid"
              rollback_idle_and_exit
            fi
            ensure_pre_switch_budget "runtime-worker-authority-confirmed"
            log "runtime worker authority refreshed after old drain: color=$WORKER_IDLE release=$RELEASE_ID"
            log "runtime worker handoff completed before Web readiness: color=$WORKER_IDLE release=$RELEASE_ID"
          fi

          # ── 6. 启动 idle 色 + ready 门禁（180s）──
          # enable --now：候选色先具备开机自启；切流成功后立即 disable 旧色，
          # 避免整机重启时两色同时启动并争用启动期 PG 锁。
          rm -f "/run/${SERVICE_NAME}-${IDLE}.pid" "/run/${SERVICE_NAME}-${IDLE}.draining"
          log "start idle unit: ${SERVICE_NAME}@${IDLE} (port $IDLE_PORT)"
          if systemctl is-enabled --quiet "${SERVICE_NAME}@${IDLE}"; then
            WEB_IDLE_WAS_ENABLED=1
          else
            WEB_IDLE_WAS_ENABLED=0
          fi
          WEB_IDLE_ENABLEMENT_DIRTY=1
          systemctl enable --now "${SERVICE_NAME}@${IDLE}"

          ready_ok() {
            curl -fsS -m 5 "$READY_URL" >/dev/null 2>&1
          }

          READY_WAITED=0
          READY_OK=0
          log "waiting ready: $READY_URL timeout=180s"
          for _ in $(seq 1 180); do
            if ready_ok; then
              READY_OK=1
              log "ready ok after ${READY_WAITED}s"
              break
            fi
            if [ $((READY_WAITED % 10)) -eq 0 ]; then
              log "waiting ready waited=${READY_WAITED}s"
            fi
            ensure_pre_switch_budget "web-readiness"
            sleep 1
            READY_WAITED=$((READY_WAITED + 1))
          done
          if [ "$READY_OK" -ne 1 ]; then
            log "ready FAILED after 180s"
            rollback_idle_and_exit
          fi

          # ── 7. warmup 等待（软门禁：failed/超时降级为警告，dispatch 时增量同步兜底）──
          read_warmup_state() {
            local body
            body=$(curl -sS -m 5 "$READY_URL" 2>/dev/null || true)
            if [ -z "$body" ]; then
              return 1
            fi
            node -e '
              const body = process.argv[1];
              let data;
              try {
                data = JSON.parse(body);
              } catch {
                process.exit(2);
              }
              console.log(String(data.warmup?.state ?? "unknown"));
            ' "$body"
          }

          log "waiting warmup.state=done timeout=420s"
          WARMUP_WAITED=0
          while [ "$WARMUP_WAITED" -lt 420 ]; do
            WARMUP_STATE=$(read_warmup_state || true)
            if [ "$WARMUP_STATE" = "done" ]; then
              log "warmup done after ${WARMUP_WAITED}s"
              break
            fi
            if [ "$WARMUP_STATE" = "failed" ]; then
              log "WARN: warmup failed; continue anyway (dispatch-time incremental sync covers)"
              break
            fi
            if [ $((WARMUP_WAITED % 30)) -eq 0 ]; then
              log "warmup state=${WARMUP_STATE:-unknown} waited=${WARMUP_WAITED}s"
            fi
            ensure_pre_switch_budget "web-warmup"
            sleep 5
            WARMUP_WAITED=$((WARMUP_WAITED + 5))
          done
          if [ "$WARMUP_WAITED" -ge 420 ]; then
            log "WARN: warmup wait timeout after 420s; continue anyway (dispatch-time incremental sync covers)"
          fi

          # ── 8. 冒烟：idle 端口 healthz 200 且 drain 状态返回合法 JSON ──
          read_drain_status() {
            local body
            body=$(curl -sS -m 5 "$DRAINZ_URL" 2>/dev/null || true)
            if [ -z "$body" ]; then
              return 1
            fi
            node -e '
              const body = process.argv[1];
              let data;
              try {
                data = JSON.parse(body);
              } catch {
                process.exit(2);
              }
              const activeStreams = Number(data.activeStreams ?? 0);
              const activeUploads = Number(data.activeUploads ?? 0);
              const blockingRuns = Number(data.activeRuns?.blocking ?? 0);
              const totalRuns = Number(data.activeRuns?.total ?? 0);
              const idle = data.idle === true;
              console.log(`${idle ? "idle" : "busy"} streams=${activeStreams} uploads=${activeUploads} blockingRuns=${blockingRuns} totalRuns=${totalRuns} status=${data.status ?? "unknown"}`);
            ' "$body"
          }

          ensure_pre_switch_budget "pre-smoke"
          log "smoke check on idle port $IDLE_PORT"
          if ! curl -fsS -m 5 "$HEALTHZ_URL" >/dev/null 2>&1; then
            log "smoke FAILED: $HEALTHZ_URL not 200"
            rollback_idle_and_exit
          fi
          SMOKE_DRAIN_STATUS=$(read_drain_status || true)
          if [ -z "$SMOKE_DRAIN_STATUS" ]; then
            log "smoke FAILED: $DRAINZ_URL did not return valid JSON"
            rollback_idle_and_exit
          fi
          log "smoke ok: healthz 200, drain status: $SMOKE_DRAIN_STATUS"

          # ── 9. 切流：重写 nginx upstream（新色 primary、旧色 backup）→ nginx -t → reload ──
          ensure_pre_switch_budget "nginx-config"
          UPSTREAM_BAK="/tmp/agent-saas-upstream.conf.bak.$$"
          API_SITE_BAK="/tmp/agent-api-kaiyan.conf.bak.$$"
          if [ -f "$UPSTREAM_CONF" ]; then
            cp "$UPSTREAM_CONF" "$UPSTREAM_BAK"
          fi
          if [ -f "$API_SITE_CONF" ]; then
            cp "$API_SITE_CONF" "$API_SITE_BAK"
          fi
          install -d -m 0770 -o nginx -g nginx /mnt/agent-saas/runtime/nginx-client-body
          install -m 0644 "$RELEASE_DIR/daemon-packaging/nginx/agent-api-kaiyan.conf.example" "$API_SITE_CONF"
          log "installed managed API nginx config with direct-streaming /api/upload"
          log "rewrite nginx upstream: primary=127.0.0.1:$IDLE_PORT ($IDLE) backup=127.0.0.1:$ACTIVE_PORT ($ACTIVE)"
          cat > "$UPSTREAM_CONF" <<EOF
          # active=$IDLE
          # 由 ci.yml 部署脚本重写，手工修改会在下次部署被覆盖
          upstream agent_saas_backend {
              server 127.0.0.1:$IDLE_PORT;
              server 127.0.0.1:$ACTIVE_PORT backup;
          }
          EOF
          if ! nginx -t; then
            log "nginx -t FAILED; restoring previous upstream conf (running nginx config unchanged)"
            if [ -f "$UPSTREAM_BAK" ]; then
              cp "$UPSTREAM_BAK" "$UPSTREAM_CONF"
            else
              rm -f "$UPSTREAM_CONF"
            fi
            if [ -f "$API_SITE_BAK" ]; then
              cp "$API_SITE_BAK" "$API_SITE_CONF"
            else
              rm -f "$API_SITE_CONF"
            fi
            nginx -t || log "WARN: nginx -t still failing after restore; manual attention needed"
            rollback_idle_and_exit
          fi
          TRAFFIC_SWITCHED=1
          if ! systemctl reload nginx; then
            log "ERROR: nginx reload failed after switch was armed; restoring previous configuration"
            if ! recover_previous_nginx "$LINENO"; then
              log "ERROR: nginx state is uncertain; preserving candidate and rollback snapshot for manual recovery"
              exit 1
            fi
            TRAFFIC_SWITCHED=0
            rollback_idle_and_exit
          fi
          log "nginx reloaded; traffic physically switched to $IDLE; verifying via https://127.0.0.1 (Host: api.agent.kaiyan.net)"
          SWITCH_VERIFIED=0
          for _ in $(seq 1 10); do
            if curl -kfsS -m 5 -H 'Host: api.agent.kaiyan.net' https://127.0.0.1/api/healthz >/dev/null 2>&1; then
              SWITCH_VERIFIED=1
              break
            fi
            sleep 1
          done
          if [ "$SWITCH_VERIFIED" -ne 1 ]; then
            log "post-reload verification FAILED; flipping nginx back to $ACTIVE and rolling back"
            if ! recover_previous_nginx "$LINENO"; then
              log "ERROR: failed to flip nginx back; preserving candidate and rollback snapshot for manual recovery"
              exit 1
            fi
            TRAFFIC_SWITCHED=0
            rollback_idle_and_exit
          fi
          # ── 10. 原子更新活动色标记；失败时先安全翻回 nginx ──
          if ! write_color_marker "$ACTIVE_COLOR_FILE" "$IDLE"; then
            log "ERROR: failed to atomically update active color; flipping nginx back to $ACTIVE"
            if ! recover_previous_nginx "$LINENO"; then
              log "ERROR: failed to flip nginx back; preserving idle service for manual recovery"
              exit 1
            fi
            TRAFFIC_SWITCHED=0
            rollback_idle_and_exit
          fi
          log "traffic switch verified: active=$IDLE"
          systemctl disable "${SERVICE_NAME}@${ACTIVE}"
          log "active color atomically updated: $ACTIVE -> $IDLE"
          log "boot ownership updated: enabled=$IDLE disabled=$ACTIVE"

          # ── 10.5 Runtime Worker 已在 Web readiness 前完成接管 ──
          if [ "$WORKER_DEPLOY_REQUIRED" = "true" ]; then
            if [ "$WORKER_PREACTIVATED" -ne 1 ]; then
              log "ERROR: runtime worker was not promoted before Web traffic switch"
              exit 1
            fi
            log "runtime worker already active: color=$WORKER_IDLE release=$RELEASE_ID"
          fi

          # ── 10.6 核对 App 物理态，但不提前提交可信 Production identity ──
          # compatibility 通道还要发布 Web；只有 Web 完成后才能把完整组件矩阵一次提交。
          IDENTITY_SYNC_DIR="/tmp/agent-saas-runtime-identity-${GITHUB_RUN_ID}"
          rm -rf "$IDENTITY_SYNC_DIR"
          mkdir -p "$IDENTITY_SYNC_DIR"
          IDENTITY_SYNCED=0
          for identity_attempt in $(seq 1 10); do
            rm -f "$IDENTITY_SYNC_DIR/live.json"
            if node "$RELEASE_DIR/scripts/release/read-live-production-components.mjs" \
                --output "$IDENTITY_SYNC_DIR/live.json" >/dev/null \
              && jq -e --arg sha "$RELEASE_SHA" --arg digest "$SERVER_ARTIFACT_DIGEST" \
                '.components.api.gitSha==$sha and .components.api.artifactDigest==$digest and
                 .components.runtimeWorker.gitSha==$sha and .components.runtimeWorker.artifactDigest==$digest' \
                "$IDENTITY_SYNC_DIR/live.json" >/dev/null; then
              IDENTITY_SYNCED=1
              break
            fi
            log "Production App physical-state readback attempt $identity_attempt/10 failed"
            sleep 2
          done
          if [ "$IDENTITY_SYNCED" -ne 1 ]; then
            log "ERROR: Production App physical state could not be confirmed; restoring API/Worker before draining old API"
            cp "$RUNTIME_IDENTITY_BAK" "$RUNTIME_IDENTITY_FILE"
            if ! write_color_marker "$ACTIVE_COLOR_FILE" "$ACTIVE"; then
              log "ERROR: failed to restore active color; preserving new traffic for manual recovery"
              exit 1
            fi
            if ! recover_previous_nginx "$LINENO"; then
              write_color_marker "$ACTIVE_COLOR_FILE" "$IDLE" || true
              log "ERROR: failed to restore old nginx upstream; preserving idle service"
              exit 1
            fi
            systemctl enable "${SERVICE_NAME}@${ACTIVE}"
            systemctl disable "${SERVICE_NAME}@${IDLE}"
            TRAFFIC_SWITCHED=0
            rollback_idle_and_exit
          fi
          rm -rf "$IDENTITY_SYNC_DIR"
          log "API and Runtime Worker physical state converged; trusted identity remains unchanged until Web converges"

          # ── 11. 固化本次发布对应的回滚状态与版本化脚本 ──
          # 先安装脚本，再原子切换状态指针；回滚会先恢复旧 unit/env/identity/Worker
          # 拓扑，再启动旧 release，因此首次引入 Runtime guard 也能安全回退。
          # 状态 schema 向后兼容旧 rollback.sh；先切换状态，再发布读取新字段的脚本，
          # 避免新脚本在两次原子 rename 之间读到旧 schema。
          rm -f "$ROLLBACK_STATE_LINK.candidate"
          ln -s "$ROLLBACK_STATE_DIR" "$ROLLBACK_STATE_LINK.candidate"
          mv -Tf "$ROLLBACK_STATE_LINK.candidate" "$ROLLBACK_STATE_LINK"
          install -m 0755 "$RELEASE_DIR/scripts/release/rollback-compatibility-app.sh" \
            "$DEPLOY_ROOT/rollback.sh.candidate"
          mv -f "$DEPLOY_ROOT/rollback.sh.candidate" "$DEPLOY_ROOT/rollback.sh"
          ROLLBACK_STATE_COMMITTED=1
          INSTALL_CLEANUP_ARMED=0
          WEB_IDLE_ENABLEMENT_DIRTY=0
          log "rollback state committed and rollback.sh refreshed: $ROLLBACK_STATE_DIR"

          # ── 12. drain 旧色：SIGUSR2 精确送 node 主进程（拒新流量→停 cron→活跃流清空→自行 exit 0）──
          # 绝不能用 systemctl kill：默认 cgroup 广播，SIGUSR2 会终止无 handler 的 SDK 子进程。
          OLD_PIDFILE="/run/${SERVICE_NAME}-${ACTIVE}.pid"
          if [ -f "$OLD_PIDFILE" ] && kill -USR2 "$(cat "$OLD_PIDFILE")" 2>/dev/null; then
            log "drain signal SIGUSR2 sent to old color $ACTIVE (pid $(cat "$OLD_PIDFILE" 2>/dev/null || echo '?'))"
          else
            OLD_DRAIN_BODY=$(curl -sS -m 5 "http://127.0.0.1:$ACTIVE_PORT/api/healthz/drain" 2>/dev/null || true)
            OLD_ACTIVE_UPLOADS=$(node -e '
              try { console.log(Number(JSON.parse(process.argv[1]).activeUploads ?? 0)); }
              catch { console.log(-1); }
            ' "$OLD_DRAIN_BODY")
            if [ "$OLD_ACTIVE_UPLOADS" -eq 0 ]; then
              log "WARN: pidfile $OLD_PIDFILE missing or kill failed; no active uploads, fallback to systemctl stop"
              systemctl stop "${SERVICE_NAME}@${ACTIVE}" || true
            else
              log "ERROR: pidfile $OLD_PIDFILE missing or kill failed and activeUploads=$OLD_ACTIVE_UPLOADS; refusing fallback stop"
            fi
          fi
          OLD_WAITED=0
          OLD_DRAINED=0
          while [ "$OLD_WAITED" -lt 60 ]; do
            if ! systemctl is-active --quiet "${SERVICE_NAME}@${ACTIVE}"; then
              OLD_DRAINED=1
              break
            fi
            sleep 5
            OLD_WAITED=$((OLD_WAITED + 5))
          done
          if [ "$OLD_DRAINED" -eq 1 ]; then
            log "old color drained: $ACTIVE unit inactive after ${OLD_WAITED}s"
          else
            log "old color draining in background: $ACTIVE still active after 60s (not a failure; next deploy waits up to 600s)"
          fi

          # ── 13. 收尾：保留 pnpm store 热缓存 + 删除上传包 ──
          # 不在部署热路径执行 pnpm store prune：它会让下一次发布 reused=0，
          # 冷装全部依赖时与 active 服务争抢 CPU/IO/内存，破坏零停机保证。
          log "preserve pnpm store cache for the next isolated install"
          log "remove uploaded release archive"
          rm -f "$RELEASE_TGZ" "$UPSTREAM_BAK" "$API_SITE_BAK" "$RUNTIME_IDENTITY_BAK"
          log "deploy ok: $RELEASE_ID active=$IDLE (old color $ACTIVE drain issued)"
          exit 0
          REMOTE

      - name: Assert zero downtime
        # deploy 失败时也要跑（打印探测报告），probe 未启动时在脚本内跳过
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ ! -f "$RUNNER_TEMP/probe.pid" ]; then
            echo "probe.pid not found (probe step did not run)"
            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "ZERO-DOWNTIME GATE FAILED: successful deploy has no running probe"
              exit 1
            fi
            echo "deploy outcome=$DEPLOY_OUTCOME; report only"
            exit 0
          fi
          kill "$(cat "$RUNNER_TEMP/probe.pid")" 2>/dev/null || true
          wait "$(cat "$RUNNER_TEMP/probe.pid")" 2>/dev/null || true
          if [ ! -f "$RUNNER_TEMP/probe.log" ]; then
            echo "probe.log missing"
            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "ZERO-DOWNTIME GATE FAILED: successful deploy has no probe log"
              exit 1
            fi
            echo "deploy outcome=$DEPLOY_OUTCOME; report only"
            exit 0
          fi
          WS_MODE=$(cat "$RUNNER_TEMP/probe.ws-mode" 2>/dev/null || true)
          if [ "$WS_MODE" != "strict" ] && [ "$WS_MODE" != "bootstrap" ]; then
            echo "invalid or missing WS probe mode: ${WS_MODE:-missing}"
            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "ZERO-DOWNTIME GATE FAILED: successful deploy has no valid WS probe mode"
              exit 1
            fi
          fi
          TOTAL=$(wc -l < "$RUNNER_TEMP/probe.log" | tr -d '[:space:]')
          HEALTH_FAILURES=$(awk '$2 != "200" { n++ } END { print n + 0 }' "$RUNNER_TEMP/probe.log")
          API_FAILURES=$(awk '$3 != "ok" { n++ } END { print n + 0 }' "$RUNNER_TEMP/probe.log")
          WS_SUCCESSES=$(awk '$4 == "ok" { n++ } END { print n + 0 }' "$RUNNER_TEMP/probe.log")
          if [ "$WS_MODE" = "bootstrap" ]; then
            WS_FAILURES=$(awk '$4 != "ok" && $4 != "legacy-auth" { n++ } END { print n + 0 }' "$RUNNER_TEMP/probe.log")
          else
            WS_FAILURES=$(awk '$4 != "ok" { n++ } END { print n + 0 }' "$RUNNER_TEMP/probe.log")
          fi
          echo "probe summary: mode=$WS_MODE total=$TOTAL health_failures=$HEALTH_FAILURES api_failures=$API_FAILURES ws_failures=$WS_FAILURES ws_successes=$WS_SUCCESSES"
          echo "--- failed probe lines (epoch health_code api_status ws_status) ---"
          if [ "$WS_MODE" = "bootstrap" ]; then
            awk '$2 != "200" || $3 != "ok" || ($4 != "ok" && $4 != "legacy-auth")' "$RUNNER_TEMP/probe.log"
          else
            awk '$2 != "200" || $3 != "ok" || $4 != "ok"' "$RUNNER_TEMP/probe.log"
          fi
          if [ -s "$RUNNER_TEMP/probe-details.log" ]; then
            echo "--- probe transport/validation details ---"
            cat "$RUNNER_TEMP/probe-details.log"
          fi
          # deploy 失败时旧色未动，探测应全绿；此处只报告不守门，不改变 job 结论
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "deploy outcome=$DEPLOY_OUTCOME; report only, zero-downtime gate skipped"
            exit 0
          fi
          if [ "${TOTAL:-0}" -eq 0 ]; then
            echo "ZERO-DOWNTIME GATE FAILED: no probe samples"
            exit 1
          fi
          if [ "${HEALTH_FAILURES:-0}" -gt 0 ] || [ "${API_FAILURES:-0}" -gt 0 ] || [ "${WS_FAILURES:-0}" -gt 0 ]; then
            echo "ZERO-DOWNTIME GATE FAILED: every health/API/WS sample must succeed"
            exit 1
          fi
          if [ "$WS_MODE" = "bootstrap" ] && [ "${WS_SUCCESSES:-0}" -eq 0 ]; then
            echo "ZERO-DOWNTIME GATE FAILED: new WS probe was never observed after cutover"
            exit 1
          fi
          echo "zero-downtime gate passed"

  # 前端静态托管在 OSS（bucket agent-saas-web，绑定 agent.kaiyan.net），
  # API/WS 走独立域名 api.agent.kaiyan.net（VITE_API_BASE 构建时注入）。
  # ECS 冷灾备使用同一份分域构建，但发布到独立 recovery-web 目录，
  # 不进入 Server release，也不由 Express 托管。
  # dispatch-only 且仅允许 Web-only；deploy_plan 发现任何 ECS 相关差异即在 mutation 前阻断。
  # 上传顺序：先 hash 资源（immutable，只增不删，兼容在途会话的旧 chunk 懒加载）,
  # 后入口文件（no-cache），保证 index.html 引用的资源先就位。
  deploy-web-oss:
    name: Deploy Web to OSS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    # 只接受 deploy_plan 已证明无需 ECS，且不可达的 deploy-ecs 保持 skipped。
    needs: [build, deploy_plan, deploy-ecs]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      needs.build.result == 'success' &&
      needs.deploy_plan.result == 'success' &&
      needs.deploy_plan.outputs.ecs_required == 'false' &&
      needs.deploy-ecs.result == 'skipped'

    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_WEB_DEPLOY_AK_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_WEB_DEPLOY_AK_SECRET }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      RELEASE_RECORD_OSS_URI: oss://agent-saas-release-records
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      OSS_REGION: cn-shenzhen
      OSS_BUCKET: agent-saas-web
      VITE_API_BASE: https://api.agent.kaiyan.net
      VITE_WEB_ORIGIN: https://agent.kaiyan.net
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RECOVERY_WEB_ROOT: /opt/agent-saas-web-recovery
      # Runner payloads enter the dedicated Production root-only directory before digest verification.
      PRODUCTION_STAGING_ROOT: /run/agent-saas-production-staging
      WEB_TRANSACTION_PREFIX: _transactions/${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_LOCK_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-compat-web
      PRODUCTION_LOCK_UPLOAD: /tmp/production-lock-${{ github.run_id }}-${{ github.run_attempt }}.sh
      PRODUCTION_LOCK_SCRIPT: /run/agent-saas-locks/production-lock-${{ github.run_id }}-${{ github.run_attempt }}.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (split-domain)
        run: pnpm -F web build:oss

      - name: Pack and identify Web release
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          tar -C web/dist -czf "$RUNNER_TEMP/web-assets.tgz" .
          node scripts/release/create-component-artifact-index.mjs \
            --sha "$GITHUB_SHA" --name webAssets --file "$RUNNER_TEMP/web-assets.tgz" \
            --output "$RUNNER_TEMP/web-artifact-index.json"
          web_digest="$(jq -r .artifacts.webAssets.digest "$RUNNER_TEMP/web-artifact-index.json")"
          release_id="rc-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          {
            echo "WEB_ARTIFACT_DIGEST=$web_digest"
            echo "COMPAT_RELEASE_ID=$release_id"
          } >> "$GITHUB_ENV"

      - name: Install and verify OSS clients
        run: |
          set -euo pipefail
          curl -sL https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -o -q /tmp/ossutil.zip -d /tmp
          sudo install /tmp/ossutil-2.1.2-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version | grep -F '2.1.2'
          ossutil cp --help > "$RUNNER_TEMP/ossutil-cp-help.txt"
          ossutil stat --help > "$RUNNER_TEMP/ossutil-stat-help.txt"
          grep -Eq -- '(^|[[:space:],])-f([[:space:],]|$)' "$RUNNER_TEMP/ossutil-cp-help.txt"
          grep -Eq -- '(^|[[:space:],])--region([=[:space:],]|$)' "$RUNNER_TEMP/ossutil-cp-help.txt"
          grep -Eq -- '(^|[[:space:],])--region([=[:space:],]|$)' "$RUNNER_TEMP/ossutil-stat-help.txt"
          node scripts/release/put-web-asset-create-only.mjs --self-check
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz \
            -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: Persist immutable Web baseline
        run: |
          set -euo pipefail
          : "${RELEASE_RECORD_OSS_URI:?Missing Release Record OSS URI}"
          destination="$RELEASE_RECORD_OSS_URI/baselines/web-${GITHUB_SHA}-${WEB_ARTIFACT_DIGEST#sha256:}"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/web-assets.tgz" "$destination/web-assets.tgz"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/web-artifact-index.json" "$destination/artifact-index.json"

      - name: Write Web release identity
        run: |
          jq -n \
            --arg releaseId "$COMPAT_RELEASE_ID" \
            --arg releaseSha "$GITHUB_SHA" \
            --arg webDigest "$WEB_ARTIFACT_DIGEST" \
            --arg configFingerprint "$(jq -r .aggregateDigest "$RUNNER_TEMP/web-artifact-index.json")" \
            '{schemaVersion:1,environment:"production",releaseId:$releaseId,releaseSha:$releaseSha,webDigest:$webDigest,configFingerprint:$configFingerprint}' \
            > web/dist/release-identity.json

      - name: Configure recovery SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_recovery_key
          chmod 600 ~/.ssh/ecs_recovery_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          scan_path="$RUNNER_TEMP/production-known-host"
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$scan_path"
          test -s "$scan_path"
          test "$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$scan_path" >> ~/.ssh/known_hosts

      - name: Acquire production host lock for the complete Web transaction
        run: |
          set -euo pipefail
          lock_log="/tmp/production-lock-$PRODUCTION_LOCK_TOKEN.log"
          scp -i ~/.ssh/ecs_recovery_key scripts/release/production-lock-lease.sh \
            "$ECS_USER@$ECS_HOST:$PRODUCTION_LOCK_UPLOAD"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo mkdir -p /run/agent-saas-locks; \
             sudo install -m 0500 '$PRODUCTION_LOCK_UPLOAD' '$PRODUCTION_LOCK_SCRIPT'; \
             rm -f '$PRODUCTION_LOCK_UPLOAD' '$lock_log'; \
             nohup sudo env PRODUCTION_LOCK_TIMEOUT_SECONDS=1800 \
               bash '$PRODUCTION_LOCK_SCRIPT' hold '$PRODUCTION_LOCK_TOKEN' \
               >'$lock_log' 2>&1 </dev/null &"
          for _ in $(seq 1 60); do
            if ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
                "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'" \
                >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" "cat '$lock_log'" >&2 || true
          exit 1

      - name: Snapshot trusted Production identity before Web transaction
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo cat /etc/agent-saas/runtime-identity.json" \
            > "$RUNNER_TEMP/runtime-identity.before.json"
          jq -e '.schemaVersion == 1 and .environment == "production" and .components.web' \
            "$RUNNER_TEMP/runtime-identity.before.json" >/dev/null
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "set -e; \
             target=\$(readlink -f '$RECOVERY_WEB_ROOT/current'); \
             case \"\$target\" in '$RECOVERY_WEB_ROOT'/releases/*) ;; \
               *) echo 'recovery Web current target is not an immutable release' >&2; exit 1 ;; \
             esac; \
             for f in manifest.webmanifest release-identity.json index.html sw.js; do \
               test -s \"\$target/\$f\" || { echo \"recovery Web before target is missing \$f\" >&2; exit 1; }; \
             done; \
             jq -e '.schemaVersion == 1 and .environment == \"production\" and .releaseId and .releaseSha and .webDigest' \
               \"\$target/release-identity.json\" >/dev/null; \
             printf '%s\\n' \"\$target\"" \
            > "$RUNNER_TEMP/recovery-web-target.before"

      - name: Snapshot all mutable Web keys under continuously verified Production lock ownership
        run: |
          set -euo pipefail
          snapshot_web() {
          set -euo pipefail
          keys="$RUNNER_TEMP/web-mutable-keys.txt"
          states="$RUNNER_TEMP/web-mutable-before.tsv"
          (
            cd web/dist
            for f in manifest.webmanifest release-identity.json index.html sw.js \
              apple-touch-icon.png favicon-16x16.png favicon-32x32.png favicon.ico \
              kaikai-avatar.png workbox-*.js; do
              [ -f "$f" ] && printf '%s\n' "$f"
            done
            for d in icons kaikai-presets; do
              [ -d "$d" ] && find "$d" -type f -print
            done
          ) | LC_ALL=C sort -u > "$keys"
          test -s "$keys"
          ECS_IP=$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')
          : "${ECS_IP:?Cannot resolve ECS_HOST to IPv4}"
          # Compare serving metadata while excluding mutation timestamps and transaction paths.
          normalize_oss_metadata() {
            grep -Ei '^[[:space:]]*(ACL|Cache-?Control|Content-?(Disposition|Encoding|Language|Length|MD5|Type)|ETag|Expires|Metadata|Storage-?Class|X-Oss-(Meta-|Object-Acl|Storage-Class|Server-Side-Encryption))' "$1" \
              | sed -E 's/\r$//; s/^[[:space:]]+//; s/[[:space:]]*:[[:space:]]*/:/' \
              | LC_ALL=C sort
          }
          : > "$states"
          while IFS= read -r key; do
            printf '%s' "$key" | grep -Eq '^[A-Za-z0-9._/-]+$'
            stat_log="$RUNNER_TEMP/web-mutable-stat.log"
            if ossutil stat "oss://$OSS_BUCKET/$key" --region "$OSS_REGION" \
              > "$stat_log" 2>&1; then
              state=present
            elif grep -Eiq 'ErrorCode[=: ]+NoSuchKey([[:space:],}]|$)' "$stat_log"; then
              state=missing
            else
              cat "$stat_log" >&2
              exit 1
            fi
            case "$key:$state" in
              manifest.webmanifest:missing|release-identity.json:missing|index.html:missing|sw.js:missing)
                echo "required Production Web key is missing before transaction: $key" >&2
                exit 1
                ;;
            esac
            before="$RUNNER_TEMP/web-before/$key"
            recovery="$RUNNER_TEMP/web-recovery-before/$key"
            mkdir -p "$(dirname "$before")" "$(dirname "$recovery")"
            http_code="$(curl -sS --resolve "agent.kaiyan.net:443:$ECS_IP" \
              -H 'cache-control: no-cache' -o "$recovery" -w '%{http_code}' \
              "https://agent.kaiyan.net/$key?before_probe=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || true)"
            if [ "$state" = present ]; then
              ossutil cp "oss://$OSS_BUCKET/$key" \
                "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" -f \
                --region "$OSS_REGION" --copy-props default
              ossutil cp "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                "$before" -f --region "$OSS_REGION"
              before_metadata="$RUNNER_TEMP/web-before-metadata/$key"
              backup_stat="$RUNNER_TEMP/web-backup-stat/$key"
              backup_metadata="$RUNNER_TEMP/web-backup-metadata/$key"
              mkdir -p "$(dirname "$before_metadata")" "$(dirname "$backup_stat")" \
                "$(dirname "$backup_metadata")"
              normalize_oss_metadata "$stat_log" > "$before_metadata"
              test -s "$before_metadata"
              ossutil stat \
                "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                --region "$OSS_REGION" > "$backup_stat"
              normalize_oss_metadata "$backup_stat" > "$backup_metadata"
              cmp "$before_metadata" "$backup_metadata"
              test "$http_code" = 200
              cmp "$before" "$recovery"
            else
              test "$http_code" = 404
            fi
            printf '%s\t%s\n' "$state" "$key" >> "$states"
          done < "$keys"
          ossutil cp "$states" \
            "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/mutable-keys.tsv" -f \
            --region "$OSS_REGION" --cache-control "no-store" \
            --content-type "text/tab-separated-values; charset=utf-8"
          touch "$RUNNER_TEMP/web-entry-snapshot-complete"
          }
          export -f snapshot_web
          PRODUCTION_LOCK_SSH_KEY=~/.ssh/ecs_recovery_key \
            bash scripts/release/run-with-production-lock-guard.sh bash -c snapshot_web

      - name: Upload to OSS under continuously verified Production lock ownership
        run: |
          set -euo pipefail
          upload_web() {
            set -euo pipefail
            : "${OSS_ACCESS_KEY_ID:?Missing secret OSS_WEB_DEPLOY_AK_ID}"
            : "${OSS_ACCESS_KEY_SECRET:?Missing secret OSS_WEB_DEPLOY_AK_SECRET}"
            credentials="$RUNNER_TEMP/web-oss-sdk-credentials.json"
            umask 077
            jq -n --arg accessKeyId "$OSS_ACCESS_KEY_ID" \
              --arg accessKeySecret "$OSS_ACCESS_KEY_SECRET" \
              '{accessKeyId:$accessKeyId,accessKeySecret:$accessKeySecret}' > "$credentials"
            cd web/dist
            # 1) hash 静态资源：最终字节只允许创建或复用，禁止覆盖既有对象键。
            bash ../../scripts/release/upload-web-assets-immutable.sh \
              assets "oss://$OSS_BUCKET/assets" "$credentials"
            # 2) 图标与预置资源：短缓存
            for d in icons kaikai-presets; do
              [ -d "$d" ] && ossutil cp "$d" "oss://$OSS_BUCKET/$d" -r -f --region "$OSS_REGION" \
                --cache-control "public, max-age=86400"
            done
            for f in apple-touch-icon.png favicon-16x16.png favicon-32x32.png favicon.ico kaikai-avatar.png; do
              [ -f "$f" ] && ossutil cp "$f" "oss://$OSS_BUCKET/$f" -f --region "$OSS_REGION" \
                --cache-control "public, max-age=86400"
            done
            # 3) SW 依赖先覆盖；manifest 显式修正 MIME
            for f in workbox-*.js; do
              ossutil cp "$f" "oss://$OSS_BUCKET/$f" -f --region "$OSS_REGION" \
                --cache-control "no-cache" --content-type "text/javascript"
            done
            ossutil cp manifest.webmanifest "oss://$OSS_BUCKET/manifest.webmanifest" -f \
              --region "$OSS_REGION" --cache-control "no-cache" \
              --content-type "application/manifest+json"
            # 4) 发布身份与 HTML 切入口；sw.js 必须最后上传，避免引用尚未就位的 Workbox 文件
            ossutil cp release-identity.json "oss://$OSS_BUCKET/release-identity.json" -f \
              --region "$OSS_REGION" --cache-control "no-cache" \
              --content-type "application/json; charset=utf-8"
            ossutil cp index.html "oss://$OSS_BUCKET/index.html" -f --region "$OSS_REGION" \
              --cache-control "no-cache" --content-type "text/html; charset=utf-8"
            ossutil cp sw.js "oss://$OSS_BUCKET/sw.js" -f --region "$OSS_REGION" \
              --cache-control "no-cache" --content-type "text/javascript"
            echo "web dist uploaded to oss://$OSS_BUCKET"
          }
          export -f upload_web
          PRODUCTION_LOCK_SSH_KEY=~/.ssh/ecs_recovery_key \
            bash scripts/release/run-with-production-lock-guard.sh bash -c upload_web

      - name: Verify live Web/API split-domain contract under the Production lock
        run: |
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          node web/scripts/check-live-oss.mjs
          node web/scripts/check-live-compression.mjs
          curl -fsS --retry 10 -H 'cache-control: no-cache' \
            "https://agent.kaiyan.net/release-identity.json?release=$COMPAT_RELEASE_ID" \
            | jq -e --arg digest "$WEB_ARTIFACT_DIGEST" '.environment=="production" and .webDigest==$digest'

      - name: Package recovery Web release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/agent-saas-recovery-web-${GITHUB_SHA}.tgz"
          tar -C web/dist -czf "$archive" .
          echo "RECOVERY_WEB_ARCHIVE_SHA256=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Seal recovery Web release in root-only staging
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/agent-saas-recovery-web-${GITHUB_SHA}.tgz"
          remote="$PRODUCTION_STAGING_ROOT/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          cat "$archive" | ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/recovery-web.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- verify '$RECOVERY_WEB_ARCHIVE_SHA256' \
             '$remote/recovery-web.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          trap - EXIT

      - name: Activate recovery Web release
        run: |
          set -euo pipefail
          remote="$PRODUCTION_STAGING_ROOT/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          printf -v recovery_web_before_q '%q' "$(cat "$RUNNER_TEMP/recovery-web-target.before")"
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo env RECOVERY_WEB_ROOT='$RECOVERY_WEB_ROOT' \
             RECOVERY_WEB_BEFORE_TARGET=$recovery_web_before_q \
             RELEASE_ID='$GITHUB_SHA' RUN_ID='${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}' \
             ARCHIVE='$remote/recovery-web.tgz' bash -s" \
            < scripts/deploy-recovery-web.sh
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"

      - name: Verify recovery Web endpoint
        run: |
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          ECS_IP=$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')
          : "${ECS_IP:?Cannot resolve ECS_HOST to IPv4}"
          curl -fsS \
            --resolve "agent.kaiyan.net:443:$ECS_IP" \
            -D "$RUNNER_TEMP/recovery-web.headers" \
            -o "$RUNNER_TEMP/recovery-web.index.html" \
            "https://agent.kaiyan.net/?recovery_probe=${GITHUB_SHA}"
          grep -Eqi '^x-agent-saas-recovery:[[:space:]]*true' "$RUNNER_TEMP/recovery-web.headers"
          cmp web/dist/index.html "$RUNNER_TEMP/recovery-web.index.html"
          echo "recovery Web endpoint matches current OSS build"

      - name: Snapshot successful Web release
        run: |
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          while IFS=$'\t' read -r _state key; do
            ossutil cp "oss://$OSS_BUCKET/$key" \
              "oss://$OSS_BUCKET/_releases/$GITHUB_SHA/current/$key" -f \
              --region "$OSS_REGION" --copy-props default
          done < "$RUNNER_TEMP/web-mutable-before.tsv"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"

      - name: Commit trusted Production identity after all compatibility targets converge
        id: commit_trusted_identity
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          remote="$PRODUCTION_STAGING_ROOT/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo grep -Fx 'state=activated' \
             '$RECOVERY_WEB_ROOT/transactions/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.activation' >/dev/null"
          identity_payload=(
            scripts/release/artifact-lib.mjs
            scripts/release/read-live-production-components.mjs
            scripts/release/read-production-state.mjs
            scripts/release/read-runtime-identity.mjs
            scripts/release/verify-installed-release.mjs
            scripts/release/write-live-production-identity.mjs
            "$RUNNER_TEMP/runtime-identity.before.json"
          )
          payload_stage="$RUNNER_TEMP/production-identity-payload"
          payload_archive="$RUNNER_TEMP/production-identity-payload.tgz"
          rm -rf "$payload_stage"
          mkdir -p "$payload_stage"
          for source in "${identity_payload[@]}"; do
            install -m 0444 "$source" "$payload_stage/$(basename "$source")"
          done
          tar -C "$payload_stage" -czf "$payload_archive" .
          payload_digest="$(sha256sum "$payload_archive" | cut -d' ' -f1)"
          cat "$payload_archive" | ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/payload.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- extract '$payload_digest' '$remote/payload.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$remote/read-live-production-components.mjs' --output '$remote/live.json' >/dev/null && \
             sudo jq -e --arg sha '$GITHUB_SHA' --arg digest '$WEB_ARTIFACT_DIGEST' \
               '.components.web.gitSha==\$sha and .components.web.artifactDigest==\$digest' '$remote/live.json' >/dev/null && \
             if [ '${{ needs.deploy_plan.outputs.ecs_required }}' = false ]; then \
               sudo jq -e --slurpfile before '$remote/runtime-identity.before.json' \
                 'def keep: {api:{gitSha:.api.gitSha,artifactDigest:.api.artifactDigest},runtimeWorker:{gitSha:.runtimeWorker.gitSha,artifactDigest:.runtimeWorker.artifactDigest},acs:{gitSha:.acs.gitSha,orchestratorArtifactDigest:.acs.orchestratorArtifactDigest,sandboxImageDigest:.acs.sandboxImageDigest}}; (.components|keep)==(\$before[0].components|keep)' \
                 '$remote/live.json' >/dev/null; \
             else \
               sudo jq -e --arg sha '$GITHUB_SHA' \
                 --arg digest '${{ needs.deploy-ecs.outputs.server_artifact_digest }}' \
                 '.components.api.gitSha==\$sha and .components.api.artifactDigest==\$digest and
                  .components.runtimeWorker.gitSha==\$sha and .components.runtimeWorker.artifactDigest==\$digest' \
                 '$remote/live.json' >/dev/null; \
             fi && \
             sudo node '$remote/write-live-production-identity.mjs' --input '$remote/live.json' >/dev/null && \
             sudo node '$remote/read-production-state.mjs' --output '$remote/confirmed.json' >/dev/null && \
             sudo jq -e --slurpfile live '$remote/live.json' \
               'def matrix: {web:{gitSha:.web.gitSha,artifactDigest:.web.artifactDigest},api:{gitSha:.api.gitSha,artifactDigest:.api.artifactDigest},runtimeWorker:{gitSha:.runtimeWorker.gitSha,artifactDigest:.runtimeWorker.artifactDigest},acs:{gitSha:.acs.gitSha,orchestratorArtifactDigest:.acs.orchestratorArtifactDigest,sandboxImageDigest:.acs.sandboxImageDigest}}; (.components|matrix)==(\$live[0].components|matrix)' \
               '$remote/confirmed.json' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          echo "Production identity committed once after Web/API/Worker/ACS live readback"
      - name: Restore previous recovery Web on failure
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          if [ ! -s "$RUNNER_TEMP/recovery-web-target.before" ]; then
            echo "recovery Web baseline was not captured and no recovery mutation started"
            exit 0
          fi
          printf -v recovery_web_before_q '%q' "$(cat "$RUNNER_TEMP/recovery-web-target.before")"
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo env RECOVERY_WEB_ROOT='$RECOVERY_WEB_ROOT' \
             RECOVERY_WEB_BEFORE_TARGET=$recovery_web_before_q \
             RUN_ID='${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}' bash -s" \
            < scripts/rollback-recovery-web.sh

      - name: Restore all previous mutable Web keys under continuously verified Production lock ownership
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          restore_web() {
          set -euo pipefail
          if ! command -v ossutil >/dev/null 2>&1; then
            echo "ossutil unavailable; no Web upload could have completed"
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/web-entry-snapshot-complete" ]; then
            echo "Web key snapshot did not complete; production Web mutation never started"
            exit 0
          fi
          while IFS=$'\t' read -r state key; do
            case "$state" in
              present)
                ossutil cp "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                  "oss://$OSS_BUCKET/$key" -f --region "$OSS_REGION" --copy-props default
                ;;
              missing)
                ossutil rm "oss://$OSS_BUCKET/$key" -f --region "$OSS_REGION" || true
                ;;
              *) echo "invalid Web snapshot state for $key: $state" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/web-mutable-before.tsv"
          echo "all previous mutable Web keys restored after failed deployment"
          }
          export -f restore_web
          PRODUCTION_LOCK_SSH_KEY=~/.ssh/ecs_recovery_key \
            bash scripts/release/run-with-production-lock-guard.sh bash -c restore_web

      - name: Restore trusted Production identity on failure
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          if [ ! -s "$RUNNER_TEMP/runtime-identity.before.json" ]; then
            echo "trusted identity was not snapshotted and was never mutated"
            exit 0
          fi
          remote="$PRODUCTION_STAGING_ROOT/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          payload_stage="$RUNNER_TEMP/production-identity-restore"
          payload_archive="$RUNNER_TEMP/production-identity-restore.tgz"
          rm -rf "$payload_stage"
          mkdir -p "$payload_stage"
          install -m 0444 "$RUNNER_TEMP/runtime-identity.before.json" \
            "$payload_stage/runtime-identity.before.json"
          tar -C "$payload_stage" -czf "$payload_archive" .
          payload_digest="$(sha256sum "$payload_archive" | cut -d' ' -f1)"
          cat "$payload_archive" | ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/payload.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- extract '$payload_digest' '$remote/payload.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo install -m 0444 '$remote/runtime-identity.before.json' \
               /etc/agent-saas/runtime-identity.json.candidate && \
             sudo mv /etc/agent-saas/runtime-identity.json.candidate /etc/agent-saas/runtime-identity.json && \
             sudo cmp '$remote/runtime-identity.before.json' /etc/agent-saas/runtime-identity.json"

      - name: Prove previous Web and trusted identity after compensation
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          if [ ! -f "$RUNNER_TEMP/web-entry-snapshot-complete" ]; then
            echo "Web transaction failed before mutation; no compensation proof required"
            exit 0
          fi
          remote="$PRODUCTION_STAGING_ROOT/production-rollback-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo grep -Ex 'state=(rolled_back|not_started)' \
             '$RECOVERY_WEB_ROOT/transactions/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.activation' >/dev/null"
          proof_payload=(
            scripts/release/artifact-lib.mjs
            scripts/release/read-production-state.mjs
            scripts/release/read-runtime-identity.mjs
          )
          payload_stage="$RUNNER_TEMP/production-proof-payload"
          payload_archive="$RUNNER_TEMP/production-proof-payload.tgz"
          rm -rf "$payload_stage"
          mkdir -p "$payload_stage"
          for source in "${proof_payload[@]}"; do
            install -m 0444 "$source" "$payload_stage/$(basename "$source")"
          done
          tar -C "$payload_stage" -czf "$payload_archive" .
          payload_digest="$(sha256sum "$payload_archive" | cut -d' ' -f1)"
          cat "$payload_archive" | ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/payload.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- extract '$payload_digest' '$remote/payload.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$remote/read-production-state.mjs' --output '$remote/restored.json' >/dev/null && \
             sudo cat '$remote/restored.json'" \
            > "$RUNNER_TEMP/production-state.restored.json"
          jq -e --slurpfile before "$RUNNER_TEMP/runtime-identity.before.json" \
            '.components == $before[0].components' \
            "$RUNNER_TEMP/production-state.restored.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/web-before" "$RUNNER_TEMP/web-oss-restored" "$RUNNER_TEMP/web-recovery-restored"
          ECS_IP=$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')
          : "${ECS_IP:?Cannot resolve ECS_HOST to IPv4}"
          # Compare serving metadata while excluding mutation timestamps and transaction paths.
          normalize_oss_metadata() {
            grep -Ei '^[[:space:]]*(ACL|Cache-?Control|Content-?(Disposition|Encoding|Language|Length|MD5|Type)|ETag|Expires|Metadata|Storage-?Class|X-Oss-(Meta-|Object-Acl|Storage-Class|Server-Side-Encryption))' "$1" \
              | sed -E 's/\r$//; s/^[[:space:]]+//; s/[[:space:]]*:[[:space:]]*/:/' \
              | LC_ALL=C sort
          }
          while IFS=$'\t' read -r state key; do
            before="$RUNNER_TEMP/web-before/$key"
            restored="$RUNNER_TEMP/web-oss-restored/$key"
            recovery="$RUNNER_TEMP/web-recovery-restored/$key"
            mkdir -p "$(dirname "$before")" "$(dirname "$restored")" "$(dirname "$recovery")"
            if [ "$state" = present ]; then
              ossutil cp \
                "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                "$before" -f --region "$OSS_REGION"
              ossutil cp "oss://$OSS_BUCKET/$key" "$restored" -f --region "$OSS_REGION"
              cmp "$before" "$restored"
              restored_stat="$RUNNER_TEMP/web-restored-stat/$key"
              restored_metadata="$RUNNER_TEMP/web-restored-metadata/$key"
              mkdir -p "$(dirname "$restored_stat")" "$(dirname "$restored_metadata")"
              ossutil stat "oss://$OSS_BUCKET/$key" --region "$OSS_REGION" > "$restored_stat"
              normalize_oss_metadata "$restored_stat" > "$restored_metadata"
              cmp "$RUNNER_TEMP/web-before-metadata/$key" "$restored_metadata"
              http_code="$(curl -sS --resolve "agent.kaiyan.net:443:$ECS_IP" \
                -H 'cache-control: no-cache' -o "$recovery" -w '%{http_code}' \
                "https://agent.kaiyan.net/$key?rollback_probe=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || true)"
              test "$http_code" = 200
              cmp "$before" "$recovery"
            elif [ "$state" = missing ]; then
              stat_log="$RUNNER_TEMP/web-restored-stat.log"
              if ossutil stat "oss://$OSS_BUCKET/$key" --region "$OSS_REGION" \
                > "$stat_log" 2>&1; then
                echo "Web key introduced by failed transaction remains after compensation: $key" >&2
                exit 1
              fi
              grep -Eiq 'ErrorCode[=: ]+NoSuchKey([[:space:],}]|$)' "$stat_log"
              http_code="$(curl -sS --resolve "agent.kaiyan.net:443:$ECS_IP" \
                -H 'cache-control: no-cache' -o "$recovery" -w '%{http_code}' \
                "https://agent.kaiyan.net/$key?rollback_probe=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || true)"
              test "$http_code" = 404
            else
              echo "invalid Web snapshot state for $key: $state" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/web-mutable-before.tsv"
          jq -e --slurpfile before "$RUNNER_TEMP/web-before/release-identity.json" \
            '.releaseSha == $before[0].releaseSha and .webDigest == $before[0].webDigest' \
            "$RUNNER_TEMP/web-recovery-restored/release-identity.json" >/dev/null
          echo "all previous OSS/recovery Web mutable keys and trusted Production identity authoritatively restored"

      - name: Release and clean up production host lock after commit or compensation
        if: always()
        run: |
          set -euo pipefail
          lock_log="/tmp/production-lock-$PRODUCTION_LOCK_TOKEN.log"
          release_status=0
          if ! ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo bash '$PRODUCTION_LOCK_SCRIPT' release '$PRODUCTION_LOCK_TOKEN'"; then
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" "cat '$lock_log'" >&2 || true
            release_status=1
          fi
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -f '$PRODUCTION_LOCK_SCRIPT'; \
             sudo rm -rf -- \
               '$PRODUCTION_STAGING_ROOT/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' \
               '$PRODUCTION_STAGING_ROOT/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web' \
               '$PRODUCTION_STAGING_ROOT/production-rollback-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; \
             rm -f '$lock_log'" || release_status=1
          exit "$release_status"

      - name: Fail compatibility transaction after compensated identity error
        if: steps.commit_trusted_identity.outcome == 'failure'
        run: |
          echo "trusted Production identity commit/readback failed; locked compensation completed" >&2
          exit 1
