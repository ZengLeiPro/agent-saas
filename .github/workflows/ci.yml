# ============================================================================
# Unified CI: parallel App + ACS checks; legacy manual compatibility publishing remains Web-only
# ============================================================================
# 触发:
#   - pull_request: affected 门禁——只跑受影响工作区、import 图与源码资源 guard 合并选择测试、不收集覆盖率
#   - push to main: 全量分片测试 + 覆盖率合并（合并后的权威门禁，不部署生产）
#   - workflow_dispatch: 仅保留 Web-only 人工兼容发布。若生产 active ECS SHA→目标 SHA
#     存在任何 ECS 相关差异（或无法证明无差异），部署计划在生产 mutation 前 fail closed；
#     Server/API/Runtime Worker 必须走 RC + Production Promotion，禁止跨 job 非原子发布。
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_only_compatibility:
        description: 'Confirm Web-only compatibility publish; Server/API/Worker changes require RC Promotion'
        required: true
        type: boolean
        default: false

# 手动生产发布共用生产写锁且不可取消。PR 淘汰旧检查；每个 main run 独立完成，
# 已被 Staging 精确引用的 SHA 不会被后续 main push 取消。
concurrency:
  # run_attempt 不参与分组；PR 按编号，main 按 run_id 保留每个精确提交的门禁。
  group: ${{ github.event_name == 'workflow_dispatch' && 'production-runtime' || format('agent-saas-{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.23.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 门禁计划：PR 只跑受影响工作区 + affected 测试、不收集覆盖率；
  #    push main / dispatch 全量分片 + 覆盖率。PR 选择子集，main 保留权威全量验证。
  ci_plan:
    name: 预检 / 规划
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      acs_required: ${{ steps.acs.outputs.required }}
      mode: ${{ steps.plan.outputs.mode }}
      coverage: ${{ steps.plan.outputs.coverage }}
      postgres: ${{ steps.plan.outputs.postgres }}
      web_production: ${{ steps.plan.outputs.web_production }}
      mobile: ${{ steps.plan.outputs.mobile }}
      release_packages: ${{ steps.plan.outputs.release_packages }}
      browser_smoke: ${{ steps.plan.outputs.browser_smoke }}
      changed_base: ${{ steps.plan.outputs.changed_base }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 校验长期 Workflow 入口清单
        run: node scripts/release/workflow-inventory.mjs

      - name: 校验 PR 变更与发布组件的映射
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/release/classify-components.mjs \
            --baseline "$RELEASE_BASE_SHA" --target "$RELEASE_TARGET_SHA"

      - name: 规划受影响门禁与测试分片
        id: plan
        run: >-
          node scripts/ci-plan.mjs
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: 规划 ACS 专项检查
        id: acs
        run: >-
          node scripts/ci-acs-plan.mjs
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  # Stable required check; an intentional PR no-op succeeds, but a failed plan never does.
  acs-impact-gate:
    name: ACS Impact Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: ci_plan
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: 校验 ACS 执行计划
        env:
          CI_PLAN_RESULT: ${{ needs.ci_plan.result }}
          ACS_REQUIRED: ${{ needs.ci_plan.outputs.acs_required }}
        run: |
          set -euo pipefail
          case "$CI_PLAN_RESULT:$ACS_REQUIRED" in
            success:true|success:false) ;;
            *) echo '::error::ACS CI plan is missing or unsuccessful'; exit 1 ;;
          esac
          if [ "$ACS_REQUIRED" = false ]; then
            echo 'ACS Impact Gate: not_required (verified PR plan)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 检出代码
        id: acs_checkout
        if: needs.ci_plan.outputs.acs_required == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 pnpm
        if: needs.ci_plan.outputs.acs_required == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        if: needs.ci_plan.outputs.acs_required == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        id: acs_install
        if: needs.ci_plan.outputs.acs_required == 'true'
        run: pnpm install --frozen-lockfile

      - name: 记录实际受测源码与工具链
        if: needs.ci_plan.outputs.acs_required == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acs-ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/acs-ci-evidence/source-sha.txt"
          node --version > "$RUNNER_TEMP/acs-ci-evidence/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/acs-ci-evidence/toolchain.txt"
          python3 --version >> "$RUNNER_TEMP/acs-ci-evidence/toolchain.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/acs-ci-evidence/lockfile-sha256.txt"
          find acs-orchestrator/src/remote -maxdepth 1 -name '*.py' -type f -print0 |
            sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/acs-ci-evidence/native-source-sha256.txt"
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          writeFileSync(`${e.RUNNER_TEMP}/acs-ci-evidence/run.json`, JSON.stringify({
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            prHeadSha: e.PR_HEAD_SHA || null,
            event: e.GITHUB_EVENT_NAME, runId: e.GITHUB_RUN_ID, attempt: e.GITHUB_RUN_ATTEMPT,
            productionActions: false,
          }, null, 2));
          NODE

      - name: 检查服务端与编排器类型
        if: needs.ci_plan.outputs.acs_required == 'true'
        run: |
          set -euo pipefail
          (pnpm -F server typecheck && pnpm -F acs-orchestrator typecheck) 2>&1 |
            tee "$RUNNER_TEMP/acs-ci-evidence/typecheck.log"

      - name: 测试编排器
        if: needs.ci_plan.outputs.acs_required == 'true'
        run: |
          set -euo pipefail
          pnpm -F acs-orchestrator test --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/acs-ci-evidence/orchestrator-tests.json" 2>&1 |
            tee "$RUNNER_TEMP/acs-ci-evidence/orchestrator-tests.log"

      # Native Python processes are not run by Vitest. Preserve this gate explicitly.
      - name: 测试真实 Python 远程进程契约
        if: ${{ !cancelled() && needs.ci_plan.outputs.acs_required == 'true' && steps.acs_checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acs-ci-evidence"
          timeout 120s python3 -B -m unittest discover -s acs-orchestrator/src/remote -p 'test_*.py' -v 2>&1 |
            tee "$RUNNER_TEMP/acs-ci-evidence/native-processes.log"

      - name: 验证编排器生产构建并记录摘要
        if: ${{ !cancelled() && needs.ci_plan.outputs.acs_required == 'true' && steps.acs_install.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acs-ci-evidence"
          pnpm -F acs-orchestrator build 2>&1 | tee "$RUNNER_TEMP/acs-ci-evidence/bundle.log"
          find acs-orchestrator/dist -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/acs-ci-evidence/bundle-sha256.txt"

      - name: 测试服务端 ACS 生命周期与准入契约
        if: needs.ci_plan.outputs.acs_required == 'true'
        run: >-
          pnpm -F server exec vitest run
          src/__tests__/acsDeployWorkflowContract.test.ts
          src/__tests__/dwsAuthFlow.test.ts
          src/__tests__/dwsKeepalive.test.ts
          src/__tests__/dwsPersonalEventGateway.test.ts
          src/__tests__/dwsPersonalMessageSender.test.ts
          src/__tests__/executionDispatchValidation.test.ts
          src/__tests__/feishuConnector.test.ts
          src/__tests__/runtimeHandProvisionRace.test.ts
          src/__tests__/runtimeTombstoneAdmission.test.ts
          src/__tests__/runtimeWakeSessionRestore.test.ts
          src/__tests__/sandboxLifecycleService.test.ts
          src/__tests__/sandboxRunAdmissionFence.test.ts
          src/__tests__/sandboxWorkloadDescriptor.test.ts
          src/__tests__/sandboxWarmup.test.ts
          src/__tests__/serverRemoteConfig.test.ts
          src/__tests__/sessionCatalog.test.ts
          src/__tests__/taskboardExecution.test.ts
          src/__tests__/webChannelPersistentInteractionRecovery.test.ts
          src/context/sync/dwsContextRuntime.test.ts
          src/dws/businessToolProvider.test.ts
          src/dws/requesterIdentityResolver.test.ts

      - name: 测试 ACS 测试及生产环境生命周期门禁
        if: needs.ci_plan.outputs.acs_required == 'true'
        run: >-
          node --test
          scripts/release/staging-workflow.test.mjs
          scripts/release/promotion-workflow.test.mjs

      - name: 测试 ACS 运维脚本
        if: needs.ci_plan.outputs.acs_required == 'true'
        run: >-
          python3 -m unittest
          scripts/test_acs_operational_scripts.py
          scripts/test_acr_webhook_redelivery.py

      - name: 无论成功失败均保存 ACS 检查证据
        if: ${{ always() && needs.ci_plan.outputs.acs_required == 'true' && steps.acs_checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: acs-ci-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acs-ci-evidence/
          if-no-files-found: error
          retention-days: 14

  preflight_checks:
    name: 预检 / 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 仓库 ratchet 与 Release 契约必须访问真实 Git 基线。
          fetch-depth: 0

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行静态检查
        run: bash scripts/pr-preflight-task.sh checks

  migration_reviews:
    name: 预检 / 历史迁移审核
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 校验已审核的生产迁移基线
        run: node scripts/release/check-reviewed-migrations.mjs

  # 每个分片是独立 Runner：server 4 片、web 2 片、shared 1 片。
  # 覆盖率以 blob 形式上传，由独立 coverage_reports job 用 vitest --merge-reports 合并。
  tests:
    name: 预检 / 测试（${{ matrix.workspace }} ${{ matrix.shard }}/${{ matrix.total }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ci_plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci_plan.outputs.test_matrix) }}

    # 只有 Server 测试包含 PostgreSQL 用例；空 image 会让 GitHub Actions 跳过该服务，
    # 避免 Web/Shared 为未使用的数据库多付容器初始化时间。
    services:
      postgres:
        image: ${{ matrix.workspace == 'server' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: 检出代码
        if: matrix.workspace != 'none'
        uses: actions/checkout@v5
        with:
          # affected 模式的 vitest --changed=<base> 需要 PR base commit 在本地历史里。
          fetch-depth: 0

      - name: 配置 pnpm
        if: matrix.workspace != 'none'
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        if: matrix.workspace != 'none'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        if: matrix.workspace != 'none'
        run: pnpm install --frozen-lockfile

      - name: 运行 ${{ matrix.workspace }} 测试（${{ matrix.mode }}，分片 ${{ matrix.shard }}/${{ matrix.total }}）
        if: matrix.workspace != 'none'
        env:
          COVERAGE_REPORT_MODE: ci
          TEST_DATABASE_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
          MEMORY_CONSOLIDATION_TEST_PG_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
        run: >-
          bash scripts/pr-preflight-task.sh test
          "${{ matrix.workspace }}" "${{ matrix.shard }}" "${{ matrix.total }}"
          "${{ matrix.mode }}" "${{ needs.ci_plan.outputs.changed_base || '-' }}"
          "${{ needs.ci_plan.outputs.coverage }}"

      # 跨 Runner 合并覆盖率所需的 blob；中间 artifact 仅保留一天。
      - name: 上传 ${{ matrix.workspace }} 覆盖率数据块
        if: always() && matrix.workspace != 'none' && needs.ci_plan.outputs.coverage == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-${{ matrix.workspace }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.workspace }}/coverage-blobs/
          if-no-files-found: warn
          retention-days: 1

  postgres_contracts:
    name: 预检 / PostgreSQL 契约
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ci_plan
    if: needs.ci_plan.outputs.postgres == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 PostgreSQL 契约检查
        env:
          TEST_DATABASE_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
          MEMORY_CONSOLIDATION_TEST_PG_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
        run: bash scripts/pr-preflight-task.sh postgres

  web_production:
    name: 预检 / Web 生产构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ci_plan
    if: needs.ci_plan.outputs.web_production == 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 Web 生产检查
        run: bash scripts/pr-preflight-task.sh web

  # Metro 导出 iOS+Android bundle 是 Mobile 门禁里最慢的一步，独立成 job 与契约测试并行。
  mobile_router_export:
    name: 预检 / 移动端路由导出
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ci_plan
    if: needs.ci_plan.outputs.mobile == 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 导出真实 iOS 与 Android 路由包
        run: pnpm -F mobile check:router-export

  mobile_contract:
    name: 预检 / 移动端与原生发布契约
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ci_plan
    if: needs.ci_plan.outputs.mobile == 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js 22.23.1 与工作区缓存
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 按锁文件安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 检查共享模块与移动端类型
        run: pnpm -F @agent/shared typecheck && pnpm -F mobile typecheck

      - name: 检查原生 Maestro 流程与 M70 发布计划
        run: pnpm -F mobile lint:maestro && pnpm -F mobile lint:m70-01 && pnpm -F mobile lint:m70-02

      - name: 运行 M60-03 清洁预构建策略门禁
        env:
          M60_03_ARTIFACT_DIR: .ci-artifacts/native-policy
        run: pnpm -F mobile test:m60-03:prebuild

      - name: 上传有界且规范化的 M60-03 失败证据
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: m60-03-native-policy-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/native-policy/*.json
          if-no-files-found: warn
          retention-days: 1

      # 一次跑完 mobile vitest 与全部 M60/M70 node 契约测试；不再按里程碑重复执行子集。
      # Shared/Server 侧的 mobileTelemetry 契约由 Tests 分片覆盖。
      - name: 运行确定性移动端测试套件
        env:
          FORCE_COLOR: '0'
          NO_COLOR: '1'
        run: |
          set +e
          raw="$RUNNER_TEMP/mobile-contract.raw.log"
          sanitized="$RUNNER_TEMP/mobile-contract.sanitized.log"
          pnpm -F mobile test > "$raw" 2>&1
          status=$?
          set -e

          sed -E \
            -e "s#${GITHUB_WORKSPACE}#<workspace>#g" \
            -e "s#${HOME}#<home>#g" \
            -e 's#/(tmp|workspace|__w|github)/[^[:space:]]+#<path>#g' \
            -e 's/((authorization|token|secret|password)[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig' \
            -e 's/((bearer|gh[pousr]_)[[:space:]]*)[A-Za-z0-9._~+\/=:-]+/\1<redacted>/Ig' \
            "$raw" > "$sanitized"
          cat "$sanitized"

          if [ "$status" -ne 0 ]; then
            mkdir -p .ci-artifacts
            {
              echo "mobile-contract exit_code=$status"
              echo "last 300 sanitized lines:"
              tail -n 300 "$sanitized"
            } > .ci-artifacts/mobile-contract-failure.log
          fi
          rm -f "$raw" "$sanitized"
          exit "$status"

      - name: 离线校验 Expo 依赖契约
        run: EXPO_OFFLINE=1 pnpm -F mobile exec expo install --check

      - name: 上传有界且脱敏的失败日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-contract-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/mobile-contract-failure.log
          if-no-files-found: warn
          retention-days: 1

  release_packages:
    name: 预检 / 真实发布包
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ci_plan
    if: needs.ci_plan.outputs.release_packages == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MP_TEST_DATABASE_URL: postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test
      VITE_API_BASE: https://api.agent.kaiyan.net
      VITE_WEB_ORIGIN: https://agent.kaiyan.net
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建同一提交的不可变发布包
        run: node scripts/release/build-release.mjs --sha="$GITHUB_SHA" --out="$RUNNER_TEMP/release-packages" --prepare-acs
      - name: 从真实发布包验证入口与 API Worker
        run: node scripts/release/verify-release-packages.mjs --directory="$RUNNER_TEMP/release-packages" --sha="$GITHUB_SHA"
      - name: 保存可信 main 发布包
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 7

  writer_bundle:
    name: 预检 / Writer 真实入口
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: ci_plan
    if: needs.ci_plan.outputs.release_packages == 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 从 Writer bundle 验证两种入口及能力
        run: node scripts/release/verify-evidence-writer-bundle.mjs

  browser_smoke:
    name: 预检 / 浏览器应用壳
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: ci_plan
    if: needs.ci_plan.outputs.browser_smoke == 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行隔离应用壳协议烟测
        run: pnpm exec playwright test -c e2e/ky-app-shell.playwright.config.ts
      - name: 保存浏览器失败证据
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ky-app-shell*
          if-no-files-found: warn
          retention-days: 1

  # 保留仓库 Ruleset 使用的 required check 名称；Build & Check 汇总 App 与 ACS。任一并行门禁失败或取消，
  # 本汇总 Job 都会明确失败；计划跳过的门禁只在计划说明跳过时才被接受。
  coverage_reports:
    name: 覆盖率汇总
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [ci_plan, tests]
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.ci_plan.outputs.coverage == 'true' }}
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 下载失败不掩盖测试结果：测试本身由 tests 矩阵守门，blob 仅用于汇总覆盖率。
      - name: 下载覆盖率数据块
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-blob-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-blobs

      - name: 合并分片覆盖率
        id: merge
        continue-on-error: true
        env:
          COVERAGE_REPORT_MODE: ci
          CI_TEST_MATRIX: ${{ needs.ci_plan.outputs.test_matrix }}
        run: |
          set -euo pipefail
          node scripts/ci-coverage-blobs.mjs "$RUNNER_TEMP/coverage-blobs"
          for workspace in shared server web; do
            bash scripts/pr-preflight-task.sh coverage-merge "$workspace"
          done

      - name: 生成覆盖率摘要
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        continue-on-error: true
        run: pnpm coverage:summary

      - name: 上传覆盖率产物
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        # 仓库 artifact 配额长期紧张（2026-07-03 曾爆配额全线 CI 红）。上传失败不判红：
        # 覆盖率主消费路径是 Step Summary，artifact 只是补充。只传小体积 lcov + json-summary。
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server/coverage/lcov.info
            server/coverage/coverage-summary.json
            web/coverage/lcov.info
            web/coverage/coverage-summary.json
            shared/coverage/lcov.info
            shared/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: 记录覆盖率缺失
        if: ${{ !cancelled() && steps.merge.outcome != 'success' }}
        run: echo 'Coverage report unavailable; complete current-attempt shards could not be merged.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      [
        ci_plan,
        acs-impact-gate,
        preflight_checks,
        migration_reviews,
        tests,
        postgres_contracts,
        web_production,
        mobile_router_export,
        mobile_contract,
        release_packages,
        writer_bundle,
        browser_smoke,
      ]
    if: ${{ always() }}

    permissions:
      contents: read

    steps:
      - name: 校验并行预检结果
        if: always()
        env:
          ACS_IMPACT_GATE_RESULT: ${{ needs.acs-impact-gate.result }}
          CI_PLAN_RESULT: ${{ needs.ci_plan.result }}
          PREFLIGHT_CHECKS_RESULT: ${{ needs.preflight_checks.result }}
          MIGRATION_REVIEWS_RESULT: ${{ needs.migration_reviews.result }}
          RELEASE_PACKAGES_RESULT: ${{ needs.release_packages.result }}
          WRITER_BUNDLE_RESULT: ${{ needs.writer_bundle.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser_smoke.result }}
          PLAN_RELEASE_PACKAGES: ${{ needs.ci_plan.outputs.release_packages }}
          PLAN_BROWSER_SMOKE: ${{ needs.ci_plan.outputs.browser_smoke }}
          TESTS_RESULT: ${{ needs.tests.result }}
          POSTGRES_CONTRACTS_RESULT: ${{ needs.postgres_contracts.result }}
          WEB_PRODUCTION_RESULT: ${{ needs.web_production.result }}
          MOBILE_ROUTER_EXPORT_RESULT: ${{ needs.mobile_router_export.result }}
          MOBILE_CONTRACT_RESULT: ${{ needs.mobile_contract.result }}
          PLAN_POSTGRES: ${{ needs.ci_plan.outputs.postgres }}
          PLAN_WEB_PRODUCTION: ${{ needs.ci_plan.outputs.web_production }}
          PLAN_MOBILE: ${{ needs.ci_plan.outputs.mobile }}
        run: |
          set -euo pipefail
          failed=0
          # 格式 name=result=planned；planned=false 的门禁允许 skipped，其余必须 success。
          for gate in \
            "ci_plan=$CI_PLAN_RESULT=true" \
            "acs_impact_gate=$ACS_IMPACT_GATE_RESULT=true" \
            "preflight_checks=$PREFLIGHT_CHECKS_RESULT=true" \
            "migration_reviews=$MIGRATION_REVIEWS_RESULT=true" \
            "release_packages=$RELEASE_PACKAGES_RESULT=$PLAN_RELEASE_PACKAGES" \
            "writer_bundle=$WRITER_BUNDLE_RESULT=$PLAN_RELEASE_PACKAGES" \
            "browser_smoke=$BROWSER_SMOKE_RESULT=$PLAN_BROWSER_SMOKE" \
            "tests=$TESTS_RESULT=true" \
            "postgres_contracts=$POSTGRES_CONTRACTS_RESULT=$PLAN_POSTGRES" \
            "web_production=$WEB_PRODUCTION_RESULT=$PLAN_WEB_PRODUCTION" \
            "mobile_router_export=$MOBILE_ROUTER_EXPORT_RESULT=$PLAN_MOBILE" \
            "mobile_contract=$MOBILE_CONTRACT_RESULT=$PLAN_MOBILE"; do
            name="${gate%%=*}"
            rest="${gate#*=}"
            result="${rest%%=*}"
            planned="${rest#*=}"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [ "$planned" = "false" ]; then
              echo "$name skipped by CI plan"
              continue
            fi
            echo "::error title=Parallel preflight failed::$name concluded with $result (planned=$planned)"
            failed=1
          done
          exit "$failed"

  deploy_plan:
    name: 规划生产部署
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    outputs:
      ecs_required: ${{ steps.plan.outputs.ecs_required }}
      production_ecs_sha: ${{ steps.plan.outputs.production_ecs_sha }}

    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 必须覆盖生产 active SHA 到目标 SHA 的累计差异，不能只看最后一个 commit。
          fetch-depth: 0

      - name: 确认仅 Web 的兼容发布范围
        if: inputs.web_only_compatibility != true
        run: |
          {
            echo "### Compatibility deployment blocked"
            echo
            echo "- This legacy entrypoint is Web-only."
            echo "- Re-run with web_only_compatibility=true only for a Web-only target."
            echo "- Server/API/Runtime Worker changes must use RC + Production Promotion."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Compatibility scope::Explicit Web-only confirmation is required"
          exit 1

      - name: 配置 SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          scan_path="$RUNNER_TEMP/production-known-host"
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$scan_path"
          test -s "$scan_path"
          test "$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$scan_path" >> ~/.ssh/known_hosts

      - name: 判定 ECS 部署必要性
        id: plan
        run: |
          set -euo pipefail

          block_server_compatibility() {
            echo "ecs_required=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Compatibility deployment blocked"
              echo
              echo "- $1"
              echo "- This entrypoint cannot atomically compensate ECS + Web across jobs."
              echo "- Publish Server/API/Runtime Worker changes through RC + Production Promotion."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Web-only compatibility::$1"
            exit 1
          }

          production_ecs_sha="$(ssh -i ~/.ssh/ecs_deploy_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$ECS_USER@$ECS_HOST" '
              set -e
              marker=/etc/agent-saas/active-color
              root=/opt/agent-saas-app/color
              [ -f "$marker" ] || exit 0
              color=$(tr -d "[:space:]" < "$marker")
              case "$color" in blue|green) ;; *) exit 0 ;; esac
              release_env="/etc/agent-saas/server-$color.release.env"
              [ -f "$release_env" ] || exit 0
              sed -n "s/^AGENT_SAAS_RELEASE_SHA=//p" "$release_env" | head -n1
            ' 2>/dev/null || true)"

          printf '%s' "$production_ecs_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || block_server_compatibility "cannot prove the active ECS release SHA"
          git cat-file -e "$production_ecs_sha^{commit}" 2>/dev/null \
            || block_server_compatibility "production ECS commit $production_ecs_sha is outside checkout history"
          git merge-base --is-ancestor "$production_ecs_sha" "$GITHUB_SHA" \
            || block_server_compatibility "production ECS commit $production_ecs_sha is not an ancestor of target"

          echo "production_ecs_sha=$production_ecs_sha" >> "$GITHUB_OUTPUT"
          if [ "$production_ecs_sha" = "$GITHUB_SHA" ]; then
            echo "ecs_required=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ECS deploy necessity gate"
              echo
              echo "- **ECS skipped**: production already runs target \`${production_ecs_sha:0:8}\`"
              echo "- Web OSS may still publish or repair the same target independently"
              echo "- compatibility scope: Web-only; Server/API/Worker must use RC Promotion"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/ecs-prod-diff.txt"
          git diff --name-only "$production_ecs_sha" "$GITHUB_SHA" > "$changed_files"
          out="$RUNNER_TEMP/ecs-release-classification.out"
          bash .github/scripts/ecs-release-classify.sh "$changed_files" > "$out" \
            || block_server_compatibility "ECS release classification failed"
          cat "$out"

          required="$(sed -n 's/^required=//p' "$out")"
          reason="$(sed -n 's/^reason=//p' "$out")"
          skipped="$(sed -n 's/^skipped=//p' "$out")"
          case "$required" in true|false) ;; *) block_server_compatibility "classifier returned invalid required=$required" ;; esac
          echo "ecs_required=$required" >> "$GITHUB_OUTPUT"

          if [ "$required" = "true" ]; then
            block_server_compatibility "ECS changes are required since production ${production_ecs_sha:0:8}: $reason"
          else
            {
              echo "### Web-only compatibility gate"
              echo
              echo "- **ECS mutation prohibited**: only Web/Mobile/docs/test paths changed since production `${production_ecs_sha:0:8}`"
              echo "- non-ECS paths: $skipped"
              echo "- Web OSS may publish without rolling Web/API or Runtime Worker"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # dispatch-only 且仅允许 Web-only；deploy_plan 发现任何 ECS 相关差异即在 mutation 前阻断。
  # 上传顺序：先 hash 资源（immutable，只增不删，兼容在途会话的旧 chunk 懒加载）,
  # 后入口文件（no-cache），保证 index.html 引用的资源先就位。
  deploy-web-oss:
    name: 将 Web 部署到 OSS
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    # 只接受 deploy_plan 已证明无需 ECS。
    needs: [build, deploy_plan]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      needs.build.result == 'success' &&
      needs.deploy_plan.result == 'success' &&
      needs.deploy_plan.outputs.ecs_required == 'false'

    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_WEB_DEPLOY_AK_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_WEB_DEPLOY_AK_SECRET }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      RELEASE_RECORD_OSS_URI: oss://agent-saas-release-records
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      OSS_REGION: cn-shenzhen
      OSS_BUCKET: agent-saas-web
      VITE_API_BASE: https://api.agent.kaiyan.net
      VITE_WEB_ORIGIN: https://agent.kaiyan.net
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RECOVERY_WEB_ROOT: /opt/agent-saas-web-recovery
      # Runner payloads enter the dedicated Production root-only directory before digest verification.
      PRODUCTION_STAGING_ROOT: /run/agent-saas-production-staging
      WEB_TRANSACTION_PREFIX: _transactions/${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_LOCK_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-compat-web
      PRODUCTION_LOCK_UPLOAD: /tmp/production-lock-${{ github.run_id }}-${{ github.run_attempt }}.sh
      PRODUCTION_LOCK_SCRIPT: /run/agent-saas-locks/production-lock-${{ github.run_id }}-${{ github.run_attempt }}.sh

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端（分域模式）
        run: pnpm -F web build:oss

      - name: 打包并标识 Web 版本
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          tar -C web/dist -czf "$RUNNER_TEMP/web-assets.tgz" .
          node scripts/release/create-component-artifact-index.mjs \
            --sha "$GITHUB_SHA" --name webAssets --file "$RUNNER_TEMP/web-assets.tgz" \
            --output "$RUNNER_TEMP/web-artifact-index.json"
          web_digest="$(jq -r .artifacts.webAssets.digest "$RUNNER_TEMP/web-artifact-index.json")"
          release_id="rc-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          {
            echo "WEB_ARTIFACT_DIGEST=$web_digest"
            echo "COMPAT_RELEASE_ID=$release_id"
          } >> "$GITHUB_ENV"

      - name: 安装并校验 OSS 客户端
        run: |
          set -euo pipefail
          curl -sL https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -o -q /tmp/ossutil.zip -d /tmp
          sudo install /tmp/ossutil-2.1.2-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version | grep -F '2.1.2'
          ossutil cp --help > "$RUNNER_TEMP/ossutil-cp-help.txt"
          ossutil stat --help > "$RUNNER_TEMP/ossutil-stat-help.txt"
          grep -Eq -- '(^|[[:space:],])-f([[:space:],]|$)' "$RUNNER_TEMP/ossutil-cp-help.txt"
          grep -Eq -- '(^|[[:space:],])--region([=[:space:],]|$)' "$RUNNER_TEMP/ossutil-cp-help.txt"
          grep -Eq -- '(^|[[:space:],])--region([=[:space:],]|$)' "$RUNNER_TEMP/ossutil-stat-help.txt"
          node scripts/release/put-web-asset-create-only.mjs --self-check
          bash scripts/release/install-aliyun-cli.sh

      - name: 持久化不可变 Web 基线
        run: |
          set -euo pipefail
          : "${RELEASE_RECORD_OSS_URI:?Missing Release Record OSS URI}"
          destination="$RELEASE_RECORD_OSS_URI/baselines/web-${GITHUB_SHA}-${WEB_ARTIFACT_DIGEST#sha256:}"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/web-assets.tgz" "$destination/web-assets.tgz"
          bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/web-artifact-index.json" "$destination/artifact-index.json"

      - name: 写入 Web 发布身份
        run: |
          jq -n \
            --arg releaseId "$COMPAT_RELEASE_ID" \
            --arg releaseSha "$GITHUB_SHA" \
            --arg webDigest "$WEB_ARTIFACT_DIGEST" \
            --arg configFingerprint "$(jq -r .aggregateDigest "$RUNNER_TEMP/web-artifact-index.json")" \
            '{schemaVersion:1,environment:"production",releaseId:$releaseId,releaseSha:$releaseSha,webDigest:$webDigest,configFingerprint:$configFingerprint}' \
            > web/dist/release-identity.json

      - name: 配置恢复用 SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_recovery_key
          chmod 600 ~/.ssh/ecs_recovery_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          scan_path="$RUNNER_TEMP/production-known-host"
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$scan_path"
          test -s "$scan_path"
          test "$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$scan_path" >> ~/.ssh/known_hosts

      - name: 为完整 Web 事务获取生产主机锁
        run: |
          set -euo pipefail
          lock_log="/tmp/production-lock-$PRODUCTION_LOCK_TOKEN.log"
          scp -i ~/.ssh/ecs_recovery_key scripts/release/production-lock-lease.sh \
            "$ECS_USER@$ECS_HOST:$PRODUCTION_LOCK_UPLOAD"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo mkdir -p /run/agent-saas-locks; \
             sudo install -m 0500 '$PRODUCTION_LOCK_UPLOAD' '$PRODUCTION_LOCK_SCRIPT'; \
             rm -f '$PRODUCTION_LOCK_UPLOAD' '$lock_log'; \
             nohup sudo env PRODUCTION_LOCK_TIMEOUT_SECONDS=1800 \
               bash '$PRODUCTION_LOCK_SCRIPT' hold '$PRODUCTION_LOCK_TOKEN' \
               >'$lock_log' 2>&1 </dev/null &"
          for _ in $(seq 1 60); do
            if ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
                "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'" \
                >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" "cat '$lock_log'" >&2 || true
          exit 1

      - name: 在 Web 事务前快照可信生产身份
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo cat /etc/agent-saas/runtime-identity.json" \
            > "$RUNNER_TEMP/runtime-identity.before.json"
          jq -e '.schemaVersion == 1 and .environment == "production" and .components.web' \
            "$RUNNER_TEMP/runtime-identity.before.json" >/dev/null
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "set -e; \
             target=\$(readlink -f '$RECOVERY_WEB_ROOT/current'); \
             case \"\$target\" in '$RECOVERY_WEB_ROOT'/releases/*) ;; \
               *) echo 'recovery Web current target is not an immutable release' >&2; exit 1 ;; \
             esac; \
             for f in manifest.webmanifest release-identity.json index.html sw.js; do \
               test -s \"\$target/\$f\" || { echo \"recovery Web before target is missing \$f\" >&2; exit 1; }; \
             done; \
             jq -e '.schemaVersion == 1 and .environment == \"production\" and .releaseId and .releaseSha and .webDigest' \
               \"\$target/release-identity.json\" >/dev/null; \
             printf '%s\\n' \"\$target\"" \
            > "$RUNNER_TEMP/recovery-web-target.before"

      - name: 在持续校验生产锁所有权下快照所有可变 Web 对象
        run: |
          set -euo pipefail
          snapshot_web() {
          set -euo pipefail
          keys="$RUNNER_TEMP/web-mutable-keys.txt"
          states="$RUNNER_TEMP/web-mutable-before.tsv"
          (
            cd web/dist
            for f in manifest.webmanifest release-identity.json index.html sw.js \
              apple-touch-icon.png favicon-16x16.png favicon-32x32.png favicon.ico \
              kaikai-avatar.png workbox-*.js; do
              [ -f "$f" ] && printf '%s\n' "$f"
            done
            for d in icons kaikai-presets; do
              [ -d "$d" ] && find "$d" -type f -print
            done
          ) | LC_ALL=C sort -u > "$keys"
          test -s "$keys"
          ECS_IP=$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')
          : "${ECS_IP:?Cannot resolve ECS_HOST to IPv4}"
          # Compare serving metadata while excluding mutation timestamps and transaction paths.
          normalize_oss_metadata() {
            grep -Ei '^[[:space:]]*(ACL|Cache-?Control|Content-?(Disposition|Encoding|Language|Length|MD5|Type)|ETag|Expires|Metadata|Storage-?Class|X-Oss-(Meta-|Object-Acl|Storage-Class|Server-Side-Encryption))' "$1" \
              | sed -E 's/\r$//; s/^[[:space:]]+//; s/[[:space:]]*:[[:space:]]*/:/' \
              | LC_ALL=C sort
          }
          : > "$states"
          while IFS= read -r key; do
            printf '%s' "$key" | grep -Eq '^[A-Za-z0-9._/-]+$'
            stat_log="$RUNNER_TEMP/web-mutable-stat.log"
            if ossutil stat "oss://$OSS_BUCKET/$key" --region "$OSS_REGION" \
              > "$stat_log" 2>&1; then
              state=present
            elif grep -Eiq 'ErrorCode[=: ]+NoSuchKey([[:space:],}]|$)' "$stat_log"; then
              state=missing
            else
              cat "$stat_log" >&2
              exit 1
            fi
            case "$key:$state" in
              manifest.webmanifest:missing|release-identity.json:missing|index.html:missing|sw.js:missing)
                echo "required Production Web key is missing before transaction: $key" >&2
                exit 1
                ;;
            esac
            before="$RUNNER_TEMP/web-before/$key"
            recovery="$RUNNER_TEMP/web-recovery-before/$key"
            mkdir -p "$(dirname "$before")" "$(dirname "$recovery")"
            http_code="$(curl -sS --resolve "agent.kaiyan.net:443:$ECS_IP" \
              -H 'cache-control: no-cache' -o "$recovery" -w '%{http_code}' \
              "https://agent.kaiyan.net/$key?before_probe=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || true)"
            if [ "$state" = present ]; then
              ossutil cp "oss://$OSS_BUCKET/$key" \
                "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" -f \
                --region "$OSS_REGION" --copy-props default
              ossutil cp "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                "$before" -f --region "$OSS_REGION"
              before_metadata="$RUNNER_TEMP/web-before-metadata/$key"
              backup_stat="$RUNNER_TEMP/web-backup-stat/$key"
              backup_metadata="$RUNNER_TEMP/web-backup-metadata/$key"
              mkdir -p "$(dirname "$before_metadata")" "$(dirname "$backup_stat")" \
                "$(dirname "$backup_metadata")"
              normalize_oss_metadata "$stat_log" > "$before_metadata"
              test -s "$before_metadata"
              ossutil stat \
                "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                --region "$OSS_REGION" > "$backup_stat"
              normalize_oss_metadata "$backup_stat" > "$backup_metadata"
              cmp "$before_metadata" "$backup_metadata"
              test "$http_code" = 200
              cmp "$before" "$recovery"
            else
              test "$http_code" = 404
            fi
            printf '%s\t%s\n' "$state" "$key" >> "$states"
          done < "$keys"
          ossutil cp "$states" \
            "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/mutable-keys.tsv" -f \
            --region "$OSS_REGION" --cache-control "no-store" \
            --content-type "text/tab-separated-values; charset=utf-8"
          touch "$RUNNER_TEMP/web-entry-snapshot-complete"
          }
          export -f snapshot_web
          PRODUCTION_LOCK_SSH_KEY=~/.ssh/ecs_recovery_key \
            bash scripts/release/run-with-production-lock-guard.sh bash -c snapshot_web

      - name: 在持续校验生产锁所有权下上传到 OSS
        run: |
          set -euo pipefail
          upload_web() {
            set -euo pipefail
            : "${OSS_ACCESS_KEY_ID:?Missing secret OSS_WEB_DEPLOY_AK_ID}"
            : "${OSS_ACCESS_KEY_SECRET:?Missing secret OSS_WEB_DEPLOY_AK_SECRET}"
            credentials="$RUNNER_TEMP/web-oss-sdk-credentials.json"
            umask 077
            jq -n --arg accessKeyId "$OSS_ACCESS_KEY_ID" \
              --arg accessKeySecret "$OSS_ACCESS_KEY_SECRET" \
              '{accessKeyId:$accessKeyId,accessKeySecret:$accessKeySecret}' > "$credentials"
            cd web/dist
            # 1) hash 静态资源：最终字节只允许创建或复用，禁止覆盖既有对象键。
            bash ../../scripts/release/upload-web-assets-immutable.sh \
              assets "oss://$OSS_BUCKET/assets" "$credentials" "" "https://agent.kaiyan.net"
            # 2) 图标与预置资源：短缓存
            for d in icons kaikai-presets; do
              [ -d "$d" ] && ossutil cp "$d" "oss://$OSS_BUCKET/$d" -r -f --region "$OSS_REGION" \
                --cache-control "public, max-age=86400"
            done
            for f in apple-touch-icon.png favicon-16x16.png favicon-32x32.png favicon.ico kaikai-avatar.png; do
              [ -f "$f" ] && ossutil cp "$f" "oss://$OSS_BUCKET/$f" -f --region "$OSS_REGION" \
                --cache-control "public, max-age=86400"
            done
            # 3) SW 依赖先覆盖；manifest 显式修正 MIME
            for f in workbox-*.js; do
              ossutil cp "$f" "oss://$OSS_BUCKET/$f" -f --region "$OSS_REGION" \
                --cache-control "no-cache" --content-type "text/javascript"
            done
            ossutil cp manifest.webmanifest "oss://$OSS_BUCKET/manifest.webmanifest" -f \
              --region "$OSS_REGION" --cache-control "no-cache" \
              --content-type "application/manifest+json"
            # 4) 发布身份与 HTML 切入口；sw.js 必须最后上传，避免引用尚未就位的 Workbox 文件
            ossutil cp release-identity.json "oss://$OSS_BUCKET/release-identity.json" -f \
              --region "$OSS_REGION" --cache-control "no-cache" \
              --content-type "application/json; charset=utf-8"
            ossutil cp index.html "oss://$OSS_BUCKET/index.html" -f --region "$OSS_REGION" \
              --cache-control "no-cache" --content-type "text/html; charset=utf-8"
            ossutil cp sw.js "oss://$OSS_BUCKET/sw.js" -f --region "$OSS_REGION" \
              --cache-control "no-cache" --content-type "text/javascript"
            echo "web dist uploaded to oss://$OSS_BUCKET"
          }
          export -f upload_web
          PRODUCTION_LOCK_SSH_KEY=~/.ssh/ecs_recovery_key \
            bash scripts/release/run-with-production-lock-guard.sh bash -c upload_web

      - name: 在生产锁下校验在线 Web/API 分域契约
        run: |
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          node web/scripts/check-live-oss.mjs
          node web/scripts/check-live-compression.mjs
          curl -fsS --retry 10 -H 'cache-control: no-cache' \
            "https://agent.kaiyan.net/release-identity.json?release=$COMPAT_RELEASE_ID" \
            | jq -e --arg digest "$WEB_ARTIFACT_DIGEST" '.environment=="production" and .webDigest==$digest'

      - name: 打包恢复用 Web 版本
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/agent-saas-recovery-web-${GITHUB_SHA}.tgz"
          tar -C web/dist -czf "$archive" .
          echo "RECOVERY_WEB_ARCHIVE_SHA256=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 在仅 root 可访问的暂存区封存恢复用 Web 版本
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/agent-saas-recovery-web-${GITHUB_SHA}.tgz"
          remote="$PRODUCTION_STAGING_ROOT/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          cat "$archive" | ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/recovery-web.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- verify '$RECOVERY_WEB_ARCHIVE_SHA256' \
             '$remote/recovery-web.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          trap - EXIT

      - name: 启用恢复用 Web 版本
        run: |
          set -euo pipefail
          remote="$PRODUCTION_STAGING_ROOT/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          printf -v recovery_web_before_q '%q' "$(cat "$RUNNER_TEMP/recovery-web-target.before")"
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo env RECOVERY_WEB_ROOT='$RECOVERY_WEB_ROOT' \
             RECOVERY_WEB_BEFORE_TARGET=$recovery_web_before_q \
             RELEASE_ID='$GITHUB_SHA' RUN_ID='${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}' \
             ARCHIVE='$remote/recovery-web.tgz' bash -s" \
            < scripts/deploy-recovery-web.sh
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"

      - name: 校验恢复用 Web 端点
        run: |
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          ECS_IP=$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')
          : "${ECS_IP:?Cannot resolve ECS_HOST to IPv4}"
          curl -fsS \
            --resolve "agent.kaiyan.net:443:$ECS_IP" \
            -D "$RUNNER_TEMP/recovery-web.headers" \
            -o "$RUNNER_TEMP/recovery-web.index.html" \
            "https://agent.kaiyan.net/?recovery_probe=${GITHUB_SHA}"
          grep -Eqi '^x-agent-saas-recovery:[[:space:]]*true' "$RUNNER_TEMP/recovery-web.headers"
          cmp web/dist/index.html "$RUNNER_TEMP/recovery-web.index.html"
          echo "recovery Web endpoint matches current OSS build"

      - name: 快照成功的 Web 版本
        run: |
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          while IFS=$'\t' read -r _state key; do
            ossutil cp "oss://$OSS_BUCKET/$key" \
              "oss://$OSS_BUCKET/_releases/$GITHUB_SHA/current/$key" -f \
              --region "$OSS_REGION" --copy-props default
          done < "$RUNNER_TEMP/web-mutable-before.tsv"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"

      - name: 所有兼容目标收敛后提交可信生产身份
        id: commit_trusted_identity
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          remote="$PRODUCTION_STAGING_ROOT/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo grep -Fx 'state=activated' \
             '$RECOVERY_WEB_ROOT/transactions/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.activation' >/dev/null"
          identity_payload=(
            scripts/release/artifact-lib.mjs
            scripts/release/read-live-production-components.mjs
            scripts/release/read-production-state.mjs
            scripts/release/read-runtime-identity.mjs
            scripts/release/config-publication.mjs
            scripts/release/verify-installed-release.mjs
            scripts/release/write-live-production-identity.mjs
            "$RUNNER_TEMP/runtime-identity.before.json"
          )
          payload_stage="$RUNNER_TEMP/production-identity-payload"
          payload_archive="$RUNNER_TEMP/production-identity-payload.tgz"
          rm -rf "$payload_stage"
          mkdir -p "$payload_stage"
          for source in "${identity_payload[@]}"; do
            install -m 0444 "$source" "$payload_stage/$(basename "$source")"
          done
          tar -C "$payload_stage" -czf "$payload_archive" .
          payload_digest="$(sha256sum "$payload_archive" | cut -d' ' -f1)"
          cat "$payload_archive" | ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/payload.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- extract '$payload_digest' '$remote/payload.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$remote/read-live-production-components.mjs' --output '$remote/live.json' >/dev/null && \
             sudo jq -e --arg sha '$GITHUB_SHA' --arg digest '$WEB_ARTIFACT_DIGEST' \
               '.components.web.gitSha==\$sha and .components.web.artifactDigest==\$digest' '$remote/live.json' >/dev/null && \
               sudo jq -e --slurpfile before '$remote/runtime-identity.before.json' \
                 'def keep: {api:{gitSha:.api.gitSha,artifactDigest:.api.artifactDigest},runtimeWorker:{gitSha:.runtimeWorker.gitSha,artifactDigest:.runtimeWorker.artifactDigest},acs:{gitSha:.acs.gitSha,orchestratorArtifactDigest:.acs.orchestratorArtifactDigest,sandboxImageDigest:.acs.sandboxImageDigest}}; (.components|keep)==(\$before[0].components|keep)' \
                 '$remote/live.json' >/dev/null && \
             sudo node '$remote/write-live-production-identity.mjs' --input '$remote/live.json' >/dev/null && \
             sudo node '$remote/read-production-state.mjs' --output '$remote/confirmed.json' >/dev/null && \
             sudo jq -e --slurpfile live '$remote/live.json' \
               'def matrix: {web:{gitSha:.web.gitSha,artifactDigest:.web.artifactDigest},api:{gitSha:.api.gitSha,artifactDigest:.api.artifactDigest},runtimeWorker:{gitSha:.runtimeWorker.gitSha,artifactDigest:.runtimeWorker.artifactDigest},acs:{gitSha:.acs.gitSha,orchestratorArtifactDigest:.acs.orchestratorArtifactDigest,sandboxImageDigest:.acs.sandboxImageDigest}}; (.components|matrix)==(\$live[0].components|matrix)' \
               '$remote/confirmed.json' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          echo "Production identity committed once after Web/API/Worker/ACS live readback"
      - name: 失败时恢复先前的恢复用 Web
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          if [ ! -s "$RUNNER_TEMP/recovery-web-target.before" ]; then
            echo "recovery Web baseline was not captured and no recovery mutation started"
            exit 0
          fi
          printf -v recovery_web_before_q '%q' "$(cat "$RUNNER_TEMP/recovery-web-target.before")"
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo env RECOVERY_WEB_ROOT='$RECOVERY_WEB_ROOT' \
             RECOVERY_WEB_BEFORE_TARGET=$recovery_web_before_q \
             RUN_ID='${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}' bash -s" \
            < scripts/rollback-recovery-web.sh

      - name: 在持续校验生产锁所有权下恢复所有先前的可变 Web 对象
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          restore_web() {
          set -euo pipefail
          if ! command -v ossutil >/dev/null 2>&1; then
            echo "ossutil unavailable; no Web upload could have completed"
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/web-entry-snapshot-complete" ]; then
            echo "Web key snapshot did not complete; production Web mutation never started"
            exit 0
          fi
          while IFS=$'\t' read -r state key; do
            case "$state" in
              present)
                ossutil cp "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                  "oss://$OSS_BUCKET/$key" -f --region "$OSS_REGION" --copy-props default
                ;;
              missing)
                ossutil rm "oss://$OSS_BUCKET/$key" -f --region "$OSS_REGION" || true
                ;;
              *) echo "invalid Web snapshot state for $key: $state" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/web-mutable-before.tsv"
          echo "all previous mutable Web keys restored after failed deployment"
          }
          export -f restore_web
          PRODUCTION_LOCK_SSH_KEY=~/.ssh/ecs_recovery_key \
            bash scripts/release/run-with-production-lock-guard.sh bash -c restore_web

      - name: 失败时恢复可信生产身份
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          if [ ! -s "$RUNNER_TEMP/runtime-identity.before.json" ]; then
            echo "trusted identity was not snapshotted and was never mutated"
            exit 0
          fi
          remote="$PRODUCTION_STAGING_ROOT/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          payload_stage="$RUNNER_TEMP/production-identity-restore"
          payload_archive="$RUNNER_TEMP/production-identity-restore.tgz"
          rm -rf "$payload_stage"
          mkdir -p "$payload_stage"
          install -m 0444 "$RUNNER_TEMP/runtime-identity.before.json" \
            "$payload_stage/runtime-identity.before.json"
          tar -C "$payload_stage" -czf "$payload_archive" .
          payload_digest="$(sha256sum "$payload_archive" | cut -d' ' -f1)"
          cat "$payload_archive" | ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/payload.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- extract '$payload_digest' '$remote/payload.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          ssh -i ~/.ssh/ecs_recovery_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ECS_USER@$ECS_HOST" \
            "sudo install -m 0444 '$remote/runtime-identity.before.json' \
               /etc/agent-saas/runtime-identity.json.candidate && \
             sudo mv /etc/agent-saas/runtime-identity.json.candidate /etc/agent-saas/runtime-identity.json && \
             sudo cmp '$remote/runtime-identity.before.json' /etc/agent-saas/runtime-identity.json"

      - name: 补偿后验证先前 Web 与可信身份
        if: failure() || cancelled() || steps.commit_trusted_identity.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'"
          if [ ! -f "$RUNNER_TEMP/web-entry-snapshot-complete" ]; then
            echo "Web transaction failed before mutation; no compensation proof required"
            exit 0
          fi
          remote="$PRODUCTION_STAGING_ROOT/production-rollback-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo grep -Ex 'state=(rolled_back|not_started)' \
             '$RECOVERY_WEB_ROOT/transactions/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.activation' >/dev/null"
          proof_payload=(
            scripts/release/artifact-lib.mjs
            scripts/release/read-production-state.mjs
            scripts/release/read-runtime-identity.mjs
            scripts/release/config-publication.mjs
          )
          payload_stage="$RUNNER_TEMP/production-proof-payload"
          payload_archive="$RUNNER_TEMP/production-proof-payload.tgz"
          rm -rf "$payload_stage"
          mkdir -p "$payload_stage"
          for source in "${proof_payload[@]}"; do
            install -m 0444 "$source" "$payload_stage/$(basename "$source")"
          done
          tar -C "$payload_stage" -czf "$payload_archive" .
          payload_digest="$(sha256sum "$payload_archive" | cut -d' ' -f1)"
          cat "$payload_archive" | ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -rf -- '$remote' && \
             sudo install -d -m 0700 '$remote' && \
             sudo tee '$remote/payload.tgz' >/dev/null"
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$PRODUCTION_STAGING_ROOT' \
             bash -s -- extract '$payload_digest' '$remote/payload.tgz' '$remote'" \
            < scripts/release/seal-root-staged-payload.sh
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$remote/read-production-state.mjs' --output '$remote/restored.json' >/dev/null && \
             sudo cat '$remote/restored.json'" \
            > "$RUNNER_TEMP/production-state.restored.json"
          jq -e --slurpfile before "$RUNNER_TEMP/runtime-identity.before.json" \
            '.components == $before[0].components' \
            "$RUNNER_TEMP/production-state.restored.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/web-before" "$RUNNER_TEMP/web-oss-restored" "$RUNNER_TEMP/web-recovery-restored"
          ECS_IP=$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')
          : "${ECS_IP:?Cannot resolve ECS_HOST to IPv4}"
          # Compare serving metadata while excluding mutation timestamps and transaction paths.
          normalize_oss_metadata() {
            grep -Ei '^[[:space:]]*(ACL|Cache-?Control|Content-?(Disposition|Encoding|Language|Length|MD5|Type)|ETag|Expires|Metadata|Storage-?Class|X-Oss-(Meta-|Object-Acl|Storage-Class|Server-Side-Encryption))' "$1" \
              | sed -E 's/\r$//; s/^[[:space:]]+//; s/[[:space:]]*:[[:space:]]*/:/' \
              | LC_ALL=C sort
          }
          while IFS=$'\t' read -r state key; do
            before="$RUNNER_TEMP/web-before/$key"
            restored="$RUNNER_TEMP/web-oss-restored/$key"
            recovery="$RUNNER_TEMP/web-recovery-restored/$key"
            mkdir -p "$(dirname "$before")" "$(dirname "$restored")" "$(dirname "$recovery")"
            if [ "$state" = present ]; then
              ossutil cp \
                "oss://$OSS_BUCKET/$WEB_TRANSACTION_PREFIX/before/objects/$key" \
                "$before" -f --region "$OSS_REGION"
              ossutil cp "oss://$OSS_BUCKET/$key" "$restored" -f --region "$OSS_REGION"
              cmp "$before" "$restored"
              restored_stat="$RUNNER_TEMP/web-restored-stat/$key"
              restored_metadata="$RUNNER_TEMP/web-restored-metadata/$key"
              mkdir -p "$(dirname "$restored_stat")" "$(dirname "$restored_metadata")"
              ossutil stat "oss://$OSS_BUCKET/$key" --region "$OSS_REGION" > "$restored_stat"
              normalize_oss_metadata "$restored_stat" > "$restored_metadata"
              cmp "$RUNNER_TEMP/web-before-metadata/$key" "$restored_metadata"
              http_code="$(curl -sS --resolve "agent.kaiyan.net:443:$ECS_IP" \
                -H 'cache-control: no-cache' -o "$recovery" -w '%{http_code}' \
                "https://agent.kaiyan.net/$key?rollback_probe=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || true)"
              test "$http_code" = 200
              cmp "$before" "$recovery"
            elif [ "$state" = missing ]; then
              stat_log="$RUNNER_TEMP/web-restored-stat.log"
              if ossutil stat "oss://$OSS_BUCKET/$key" --region "$OSS_REGION" \
                > "$stat_log" 2>&1; then
                echo "Web key introduced by failed transaction remains after compensation: $key" >&2
                exit 1
              fi
              grep -Eiq 'ErrorCode[=: ]+NoSuchKey([[:space:],}]|$)' "$stat_log"
              http_code="$(curl -sS --resolve "agent.kaiyan.net:443:$ECS_IP" \
                -H 'cache-control: no-cache' -o "$recovery" -w '%{http_code}' \
                "https://agent.kaiyan.net/$key?rollback_probe=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || true)"
              test "$http_code" = 404
            else
              echo "invalid Web snapshot state for $key: $state" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/web-mutable-before.tsv"
          jq -e --slurpfile before "$RUNNER_TEMP/web-before/release-identity.json" \
            '.releaseSha == $before[0].releaseSha and .webDigest == $before[0].webDigest' \
            "$RUNNER_TEMP/web-recovery-restored/release-identity.json" >/dev/null
          echo "all previous OSS/recovery Web mutable keys and trusted Production identity authoritatively restored"

      - name: 提交或补偿后释放并清理生产主机锁
        if: always()
        run: |
          set -euo pipefail
          lock_log="/tmp/production-lock-$PRODUCTION_LOCK_TOKEN.log"
          release_status=0
          if ! ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
              "sudo bash '$PRODUCTION_LOCK_SCRIPT' release '$PRODUCTION_LOCK_TOKEN'"; then
            ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" "cat '$lock_log'" >&2 || true
            release_status=1
          fi
          ssh -i ~/.ssh/ecs_recovery_key "$ECS_USER@$ECS_HOST" \
            "sudo rm -f '$PRODUCTION_LOCK_SCRIPT'; \
             sudo rm -rf -- \
               '$PRODUCTION_STAGING_ROOT/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' \
               '$PRODUCTION_STAGING_ROOT/production-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web' \
               '$PRODUCTION_STAGING_ROOT/production-rollback-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; \
             rm -f '$lock_log'" || release_status=1
          exit "$release_status"

      - name: 身份错误完成补偿后将兼容事务标记为失败
        if: steps.commit_trusted_identity.outcome == 'failure'
        run: |
          echo "trusted Production identity commit/readback failed; locked compensation completed" >&2
          exit 1

  retire_legacy_workflows:
    name: 清理已退役 Workflow 注册项
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 停用清单中已从 main 移除的旧入口（保留全部历史证据）
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/retire-legacy-workflows.mjs --apply
