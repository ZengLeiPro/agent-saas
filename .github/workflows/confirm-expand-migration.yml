name: 确认扩展迁移

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: '已完成生产物理收敛、等待 expand 确认的 RC ID'
        required: true
        type: string
      reason:
        description: '迁移现场确认说明'
        required: true
        type: string

permissions:
  contents: write
  actions: read

# 确认与生产晋级共享互斥锁，禁止在现场读回期间启动另一轮晋级。
concurrency:
  group: production-runtime
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  confirm:
    name: Confirm bound expand migration after production readback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RELEASE_RECORD_OSS_URI: ${{ vars.RELEASE_RECORD_OSS_URI }}
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      RELEASE_ID_INPUT: ${{ inputs.release_id }}
      CONFIRMATION_REASON: ${{ inputs.reason }}

    steps:
      - name: 校验确认请求
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_ID_INPUT" =~ ^rc-[0-9]{8}-[0-9]{2,}$ ]]
          test -n "$(printf '%s' "$CONFIRMATION_REASON" | tr -d '[:space:]')"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID_INPUT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: Download and verify immutable RC evidence and confirmation window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/attestations"
          gh release download "$RELEASE_ID" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json --pattern 'attestation-*.jsonl'
          node scripts/release/attestation-snapshot.mjs select \
            "$RUNNER_TEMP/release"/attestation-*.jsonl \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts \
            "$RUNNER_TEMP/release/manifest.json" "$RELEASE_ID"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/release/manifest.json")"
          release_sha="$(jq -r .releaseSha "$RUNNER_TEMP/release/manifest.json")"
          plan_digest="$(jq -r .migrationPlan.planDigest "$RUNNER_TEMP/release/manifest.json")"
          test "$(jq -r .migrationPlan.phase "$RUNNER_TEMP/release/manifest.json")" = expand
          test "$(jq -r .migrationPlan.confirmation "$RUNNER_TEMP/release/manifest.json")" = required_after_observation
          git fetch --no-tags origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          test "$(git rev-parse "$RELEASE_ID^{commit}")" = "$release_sha"
          git cat-file -p "$RELEASE_ID^{tag}" | grep -Fx "manifest-digest: $manifest_digest"
          {
            echo "MANIFEST_DIGEST=$manifest_digest"
            echo "MIGRATION_PLAN_DIGEST=$plan_digest"
          } >> "$GITHUB_ENV"
          latest_state="$(tail -n1 "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" | jq -r .state)"
          if [ "$latest_state" = completed ]; then
            latest_operation="$(tail -n1 "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" | jq -r .operationKey)"
            case "$latest_operation" in
              "expand-confirmation:$GITHUB_RUN_ID:"*) ;;
              *) echo 'Release was already confirmed by another workflow run' >&2; exit 1 ;;
            esac
            tail -n1 "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" | jq -r .reason \
              > "$RUNNER_TEMP/migration-confirmation.json"
            echo 'CONFIRMATION_REPAIR=true' >> "$GITHUB_ENV"
          elif [ "$latest_state" = awaiting_expand_confirmation ]; then
            # 同一次人工确认不得自动续期；过期后必须从当前生产基线重新创建 RC。
            node -e 'const fs=require("node:fs"); const lines=fs.readFileSync(process.argv[1],"utf8").trim().split(/\r?\n/); const latest=JSON.parse(lines.at(-1)); const awaitingAt=Date.parse(latest.recordedAt); const age=Date.now()-awaitingAt; if (!Number.isFinite(awaitingAt) || age<0 || age>2*60*60*1000) { console.error("Expand confirmation request is invalid or expired after two hours; dispatch a new Promotion instead of refreshing this request"); process.exit(1); }' \
              "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          else
            echo "Release cannot be confirmed from $latest_state" >&2
            exit 1
          fi

      - name: Configure pinned production SSH
        if: env.CONFIRMATION_REPAIR != 'true'
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          scan_path="$RUNNER_TEMP/production-known-host"
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$scan_path"
          test "$(ssh-keygen -lf "$scan_path" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$scan_path" >> ~/.ssh/known_hosts

      - name: Confirm live binding and append completed attestation under the Production host lock
        if: env.CONFIRMATION_REPAIR != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="/tmp/expand-confirmation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          lock_token="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-expand-confirmation"
          lock_log="$RUNNER_TEMP/expand-confirmation-lock.log"
          lock_pid=''
          guarded_pid=''
          lock_ready_confirmed=false
          assert_lock() {
            ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
              "sudo bash -s -- assert '$lock_token'" \
              < scripts/release/production-lock-lease.sh
          }
          run_locked_ssh() {
            assert_lock
            ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "$1"
            assert_lock
          }
          terminate_guarded() {
            [ -n "$guarded_pid" ] || return 0
            kill -- "-$guarded_pid" 2>/dev/null || kill "$guarded_pid" 2>/dev/null || true
            for _ in $(seq 1 50); do
              kill -0 -- "-$guarded_pid" 2>/dev/null || break
              sleep 0.2
            done
            if kill -0 -- "-$guarded_pid" 2>/dev/null; then
              kill -KILL -- "-$guarded_pid" 2>/dev/null || true
            fi
            wait "$guarded_pid" 2>/dev/null || true
            guarded_pid=''
          }
          run_guarded() {
            assert_lock
            setsid "$@" &
            guarded_pid=$!
            next_owner_check=$SECONDS
            while kill -0 -- "-$guarded_pid" 2>/dev/null; do
              if ! kill -0 "$lock_pid" 2>/dev/null; then
                terminate_guarded
                cat "$lock_log" >&2
                echo 'Production host lock holder exited during a guarded confirmation operation' >&2
                return 70
              fi
              if [ "$SECONDS" -ge "$next_owner_check" ]; then
                if ! assert_lock; then
                  terminate_guarded
                  echo 'Production host lock owner proof was lost during a guarded confirmation operation' >&2
                  return 70
                fi
                next_owner_check=$((SECONDS + 1))
              fi
              sleep 0.2
            done
            guarded_status=0
            wait "$guarded_pid" || guarded_status=$?
            guarded_pid=''
            [ "$guarded_status" -eq 0 ] || return "$guarded_status"
            assert_lock
          }
          terminate_lock() {
            [ -n "$lock_pid" ] || return 0
            kill -- "-$lock_pid" 2>/dev/null || kill "$lock_pid" 2>/dev/null || true
            wait "$lock_pid" 2>/dev/null || true
            lock_pid=''
          }
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            cleanup_status=0
            terminate_guarded
            if [ "$lock_ready_confirmed" = true ]; then
              release_status=0
              ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
                "sudo bash -s -- release '$lock_token'" \
                < scripts/release/production-lock-lease.sh || release_status=$?
              if [ "$release_status" -ne 0 ]; then
                cleanup_status="$release_status"
                terminate_lock
              fi
            else
              terminate_lock
            fi
            if [ -n "$lock_pid" ]; then
              wait "$lock_pid" || cleanup_status=$?
              lock_pid=''
            fi
            ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "rm -rf -- '$remote'" || true
            [ "$cleanup_status" -eq 0 ] || status=1
            exit "$status"
          }
          trap cleanup EXIT

          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key \
            scripts/release/artifact-lib.mjs \
            scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs \
            scripts/release/verify-installed-release.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"

          # 租约上限严格长于 30 分钟 job 上限，避免长尾上传先耗尽固定租约。
          setsid timeout --signal=TERM --kill-after=10 7250 ssh \
            -o ConnectTimeout=10 -o ServerAliveInterval=1 -o ServerAliveCountMax=2 \
            -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo env PRODUCTION_LOCK_TIMEOUT_SECONDS=7200 bash -s -- hold '$lock_token'" \
            < scripts/release/production-lock-lease.sh > "$lock_log" 2>&1 &
          lock_pid=$!
          lock_ready=false
          lock_ready_deadline=$((SECONDS + 75))
          while [ "$SECONDS" -lt "$lock_ready_deadline" ]; do
            if assert_lock; then
              lock_ready=true
              break
            fi
            if ! kill -0 "$lock_pid" 2>/dev/null; then
              wait "$lock_pid" 2>/dev/null || true
              lock_pid=''
              break
            fi
            sleep 1
          done
          if [ "$lock_ready" != true ]; then
            terminate_lock
            cat "$lock_log" >&2
            exit 1
          fi
          lock_ready_confirmed=true

          run_locked_ssh \
            "sudo node '$remote/read-live-production-components.mjs' --output '$remote/live-initial.json' >/dev/null"
          run_guarded scp -i ~/.ssh/production_key \
            "$ECS_USER@$ECS_HOST:$remote/live-initial.json" \
            "$RUNNER_TEMP/production-live-initial.json"
          run_guarded curl -fsS --retry 10 \
            'https://api.agent.kaiyan.net/api/healthz/ready' \
            > "$RUNNER_TEMP/production-api-ready-initial.json"
          run_guarded node scripts/release/confirm-expand-migration.mjs \
            --manifest "$RUNNER_TEMP/release/manifest.json" \
            --attestations "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" \
            --live "$RUNNER_TEMP/production-live-initial.json" \
            --api-ready "$RUNNER_TEMP/production-api-ready-initial.json" \
            --output "$RUNNER_TEMP/migration-confirmation-initial.json"

          # completed 提交前在同一锁租约内重新读取；任一组件/API 漂移均 fail closed。
          run_locked_ssh \
            "sudo node '$remote/read-live-production-components.mjs' --output '$remote/live-final.json' >/dev/null"
          run_guarded scp -i ~/.ssh/production_key \
            "$ECS_USER@$ECS_HOST:$remote/live-final.json" \
            "$RUNNER_TEMP/production-live.json"
          run_guarded curl -fsS --retry 10 \
            'https://api.agent.kaiyan.net/api/healthz/ready' \
            > "$RUNNER_TEMP/production-api-ready.json"
          run_guarded node scripts/release/confirm-expand-migration.mjs \
            --manifest "$RUNNER_TEMP/release/manifest.json" \
            --attestations "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" \
            --live "$RUNNER_TEMP/production-live.json" \
            --api-ready "$RUNNER_TEMP/production-api-ready.json" \
            --output "$RUNNER_TEMP/migration-confirmation.json"
          diff -u \
            <(jq -S 'del(.liveObservedAt,.confirmedAt)' "$RUNNER_TEMP/migration-confirmation-initial.json") \
            <(jq -S 'del(.liveObservedAt,.confirmedAt)' "$RUNNER_TEMP/migration-confirmation.json")
          assert_lock

          confirmation_digest="sha256:$(sha256sum "$RUNNER_TEMP/migration-confirmation.json" | cut -d' ' -f1)"
          # 先按内容 digest 持久化最终锁内读回；只有成功落盘后才能追加 completed。
          run_guarded bash scripts/release/upload-oss-object-immutable.sh \
            "$RUNNER_TEMP/migration-confirmation.json" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/migration-confirmations/${confirmation_digest#sha256:}.json"
          reason="$(jq -c --arg operatorReason "$CONFIRMATION_REASON" \
            --arg confirmationEvidenceDigest "$confirmation_digest" \
            '. + {operatorReason:$operatorReason,confirmationEvidenceDigest:$confirmationEvidenceDigest}' \
            "$RUNNER_TEMP/migration-confirmation.json")"
          run_guarded pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" \
            --digest "$MANIFEST_DIGEST" --state completed \
            --operation "expand-confirmation:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$reason" \
            --confirmation-evidence "$RUNNER_TEMP/migration-confirmation.json"
          run_guarded node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots" \
            > "$RUNNER_TEMP/attestation-snapshot-result.json"
          snapshot_path="$(jq -r .path "$RUNNER_TEMP/attestation-snapshot-result.json")"
          # GitHub Release 是重跑读取源；其成功后再镜像 OSS，失败重跑不会生成分叉状态。
          run_guarded bash scripts/release/upload-github-release-asset-immutable.sh \
            "$RELEASE_ID" "$snapshot_path"
          run_guarded bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")"
          {
            echo '### Expand migration confirmation'
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Manifest: \`$MANIFEST_DIGEST\`"
            echo "- Migration plan: \`$MIGRATION_PLAN_DIGEST\`"
            echo '- Result: completed after two Production live readbacks under one host lock lease'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Repair OSS attestation mirror after a GitHub-successful rerun
        if: env.CONFIRMATION_REPAIR == 'true'
        run: |
          set -euo pipefail
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")"
          echo 'Repaired the OSS mirror from the completed GitHub Release attestation' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-confirmation-${{ env.RELEASE_ID }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/production-live.json
            ${{ runner.temp }}/production-api-ready.json
            ${{ runner.temp }}/migration-confirmation.json
