name: 测试环境部署

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '发版说明'
        required: false
        type: string

permissions:
  contents: write
  actions: read
  deployments: write
  pull-requests: read

# Deploy 与 Acceptance 共享唯一在线 Staging 槽位，避免验收中途被换版。
concurrency:
  group: staging-runtime
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REPO_ID: crr-csx99pbexlsw5qqv
  ACR_REGION_ID: cn-shenzhen
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox

jobs:
  prepare-evidence:
    name: 准备发布证据
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RELEASE_RECORD_OSS_URI: ${{ vars.RELEASE_RECORD_OSS_URI }}
      RELEASE_RECORD_OSS_REGION: ${{ vars.RELEASE_RECORD_OSS_REGION }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      RELEASE_EVIDENCE_SCHEMA_VERSION: '2'
      RELEASE_SHA: ${{ github.sha }}
      PRODUCTION_CONFIG_IDENTITY_STAGE: steady-state

    steps:
      - name: 校验证据写入器配置
        env:
          PRODUCTION_OBSERVATION_URL: ${{ vars.PRODUCTION_OBSERVATION_URL }}
          RELEASE_EVIDENCE_READ_TOKEN: ${{ secrets.PRODUCTION_OBSERVATION_TOKEN }}
          RELEASE_EVIDENCE_WRITE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_OBSERVATION_URL:?Missing production variable PRODUCTION_OBSERVATION_URL}"
          : "${RELEASE_EVIDENCE_READ_TOKEN:?Missing production Evidence read token}"
          : "${RELEASE_EVIDENCE_WRITE_TOKEN:?Missing production Evidence write token}"
          test "$RELEASE_EVIDENCE_READ_TOKEN" != "$RELEASE_EVIDENCE_WRITE_TOKEN"
          case "$PRODUCTION_OBSERVATION_URL" in
            https://*/production-observation) ;;
            *) echo 'PRODUCTION_OBSERVATION_URL must be HTTPS and end with /production-observation' >&2; exit 1 ;;
          esac

      - name: 校验证据写入器架构兼容性
        env:
          PRODUCTION_OBSERVATION_URL: ${{ vars.PRODUCTION_OBSERVATION_URL }}
          RELEASE_EVIDENCE_READ_TOKEN: ${{ secrets.PRODUCTION_OBSERVATION_TOKEN }}
        run: |
          set -euo pipefail
          capability_url="${PRODUCTION_OBSERVATION_URL%/production-observation}/capabilities"
          status="$(curl -sS --retry 3 --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/evidence-writer-capabilities.json" -w '%{http_code}' \
            -H "authorization: Bearer $RELEASE_EVIDENCE_READ_TOKEN" \
            "$capability_url")"
          if [ "$status" != 200 ]; then
            cat "$RUNNER_TEMP/evidence-writer-capabilities.json" >&2
            echo "Evidence Writer capability check failed with HTTP $status" >&2
            exit 1
          fi
          if ! jq -e --argjson required "$RELEASE_EVIDENCE_SCHEMA_VERSION" '
            .schemaVersion == 1 and
            .service == "agent-saas-release-evidence" and
            (.currentReleaseEvidenceSchemaVersion | type == "number") and
            (.supportedReleaseEvidenceSchemaVersions | type == "array") and
            (.supportedReleaseEvidenceSchemaVersions | index($required) != null)
          ' "$RUNNER_TEMP/evidence-writer-capabilities.json" >/dev/null; then
            cat "$RUNNER_TEMP/evidence-writer-capabilities.json" >&2
            echo "Evidence Writer does not support required Release Evidence schema v$RELEASE_EVIDENCE_SCHEMA_VERSION" >&2
            exit 1
          fi

      - name: 检出用于生成证据的不可变触发版本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 等待应用 CI 成功并校验已合并的 GitHub PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --quiet --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

          # Workflow 显示名称会随侧边栏排序调整；发布门禁只绑定稳定的文件身份与数值 ID。
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
            > "$RUNNER_TEMP/app-ci-workflow.json"
          jq -e '
            (.id | type == "number" and . > 0) and
            .path == ".github/workflows/ci.yml"
          ' "$RUNNER_TEMP/app-ci-workflow.json" >/dev/null
          app_ci_workflow_id="$(jq -r .id "$RUNNER_TEMP/app-ci-workflow.json")"

          app_ci_run=''
          app_ci_ready=false
          for attempt in $(seq 1 180); do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$app_ci_workflow_id/runs" \
              -f branch=main -f head_sha="$RELEASE_SHA" -f event=push -f per_page=20 \
              > "$RUNNER_TEMP/app-ci-runs.json"
            app_ci_run="$(jq -c --arg sha "$RELEASE_SHA" \
              --argjson workflow_id "$app_ci_workflow_id" '
              [.workflow_runs[] | select(
                .workflow_id == $workflow_id and
                .head_sha == $sha and
                .head_branch == "main" and
                .event == "push"
              )] |
              sort_by(.run_number) | last // empty
            ' "$RUNNER_TEMP/app-ci-runs.json")"
            if [ -z "$app_ci_run" ]; then
              if [ "$attempt" -eq 1 ] || [ $((attempt % 6)) -eq 0 ]; then
                echo "等待 APP CI：尚未找到同一 SHA 的 main push run（$attempt/180）"
              fi
              sleep 10
              continue
            fi

            app_ci_run_id="$(printf '%s' "$app_ci_run" | jq -r .id)"
            app_ci_status="$(printf '%s' "$app_ci_run" | jq -r .status)"
            app_ci_conclusion="$(printf '%s' "$app_ci_run" | jq -r '.conclusion // "pending"')"
            if [ "$app_ci_status" != completed ]; then
              if [ "$attempt" -eq 1 ] || [ $((attempt % 6)) -eq 0 ]; then
                echo "等待 APP CI run $app_ci_run_id：status=$app_ci_status（$attempt/180）"
              fi
              sleep 10
              continue
            fi

            if [ "$app_ci_conclusion" != success ]; then
              printf '%s' "$app_ci_run" | jq '{
                id, workflow_id, name, event, head_branch, head_sha,
                status, conclusion, run_number, run_attempt, html_url
              }' >&2
              echo "::error::APP CI run $app_ci_run_id 已完成，但结论为 $app_ci_conclusion" >&2
              exit 1
            fi
            app_ci_ready=true
            break
          done

          if [ "$app_ci_ready" != true ]; then
            echo "::error::等待 APP CI 超时：workflow_id=$app_ci_workflow_id sha=$RELEASE_SHA" >&2
            if [ -n "$app_ci_run" ]; then
              printf '%s' "$app_ci_run" | jq '{
                id, workflow_id, name, event, head_branch, head_sha,
                status, conclusion, run_number, run_attempt, html_url
              }' >&2
            else
              jq --arg sha "$RELEASE_SHA" '[
                .workflow_runs[] | select(.head_sha == $sha) | {
                  id, workflow_id, name, event, head_branch, head_sha,
                  status, conclusion, run_number, run_attempt, html_url
                }
              ]' "$RUNNER_TEMP/app-ci-runs.json" >&2
            fi
            exit 1
          fi

          printf '%s' "$app_ci_run_id" | grep -Eq '^[0-9]+$'

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$app_ci_run_id" \
            > "$RUNNER_TEMP/app-ci-run.json"
          jq -e --arg sha "$RELEASE_SHA" \
            --argjson workflow_id "$app_ci_workflow_id" '
            .workflow_id == $workflow_id and
            .event == "push" and
            .head_branch == "main" and
            .head_sha == $sha and
            .status == "completed" and
            .conclusion == "success"
          ' "$RUNNER_TEMP/app-ci-run.json" >/dev/null
          echo "APP_CI_RUN_ID=$app_ci_run_id" >> "$GITHUB_ENV"
          echo "已验证 APP CI run $app_ci_run_id"

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
            > "$RUNNER_TEMP/associated-pulls.json"
          jq -e --arg sha "$RELEASE_SHA" '
            map(select(
              .state == "closed" and
              .merged_at != null and
              .base.ref == "main" and
              .merge_commit_sha == $sha
            )) |
            if length == 1 then .[0] else error("Expected exactly one merged PR for Release SHA") end
          ' "$RUNNER_TEMP/associated-pulls.json" > "$RUNNER_TEMP/release-pr.json"
          jq -e '.number > 0 and (.head.sha | test("^[a-f0-9]{40}$"))' \
            "$RUNNER_TEMP/release-pr.json" >/dev/null
          jq '{
            schemaVersion: 1,
            finalPullRequest: {
              number: .number,
              headSha: .head.sha,
              mergeCommitOid: .merge_commit_sha,
              state: "MERGED"
            },
            sources: []
          }' "$RUNNER_TEMP/release-pr.json" > "$RUNNER_TEMP/merge.json"

      - name: 解析同一发布 SHA 的 ACS 证据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "$RELEASE_SHA^1")"
          git diff --name-only "$base_sha" "$RELEASE_SHA" > "$RUNNER_TEMP/acs-changed-files.txt"
          bash .github/scripts/acs-classify.sh \
            "$RUNNER_TEMP/acs-changed-files.txt" "$base_sha" > "$RUNNER_TEMP/acs-classification.out"
          cat "$RUNNER_TEMP/acs-classification.out"
          publish="$(sed -n 's/^publish=//p' "$RUNNER_TEMP/acs-classification.out")"
          contract_check="$(sed -n 's/^contract_check=//p' "$RUNNER_TEMP/acs-classification.out")"
          case "$publish:$contract_check" in
            false:false)
              jq -n --arg sha "$RELEASE_SHA" --argjson appRunId "$APP_CI_RUN_ID" '{
                appCi: {workflow: "Build & Check", status: "success", headSha: $sha, runId: $appRunId},
                acsImpact: {workflow: "ACS Impact Gate", status: "not_required", headSha: $sha}
              }' > "$RUNNER_TEMP/checks.json"
              ;;
            true:*|*:true)
              acs_run=''
              for attempt in $(seq 1 90); do
                gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/acs-sandbox.yml/runs" \
                  -f head_sha="$RELEASE_SHA" -f event=push -f per_page=20 \
                  > "$RUNNER_TEMP/acs-runs.json"
                acs_run="$(jq -c --arg sha "$RELEASE_SHA" '
                  [.workflow_runs[] | select(.head_sha == $sha and .event == "push")] |
                  sort_by(.run_number) | last // empty
                ' "$RUNNER_TEMP/acs-runs.json")"
                if [ -z "$acs_run" ] || [ "$(printf '%s' "$acs_run" | jq -r .status)" != completed ]; then
                  sleep 10
                  continue
                fi
                test "$(printf '%s' "$acs_run" | jq -r .conclusion)" = success
                acs_run_id="$(printf '%s' "$acs_run" | jq -r .id)"
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$acs_run_id/jobs?filter=all" \
                  > "$RUNNER_TEMP/acs-jobs.json"
                if [ "$publish" = true ]; then
                  jq -e '[.jobs[] | select(.name == "Gate (typecheck + test)" and .conclusion == "success")] | length == 1' \
                    "$RUNNER_TEMP/acs-jobs.json" >/dev/null
                fi
                if [ "$contract_check" = true ]; then
                  jq -e '[.jobs[] | select(.name == "ACS Contract Check" and .conclusion == "success")] | length == 1' \
                    "$RUNNER_TEMP/acs-jobs.json" >/dev/null
                fi
                jq -n --arg sha "$RELEASE_SHA" --argjson appRunId "$APP_CI_RUN_ID" \
                  --argjson acsRunId "$acs_run_id" '{
                    appCi: {workflow: "Build & Check", status: "success", headSha: $sha, runId: $appRunId},
                    acsImpact: {workflow: "ACS Impact Gate", status: "success", headSha: $sha, runId: $acsRunId}
                  }' > "$RUNNER_TEMP/checks.json"
                break
              done
              test -s "$RUNNER_TEMP/checks.json"
              ;;
            *)
              echo 'Invalid ACS classification output' >&2
              exit 1
              ;;
          esac

      - name: 存在时复用不可变发布证据
        env:
          PRODUCTION_OBSERVATION_URL: ${{ vars.PRODUCTION_OBSERVATION_URL }}
          RELEASE_EVIDENCE_READ_TOKEN: ${{ secrets.PRODUCTION_OBSERVATION_TOKEN }}
        run: |
          set -euo pipefail
          release_evidence_url="$(node - <<'NODE'
          const value = new URL(process.env.PRODUCTION_OBSERVATION_URL);
          if (!value.pathname.endsWith('/production-observation')) {
            throw new Error('PRODUCTION_OBSERVATION_URL must end with /production-observation');
          }
          value.pathname = value.pathname.replace(/\/production-observation$/u, '/release-evidence');
          process.stdout.write(value.toString());
          NODE
          )"
          status="$(curl -sS --retry 3 -o "$RUNNER_TEMP/existing-release-evidence.json" \
            -w '%{http_code}' -H "authorization: Bearer $RELEASE_EVIDENCE_READ_TOKEN" \
            "$release_evidence_url?sha=$RELEASE_SHA")"
          case "$status" in
            200)
              node --input-type=module -e "
                import { readFile } from 'node:fs/promises';
                import { validateReleaseEvidenceDocument } from './scripts/release/release-evidence-schema.mjs';
                const evidence = JSON.parse(await readFile(process.argv[1], 'utf8'));
                validateReleaseEvidenceDocument(evidence, { expectedSha: process.argv[2] });
              " "$RUNNER_TEMP/existing-release-evidence.json" "$RELEASE_SHA"
              echo 'REUSE_RELEASE_EVIDENCE=true' >> "$GITHUB_ENV"
              {
                echo '### Immutable Release Evidence'
                echo
                echo "- Release SHA: \`$RELEASE_SHA\`"
                echo "- Evidence digest: \`$(jq -r .evidenceDigest "$RUNNER_TEMP/existing-release-evidence.json")\`"
                echo '- Result: reused existing immutable evidence after schema validation'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo 'REUSE_RELEASE_EVIDENCE=false' >> "$GITHUB_ENV"
              ;;
            *)
              cat "$RUNNER_TEMP/existing-release-evidence.json" >&2
              echo "Release Evidence read failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: 配置固定的生产只读 SSH
        if: env.REUSE_RELEASE_EVIDENCE != 'true'
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing production secret ECS_HOST}"
          : "${ECS_USER:?Missing production secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing production secret ECS_SSH_KEY}"
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/production_evidence_key
          chmod 600 ~/.ssh/production_evidence_key
          ssh-keyscan -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/production-known-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/production-known-host" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/production-known-host" >> ~/.ssh/known_hosts

      - name: 只读获取在线生产状态
        if: env.REUSE_RELEASE_EVIDENCE != 'true'
        run: |
          set -euo pipefail
          remote="/tmp/release-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            ssh -i ~/.ssh/production_evidence_key "$ECS_USER@$ECS_HOST" "rm -rf -- '$remote'"
          }
          trap cleanup EXIT
          ssh -i ~/.ssh/production_evidence_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_evidence_key scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/production_evidence_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/read-production-state.mjs' --config-identity-stage '$PRODUCTION_CONFIG_IDENTITY_STAGE' --output '$remote/production.json' >/dev/null"
          scp -i ~/.ssh/production_evidence_key "$ECS_USER@$ECS_HOST:$remote/production.json" \
            "$RUNNER_TEMP/production.json"
          test "$(jq -r .environment "$RUNNER_TEMP/production.json")" = production

      - name: 安装用于生产证据的阿里云 CLI
        if: env.REUSE_RELEASE_EVIDENCE != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz \
            -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: 将不可变 OSS 产物绑定到在线生产环境
        if: env.REUSE_RELEASE_EVIDENCE != 'true'
        run: |
          set -euo pipefail
          : "${ALIBABACLOUD_ACCESS_KEY_ID:?Missing production secret ALIYUN_ACCESS_KEY_ID}"
          : "${ALIBABACLOUD_ACCESS_KEY_SECRET:?Missing production secret ALIYUN_ACCESS_KEY_SECRET}"
          : "${RELEASE_RECORD_OSS_URI:?Missing production variable RELEASE_RECORD_OSS_URI}"
          : "${RELEASE_RECORD_OSS_REGION:?Missing production variable RELEASE_RECORD_OSS_REGION}"
          case "$RELEASE_RECORD_OSS_URI" in oss://*) ;; *) exit 1 ;; esac
          case "$RELEASE_RECORD_OSS_REGION" in cn-*) ;; *) exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/baseline-indexes" "$RUNNER_TEMP/baseline-index-raw"
          : > "$RUNNER_TEMP/baseline-index-uris.txt"
          for prefix in baselines records; do
            aliyun --secure oss ls "$RELEASE_RECORD_OSS_URI/$prefix/" \
              --limited-num 1000 --region "$RELEASE_RECORD_OSS_REGION" \
              > "$RUNNER_TEMP/$prefix-list.txt"
            awk '$NF ~ /\/artifact-index\.json$/ {print $NF}' \
              "$RUNNER_TEMP/$prefix-list.txt" >> "$RUNNER_TEMP/baseline-index-uris.txt"
          done
          sort -u -o "$RUNNER_TEMP/baseline-index-uris.txt" \
            "$RUNNER_TEMP/baseline-index-uris.txt"
          index_count="$(wc -l < "$RUNNER_TEMP/baseline-index-uris.txt" | tr -d ' ')"
          test "$index_count" -gt 0
          test "$index_count" -lt 1000
          index_number=0
          while IFS= read -r index_uri; do
            index_number=$((index_number + 1))
            raw="$RUNNER_TEMP/baseline-index-raw/$index_number.json"
            target="$RUNNER_TEMP/baseline-indexes/$index_number.json"
            aliyun --secure oss cp "$index_uri" "$raw" \
              --region "$RELEASE_RECORD_OSS_REGION"
            jq --arg indexUri "$index_uri" '. + {indexUri: $indexUri}' "$raw" > "$target"
          done < "$RUNNER_TEMP/baseline-index-uris.txt"
          node scripts/release/resolve-baseline-artifacts.mjs \
            --production "$RUNNER_TEMP/production.json" \
            --indexes "$RUNNER_TEMP/baseline-indexes" \
            --output "$RUNNER_TEMP/baseline-artifacts.json"

      - name: 生成、发布并回读不可变发布证据
        if: env.REUSE_RELEASE_EVIDENCE != 'true'
        env:
          PRODUCTION_OBSERVATION_URL: ${{ vars.PRODUCTION_OBSERVATION_URL }}
          RELEASE_EVIDENCE_READ_TOKEN: ${{ secrets.PRODUCTION_OBSERVATION_TOKEN }}
          RELEASE_EVIDENCE_WRITE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          baseline="$(jq -r .components.api.gitSha "$RUNNER_TEMP/production.json")"
          git cat-file -e "$baseline^{commit}"
          git merge-base --is-ancestor "$baseline" "$RELEASE_SHA"
          if ! node scripts/release/classify-components.mjs \
            --baseline "$baseline" --target "$RELEASE_SHA" \
            > "$RUNNER_TEMP/classification.json"; then
            cat "$RUNNER_TEMP/classification.json" >&2
            exit 1
          fi
          if ! node scripts/release/migration-plan.mjs \
            --changed-paths "$RUNNER_TEMP/classification.json" \
            --baseline "$baseline" --target "$RELEASE_SHA" \
            > "$RUNNER_TEMP/migration.json"; then
            cat "$RUNNER_TEMP/migration.json" >&2
            exit 1
          fi
          node scripts/release/produce-release-evidence.mjs \
            --sha "$RELEASE_SHA" \
            --merge "$RUNNER_TEMP/merge.json" \
            --checks "$RUNNER_TEMP/checks.json" \
            --production "$RUNNER_TEMP/production.json" \
            --baseline-artifacts "$RUNNER_TEMP/baseline-artifacts.json" \
            --classification "$RUNNER_TEMP/classification.json" \
            --migration "$RUNNER_TEMP/migration.json" \
            --output "$RUNNER_TEMP/release-evidence.json"

          release_evidence_url="$(node - <<'NODE'
          const value = new URL(process.env.PRODUCTION_OBSERVATION_URL);
          if (!value.pathname.endsWith('/production-observation')) {
            throw new Error('PRODUCTION_OBSERVATION_URL must end with /production-observation');
          }
          value.pathname = value.pathname.replace(/\/production-observation$/u, '/release-evidence');
          process.stdout.write(value.toString());
          NODE
          )"
          node scripts/release/publish-release-evidence.mjs \
            --input "$RUNNER_TEMP/release-evidence.json" \
            --url "$release_evidence_url"

          {
            echo '### Immutable Release Evidence'
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Evidence digest: \`$(jq -r .evidenceDigest "$RUNNER_TEMP/release-evidence.json")\`"
            echo "- Release PR: #$(jq -r .finalPullRequest.number "$RUNNER_TEMP/merge.json")"
            echo '- Result: generated, written once, and read back with the separate read identity'
          } >> "$GITHUB_STEP_SUMMARY"

  build-deploy-verify:
    name: 构建并校验精确的测试环境 RC
    needs: prepare-evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      STAGING_ECS_HOST: ${{ secrets.STAGING_ECS_HOST }}
      STAGING_ECS_USER: ${{ secrets.STAGING_ECS_USER }}
      STAGING_ECS_SSH_KEY: ${{ secrets.STAGING_ECS_SSH_KEY }}
      RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
      STAGING_WEB_URL: https://staging-agent.kaiyan.net
      STAGING_API_URL: https://staging-agent-api.kaiyan.net
      RELEASE_EVIDENCE_URL: ${{ vars.RELEASE_EVIDENCE_URL }}
      STAGING_ISOLATION_EVIDENCE_URL: ${{ vars.STAGING_ISOLATION_EVIDENCE_URL }}
      STAGING_SSH_HOST_KEY_SHA256: ${{ vars.STAGING_SSH_HOST_KEY_SHA256 }}
      STAGING_RELEASE_OSS_URI: ${{ vars.STAGING_RELEASE_OSS_URI }}
      STAGING_WEB_OSS_URI: oss://agent-saas-web-staging
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      DISPATCH_REASON: ${{ inputs.reason || 'manual staging release' }}

    steps:
      - name: 锁定触发 SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$GITHUB_REF" = refs/heads/main
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          created_at="$(node -e "process.stdout.write(new Date(process.argv[1]).toISOString())" "$created_at")"
          release_date="${created_at:0:10}"
          release_id="rc-${release_date//-/}-$(printf '%02d' "$GITHUB_RUN_NUMBER")"
          expires_at="$(node -e "process.stdout.write(new Date(Date.parse(process.argv[1])+86400000).toISOString())" "$created_at")"
          {
            echo "STAGING_RELEASE_ID=$release_id"
            echo "STAGING_RELEASE_SHA=$GITHUB_SHA"
            echo "RELEASE_CREATED_AT=$created_at"
            echo "RELEASE_EXPIRES_AT=$expires_at"
          } >> "$GITHUB_ENV"

      - name: 检出不可变触发版本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 确认 SHA 属于可信 main 历史
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 确认测试环境资源已准备好首次部署
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const plan = JSON.parse(readFileSync('infra/staging/resource-plan.json', 'utf8'));
          const blockers = Array.isArray(plan.blockingConditions) ? plan.blockingConditions : [];
          if (
            plan.environment !== 'staging' ||
            plan.status !== 'provisioned' ||
            plan.firstDeploymentReadiness !== 'ready' ||
            blockers.length > 0
          ) {
            throw new Error(
              `Staging first deployment is blocked: status=${plan.status}, readiness=${plan.firstDeploymentReadiness}, blockers=${blockers.join(',')}`,
            );
          }
          NODE

      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装阿里云 CLI
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: 任务重跑时恢复不可变 RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'REUSE_RC=false' >> "$GITHUB_ENV"
          if ! gh release view "$STAGING_RELEASE_ID" >/dev/null 2>&1; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/attestations"
          gh release download "$STAGING_RELEASE_ID" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json --pattern artifact-index.json \
            --pattern 'attestation-*.jsonl'
          mv "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/manifest.json"
          node scripts/release/attestation-snapshot.mjs select \
            "$RUNNER_TEMP/release"/attestation-*.jsonl \
            "$RUNNER_TEMP/attestations/$STAGING_RELEASE_ID.jsonl"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts \
            "$RUNNER_TEMP/manifest.json" "$STAGING_RELEASE_ID"
          test "$(jq -r .releaseSha "$RUNNER_TEMP/manifest.json")" = "$GITHUB_SHA"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/manifest.json")"
          git fetch --no-tags origin "refs/tags/$STAGING_RELEASE_ID:refs/tags/$STAGING_RELEASE_ID"
          test "$(git rev-parse "$STAGING_RELEASE_ID^{commit}")" = "$GITHUB_SHA"
          tag_object="$(git rev-parse "$STAGING_RELEASE_ID^{tag}")"
          git cat-file -p "$tag_object" | grep -Fx "manifest-digest: $manifest_digest"
          node scripts/release/verify-artifact.mjs "$RUNNER_TEMP/release/artifact-index.json" "$GITHUB_SHA" || {
            destination="$STAGING_RELEASE_OSS_URI/$STAGING_RELEASE_ID"
            rm -rf "$RUNNER_TEMP/release" && mkdir -p "$RUNNER_TEMP/release"
            aliyun --secure oss cp "$destination/" "$RUNNER_TEMP/release/" --recursive \
              --region "$RELEASE_RECORD_OSS_REGION"
            node scripts/release/verify-artifact.mjs "$RUNNER_TEMP/release/artifact-index.json" "$GITHUB_SHA"
          }
          echo "MANIFEST_DIGEST=$manifest_digest" >> "$GITHUB_ENV"
          echo 'REUSE_RC=true' >> "$GITHUB_ENV"

      - name: 读取权威候选与生产证据
        if: env.REUSE_RC != 'true'
        run: |
          set -euo pipefail
          : "${RELEASE_EVIDENCE_URL:?Missing staging variable RELEASE_EVIDENCE_URL}"
          : "${RELEASE_EVIDENCE_TOKEN:?Missing staging secret RELEASE_EVIDENCE_TOKEN}"
          curl -fsS --retry 3 \
            -H "authorization: Bearer $RELEASE_EVIDENCE_TOKEN" \
            "$RELEASE_EVIDENCE_URL?sha=$GITHUB_SHA" > "$RUNNER_TEMP/authoritative-evidence.json"
          test "$(jq -r .releaseSha "$RUNNER_TEMP/authoritative-evidence.json")" = "$GITHUB_SHA"
          test "$(jq -r .ok "$RUNNER_TEMP/authoritative-evidence.json")" = true
          baseline="$(jq -r .productionBaseline.api.sourceSha "$RUNNER_TEMP/authoritative-evidence.json")"
          git cat-file -e "$baseline^{commit}"
          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
          node scripts/release/classify-components.mjs --baseline "$baseline" --target "$GITHUB_SHA" > "$RUNNER_TEMP/classification.json"
          diff <(jq -S .components "$RUNNER_TEMP/classification.json") \
               <(jq -S .affectedComponents "$RUNNER_TEMP/authoritative-evidence.json")
          if ! node scripts/release/migration-plan.mjs --changed-paths "$RUNNER_TEMP/classification.json" \
            --baseline "$baseline" --target "$GITHUB_SHA" > "$RUNNER_TEMP/migration-plan.json"; then
            cat "$RUNNER_TEMP/migration-plan.json" >&2
            exit 1
          fi
          diff <(jq -S .migrationPlan "$RUNNER_TEMP/migration-plan.json") \
               <(jq -S .migrationPlan "$RUNNER_TEMP/authoritative-evidence.json")
      - name: 按需解析精确 ACS 镜像
        if: env.REUSE_RC != 'true'
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ACR_READ_ACCESS_KEY_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ACR_READ_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          include_acs=false
          if jq -e '.affectedComponents | index("acs") != null' "$RUNNER_TEMP/authoritative-evidence.json" >/dev/null; then
            : "${ALIBABACLOUD_ACCESS_KEY_ID:?Missing staging secret ACR_READ_ACCESS_KEY_ID}"
            : "${ALIBABACLOUD_ACCESS_KEY_SECRET:?Missing staging secret ACR_READ_ACCESS_KEY_SECRET}"
            include_acs=true
            RELEASE_SHA="$GITHUB_SHA" OUTPUT_FILE="$RUNNER_TEMP/acs-image.json" \
              bash scripts/release/wait-for-acr-image.sh
          fi
          echo "INCLUDE_ACS=$include_acs" >> "$GITHUB_ENV"

      - name: 一次性构建不可变产物
        if: env.REUSE_RC != 'true'
        env:
          VITE_API_BASE: https://api.agent.kaiyan.net
          VITE_WEB_ORIGIN: https://agent.kaiyan.net
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          args=(--sha="$GITHUB_SHA" --out="$RUNNER_TEMP/release")
          if [ "$INCLUDE_ACS" = true ]; then
            args+=(--include-acs --acs-image="$(jq -r .reference "$RUNNER_TEMP/acs-image.json")")
          fi
          node scripts/release/build-release.mjs "${args[@]}"
          node scripts/release/verify-artifact.mjs "$RUNNER_TEMP/release/artifact-index.json" "$GITHUB_SHA"

      - name: 持久化内容寻址产物
        if: env.REUSE_RC != 'true'
        run: |
          set -euo pipefail
          : "${STAGING_RELEASE_OSS_URI:?Missing staging variable STAGING_RELEASE_OSS_URI}"
          case "$STAGING_RELEASE_OSS_URI" in oss://*) ;; *) echo 'Release URI must be OSS'; exit 1 ;; esac
          destination="$STAGING_RELEASE_OSS_URI/$STAGING_RELEASE_ID"
          if aliyun --secure oss stat "$destination/artifact-index.json" \
            --region "$RELEASE_RECORD_OSS_REGION" >/dev/null 2>&1; then
            rm -rf "$RUNNER_TEMP/release-saved"
            mkdir -p "$RUNNER_TEMP/release-saved"
            aliyun --secure oss cp "$destination/" "$RUNNER_TEMP/release-saved/" \
              --recursive --region "$RELEASE_RECORD_OSS_REGION"
            node scripts/release/verify-artifact.mjs "$RUNNER_TEMP/release-saved/artifact-index.json" "$GITHUB_SHA"
            rm -rf "$RUNNER_TEMP/release"
            mv "$RUNNER_TEMP/release-saved" "$RUNNER_TEMP/release"
          else
            while IFS= read -r -d '' source; do
              bash scripts/release/upload-oss-object-immutable.sh \
                "$source" "$destination/$(basename "$source")"
            done < <(find "$RUNNER_TEMP/release" -maxdepth 1 -type f -print0)
            rm -rf "$RUNNER_TEMP/release-saved"
            mkdir -p "$RUNNER_TEMP/release-saved"
            aliyun --secure oss cp "$destination/" "$RUNNER_TEMP/release-saved/" \
              --recursive --region "$RELEASE_RECORD_OSS_REGION"
            node scripts/release/verify-artifact.mjs \
              "$RUNNER_TEMP/release-saved/artifact-index.json" "$GITHUB_SHA"
          fi

      - name: 创建规范发布清单
        if: env.REUSE_RC != 'true'
        run: |
          set -euo pipefail
          node scripts/release/assemble-release-evidence.mjs \
            --authoritative "$RUNNER_TEMP/authoritative-evidence.json" \
            --index "$RUNNER_TEMP/release/artifact-index.json" \
            --sha "$GITHUB_SHA" --release-id "$STAGING_RELEASE_ID" \
            --actor "$GITHUB_ACTOR" --created-at "$RELEASE_CREATED_AT" \
            --expires-at "$RELEASE_EXPIRES_AT" --artifact-base-uri "$STAGING_RELEASE_OSS_URI" \
            --output "$RUNNER_TEMP/release-evidence.json"
          pnpm exec tsx server/src/release/createReleaseCandidateCli.ts \
            --input "$RUNNER_TEMP/release-evidence.json" \
            --output "$RUNNER_TEMP/manifest.json"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts \
            "$RUNNER_TEMP/manifest.json" "$STAGING_RELEASE_ID"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/manifest.json")"
          echo "MANIFEST_DIGEST=$manifest_digest" >> "$GITHUB_ENV"

      - name: 实例化并校验清单选定产物
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected"
          fetch() {
            local uri="$1" target="$2"
            case "$uri" in
              oss://*) aliyun --secure oss cp "$uri" "$target" --region "$RELEASE_RECORD_OSS_REGION" ;;
              https://*) curl -fsSL --retry 3 "$uri" -o "$target" ;;
              *) echo "Unsupported immutable artifact URI: $uri" >&2; return 1 ;;
            esac
          }
          for pair in 'serverBundle server-bundle.tgz' 'webAssets web-assets.tgz' 'acsOrchestrator acs-orchestrator.tgz'; do
            set -- $pair
            uri="$(jq -r ".artifacts.$1.uri" "$RUNNER_TEMP/manifest.json")"
            fetch "$uri" "$RUNNER_TEMP/selected/$2"
          done
          if [ "$(jq -r .schemaVersion "$RUNNER_TEMP/manifest.json")" = 2 ]; then
            fetch "$(jq -r .artifacts.runtimeDependencies.server.uri "$RUNNER_TEMP/manifest.json")" \
              "$RUNNER_TEMP/selected/runtime-dependencies-server.json"
            fetch "$(jq -r .artifacts.runtimeDependencies.acs.uri "$RUNNER_TEMP/manifest.json")" \
              "$RUNNER_TEMP/selected/runtime-dependencies-acs.json"
          fi
          node scripts/release/verify-selected-release-artifacts.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/selected"
          staging_runtime_path="$(jq -r .artifacts.stagingRuntimeAssets.path "$RUNNER_TEMP/release/artifact-index.json")"
          staging_runtime_digest="$(jq -r .artifacts.stagingRuntimeAssets.digest "$RUNNER_TEMP/release/artifact-index.json")"
          test "$staging_runtime_path" = staging-runtime-assets.tgz
          cp "$RUNNER_TEMP/release/$staging_runtime_path" \
            "$RUNNER_TEMP/selected/staging-runtime-assets.tgz"
          test "sha256:$(sha256sum "$RUNNER_TEMP/selected/staging-runtime-assets.tgz" | cut -d' ' -f1)" = \
            "$staging_runtime_digest"
          jq -n \
            --arg releaseId "$STAGING_RELEASE_ID" \
            --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg serverDigest "$(jq -r .components.api.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg acsOrchestratorDigest "$(jq -r .components.acs.orchestratorArtifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg acsImageDigest "$(jq -r .components.acs.sandboxImageDigest "$RUNNER_TEMP/manifest.json")" \
            --arg stagingRuntimeAssetsDigest "$staging_runtime_digest" \
            '{schemaVersion:1,releaseId:$releaseId,manifestDigest:$manifestDigest,serverDigest:$serverDigest,webDigest:$webDigest,acsOrchestratorDigest:$acsOrchestratorDigest,acsImageDigest:$acsImageDigest,stagingRuntimeAssetsDigest:$stagingRuntimeAssetsDigest}' \
            > "$RUNNER_TEMP/staging-runtime-summary.json"

      - name: 创建不可变 RC 标签、Release 与构建证明
        if: env.REUSE_RC != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse "$STAGING_RELEASE_ID^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$STAGING_RELEASE_ID^{commit}")" = "$GITHUB_SHA"
            tag_object="$(git rev-parse "$STAGING_RELEASE_ID^{tag}")"
            git cat-file -p "$tag_object" | grep -Fx "manifest-digest: $MANIFEST_DIGEST"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag -a "$STAGING_RELEASE_ID" "$GITHUB_SHA" \
              -m "Agent SaaS $STAGING_RELEASE_ID" -m "manifest-digest: $MANIFEST_DIGEST"
            git push origin "refs/tags/$STAGING_RELEASE_ID"
          fi
          mkdir -p "$RUNNER_TEMP/attestations"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$STAGING_RELEASE_ID" \
            --digest "$MANIFEST_DIGEST" --state built \
            --operation "build:$GITHUB_RUN_ID" --actor "$GITHUB_ACTOR" \
            --reason "$DISPATCH_REASON"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$STAGING_RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"

          records_root="$RUNNER_TEMP/immutable-release-records"
          record_uri="$STAGING_RELEASE_OSS_URI/records/$STAGING_RELEASE_ID"
          if aliyun --secure oss stat "$record_uri/record.json" \
            --region "$RELEASE_RECORD_OSS_REGION" >/dev/null 2>&1; then
            mkdir -p "$records_root/$STAGING_RELEASE_ID"
            aliyun --secure oss cp "$record_uri/" "$records_root/$STAGING_RELEASE_ID/" \
              --recursive --region "$RELEASE_RECORD_OSS_REGION"
          fi
          node scripts/release/publish-release-record.mjs "$RUNNER_TEMP/manifest.json" \
            "$RUNNER_TEMP/release/artifact-index.json" "$records_root" "$RUNNER_TEMP/selected"
          for file in manifest.json artifact-index.json record.json; do
            bash scripts/release/upload-oss-object-immutable.sh \
              "$records_root/$STAGING_RELEASE_ID/$file" "$record_uri/$file"
          done
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$record_uri/attestations/$(basename "$snapshot_path")"

          ! gh release view "$STAGING_RELEASE_ID" >/dev/null 2>&1
          gh release create "$STAGING_RELEASE_ID" --verify-tag --prerelease \
            --title "$STAGING_RELEASE_ID" --notes "$DISPATCH_REASON" \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/release/artifact-index.json" \
            "$snapshot_path"

      - name: 创建 GitHub 测试环境部署记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_id="$(jq -n --arg ref "$GITHUB_SHA" --arg releaseId "$STAGING_RELEASE_ID" \
            '{ref:$ref,environment:"staging",auto_merge:false,required_contexts:[],payload:{releaseId:$releaseId}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          test "$deployment_id" -gt 0
          echo "STAGING_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=in_progress -f environment=staging \
            -f environment_url="$STAGING_WEB_URL" >/dev/null

      - name: 为当前 Runner 授权测试环境 SSH
        run: |
          set -euo pipefail
          runner_ip="$(curl -4 -fsS --retry 5 https://api.ipify.org)"
          node -e "if (!require('node:net').isIPv4(process.argv[1])) process.exit(1)" "$runner_ip"
          security_group_id="$(jq -r .resources.api.securityGroupId infra/staging/resource-plan.json)"
          printf '%s' "$security_group_id" | grep -Eq '^sg-[a-z0-9]+$'
          source_cidr="$runner_ip/32"
          {
            echo "STAGING_SSH_SECURITY_GROUP_ID=$security_group_id"
            echo "STAGING_SSH_SOURCE_CIDR=$source_cidr"
          } >> "$GITHUB_ENV"
          aliyun --region cn-shenzhen ecs AuthorizeSecurityGroup \
            --RegionId cn-shenzhen --SecurityGroupId "$security_group_id" \
            --IpProtocol TCP --PortRange 22/22 --SourceCidrIp "$source_cidr" \
            --Policy accept --Priority 1 \
            --Description "GitHub Staging SSH $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --ClientToken "staging-ssh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null

      - name: 配置测试环境 SSH
        run: |
          set -euo pipefail
          : "${STAGING_ECS_HOST:?Missing secret STAGING_ECS_HOST}"
          : "${STAGING_ECS_USER:?Missing secret STAGING_ECS_USER}"
          : "${STAGING_ECS_SSH_KEY:?Missing secret STAGING_ECS_SSH_KEY}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_ECS_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          : "${STAGING_SSH_HOST_KEY_SHA256:?Missing pinned Staging SSH host key fingerprint}"
          scan_path="$RUNNER_TEMP/staging-known-host"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -t ed25519 -H "$STAGING_ECS_HOST" > "$scan_path"; then
              break
            fi
            test "$attempt" -lt 5
            sleep 2
          done
          test -s "$scan_path"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/staging-known-host" -E sha256 | awk '{print $2}')" = \
            "$STAGING_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/staging-known-host" >> ~/.ssh/known_hosts

      - name: 部署精确的测试环境 API、Worker 与 ACS 产物
        run: |
          set -euo pipefail
          remote="/tmp/agent-saas-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/staging_key "$STAGING_ECS_USER@$STAGING_ECS_HOST" "mkdir -p '$remote'"
          # The deploy gate imports the shared strict private ConfigIdentity contract.
          scp -i ~/.ssh/staging_key "$RUNNER_TEMP/selected/"*.tgz "$RUNNER_TEMP/manifest.json" \
            scripts/release/deploy-staging-release.sh scripts/release/verify-installed-release.mjs \
            scripts/release/read-production-state.mjs scripts/release/read-runtime-identity.mjs \
            scripts/release/artifact-lib.mjs \
            daemon-packaging/systemd/agent-saas-server-staging.service.template \
            daemon-packaging/systemd/agent-saas-runtime-worker-staging.service.template \
            daemon-packaging/systemd/agent-saas-acs-orchestrator-staging.service.template \
            "$STAGING_ECS_USER@$STAGING_ECS_HOST:$remote/"
          ssh -i ~/.ssh/staging_key "$STAGING_ECS_USER@$STAGING_ECS_HOST" \
            "RELEASE_DIR='$remote' UNIT_DIR='$remote' MANIFEST_PATH='$remote/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' STAGING_RUNTIME_ASSETS_PATH='$remote/staging-runtime-assets.tgz' STAGING_RUNTIME_ASSETS_DIGEST='$(jq -r .stagingRuntimeAssetsDigest "$RUNNER_TEMP/staging-runtime-summary.json")' VERIFY_INSTALLED_SCRIPT='$remote/verify-installed-release.mjs' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash '$remote/deploy-staging-release.sh'"

      - name: 最后发布精确的测试环境 Web 产物
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/web-assets" && mkdir -p "$RUNNER_TEMP/web-assets"
          tar -xzf "$RUNNER_TEMP/selected/web-assets.tgz" -C "$RUNNER_TEMP/web-assets"
          jq -n \
            --arg releaseId "$STAGING_RELEASE_ID" --arg releaseSha "$(jq -r .components.web.sourceSha "$RUNNER_TEMP/manifest.json")" \
            --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg configFingerprint "$(jq -r .digest "$RUNNER_TEMP/manifest.json")" \
            '{schemaVersion:1,environment:"staging",releaseId:$releaseId,releaseSha:$releaseSha,webDigest:$webDigest,configFingerprint:$configFingerprint}' \
            > "$RUNNER_TEMP/web-assets/release-identity.json"
          aliyun --secure oss cp "$RUNNER_TEMP/web-assets/" "$STAGING_WEB_OSS_URI/" \
            --recursive --force --exclude index.html --exclude release-identity.json \
            --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$RUNNER_TEMP/web-assets/release-identity.json" \
            "$STAGING_WEB_OSS_URI/release-identity.json" --force \
            --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$RUNNER_TEMP/web-assets/index.html" \
            "$STAGING_WEB_OSS_URI/index.html" --force \
            --region "$RELEASE_RECORD_OSS_REGION"
          rm -rf "$RUNNER_TEMP/web-oss-readback"
          mkdir -p "$RUNNER_TEMP/web-oss-readback"
          export WEB_ASSETS_ROOT="$RUNNER_TEMP/web-assets"
          export WEB_OSS_READBACK_ROOT="$RUNNER_TEMP/web-oss-readback"
          export STAGING_WEB_OSS_URI RELEASE_RECORD_OSS_REGION
          find "$WEB_ASSETS_ROOT" -type f -print0 | \
            xargs -0 -r -P 8 -n 1 bash -euo pipefail -c '
              source="$1"
              relative="${source#"$WEB_ASSETS_ROOT/"}"
              target="$WEB_OSS_READBACK_ROOT/$relative"
              mkdir -p "$(dirname "$target")"
              aliyun --secure oss cp "$STAGING_WEB_OSS_URI/$relative" \
                "$target" --region "$RELEASE_RECORD_OSS_REGION"
              cmp "$source" "$target"
            ' _
          curl -fsS --retry 10 "$STAGING_WEB_URL" >/dev/null

      - name: 校验迁移与隔离的集成测试夹具
        run: |
          set -euo pipefail
          remote="/tmp/agent-saas-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scp -i ~/.ssh/staging_key scripts/staging/ensure-integration-fixture.mjs \
            "$STAGING_ECS_USER@$STAGING_ECS_HOST:$remote/"
          ssh -i ~/.ssh/staging_key "$STAGING_ECS_USER@$STAGING_ECS_HOST" \
            "AGENT_SAAS_ENVIRONMENT=staging node '$remote/ensure-integration-fixture.mjs' '$STAGING_RELEASE_ID'" \
            > "$RUNNER_TEMP/staging-integration-fixture.json"
          test "$(jq -r .releaseId "$RUNNER_TEMP/staging-integration-fixture.json")" = \
            "$STAGING_RELEASE_ID"
          test "$(jq -r .migrationReadback.status "$RUNNER_TEMP/staging-integration-fixture.json")" = present
          test "$(jq -r .fixture.state "$RUNNER_TEMP/staging-integration-fixture.json")" = canceled
          test "$(jq -r .fixture.evidenceScope "$RUNNER_TEMP/staging-integration-fixture.json")" = \
            storage-and-authenticated-readback-only
          integration_task_id="$(jq -r .fixture.taskId "$RUNNER_TEMP/staging-integration-fixture.json")"
          test "$integration_task_id" = staging-e2e-integration-task

      - name: 校验在线反向隔离证据
        run: |
          set -euo pipefail
          : "${STAGING_ISOLATION_EVIDENCE_URL:?Missing staging variable}"
          remote="/tmp/agent-saas-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scp -i ~/.ssh/staging_key infra/staging/resource-plan.json \
            scripts/staging/collect-isolation-host.mjs \
            scripts/staging/publish-isolation-evidence.mjs \
            "$STAGING_ECS_USER@$STAGING_ECS_HOST:$remote/"
          ssh -i ~/.ssh/staging_key "$STAGING_ECS_USER@$STAGING_ECS_HOST" \
            "node '$remote/collect-isolation-host.mjs' staging '$STAGING_RELEASE_ID' '$remote/resource-plan.json'" \
            > "$RUNNER_TEMP/isolation-host-evidence.json"
          jq -nc --arg accessKeyId "$ALIYUN_ACCESS_KEY_ID" \
            --arg accessKeySecret "$ALIYUN_ACCESS_KEY_SECRET" \
            '{accessKeyId:$accessKeyId,accessKeySecret:$accessKeySecret}' | \
            node scripts/staging/collect-isolation-evidence.mjs \
              --release-id "$STAGING_RELEASE_ID" \
              --resource-plan infra/staging/resource-plan.json \
              --host-evidence "$RUNNER_TEMP/isolation-host-evidence.json" \
              --output "$RUNNER_TEMP/isolation-evidence-input.json"
          node scripts/staging/assert-isolation.mjs "$RUNNER_TEMP/isolation-evidence-input.json" \
            "$RUNNER_TEMP/isolation-summary-expected.json"
          scp -i ~/.ssh/staging_key "$RUNNER_TEMP/isolation-evidence-input.json" \
            "$STAGING_ECS_USER@$STAGING_ECS_HOST:$remote/isolation-evidence-input.json"
          ssh -i ~/.ssh/staging_key "$STAGING_ECS_USER@$STAGING_ECS_HOST" \
            "node '$remote/publish-isolation-evidence.mjs' staging '$STAGING_RELEASE_ID' '$remote/isolation-evidence-input.json'"
          curl -fsS -H "authorization: Bearer $RELEASE_EVIDENCE_TOKEN" \
            "$STAGING_ISOLATION_EVIDENCE_URL?releaseId=$STAGING_RELEASE_ID" \
            > "$RUNNER_TEMP/isolation-evidence.json"
          node scripts/staging/assert-isolation.mjs "$RUNNER_TEMP/isolation-evidence.json" \
            "$RUNNER_TEMP/isolation-summary.json"
          diff <(jq -S . "$RUNNER_TEMP/isolation-evidence-input.json") \
            <(jq -S . "$RUNNER_TEMP/isolation-evidence.json")
          diff <(jq -S 'del(.observedAt)' "$RUNNER_TEMP/isolation-summary-expected.json") \
            <(jq -S 'del(.observedAt)' "$RUNNER_TEMP/isolation-summary.json")
          echo "STAGING_ISOLATION_SUMMARY=$RUNNER_TEMP/isolation-summary.json" >> "$GITHUB_ENV"

      - name: 记录确定性的测试环境部署与校验结果
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log_root="$RUNNER_TEMP/attestations"
          current="$(tail -n1 "$log_root/$STAGING_RELEASE_ID.jsonl" | jq -r .state)"
          if [ "$current" = built ]; then
            verification_summary="$(jq -nc \
              '{schemaVersion:1,mode:"deterministic-deployment-gates-v1",status:"passed",checks:["immutable-artifacts","runtime-identity","api-readiness","acs-health","web-readback","migration-readback","reverse-isolation"]}')"
            staging_reason="$(jq -nc --arg deploymentId "$STAGING_DEPLOYMENT_ID" --arg stagingRunId "$GITHUB_RUN_ID" \
              --arg manifestDigest "$MANIFEST_DIGEST" \
              --argjson runtimeSummary "$(cat "$RUNNER_TEMP/staging-runtime-summary.json")" \
              --argjson verificationSummary "$verification_summary" \
              '{stagingDeploymentId:$deploymentId,stagingRunId:$stagingRunId,manifestDigest:$manifestDigest,runtimeSummary:$runtimeSummary,verificationSummary:$verificationSummary}')"
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$log_root" --release-id "$STAGING_RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state staging_deployed --operation "staging:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
              --actor "$GITHUB_ACTOR" --reason "$staging_reason"
            current=staging_deployed
          fi
          if [ "$current" = staging_deployed ]; then
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$log_root" --release-id "$STAGING_RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state verified --operation "deterministic:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
              --actor "$GITHUB_ACTOR"
            current=verified
          fi
          test "$current" = verified
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$log_root/$STAGING_RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh \
            "$STAGING_RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$STAGING_RELEASE_OSS_URI/records/$STAGING_RELEASE_ID/attestations/$(basename "$snapshot_path")"

      - name: 撤销临时测试环境 SSH 入站授权
        if: always() && env.STAGING_SSH_SOURCE_CIDR != ''
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if aliyun --region cn-shenzhen ecs RevokeSecurityGroup \
              --RegionId cn-shenzhen --SecurityGroupId "$STAGING_SSH_SECURITY_GROUP_ID" \
              --IpProtocol TCP --PortRange 22/22 --SourceCidrIp "$STAGING_SSH_SOURCE_CIDR" \
              --Policy accept --Priority 1 >/dev/null; then
              exit 0
            fi
            test "$attempt" -lt 5
            sleep 2
          done

      - name: 完成 GitHub 测试环境部署记录
        if: always() && env.STAGING_DEPLOYMENT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$WORKFLOW_STATUS" = success ] && state=success
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$STAGING_DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment=staging -f environment_url="$STAGING_WEB_URL" >/dev/null

      - name: 校验完整的测试环境证据包
        if: success()
        run: |
          set -euo pipefail
          for evidence in manifest.json isolation-summary.json staging-runtime-summary.json \
            staging-integration-fixture.json; do
            test -f "$RUNNER_TEMP/$evidence"
          done

      - name: 上传独立测试环境证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ env.STAGING_RELEASE_ID }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/isolation-summary.json
            ${{ runner.temp }}/staging-runtime-summary.json
            ${{ runner.temp }}/staging-integration-fixture.json
