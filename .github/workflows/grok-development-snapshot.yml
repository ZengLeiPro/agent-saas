name: Grok development snapshot

on:
  push:
    branches: [feat/grok-subscription-global-pool]
    paths: [.github/workflows/grok-development-snapshot.yml, scripts/grok-apply.py]

permissions:
  contents: write

concurrency:
  group: grok-isolated-development
  cancel-in-progress: false

jobs:
  implementation:
    if: github.ref == 'refs/heads/feat/grok-subscription-global-pool'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/grok-subscription-global-pool
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed implementation on the feature branch only
        if: hashFiles('scripts/grok-apply.py') != ''
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/grok-subscription-global-pool
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/grok-apply.py')
          s = p.read_text()
          if "['runtime/responses/responsesTransport.ts', 'types/index.ts']" in s:
              s = s.replace("['runtime/responses/responsesTransport.ts', 'types/index.ts']", "['runtime/responses/responsesTransport.ts']")
              p.write_text(s)
              for name in ['server/src/types/index.ts', 'server/src/agent/titleGenerator.ts', 'web/src/components/ModelManager/modelConfigTypes.ts']:
                  target = Path(name)
                  content = target.read_text()
                  for quote in ["'", '"']:
                      old = f'{quote}openai_compatible{quote} | {quote}codex_subscription{quote}'
                      if old in content and old + f' | {quote}grok_subscription{quote}' not in content:
                          content = content.replace(old, old + f' | {quote}grok_subscription{quote}')
                  target.write_text(content)
          PY
          python3 scripts/grok-apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/src/runtime/responses/codexCredentialFailover.ts')
          s = p.read_text()
          s = s.replace('return executeOrderedSubscriptionFailover({', "return executeOrderedSubscriptionFailover<Awaited<ReturnType<typeof getCredentialsForCredential>>, ResponsesTransportExecuteResult, LastQuota>({")
          p.write_text(s)
          PY
          rm scripts/grok-apply.py
          git add -A
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'feat(grok): apply subscription implementation work package'
          git push origin HEAD:refs/heads/feat/grok-subscription-global-pool
          echo "Validated worktree SHA: $(git rev-parse HEAD)"
      - name: Check server types
        run: pnpm -F server typecheck
      - name: Check web and shared types
        run: pnpm -F web typecheck && pnpm -F @agent/shared typecheck
      - name: Codex subscription regression
        run: pnpm -F server exec vitest run codex
