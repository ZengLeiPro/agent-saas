name: Grok development snapshot
on:
  push:
    branches: [feat/grok-subscription-global-pool]
    paths: [.github/workflows/grok-development-snapshot.yml, scripts/grok-apply.py, scripts/grok-followup.py, scripts/grok-prepare.py]
permissions:
  contents: write
concurrency:
  group: grok-isolated-development
  cancel-in-progress: false
jobs:
  implementation:
    if: github.ref == 'refs/heads/feat/grok-subscription-global-pool'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_saas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_saas_test
      MEMORY_CONSOLIDATION_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_saas_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/grok-subscription-global-pool
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed feature changes
        run: |
          set -euo pipefail
          {
            test "$(git branch --show-current)" = feat/grok-subscription-global-pool
            if [ -f scripts/grok-prepare.py ]; then
              python3 scripts/grok-prepare.py
              rm scripts/grok-prepare.py
            fi
            for script in scripts/grok-apply.py scripts/grok-followup.py; do
              if [ -f "$script" ]; then
                python3 "$script"
                rm "$script"
              fi
            done
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'fix(grok): complete reviewed integration and regression coverage'
              git push origin HEAD:refs/heads/feat/grok-subscription-global-pool
            fi
          } 2>&1 | tee /tmp/grok-apply.log
      - name: Validate independently and preserve exact-SHA diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], text=True, **kwargs).strip()
          status=git('status','--porcelain')
          sha=git('rev-parse','HEAD')
          remote=git('ls-remote','origin','refs/heads/feat/grok-subscription-global-pool').split()[0]
          report={'sha':sha,'remoteFeatureSha':remote,'pushed':sha==remote,'main':git('rev-parse','origin/main'),'run':os.environ['GITHUB_RUN_ID'],'worktreeClean':not status,'worktreeStatus':status.splitlines(),'checks':[]}
          if Path('/tmp/grok-apply.log').exists():
              report['applyTail']=Path('/tmp/grok-apply.log').read_text().splitlines()[-70:]
          report['changedFiles']=git('diff','--name-status','origin/main...HEAD').splitlines()
          report['instructions']={p:Path(p).read_text() for p in git('ls-files').splitlines() if p.endswith('AGENTS.md') and not p.startswith('packages/')}
          def publish():
              raw=json.dumps(report,ensure_ascii=False,indent=2)
              Path('/tmp/grok-validation.json').write_text(raw)
              blob=git('hash-object','-w','--stdin',input=raw)
              tree=git('mktree',input=f'100644 blob {blob}\treport.json\n')
              prior=subprocess.run(['git','rev-parse','--verify','refs/remotes/origin/workbench/grok-validation'],capture_output=True,text=True)
              parents=['-p',prior.stdout.strip()] if prior.returncode==0 else []
              env=dict(os.environ,GIT_AUTHOR_NAME='OpenAI',GIT_AUTHOR_EMAIL='noreply@openai.com',GIT_COMMITTER_NAME='OpenAI',GIT_COMMITTER_EMAIL='noreply@openai.com')
              commit=git('commit-tree',tree,*parents,input='Grok isolated validation evidence\n',env=env)
              subprocess.run(['git','push','origin',f'{commit}:refs/heads/workbench/grok-validation'],check=True)
              subprocess.run(['git','update-ref','refs/remotes/origin/workbench/grok-validation',commit],check=True)
          publish()
          commands=[
              ('grok-migration','node scripts/release/grok-migration-evidence.mjs origin/main HEAD'),
              ('server-types','pnpm -F server typecheck'),
              ('web-types','pnpm -F web typecheck'),
              ('shared-types','pnpm -F @agent/shared typecheck'),
              ('mobile-types','pnpm -F mobile typecheck'),
              ('subscription-tests','pnpm -F server exec vitest run codex grok subscription'),
              ('publication-tests','pnpm -F server exec vitest run productionModelPublication configIdentity sharedConfigRefresher'),
              ('ui-tests','pnpm -F web exec vitest run src/components/ModelManager src/components/PlatformAdmin/pages/ProviderQuota'),
              ('ratchets','pnpm check:ratchets'),
              ('config-governance','pnpm test:config-governance'),
              ('release-contracts','pnpm test:release-contracts'),
              ('server-build','pnpm -F server build'),
              ('web-build','pnpm -F web build'),
              ('full-shared','pnpm -F @agent/shared exec vitest run'),
              ('full-server','pnpm -F server exec vitest run --maxWorkers=2'),
              ('full-web','NODE_ENV=test pnpm -F web exec vitest run --testTimeout=15000 --maxWorkers=2'),
          ]
          failed=False
          for name,command in commands:
              started=time.monotonic()
              try:
                  result=subprocess.run(command,shell=True,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=1200)
                  code,output=result.returncode,result.stdout
              except subprocess.TimeoutExpired as error:
                  code,output=124,str(error.stdout)
              output=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',output)
              Path(f'/tmp/grok-{name}.log').write_text(output)
              lines=output.splitlines()
              selected=set(range(max(0,len(lines)-24),len(lines)))
              if name=='grok-migration': selected=set(range(len(lines)))
              elif code:
                  for i,line in enumerate(lines):
                      if re.search(r'not ok|FAIL|Error|error TS|GROWN|LOWERED|Assertion|conflict',line):
                          selected.update(range(max(0,i-1),min(len(lines),i+16)))
              summary=[lines[i] for i in sorted(selected)]
              report['checks'].append({'name':name,'command':command,'exitCode':code,'seconds':round(time.monotonic()-started,2),'outputLines':summary[:1000]})
              failed|=code!=0
              print(name,code,flush=True)
              publish()
          raise SystemExit(1 if failed or not report['worktreeClean'] or not report['pushed'] else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-development-diagnostics-${{ github.run_id }}
          path: /tmp/grok-*.log
          retention-days: 7
