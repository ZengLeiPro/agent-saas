name: Integration v3 Production Preflight

on:
  workflow_dispatch:

concurrency:
  group: agent-saas-integration-v3-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing secret ECS_HOST}"
          : "${ECS_USER:?Missing secret ECS_USER}"
          : "${ECS_SSH_KEY:?Missing secret ECS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production prerequisites without revealing values
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ecs_deploy_key \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$ECS_USER@$ECS_HOST" 'python3 -' <<'PY'
          import json, os, stat, subprocess
          from pathlib import Path

          config_path = Path('/etc/agent-saas/config.json')
          checks = {}
          def check(name, passed, detail):
              checks[name] = {'passed': bool(passed), 'detail': detail}

          try:
              config = json.loads(config_path.read_text())
              check('config_parse', True, 'ok')
          except Exception:
              config = {}
              check('config_parse', False, 'missing_or_invalid')

          control = config.get('integrationV3ControlPlane') if isinstance(config, dict) else None
          check('control_plane_section', isinstance(control, dict), 'present' if isinstance(control, dict) else 'missing')
          if not isinstance(control, dict):
              control = {}
          check('enabled_boolean', control.get('enabled') is True, 'enabled' if control.get('enabled') is True else 'missing_or_disabled')
          root = control.get('controlledMirrorRoot')
          root_ok = isinstance(root, str) and os.path.isabs(root) and os.path.isdir(root)
          if root_ok:
              resolved_root = os.path.realpath(root)
              mode = stat.S_IMODE(os.stat(resolved_root).st_mode)
              root_ok = resolved_root != os.path.sep and mode & 0o022 == 0
          check('controlled_mirror_root', root_ok, 'safe_directory' if root_ok else 'missing_or_unsafe')
          token_mode = control.get('githubTokenMode')
          check('github_token_mode', token_mode in ('github_app', 'personal_access_token'), token_mode if token_mode in ('github_app', 'personal_access_token') else 'missing_or_invalid')
          if token_mode == 'github_app':
              check('github_installation_id', isinstance(control.get('githubAppInstallationId'), int) and control.get('githubAppInstallationId') > 0, 'configured' if isinstance(control.get('githubAppInstallationId'), int) and control.get('githubAppInstallationId') > 0 else 'missing')
              app = control.get('githubApp')
              app_ok = isinstance(app, dict)
              check('github_app_id', app_ok and isinstance(app.get('appId'), int) and app.get('appId') > 0, 'configured' if app_ok and isinstance(app.get('appId'), int) and app.get('appId') > 0 else 'missing')
              check('github_private_key_ref', app_ok and isinstance(app.get('privateKeyRef'), str) and bool(app.get('privateKeyRef').strip()), 'configured' if app_ok and isinstance(app.get('privateKeyRef'), str) and bool(app.get('privateKeyRef').strip()) else 'missing')
          elif token_mode == 'personal_access_token':
              checks['existing_pat_runtime_probe'] = {
                  'status': 'deferred', 'gating': False,
                  'detail': 'runtime_owner_tenant_repository_probe',
              }

          vault = config.get('secretVault') if isinstance(config, dict) else None
          backend = vault.get('backend') if isinstance(vault, dict) else None
          check('durable_secret_vault', backend in ('encrypted-file', 'http'), backend if backend in ('encrypted-file', 'http') else 'missing_or_memory')
          hands = (((config.get('tenantRemoteHands') or {}).get('hands')) or []) if isinstance(config, dict) else []
          acs = [hand for hand in hands if isinstance(hand, dict) and (hand.get('id') == 'agent-saas-acs' or 'acs' in str(hand.get('id', '')).lower())]
          check('acs_orchestrator', len(acs) > 0, 'configured' if acs else 'missing')

          for unit in ('agent-saas-runtime-worker@blue.service', 'agent-saas-runtime-worker@green.service'):
              result = subprocess.run(['systemctl', 'show', unit, '--property=LoadState', '--value'], capture_output=True, text=True)
              check('unit_' + unit.split('@')[1].split('.')[0], result.returncode == 0 and result.stdout.strip() == 'loaded', 'loaded' if result.returncode == 0 and result.stdout.strip() == 'loaded' else 'missing')

          print(json.dumps(checks, ensure_ascii=False, sort_keys=True))
          failed = [name for name, value in checks.items() if value.get('gating', True) and not value.get('passed', False)]
          if failed:
              print('FAILED_CHECKS=' + ','.join(failed))
              raise SystemExit(1)
          print('PREFLIGHT=passed')
          PY
