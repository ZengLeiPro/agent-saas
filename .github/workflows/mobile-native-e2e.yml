name: Mobile Native E2E

on:
  workflow_call:
    inputs:
      configured:
        description: 'Explicitly confirms that every matrix slot has a configured self-hosted runner or device farm'
        required: true
        type: boolean
      matrix_json:
        description: 'Exact four-slot JSON matrix; no provider or runner labels are inferred'
        required: true
        type: string
      build_sha:
        description: 'Full immutable app source/build SHA'
        required: true
        type: string
    secrets:
      MOBILE_E2E_ACCOUNTS_JSON: { required: false }
      MOBILE_E2E_SERVICE_ORIGIN: { required: false }
      MOBILE_E2E_OTP: { required: false }
      MOBILE_E2E_FIXTURE_SERVER_ORIGIN: { required: false }
      MOBILE_E2E_FIXTURE_TOKEN: { required: false }
      MOBILE_E2E_ARTIFACTS_JSON: { required: false }
      MOBILE_E2E_RECEIPT_HMAC_KEY: { required: false }
  workflow_dispatch:
    inputs:
      configured:
        description: 'Run only when the four physical-device slots and provider executables are configured'
        required: true
        type: boolean
        default: false
      matrix_json:
        description: 'Exact four-slot JSON matrix (runnerLabels and providerExecutable are mandatory)'
        required: true
        type: string
        default: '[]'
      build_sha:
        description: 'Full immutable app source/build SHA (defaults to dispatched SHA only when blank)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-native-e2e-${{ inputs.build_sha || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contract:
    name: Native E2E contract and deterministic receipts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_sha: ${{ steps.contract.outputs.build_sha }}
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint Maestro and test contract/receipts
        run: pnpm -F mobile lint:maestro && pnpm -F mobile test:m60-02
      - id: contract
        name: Validate explicit provider matrix
        if: inputs.configured
        env:
          MOBILE_E2E_MATRIX_JSON: ${{ inputs.matrix_json }}
          REQUESTED_BUILD_SHA: ${{ inputs.build_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_BUILD_SHA"
          node mobile/e2e/maestro/scripts/validate-device-matrix.mjs
          {
            echo "build_sha=$REQUESTED_BUILD_SHA"
            echo "matrix<<MATRIX_EOF"
            printf '%s\n' "$MOBILE_E2E_MATRIX_JSON"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Explain intentionally absent real-device job
        if: ${{ !inputs.configured }}
        run: echo 'No physical-device provider matrix was explicitly configured; no real-device receipt will be generated.'

  real_device:
    name: Real device / ${{ matrix.slot }}
    if: inputs.configured
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.contract.outputs.matrix) }}
    runs-on: ${{ matrix.runnerLabels }}
    timeout-minutes: 45
    env:
      MOBILE_E2E_ACCOUNTS_JSON: ${{ secrets.MOBILE_E2E_ACCOUNTS_JSON }}
      MOBILE_E2E_SERVICE_ORIGIN: ${{ secrets.MOBILE_E2E_SERVICE_ORIGIN }}
      MOBILE_E2E_OTP: ${{ secrets.MOBILE_E2E_OTP }}
      MOBILE_E2E_FIXTURE_SERVER_ORIGIN: ${{ secrets.MOBILE_E2E_FIXTURE_SERVER_ORIGIN }}
      MOBILE_E2E_FIXTURE_TOKEN: ${{ secrets.MOBILE_E2E_FIXTURE_TOKEN }}
      MOBILE_E2E_ARTIFACTS_JSON: ${{ secrets.MOBILE_E2E_ARTIFACTS_JSON }}
      MOBILE_E2E_RECEIPT_HMAC_KEY: ${{ secrets.MOBILE_E2E_RECEIPT_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.contract.outputs.build_sha }}
          clean: true
      - name: Verify runner prerequisites without installing a provider
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.contract.outputs.build_sha }}'
          command -v node
          command -v maestro
          test -x '${{ matrix.providerExecutable }}'
      - name: Run fail-closed native E2E contract
        run: |
          set -euo pipefail
          node mobile/e2e/maestro/scripts/run-native-e2e.mjs \
            --platform '${{ matrix.platform }}' \
            --device '${{ matrix.device }}' \
            --osVersion '${{ matrix.osVersion }}' \
            --osRole '${{ matrix.osRole }}' \
            --deviceClass '${{ matrix.deviceClass }}' \
            --buildSha '${{ needs.contract.outputs.build_sha }}' \
            --appId '${{ matrix.appId }}' \
            --version '${{ matrix.version }}' \
            --signingFingerprint '${{ matrix.signingFingerprint }}' \
            --testRunId '${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}' \
            --slot '${{ matrix.slot }}' \
            --providerExecutable '${{ matrix.providerExecutable }}' \
            --outputDir "$GITHUB_WORKSPACE/.native-e2e/${{ matrix.slot }}"
      - name: Retain bounded evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-e2e-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .native-e2e/${{ matrix.slot }}
          if-no-files-found: error
          retention-days: 14

  evidence_validator:
    name: RC/release four-slot evidence validator
    if: always() && inputs.configured
    needs: [contract, real_device]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOBILE_E2E_RECEIPT_HMAC_KEY: ${{ secrets.MOBILE_E2E_RECEIPT_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.contract.outputs.build_sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: native-e2e-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-e2e-receipts
      - name: Require iOS minimum/latest and Android flagship/low-end-small on one HEAD/build
        run: |
          set -euo pipefail
          test '${{ needs.real_device.result }}' = success
          node mobile/e2e/maestro/scripts/validate-evidence.mjs \
            --receipts native-e2e-receipts \
            --buildSha '${{ needs.contract.outputs.build_sha }}' \
            --mode real
