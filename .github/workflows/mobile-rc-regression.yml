name: Mobile M70-01 RC Regression

on:
  workflow_call:
    inputs:
      configured: { description: 'True only after provider, fixture server, four-slot M60 evidence and all secrets are configured', required: true, type: boolean }
      matrix_json: { description: 'Explicit case/slot/runner/provider matrix; values are never inferred', required: true, type: string }
      build_sha: { description: 'Exact 40-character RC source/build SHA', required: true, type: string }
      profile: { description: 'Exact installed RC build profile', required: true, type: string }
      m60_evidence_run_id: { description: 'Workflow run containing same-SHA M60-02/M60-04/M60-05 evidence', required: true, type: string }
      m60_evidence_artifact: { description: 'Exact prior-run evidence artifact name', required: true, type: string }
      m60_binding_path: { description: 'Path to m60-bindings.json inside the downloaded artifact', required: false, type: string, default: 'm60-bindings.json' }
    secrets:
      MOBILE_RC_PROVIDER_TOKEN: { required: false }
      MOBILE_RC_FIXTURE_SERVER_ORIGIN: { required: false }
      MOBILE_RC_FIXTURE_TOKEN: { required: false }
      MOBILE_RC_EVIDENCE_HMAC_KEY: { required: false }
      MOBILE_E2E_RECEIPT_HMAC_KEY: { required: false }
      MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON: { required: false }
      MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY: { required: false }
  workflow_dispatch:
    inputs:
      configured: { description: 'Run real matrix only when every provider/fixture/secret is configured', required: true, type: boolean, default: false }
      matrix_json: { description: 'Explicit matrix JSON; no device/provider defaults', required: true, type: string, default: '[]' }
      build_sha: { description: 'Exact 40-character RC source/build SHA', required: true, type: string }
      profile: { description: 'Exact installed RC build profile', required: true, type: string }
      m60_evidence_run_id: { description: 'Prior same-SHA M60 evidence workflow run id', required: true, type: string }
      m60_evidence_artifact: { description: 'Exact prior-run evidence artifact name', required: true, type: string }
      m60_binding_path: { description: 'Path to m60-bindings.json in evidence artifact', required: false, type: string, default: 'm60-bindings.json' }

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '22.23.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-m70-01-rc-${{ inputs.build_sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Plan/schema/mock/negative contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.explicit.outputs.matrix }}
      build_sha: ${{ steps.explicit.outputs.build_sha }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.build_sha || github.sha }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10.18.3, run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F mobile test:m70-01
      - id: explicit
        if: inputs.configured
        env:
          MATRIX_JSON: ${{ inputs.matrix_json }}
          BUILD_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          test "$(node -e 'const m=JSON.parse(process.env.MATRIX_JSON);if(!Array.isArray(m.include)||!m.include.length)process.exit(1);for(const x of m.include){for(const k of ["caseId","slot","runnerLabels","providerExecutable","m60ReceiptId","buildId","artifactDigest"]){if(!x[k])process.exit(1)}};process.stdout.write("ok")')" = ok
          {
            echo "build_sha=$BUILD_SHA"
            echo 'matrix<<MATRIX_EOF'
            printf '%s\n' "$MATRIX_JSON"
            echo MATRIX_EOF
          } >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.configured }}
        run: echo 'Provider/fixtures/secrets not explicitly configured; real RC matrix is intentionally not executed.'

  fetch_m60:
    name: Fetch explicit same-SHA M60 evidence
    if: inputs.configured
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN_ID: ${{ inputs.m60_evidence_run_id }}
      EVIDENCE_ARTIFACT: ${{ inputs.m60_evidence_artifact }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.contract.outputs.build_sha }}" }
      - name: Download exact prior-run artifact without provider guessing
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_RUN_ID"
          test -n "$EVIDENCE_ARTIFACT"
          gh run download "$EVIDENCE_RUN_ID" --name "$EVIDENCE_ARTIFACT" --dir m60-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: m70-m60-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: m60-evidence
          if-no-files-found: error
          retention-days: 1

  real_matrix:
    name: RC / ${{ matrix.caseId }} / ${{ matrix.slot }}
    if: inputs.configured
    needs: [contract, fetch_m60]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    runs-on: ${{ matrix.runnerLabels }}
    timeout-minutes: 45
    env:
      MOBILE_RC_PROVIDER_TOKEN: ${{ secrets.MOBILE_RC_PROVIDER_TOKEN }}
      MOBILE_RC_FIXTURE_SERVER_ORIGIN: ${{ secrets.MOBILE_RC_FIXTURE_SERVER_ORIGIN }}
      MOBILE_RC_FIXTURE_TOKEN: ${{ secrets.MOBILE_RC_FIXTURE_TOKEN }}
      CASE_ID: ${{ matrix.caseId }}
      SLOT: ${{ matrix.slot }}
      PROVIDER_EXECUTABLE: ${{ matrix.providerExecutable }}
      M60_RECEIPT_ID: ${{ matrix.m60ReceiptId }}
      ARTIFACT_DIGEST: ${{ matrix.artifactDigest }}
      BUILD_ID: ${{ matrix.buildId }}
      BUILD_SHA: ${{ needs.contract.outputs.build_sha }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.contract.outputs.build_sha }}", clean: true }
      - name: Require every provider and fixture secret explicitly
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          test -n "$MOBILE_RC_PROVIDER_TOKEN"
          test -n "$MOBILE_RC_FIXTURE_SERVER_ORIGIN"
          test -n "$MOBILE_RC_FIXTURE_TOKEN"
          test -x "$PROVIDER_EXECUTABLE"
          test "$SLOT" = "$(node -e 'const p=require("./mobile/rc/rc-plan.json");const c=p.cases.find(x=>x.id===process.env.CASE_ID);if(!c)process.exit(2);process.stdout.write(c.platformSlot)')"
      - name: Execute one provider-bound physical-device case with immutable attempt identity
        run: |
          set -euo pipefail
          node mobile/rc/scripts/run-rc-case.mjs \
            --plan mobile/rc/rc-plan.json --caseId "$CASE_ID" --mode production \
            --providerExecutable "$PROVIDER_EXECUTABLE" --buildSha "$BUILD_SHA" \
            --buildId "$BUILD_ID" --profile "$PROFILE" --artifactDigest "$ARTIFACT_DIGEST" \
            --m60ReceiptId "$M60_RECEIPT_ID" \
            --testRunId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CASE_ID}" \
            --attempt "$GITHUB_RUN_ATTEMPT" --outputDir ".m70-rc/$CASE_ID"
      - name: Upload only bounded receipt, screenshots and redacted log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m70-result-${{ matrix.caseId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .m70-rc/${{ matrix.caseId }}/result.json
            .m70-rc/${{ matrix.caseId }}/provider-receipt.json
            .m70-rc/${{ matrix.caseId }}/evidence/*
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Production RC fail-closed gate
    if: always() && inputs.configured
    needs: [contract, fetch_m60, real_matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOBILE_RC_EVIDENCE_HMAC_KEY: ${{ secrets.MOBILE_RC_EVIDENCE_HMAC_KEY }}
      MOBILE_E2E_RECEIPT_HMAC_KEY: ${{ secrets.MOBILE_E2E_RECEIPT_HMAC_KEY }}
      MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY: ${{ secrets.MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY }}
      RELEASE_KEYS: ${{ secrets.MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON }}
      BUILD_SHA: ${{ needs.contract.outputs.build_sha }}
      PROFILE: ${{ inputs.profile }}
      M60_BINDING_PATH: ${{ inputs.m60_binding_path }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.contract.outputs.build_sha }}" }
      - uses: actions/download-artifact@v7
        with: { pattern: 'm70-result-*', path: rc-results }
      - uses: actions/download-artifact@v7
        with: { name: "m70-m60-input-${{ github.run_id }}-${{ github.run_attempt }}", path: m60-evidence }
      - name: Assemble and validate one-SHA production evidence
        run: |
          set -euo pipefail
          test '${{ needs.real_matrix.result }}' = success
          test -n "$MOBILE_RC_EVIDENCE_HMAC_KEY"
          test -n "$MOBILE_E2E_RECEIPT_HMAC_KEY"
          test -n "$MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY"
          test -n "$RELEASE_KEYS"
          printf '%s' "$RELEASE_KEYS" > "$RUNNER_TEMP/release-public-keys.json"
          node mobile/rc/scripts/assemble-rc-evidence.mjs \
            --plan mobile/rc/rc-plan.json --results rc-results \
            --m60 "m60-evidence/$M60_BINDING_PATH" --commitSha "$BUILD_SHA" \
            --profile "$PROFILE" --mode production --expiryHours 24 --output rc-bundle.json
          node mobile/rc/scripts/validate-rc-evidence.mjs \
            --plan mobile/rc/rc-plan.json --bundle rc-bundle.json \
            --evidenceRoot m60-evidence --resultsRoot rc-results \
            --publicKeys "$RUNNER_TEMP/release-public-keys.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m70-01-rc-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: rc-bundle.json
          if-no-files-found: error
          retention-days: 14
