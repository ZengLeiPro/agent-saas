name: Mobile M70-03 Pause or Rollback
on:
  workflow_call:
    inputs:
      stopped_receipt_run_id: { type: string, required: true }
      stopped_receipt_artifact: { type: string, required: true }
      command: { type: string, required: true }
      provider_adapter_executable: { type: string, required: true }
    secrets:
      MOBILE_ROLLOUT_PROVIDER_TOKEN: { required: false }
      MOBILE_ROLLOUT_GATE_HMAC_KEY: { required: false }
  workflow_dispatch:
    inputs:
      stopped_receipt_run_id: { type: string, required: true }
      stopped_receipt_artifact: { type: string, required: true }
      command: { type: choice, required: true, options: [pause, rollback] }
      provider_adapter_executable: { type: string, required: true }
permissions: { contents: read, actions: read }
concurrency: { group: mobile-m70-03-emergency, cancel-in-progress: false }
jobs:
  authorize_and_execute:
    if: github.repository == 'ZengLeiPro/agent-saas'
    runs-on: [self-hosted, mobile-rollout-provider]
    timeout-minutes: 10
    environment: mobile-rollout-emergency
    env:
      GH_TOKEN: ${{ github.token }}
      COMMAND: ${{ inputs.command }}
      PROVIDER_ADAPTER: ${{ inputs.provider_adapter_executable }}
      MOBILE_ROLLOUT_PROVIDER_TOKEN: ${{ secrets.MOBILE_ROLLOUT_PROVIDER_TOKEN }}
      MOBILE_ROLLOUT_GATE_HMAC_KEY: ${{ secrets.MOBILE_ROLLOUT_GATE_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Download and cryptographically authorize signed stopped receipt only
        run: |
          set -euo pipefail
          test -n "$MOBILE_ROLLOUT_PROVIDER_TOKEN"; test -n "$MOBILE_ROLLOUT_GATE_HMAC_KEY"; test -x "$PROVIDER_ADAPTER"
          gh run download '${{ inputs.stopped_receipt_run_id }}' --name '${{ inputs.stopped_receipt_artifact }}' --dir stopped
          node mobile/rollout/scripts/validate-rollout-gate.mjs --command authorize-emergency --receipt stopped/stage-receipt.json --emergency "$COMMAND" > authorization.json
          jq -e '.authorized == true' authorization.json >/dev/null
          ulimit -f 128
          "$PROVIDER_ADAPTER" "$COMMAND" authorization.json emergency-command-receipt.json > "$RUNNER_TEMP/emergency.log" 2>&1
          test "$(wc -c < "$RUNNER_TEMP/emergency.log")" -le 65536
          jq -e '.status == "accepted" or .status == "completed"' emergency-command-receipt.json >/dev/null
      - uses: actions/upload-artifact@v7
        with: { name: 'm70-03-emergency-receipt-${{ github.run_id }}-${{ github.run_attempt }}', path: emergency-command-receipt.json, if-no-files-found: error, retention-days: 90 }
