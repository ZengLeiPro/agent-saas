name: Mobile M70-03 Staged Rollout Gate
on:
  workflow_call:
    inputs:
      configured: { type: boolean, required: false, default: false }
      build_sha: { type: string, required: true }
      target_stage: { type: string, required: true }
      evidence_run_id: { type: string, required: true }
      evidence_artifact_name: { type: string, required: true }
      provider_adapter_executable: { type: string, required: true }
    secrets:
      MOBILE_ROLLOUT_PROVIDER_TOKEN: { required: false }
      MOBILE_ROLLOUT_GATE_HMAC_KEY: { required: false }
      MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON: { required: false }
      MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY: { required: false }
      MOBILE_RC_EVIDENCE_HMAC_KEY: { required: false }
      MOBILE_E2E_RECEIPT_HMAC_KEY: { required: false }
  workflow_dispatch:
    inputs:
      configured: { description: '仅当真实证据、审批阈值和 provider adapter 均配置后启用', type: boolean, required: true, default: false }
      build_sha: { type: string, required: true }
      target_stage: { type: choice, required: true, options: [employee-dogfood, closed-test, small-percentage, expanded, full] }
      evidence_run_id: { type: string, required: true }
      evidence_artifact_name: { type: string, required: true }
      provider_adapter_executable: { description: '显式注入；仓库不猜商店/provider', type: string, required: true }
permissions: { contents: read, actions: read }
concurrency:
  group: mobile-m70-03-${{ inputs.build_sha }}
  cancel-in-progress: false
env: { FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true }
jobs:
  contract:
    name: Contract, mock, negative, YAML and security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 10.18.3, run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22.23.1, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F mobile test:m70-03

  validate_evidence:
    name: Validate immutable same-release prerequisites
    if: inputs.configured && github.repository == 'ZengLeiPro/agent-saas'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: ${{ inputs.build_sha }}
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
      TARGET_STAGE: ${{ inputs.target_stage }}
      MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON: ${{ secrets.MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON }}
      MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY: ${{ secrets.MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY }}
      MOBILE_RC_EVIDENCE_HMAC_KEY: ${{ secrets.MOBILE_RC_EVIDENCE_HMAC_KEY }}
      MOBILE_E2E_RECEIPT_HMAC_KEY: ${{ secrets.MOBILE_E2E_RECEIPT_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.build_sha }}', clean: true, persist-credentials: false }
      - name: Download exact prior-run evidence; never build or submit
        run: |
          set -euo pipefail
          printf '%s' "$BUILD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          test -n "$EVIDENCE_RUN_ID"; test -n "$EVIDENCE_ARTIFACT_NAME"
          gh run download "$EVIDENCE_RUN_ID" --name "$EVIDENCE_ARTIFACT_NAME" --dir gate-input
          test -f gate-input/gate-input-base.json
          test -f gate-input/approved-policy.json
          test -f gate-input/replay-ledger.json
          node mobile/rollout/scripts/validate-rollout-gate.mjs --command lint-policy --policy gate-input/approved-policy.json --mode production
          test -n "$MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON"; test -n "$MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY"; test -n "$MOBILE_RC_EVIDENCE_HMAC_KEY"; test -n "$MOBILE_E2E_RECEIPT_HMAC_KEY"
          printf '%s' "$MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON" > "$RUNNER_TEMP/release-public-keys.json"
          node mobile/rollout/scripts/validate-rollout-gate.mjs --command validate-prerequisites --input gate-input/gate-input-base.json --evidence-root gate-input --release-public-keys "$RUNNER_TEMP/release-public-keys.json"
          jq -e --arg sha "$BUILD_SHA" --arg stage "$TARGET_STAGE" '.mode == "production" and .release.sha == $sha and .targetStage == $stage' gate-input/gate-input-base.json >/dev/null
      - uses: actions/upload-artifact@v7
        with: { name: 'm70-03-validated-input-${{ github.run_id }}-${{ github.run_attempt }}', path: gate-input, if-no-files-found: error, retention-days: 1 }

  protected_approval:
    name: Protected stage approval
    if: inputs.configured && github.repository == 'ZengLeiPro/agent-saas'
    needs: validate_evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: mobile-rollout-gate-${{ inputs.target_stage }}
    steps:
      - name: Materialize one-use approval metadata
        env: { TARGET_STAGE: '${{ inputs.target_stage }}' }
        run: |
          set -euo pipefail
          mkdir approval
          nonce="$(openssl rand -hex 24)"
          jq -n --arg stage "$TARGET_STAGE" --arg environment "mobile-rollout-gate-$TARGET_STAGE" --arg approvalId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TARGET_STAGE" --arg deploymentId "$GITHUB_RUN_ID" --arg approvedAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --arg nonce "$nonce" '{stageId:$stage,environment:$environment,approvalId:$approvalId,deploymentId:$deploymentId,approvedAt:$approvedAt,nonce:$nonce}' > approval/approval.json
      - uses: actions/upload-artifact@v7
        with: { name: 'm70-03-approval-${{ github.run_id }}-${{ github.run_attempt }}', path: approval/approval.json, if-no-files-found: error, retention-days: 1 }

  provider_rollout:
    name: Injected provider rollout adapter
    if: inputs.configured && github.repository == 'ZengLeiPro/agent-saas'
    needs: protected_approval
    runs-on: [self-hosted, mobile-rollout-provider]
    timeout-minutes: 15
    env:
      PROVIDER_ADAPTER: ${{ inputs.provider_adapter_executable }}
      MOBILE_ROLLOUT_PROVIDER_TOKEN: ${{ secrets.MOBILE_ROLLOUT_PROVIDER_TOKEN }}
      TARGET_STAGE: ${{ inputs.target_stage }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.build_sha }}', clean: true, persist-credentials: false }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-03-validated-input-${{ github.run_id }}-${{ github.run_attempt }}', path: gate-input }
      - name: Fail closed if adapter is absent; invoke bounded contract only
        run: |
          set -euo pipefail
          test -n "$MOBILE_ROLLOUT_PROVIDER_TOKEN"; test -n "$PROVIDER_ADAPTER"; test -x "$PROVIDER_ADAPTER"
          ulimit -f 128
          jq -n --arg action advance --arg stage "$TARGET_STAGE" --argjson release "$(jq .release gate-input/gate-input-base.json)" '{action:$action,stageId:$stage,release:$release}' > "$RUNNER_TEMP/rollout-request.json"
          "$PROVIDER_ADAPTER" rollout "$RUNNER_TEMP/rollout-request.json" adapter-receipt.json > "$RUNNER_TEMP/adapter.log" 2>&1
          test "$(wc -c < "$RUNNER_TEMP/adapter.log")" -le 65536
          jq -e '.configured == true and .status == "accepted"' adapter-receipt.json >/dev/null
      - uses: actions/upload-artifact@v7
        with: { name: 'm70-03-adapter-${{ github.run_id }}-${{ github.run_attempt }}', path: adapter-receipt.json, if-no-files-found: error, retention-days: 1 }

  observe:
    name: Observe signed telemetry and support windows
    if: inputs.configured && github.repository == 'ZengLeiPro/agent-saas'
    needs: provider_rollout
    runs-on: [self-hosted, mobile-rollout-provider]
    timeout-minutes: 360
    env:
      PROVIDER_ADAPTER: ${{ inputs.provider_adapter_executable }}
      MOBILE_ROLLOUT_PROVIDER_TOKEN: ${{ secrets.MOBILE_ROLLOUT_PROVIDER_TOKEN }}
      MOBILE_ROLLOUT_GATE_HMAC_KEY: ${{ secrets.MOBILE_ROLLOUT_GATE_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.build_sha }}', clean: true, persist-credentials: false }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-03-validated-input-${{ github.run_id }}-${{ github.run_attempt }}', path: gate-input }
      - name: Adapter emits provider-signed dashboard/query/cohort and owner/time snapshots
        run: |
          set -euo pipefail
          test -n "$MOBILE_ROLLOUT_PROVIDER_TOKEN"; test -n "$MOBILE_ROLLOUT_GATE_HMAC_KEY"; test -x "$PROVIDER_ADAPTER"
          ulimit -f 128
          "$PROVIDER_ADAPTER" observe gate-input/gate-input-base.json observed-snapshots.json > "$RUNNER_TEMP/observe.log" 2>&1
          test "$(wc -c < "$RUNNER_TEMP/observe.log")" -le 65536
          jq -e '.telemetrySnapshot.signature and .supportSnapshot.signature' observed-snapshots.json >/dev/null
      - uses: actions/upload-artifact@v7
        with: { name: 'm70-03-observation-${{ github.run_id }}-${{ github.run_attempt }}', path: observed-snapshots.json, if-no-files-found: error, retention-days: 14 }

  evaluate:
    name: Evaluate and seal chained stage receipt
    if: always() && inputs.configured && github.repository == 'ZengLeiPro/agent-saas'
    needs: [validate_evidence, protected_approval, provider_rollout, observe]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOBILE_ROLLOUT_GATE_HMAC_KEY: '${{ secrets.MOBILE_ROLLOUT_GATE_HMAC_KEY }}'
      MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON: '${{ secrets.MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON }}'
      MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY: '${{ secrets.MOBILE_TELEMETRY_EVIDENCE_HMAC_KEY }}'
      MOBILE_RC_EVIDENCE_HMAC_KEY: '${{ secrets.MOBILE_RC_EVIDENCE_HMAC_KEY }}'
      MOBILE_E2E_RECEIPT_HMAC_KEY: '${{ secrets.MOBILE_E2E_RECEIPT_HMAC_KEY }}'
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.build_sha }}', clean: true, persist-credentials: false }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-03-validated-input-${{ github.run_id }}-${{ github.run_attempt }}', path: gate-input }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-03-approval-${{ github.run_id }}-${{ github.run_attempt }}', path: stage }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-03-adapter-${{ github.run_id }}-${{ github.run_attempt }}', path: stage }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-03-observation-${{ github.run_id }}-${{ github.run_attempt }}', path: stage }
      - name: Fail if any prior phase failed; evaluate without override
        run: |
          set -euo pipefail
          test '${{ needs.validate_evidence.result }}' = success; test '${{ needs.protected_approval.result }}' = success; test '${{ needs.provider_rollout.result }}' = success; test '${{ needs.observe.result }}' = success
          test -n "$MOBILE_ROLLOUT_GATE_HMAC_KEY"
          jq -s '.[0] + {approval:.[1],adapterReceipt:.[2],telemetrySnapshot:.[3].telemetrySnapshot,supportSnapshot:.[3].supportSnapshot}' gate-input/gate-input-base.json stage/approval.json stage/adapter-receipt.json stage/observed-snapshots.json > stage-input.json
          printf '%s' "$MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON" > "$RUNNER_TEMP/release-public-keys.json"
          node mobile/rollout/scripts/validate-rollout-gate.mjs --command evaluate --policy gate-input/approved-policy.json --input stage-input.json --evidence-root gate-input --release-public-keys "$RUNNER_TEMP/release-public-keys.json" --ledger gate-input/replay-ledger.json --ledger-output replay-ledger.json --output stage-receipt.json
          jq -e '.status == "passed"' stage-receipt.json >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 'm70-03-stage-receipt-${{ inputs.target_stage }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            stage-receipt.json
            replay-ledger.json
          if-no-files-found: error
          retention-days: 90
