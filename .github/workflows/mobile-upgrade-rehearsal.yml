name: Mobile M70-02 Upgrade and Rollback Rehearsal
on:
  pull_request:
    paths:
      - 'mobile/rehearsal/**'
      - 'mobile/package.json'
      - 'docs/mobile-m70-02-upgrade-rollback-runbook.md'
      - 'mobile/src/startup/**'
      - 'mobile/src/updates/enterpriseRollbackManifest*'
      - 'shared/src/mobileCompatibility/**'
      - 'server/src/mobileCompatibility/**'
      - '.github/workflows/mobile-upgrade-rehearsal.yml'
  workflow_call:
    inputs:
      configured: { type: boolean, required: false, default: false }
      previous_commit_sha: { type: string, required: false, default: '' }
      m60_run_id: { type: string, required: false, default: '' }
      m60_artifact_name: { type: string, required: false, default: '' }
      artifact_binding_path: { type: string, required: false, default: '' }
      provider_executable: { type: string, required: false, default: '' }
    secrets:
      MOBILE_REHEARSAL_PROVIDER_TOKEN: { required: false }
      MOBILE_REHEARSAL_POLICY_PUBLIC_KEY: { required: false }
      MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON: { required: false }
  workflow_dispatch:
    inputs:
      configured: { type: boolean, description: '外部旧/新包、真机 provider 和 secrets 均已配置', required: true, default: false }
      previous_commit_sha: { type: string, required: false }
      m60_run_id: { type: string, required: false }
      m60_artifact_name: { type: string, required: false }
      artifact_binding_path: { type: string, required: false, default: 'm70-02-artifact-binding.json' }
      provider_executable: { type: string, required: false }
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-m70-02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    name: Schema, mock, negative and N-1/N contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: identity
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run PR-safe contract gates only
        run: |
          set -euo pipefail
          pnpm -F @agent/shared exec vitest run src/mobileCompatibility/policy.test.ts
          pnpm -F server exec vitest run src/mobileCompatibility/policySigner.test.ts
          pnpm -F mobile exec vitest run src/startup/mobileCompatibilityVerifier.test.ts src/startup/mobileStartupGate.test.ts src/updates/enterpriseRollbackManifest.test.ts
          pnpm -F mobile test:m70-02
      - id: matrix
        run: echo "value=$(node -e 'const p=require("./mobile/rehearsal/rehearsal-plan.json");process.stdout.write(JSON.stringify({include:p.cases.map(x=>({caseId:x.id}))}))')" >> "$GITHUB_OUTPUT"
  fetch_authoritative_inputs:
    name: Fetch configured M60 real artifacts
    if: github.event_name != 'pull_request' && inputs.configured
    needs: contract
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      M60_RUN_ID: ${{ inputs.m60_run_id }}
      M60_ARTIFACT_NAME: ${{ inputs.m60_artifact_name }}
      BINDING_PATH: ${{ inputs.artifact_binding_path }}
      PREVIOUS_SHA: ${{ inputs.previous_commit_sha }}
      PROVIDER_EXECUTABLE: ${{ inputs.provider_executable }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.contract.outputs.commit_sha }}' }
      - name: Fail closed when any external binding is absent
        run: |
          set -euo pipefail
          test "$PREVIOUS_SHA" != "${{ needs.contract.outputs.commit_sha }}"
          printf '%s' "$PREVIOUS_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$M60_RUN_ID"; test -n "$M60_ARTIFACT_NAME"; test -n "$BINDING_PATH"
          test -n "$PROVIDER_EXECUTABLE"
          gh run download "$M60_RUN_ID" --name "$M60_ARTIFACT_NAME" --dir authoritative-inputs
          test -f "authoritative-inputs/$BINDING_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: m70-02-authoritative-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: authoritative-inputs
          if-no-files-found: error
          retention-days: 1
  real_rehearsal:
    name: Real rehearsal / ${{ matrix.caseId }}
    if: github.event_name != 'pull_request' && inputs.configured
    needs: [contract, fetch_authoritative_inputs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    runs-on: [self-hosted, mobile-device-provider]
    timeout-minutes: 45
    env:
      CASE_ID: ${{ matrix.caseId }}
      CURRENT_SHA: ${{ needs.contract.outputs.commit_sha }}
      PREVIOUS_SHA: ${{ inputs.previous_commit_sha }}
      BINDING_PATH: ${{ inputs.artifact_binding_path }}
      PROVIDER_EXECUTABLE: ${{ inputs.provider_executable }}
      MOBILE_REHEARSAL_PROVIDER_TOKEN: ${{ secrets.MOBILE_REHEARSAL_PROVIDER_TOKEN }}
      MOBILE_REHEARSAL_POLICY_PUBLIC_KEY: ${{ secrets.MOBILE_REHEARSAL_POLICY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.contract.outputs.commit_sha }}', clean: true }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-02-authoritative-inputs-${{ github.run_id }}-${{ github.run_attempt }}', path: authoritative-inputs }
      - name: Execute configured provider without synthesizing evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURRENT_SHA"
          test -n "$MOBILE_REHEARSAL_PROVIDER_TOKEN"; test -n "$MOBILE_REHEARSAL_POLICY_PUBLIC_KEY"
          test -x "$PROVIDER_EXECUTABLE"
          node mobile/rehearsal/scripts/run-rehearsal-case.mjs --caseId "$CASE_ID" --providerExecutable "$PROVIDER_EXECUTABLE" --artifactBinding "authoritative-inputs/$BINDING_PATH" --output ".m70-02/$CASE_ID/result.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m70-02-result-${{ matrix.caseId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .m70-02/${{ matrix.caseId }}
          if-no-files-found: error
          retention-days: 14
  production_gate:
    name: Real evidence fail-closed gate
    if: always() && github.event_name != 'pull_request' && inputs.configured
    needs: [contract, fetch_authoritative_inputs, real_rehearsal]
    runs-on: ubuntu-latest
    env:
      MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON: ${{ secrets.MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.contract.outputs.commit_sha }}' }
      - uses: actions/download-artifact@v7
        with: { pattern: 'm70-02-result-*', path: rehearsal-results }
      - uses: actions/download-artifact@v7
        with: { name: 'm70-02-authoritative-inputs-${{ github.run_id }}-${{ github.run_attempt }}', path: rehearsal-results/authoritative-inputs }
      - name: Assemble and validate without fabricating unavailable receipts
        env:
          CURRENT_SHA: ${{ needs.contract.outputs.commit_sha }}
          PREVIOUS_SHA: ${{ inputs.previous_commit_sha }}
        run: |
          set -euo pipefail
          test '${{ needs.real_rehearsal.result }}' = success
          test -n "$MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON"
          printf '%s' "$MOBILE_RELEASE_EVIDENCE_PUBLIC_KEYS_JSON" > "$RUNNER_TEMP/mobile-release-public-keys.json"
          node mobile/rehearsal/scripts/assemble-rehearsal-evidence.mjs --results rehearsal-results --commitSha "$CURRENT_SHA" --previousCommitSha "$PREVIOUS_SHA" --output m70-02-evidence.json
          node mobile/rehearsal/scripts/validate-rehearsal-evidence.mjs --bundle m70-02-evidence.json --evidenceRoot rehearsal-results --publicKeys "$RUNNER_TEMP/mobile-release-public-keys.json"
      - uses: actions/upload-artifact@v7
        with:
          name: m70-02-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: m70-02-evidence.json
          if-no-files-found: error
          retention-days: 14
