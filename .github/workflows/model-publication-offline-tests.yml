name: Model publication offline test dependencies
# Temporary feature-branch test helper; removed from the final PR diff.
# Read-only repository access, no environments, no production secrets or deployment.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths: [.github/workflows/model-publication-offline-tests.yml]
permissions:
  contents: read
jobs:
  history:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export Git objects only, never .git config or credentials
        run: |
          git bundle create /tmp/model-publication-history.bundle --all
          git bundle verify /tmp/model-publication-history.bundle
      - uses: actions/upload-artifact@v7
        with:
          name: model-publication-history
          path: /tmp/model-publication-history.bundle
          compression-level: 0
          retention-days: 1
