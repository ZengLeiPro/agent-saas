name: Prepare unified CI (branch-only)
on:
  push:
    branches: [refactor/unified-ci-20260910]
    paths:
      - .github/scripts/prepare-unified-ci.py
      - .github/scripts/finalize-unified-ci.py
      - .github/workflows/prepare-unified-ci.yml
# Temporary isolated editing/verification; never uses deployment environments or credentials.
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare reviewed workflow edits
        id: apply
        run: |
          python3 .github/scripts/prepare-unified-ci.py
          python3 .github/scripts/finalize-unified-ci.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Dependency-free regression tests
        id: basic
        continue-on-error: true
        run: node --test scripts/release/unified-ci*.test.mjs > "$RUNNER_TEMP/basic.log" 2>&1; status=$?; tail -20 "$RUNNER_TEMP/basic.log"; exit "$status"
        shell: bash {0}
      - uses: ./.github/actions/setup-pnpm
      - name: Install repository dependencies when available
        id: dependencies
        continue-on-error: true
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: Format new source files
        if: steps.dependencies.outcome == 'success'
        run: pnpm exec prettier --write scripts/ci-acs-plan.mjs scripts/release/unified-ci*.mjs docs/unified-ci.md
      - name: Existing and new workflow contracts
        id: contracts
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash {0}
        run: |
          node --test scripts/release/unified-ci*.test.mjs \
            scripts/release/staging-release-evidence-workflow.test.mjs \
            scripts/release/staging-workflow.test.mjs scripts/release/promotion-workflow.test.mjs \
            scripts/pr-preflight-contract.test.mjs scripts/release/classify-components.test.mjs \
            > "$RUNNER_TEMP/contracts.log" 2>&1
          status=$?
          grep -A 25 '^not ok' "$RUNNER_TEMP/contracts.log" || true
          tail -15 "$RUNNER_TEMP/contracts.log"
          exit "$status"
      - name: ACS deployment and classification regression
        id: acs
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: pnpm -F server exec vitest run src/__tests__/acsDeployWorkflowContract.test.ts
      - name: ACS operational script regressions
        id: operational
        continue-on-error: true
        run: python3 -m unittest scripts/test_acs_operational_scripts.py scripts/test_acr_webhook_redelivery.py
      - name: Lint changed source and check repository ratchets
        id: lint
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm exec eslint scripts/ci-acs-plan.mjs scripts/release/unified-ci*.mjs scripts/release/staging-release-evidence-workflow.test.mjs server/src/__tests__/acsDeployWorkflowContract.test.ts scripts/release/classify-components.mjs scripts/pr-preflight-contract.test.mjs
          pnpm check:ratchets
      - name: Export reviewed blobs without changing any branch
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          python3 .github/scripts/finalize-unified-ci.py export-blobs
      - name: Report actual validation outcomes
        if: always()
        env:
          RESULTS: basic=${{ steps.basic.outcome }} contracts=${{ steps.contracts.outcome }} acs=${{ steps.acs.outcome }} operational=${{ steps.operational.outcome }} lint=${{ steps.lint.outcome }}
        run: |
          echo "VALIDATION_RESULTS=$RESULTS"
          for result in $RESULTS; do
            test "${result#*=}" = success || exit 1
          done
