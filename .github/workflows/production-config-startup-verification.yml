name: Production config cold-start verification
# Temporary feature-branch-only verification. No production credentials or deployment.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths: [.github/workflows/production-config-startup-verification.yml]
permissions:
  contents: write
concurrency:
  group: production-config-startup-integration
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Wire reviewed cold-start recovery and crash-safe rollback ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          def edit(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, (path, text.count(before))
              p.write_text(text.replace(before, after))
          runtime = Path('server/src/app/runtime.ts')
          old_digest = 'sha256:' + hashlib.sha256(runtime.read_bytes()).hexdigest()
          assert old_digest == 'sha256:8c0a007a764b9fa33d92995fc431a8be6b95fd688f178c05ad6661496c3b67e3', old_digest
          edit(str(runtime), "import { initializeProductionModelPublication } from './productionModelPublication.js';",
               "import { prepareProductionConfigStartup, alignProductionConfigStartup } from './productionConfigStartup.js';\nimport { initializeProductionModelPublication } from './productionModelPublication.js';")
          edit(str(runtime), '  const config = loadAppConfig(processCwd); const sessionAutomationFlagSource = createSessionAutomationFlagSource(config);',
               '  await prepareProductionConfigStartup(processCwd, processRole);\n  const config = loadAppConfig(processCwd); const sessionAutomationFlagSource = createSessionAutomationFlagSource(config);')
          edit(str(runtime), "  if (!await refreshPublishedConfig(true)) {\n    throw new Error('共享配置启动对齐失败');\n  }",
               '  await alignProductionConfigStartup({ processCwd, refresher: sharedConfigRefresher, identity: configIdentityAssembly });')
          publisher = 'server/src/config/productionModelPublisher.ts'
          edit(publisher, "      const text = readSnapshot(this.options.configPath, state.previous.rawRevision);\n      rolling = writePublication",
               "      const text = readSnapshot(this.options.configPath, state.previous.rawRevision);\n      // Keep both known revisions in the pending journal until old bytes are durable.\n      atomicWrite(this.options.configPath, text);\n      rolling = writePublication")
          edit(publisher, "      atomicWrite(this.options.configPath, text);\n      const targets = this.options.targets();",
               "      const targets = this.options.targets();")
          test_path = 'server/src/app/productionConfigStartup.test.ts'
          edit(test_path, "const stamp = vi.spyOn(boot.refresher, 'getAppliedStamps').mockReturnValue({});",
               "const emptyConfigStamp = { ...boot.refresher.getAppliedStamps(), config: undefined };\n    const stamp = vi.spyOn(boot.refresher, 'getAppliedStamps').mockReturnValue(emptyConfigStamp);")
          edit(test_path, "  it('staged recovery is idempotent and still requires two observers',",
               "  it('rollback keeps candidate and previous digests journaled until old bytes are durable', async () => {\n    rig.blockedPhases.add('runtime-worker:applying');\n    const original = publications.writePublication;\n    let checked = false;\n    vi.spyOn(publications, 'writePublication').mockImplementation((path, record) => {\n      if (record.phase === 'rolling_back') {\n        expect(readFileSync(rig.configPath, 'utf8')).toBe(rig.before);\n        checked = true;\n      }\n      return original(path, record);\n    });\n    await expect(rig.service.mutate(rig.input())).rejects.toThrow('超时');\n    expect(checked).toBe(true);\n    expect(readPublication(rig.configPath)?.phase).toBe('committed');\n  });\n  it('staged recovery is idempotent and still requires two observers',")
          audit_path = 'docs/release/生产模型在线发布运行时装配审核-20260909.md'
          audit = Path(audit_path)
          old_audit = 'sha256:' + hashlib.sha256(audit.read_bytes()).hexdigest()
          audit.write_text(audit.read_text() + '\n\n## 冷启动恢复装配补充\n\n本次进一步核对 createRuntime 的入口顺序：生产签名事务恢复必须先于 loadAppConfig、凭据解析及执行服务构造；启动对齐允许已验证但尚未完成双进程确认的恢复版本装配观察者，业务执行与 readiness 门禁仍保持关闭。旧配置字节先恢复、再改写回滚阶段目标，避免崩溃窗口丢失候选摘要。新增模块只调用既有文件锁、签名日志、配置文件及只读身份 API，不新增 SQL、迁移或数据库写入。既有数据库结构分类与基线摘要不变，目标源码及这份补充证据重新绑定。\n')
          new_audit = 'sha256:' + hashlib.sha256(audit.read_bytes()).hexdigest()
          new_digest = 'sha256:' + hashlib.sha256(runtime.read_bytes()).hexdigest()
          registry = Path('config/release-migration-reviews.json')
          value = json.loads(registry.read_text())
          counts = {'source': 0, 'evidence': 0}
          def update(node):
              if isinstance(node, dict):
                  if node.get('path') == str(runtime) and node.get('targetDigest') == old_digest:
                      node['targetDigest'] = new_digest
                      node['reason'] += ' 补充启动前签名事务恢复及启动装配/执行准入分离，不新增 SQL 或数据库变更。'
                      counts['source'] += 1
                  if node.get('path') == audit_path and node.get('digest') == old_audit:
                      node['digest'] = new_audit
                      counts['evidence'] += 1
                  for item in node.values(): update(item)
              elif isinstance(node, list):
                  for item in node: update(item)
          update(value)
          assert counts == {'source': 6, 'evidence': 6}, counts
          registry.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')
          plan = Path('docs/plans/production-model-config-online-save.md')
          plan.write_text(plan.read_text() + '\n\n## 冷启动与中断回滚的恢复入口\n\nAPI 与 Worker 在加载配置之前，只对原发布版本的已签名中断事务尝试恢复。拥有者仍存活的正常事务不被接管；两个 OS 互斥锁、候选/原版本字节校验和快照完整性必须全部成立，事务外磁盘改写绝不覆盖。恢复旧字节后保持 recovery_required，不会在启动辅助函数里提交成功。启动装配与业务准入分离，观察者能够完成初始化，但业务执行和就绪状态仍关闭，直到正常发布器重新收集 API、Worker 的对应版本回执。回滚先恢复旧字节再改写阶段目标，因此两种写入间崩溃也仍有完整的候选与原版本记录可供恢复。\n')
          PY
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format new modules
        run: pnpm exec prettier --write server/src/app/productionConfigStartup.ts server/src/app/productionConfigStartup.test.ts
      - name: Verify independent checks without hiding failures
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          root = Path('/tmp/production-startup-verification'); root.mkdir()
          checks = [
            ('typecheck', ['pnpm','-F','server','typecheck']),
            ('regressions', ['pnpm','-F','server','exec','vitest','run','productionConfigStartup','productionModelPublication','sessionAutomationProductionAssembly','configIdentityAssembly','modelResolvers','sharedConfigRefresher','configRuntimeRecovery.integration']),
            ('lint', ['pnpm','exec','eslint','server/src/app/productionConfigStartup.ts','server/src/app/productionConfigStartup.test.ts','server/src/config/productionModelPublisher.ts','server/src/app/runtime.ts']),
            ('ratchets', ['pnpm','check:ratchets']),
            ('migration-reviews', ['node','scripts/release/check-reviewed-migrations.mjs']),
            ('release-contracts', ['pnpm','test:release-contracts']),
            ('build', ['pnpm','-F','server','build']),
            ('whitespace', ['git','diff','--check']),
          ]
          results=[]
          for name, command in checks:
              log=root/f'{name}.log'
              with log.open('w') as output:
                  try: code=subprocess.run(command,stdout=output,stderr=subprocess.STDOUT,timeout=600).returncode
                  except subprocess.TimeoutExpired: code=124
              lines=re.sub(r'\x1b\[[0-9;]*m','',log.read_text(errors='replace')).splitlines()
              print(f'CHECK {name}: {code}',flush=True)
              if code:
                  for i,line in enumerate(lines):
                      if re.search(r'FAIL\s|error TS|^not ok |AssertionError|❯ .*test.*:\d+',line):
                          print('\n'.join(lines[i:i+18])[:6000],flush=True)
                  print('\n'.join(lines[-30:])[-7000:],flush=True)
              else: print('\n'.join(line for line in lines if re.search(r'Test Files|Tests\s|^# (pass|fail)|warnings?',line))[-3000:],flush=True)
              results.append({'check':name,'exitCode':code})
              (root/'results.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(1 if any(row['exitCode'] for row in results) else 0)
          PY
      - name: Commit verified startup recovery to the original PR
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/models-production-write-policy-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git add -- server/src/app/productionConfigStartup.ts server/src/app/productionConfigStartup.test.ts \
            server/src/app/runtime.ts server/src/config/productionModelPublisher.ts \
            config/release-migration-reviews.json docs/release/生产模型在线发布运行时装配审核-20260909.md \
            docs/plans/production-model-config-online-save.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(config): close cold-start and rollback interruption recovery gaps'
          git push origin HEAD:refs/heads/fix/models-production-write-policy-20260908
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Retain isolated verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-startup-${{ github.run_id }}
          path: /tmp/production-startup-verification/
          if-no-files-found: ignore
          retention-days: 1
