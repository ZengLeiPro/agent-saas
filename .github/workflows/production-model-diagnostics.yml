name: Publication failure diagnostics
# Temporary branch-only read-only log inspection; removed before final PR delivery.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths: [.github/workflows/production-model-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Identify the failing test and assertion without large source diffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import re, subprocess
          result = subprocess.run(['gh', 'run', 'view', '34298560965', '--repo', 'ZengLeiPro/agent-saas', '--job', '102300423626', '--log-failed'], capture_output=True, text=True, timeout=90)
          if result.returncode:
              print(result.stderr[-2000:])
              raise SystemExit(result.returncode)
          text = re.sub(r'(?:\x1b|\^\[)\[[0-9;]*m', '', result.stdout)
          lines = text.splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if re.search(r'\bFAIL\s|Failed Tests', line):
                  selected.update(range(max(0, i - 1), min(len(lines), i + 18)))
              if re.search(r'❯\s+src/|Test Files|Tests\s+[0-9]+ failed', line):
                  selected.add(i)
          print('\n'.join(lines[i][:700] for i in sorted(selected))[:16000])
          PY
