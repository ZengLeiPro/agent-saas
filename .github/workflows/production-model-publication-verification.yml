name: Production model publication final verification
# Temporary PR-593 helper. No production environments, credentials or deployment.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths:
      - .github/workflows/production-model-publication-verification.yml
      - scripts/release/finish-production-publication.py
permissions:
  contents: write
  actions: read
concurrency:
  group: production-model-publication-integration
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Capture bounded diagnostics from the previously failed Server shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import re, subprocess
          result = subprocess.run(['gh', 'api', 'repos/ZengLeiPro/agent-saas/actions/jobs/102296304860/logs'], capture_output=True, text=True, timeout=60)
          if result.returncode:
              print('Previous job diagnostics unavailable; current source tests remain authoritative.')
          else:
              text = re.sub(r'\x1b\[[0-9;]*m', '', result.stdout)
              lines = text.splitlines()
              selected = set()
              for i, line in enumerate(lines):
                  if re.search(r'FAIL\s|Failed Tests|AssertionError|Test Files|Tests\s+[0-9]+ failed', line):
                      selected.update(range(max(0, i - 2), min(len(lines), i + 24)))
              print('\n'.join(lines[i] for i in sorted(selected))[-18000:])
          PY
      - name: Apply final reviewed boundary changes
        run: python3 scripts/release/finish-production-publication.py
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format new test and updated documentation
        run: pnpm exec prettier --write scripts/release/config-publication-boundary.test.mjs docs/plans/production-model-config-online-save.md docs/config-identity.md
      - name: Verify without hiding independent failures
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          root = Path('/tmp/production-model-final')
          root.mkdir()
          base = '692618557f76bce83549584be0e434a559696ef8'
          paths = set(subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines())
          lint = sorted(p for p in paths if Path(p).is_file() and re.search(r'\.(?:mjs|cjs|js|jsx|ts|tsx|mts|cts)$', p))
          checks = [
            ('lint', ['pnpm', 'exec', 'eslint', *lint]),
            ('engineering', ['pnpm', 'check:ratchets']),
            ('migration-reviews', ['node', 'scripts/release/check-reviewed-migrations.mjs']),
            ('release-contracts', ['pnpm', 'test:release-contracts']),
            ('shared-types', ['pnpm', '-F', '@agent/shared', 'typecheck']),
            ('server-types', ['pnpm', '-F', 'server', 'typecheck']),
            ('web-types', ['pnpm', '-F', 'web', 'typecheck']),
            ('production-runtime', ['pnpm', '-F', 'server', 'exec', 'vitest', 'run', 'productionModelPublication', 'memoryIndexRuntimeUpdate', 'sharedConfigRefresher', 'adminRunner', 'src/__tests__/modelsAdminProductionWritePolicy.test.ts', 'src/__tests__/modelsAdmin.test.ts', 'src/__tests__/modelsAdminQuotaSource.test.ts', 'src/__tests__/modelsAdminGuardrailDisable.test.ts', 'src/__tests__/adminConfigMutationService.test.ts', 'src/app/modelResolvers.test.ts', 'src/app/configRuntimeRecovery.integration.test.ts', 'src/runtime/configIdentityRuntime.test.ts']),
            ('production-ui', ['pnpm', '-F', 'web', 'exec', 'vitest', 'run', 'src/components/ModelManager/index.test.tsx', 'src/components/ModelManager/writePolicy.test.tsx', 'src/components/ModelManager/productionSave.test.tsx']),
            ('server-build', ['pnpm', '-F', 'server', 'build']),
            ('web-build', ['pnpm', '-F', 'web', 'build']),
            ('web-budget', ['pnpm', 'check:web-startup-budget']),
            ('whitespace', ['git', 'diff', '--check']),
          ]
          results = []
          for name, command in checks:
              log = root / f'{name}.log'
              with log.open('w') as out:
                  try:
                      code = subprocess.run(command, stdout=out, stderr=subprocess.STDOUT, timeout=900).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              text = re.sub(r'\x1b\[[0-9;]*m', '', log.read_text(errors='replace'))
              print(f'CHECK {name}: exit={code}', flush=True)
              if code:
                  print('\n'.join(text.splitlines()[-100:]), flush=True)
              else:
                  print('\n'.join(line for line in text.splitlines() if re.search(r'Test Files|Tests\s|^# (tests|pass|fail)|warnings?|built in', line))[-6000:], flush=True)
              results.append({'check': name, 'exitCode': code})
              (root / 'results.json').write_text(json.dumps(results, indent=2))
          raise SystemExit(1 if any(item['exitCode'] for item in results) else 0)
          PY
      - name: Smoke test sealed publication CLI with an isolated credential-free configuration
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          printf '{}\n' > "$temporary/config.json"
          expected='{"schemaVersion":1,"digest":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","credentialVersionDigest":null}'
          node server/dist/config-publication-cli.js prepare "$temporary/config.json" synthetic-ci-release "$expected"
          node server/dist/config-publication-cli.js verify "$temporary/config.json"
          test "$(cat "$temporary/config.json")" = '{}'
      - name: Commit verified final source changes to the original PR branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/models-production-write-policy-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git add -- scripts/release/read-production-state.mjs scripts/release/deploy-production-release.sh \
            scripts/release/config-publication-boundary.test.mjs docs/config-identity.md docs/plans/production-model-config-online-save.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(release): validate signed online versions at API and Worker rollback boundaries'
          git push origin HEAD:refs/heads/fix/models-production-write-policy-20260908
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-model-final-${{ github.run_id }}
          path: /tmp/production-model-final/
          if-no-files-found: ignore
          retention-days: 1
