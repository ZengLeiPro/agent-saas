name: Production model publication final verification
# Temporary PR-593 helper. No production environments, credentials or deployment.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths:
      - .github/workflows/production-model-publication-verification.yml
      - scripts/release/finish-production-publication.py
permissions:
  contents: read
  actions: read
concurrency:
  group: production-model-publication-integration
  cancel-in-progress: false
jobs:
  diagnostics:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact previous failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          def show(text):
              lines = re.sub(r'\x1b\[[0-9;]*m', '', text).splitlines()
              selected = set()
              for i, line in enumerate(lines):
                  if re.search(r'not ok |FAIL\s|Failed Tests|AssertionError|Error:|Test Files|^# (tests|pass|fail)', line):
                      selected.update(range(max(0, i - 2), min(len(lines), i + 55)))
              print('\n'.join(lines[i] for i in sorted(selected))[-26000:], flush=True)
          result = subprocess.run(['gh', 'run', 'download', '34298556822', '--repo', 'ZengLeiPro/agent-saas', '--name', 'production-model-final-34298556822', '--dir', '/tmp/last-verification'], capture_output=True, text=True, timeout=90)
          print('Prior verification artifact download exit:', result.returncode)
          if result.returncode:
              print(result.stderr[-2000:])
          else:
              show(Path('/tmp/last-verification/release-contracts.log').read_text(errors='replace'))
          result = subprocess.run(['gh', 'run', 'view', '34298560965', '--repo', 'ZengLeiPro/agent-saas', '--job', '102300423626', '--log-failed'], capture_output=True, text=True, timeout=90)
          print('Prior Server shard log read exit:', result.returncode)
          if result.returncode:
              print(result.stderr[-2000:])
          else:
              show(result.stdout)
          PY
  reproduce:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply final reviewed boundary changes
        run: python3 scripts/release/finish-production-publication.py
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reproduce remaining release and Server gates with bounded failure contexts
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          root = Path('/tmp/production-model-reproduce')
          root.mkdir()
          checks = [
              ('release-contracts', ['pnpm', 'test:release-contracts'], {}),
              ('server-shard-4', ['bash', 'scripts/pr-preflight-task.sh', 'test', 'server', '4', '4', 'full', '-', 'true'], {'TEST_DATABASE_URL': 'postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test'}),
          ]
          results = []
          for name, command, environment in checks:
              log = root / f'{name}.log'
              with log.open('w') as out:
                  code = subprocess.run(command, env={**os.environ, **environment}, stdout=out, stderr=subprocess.STDOUT, timeout=900).returncode
              lines = re.sub(r'\x1b\[[0-9;]*m', '', log.read_text(errors='replace')).splitlines()
              selected = set(range(max(0, len(lines)-20), len(lines)))
              for i, line in enumerate(lines):
                  if re.search(r'not ok |FAIL\s|Failed Tests|AssertionError|Error:|Test Files', line):
                      selected.update(range(max(0, i-2), min(len(lines), i+70)))
              print(f'CHECK {name}: exit={code}', flush=True)
              print('\n'.join(lines[i] for i in sorted(selected))[-32000:], flush=True)
              results.append(code)
          raise SystemExit(1 if any(results) else 0)
          PY
      - name: Retain local test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-model-reproduce-${{ github.run_id }}
          path: /tmp/production-model-reproduce/
          if-no-files-found: ignore
          retention-days: 1
