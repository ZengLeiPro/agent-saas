name: Production model publication final verification
# Temporary PR-593 helper. No production environments, credentials or deployment.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths:
      - .github/workflows/production-model-publication-verification.yml
      - scripts/release/finish-production-publication.py
permissions:
  contents: write
  actions: read
concurrency:
  group: production-model-publication-integration
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agent_saas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_saas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply final reviewed boundary changes
        run: python3 scripts/release/finish-production-publication.py
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format boundary regression and updated documentation
        run: pnpm exec prettier --write scripts/release/config-publication-boundary.test.mjs docs/plans/production-model-config-online-save.md docs/config-identity.md
      - name: Verify source, real failing shard and release contracts independently
        run: |
          python3 - <<'PY'
          import os, json, re, subprocess
          from pathlib import Path
          root = Path('/tmp/production-model-final')
          root.mkdir()
          base = '692618557f76bce83549584be0e434a559696ef8'
          paths = set(subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines())
          lint = sorted(p for p in paths if Path(p).is_file() and re.search(r'\.(?:mjs|cjs|js|jsx|ts|tsx|mts|cts)$', p))
          database = {'TEST_DATABASE_URL': 'postgresql://agent_test:ci-only-password@127.0.0.1:5432/agent_saas_test'}
          checks = [
            ('lint', ['pnpm', 'exec', 'eslint', *lint], {}),
            ('engineering', ['pnpm', 'check:ratchets'], {}),
            ('release-contracts', ['pnpm', 'test:release-contracts'], {}),
            ('server-shard-4', ['bash', 'scripts/pr-preflight-task.sh', 'test', 'server', '4', '4', 'full', '-', 'true'], database),
            ('shared-types', ['pnpm', '-F', '@agent/shared', 'typecheck'], {}),
            ('server-types', ['pnpm', '-F', 'server', 'typecheck'], {}),
            ('web-types', ['pnpm', '-F', 'web', 'typecheck'], {}),
            ('production-runtime', ['pnpm', '-F', 'server', 'exec', 'vitest', 'run', 'productionModelPublication', 'memoryIndexRuntimeUpdate', 'sharedConfigRefresher', 'adminRunner', 'src/__tests__/modelsAdminProductionWritePolicy.test.ts', 'src/__tests__/modelsAdmin.test.ts', 'src/__tests__/modelsAdminQuotaSource.test.ts', 'src/__tests__/modelsAdminGuardrailDisable.test.ts', 'src/__tests__/adminConfigMutationService.test.ts', 'src/app/modelResolvers.test.ts', 'src/app/configRuntimeRecovery.integration.test.ts', 'src/app/sessionAutomationProductionAssembly.test.ts', 'src/runtime/configIdentityRuntime.test.ts'], {}),
            ('production-ui', ['pnpm', '-F', 'web', 'exec', 'vitest', 'run', 'src/components/ModelManager/index.test.tsx', 'src/components/ModelManager/writePolicy.test.tsx', 'src/components/ModelManager/productionSave.test.tsx'], {}),
            ('server-build', ['pnpm', '-F', 'server', 'build'], {}),
            ('web-build', ['pnpm', '-F', 'web', 'build'], {}),
            ('web-budget', ['pnpm', 'check:web-startup-budget'], {}),
            ('whitespace', ['git', 'diff', '--check'], {}),
          ]
          results = []
          for name, command, environment in checks:
              log = root / f'{name}.log'
              with log.open('w') as out:
                  try:
                      code = subprocess.run(command, env={**os.environ, **environment}, stdout=out, stderr=subprocess.STDOUT, timeout=900).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              lines = re.sub(r'\x1b\[[0-9;]*m', '', log.read_text(errors='replace')).splitlines()
              print(f'CHECK {name}: exit={code}', flush=True)
              if code:
                  for i, line in enumerate(lines):
                      if re.search(r'^not ok |\bFAIL\s|AssertionError:|Failed Tests|❯ .*\.(?:test|spec)\.[cm]?[jt]sx?:\d+', line):
                          print('\n'.join(lines[i:i+18])[:6000], flush=True)
                  print('\n'.join(lines[-25:])[-5000:], flush=True)
              else:
                  print('\n'.join(line for line in lines if re.search(r'Test Files|Tests\s|^# (tests|pass|fail)|warnings?|built in', line))[-6000:], flush=True)
              results.append({'check': name, 'exitCode': code})
              (root / 'results.json').write_text(json.dumps(results, indent=2))
          raise SystemExit(1 if any(item['exitCode'] for item in results) else 0)
          PY
      - name: Smoke test sealed CLI against an isolated credential-free configuration
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          printf '{}\n' > "$temporary/config.json"
          expected='{"schemaVersion":1,"digest":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","credentialVersionDigest":null}'
          node server/dist/config-publication-cli.js prepare "$temporary/config.json" synthetic-ci-release "$expected"
          node server/dist/config-publication-cli.js verify "$temporary/config.json"
          test "$(cat "$temporary/config.json")" = '{}'
      - name: Commit verified source and remove temporary patch generators
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/models-production-write-policy-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git add -- scripts/release/read-production-state.mjs scripts/release/deploy-production-release.sh \
            scripts/release/config-publication-boundary.test.mjs docs/config-identity.md docs/plans/production-model-config-online-save.md
          git rm -- scripts/release/bootstrap-production-model-publication.py \
            scripts/release/finalize-production-model-integration.py scripts/release/finish-production-publication.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(release): complete signed online configuration rollback boundaries'
          git push origin HEAD:refs/heads/fix/models-production-write-policy-20260908
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Retain isolated verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-model-final-${{ github.run_id }}
          path: /tmp/production-model-final/
          if-no-files-found: ignore
          retention-days: 1
