name: Production model publication integration verification
# Temporary PR-593 development helper. No deployment environment, secrets,
# production endpoint, main writes, merge or deployment action.
on:
  push:
    branches: [fix/models-production-write-policy-20260908]
    paths:
      - .github/workflows/production-model-publication-verification.yml
      - scripts/release/bootstrap-production-model-publication.py
      - scripts/release/finalize-production-model-integration.py
permissions:
  contents: write
concurrency:
  group: production-model-publication-integration
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ZengLeiPro/agent-saas' && github.ref == 'refs/heads/fix/models-production-write-policy-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply checked integration patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/release/bootstrap-production-model-publication.py')
          s = p.read_text()
          old = "    count = text.count(old)\n    if count != 1:"
          new = "    count = text.count(old)\n    if count != 1 and old.startswith(' '):\n        old, new = '\\n' + old, '\\n' + new\n        count = text.count(old)\n    if count != 1:"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          python3 scripts/release/bootstrap-production-model-publication.py
          git restore -- scripts/release/bootstrap-production-model-publication.py
          python3 scripts/release/finalize-production-model-integration.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ['scripts/release/read-production-state.mjs', 'scripts/release/read-live-production-components.mjs']:
              p = Path(name)
              lines = p.read_text().splitlines()
              if lines[1].startswith('#!'):
                  lines[0], lines[1] = lines[1], lines[0]
                  p.write_text('\n'.join(lines) + '\n')
          p = Path('server/src/config/productionModelPublisher.ts')
          p.write_text(p.read_text().replace('  publishedExpected, rawRevision,', '  rawRevision,'))
          p = Path('server/src/__tests__/productionModelPublication.process.test.ts')
          s = p.read_text()
          assert s.count('    alias: {') == 1
          s = s.replace('    alias: {', "    packages: 'external', alias: {")
          assert s.count("symlinkSync(resolve('node_modules')") == 1
          s = s.replace("symlinkSync(resolve('node_modules')", "symlinkSync(resolve('../node_modules')")
          p.write_text(s)
          p = Path('web/src/components/ModelManager/useModelWritePolicy.ts')
          s = p.read_text().replace('        ? `${PRODUCTION_NOTICE} ${policy.message}`', '        ? (policy.message || PRODUCTION_NOTICE)')
          p.write_text(s)
          PY
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format new modules and bind migration review evidence
        run: |
          pnpm exec prettier --write \
            scripts/release/config-publication.mjs scripts/release/config-publication.d.mts scripts/release/config-publication.test.mjs scripts/release/config-publication-release.test.mjs \
            server/src/config/productionModelPublisher.ts \
            server/src/app/productionConfigIdentity.ts server/src/app/productionModelPublication.ts \
            server/src/app/memoryIndexRuntimeUpdate.ts server/src/app/memoryIndexRuntimeUpdate.test.ts \
            server/src/release/configPublicationCli.ts \
            server/src/__tests__/helpers/productionPublicationRig.ts server/src/__tests__/helpers/productionPublicationWorker.ts \
            server/src/__tests__/productionModelPublication.test.ts server/src/__tests__/productionModelPublication.process.test.ts server/src/__tests__/productionModelPublication.fence.test.ts \
            web/src/components/ModelManager/productionSave.test.tsx \
            docs/release/生产模型在线发布运行时装配审核-20260909.md
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          path = 'server/src/app/runtime.ts'
          old = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
          digest = lambda data: 'sha256:' + hashlib.sha256(data).hexdigest()
          old_digest, new_digest = digest(old), digest(Path(path).read_bytes())
          document = 'docs/release/生产模型在线发布运行时装配审核-20260909.md'
          evidence = {'path': document, 'digest': digest(Path(document).read_bytes())}
          p = Path('config/release-migration-reviews.json')
          data = json.loads(p.read_text())
          updated = 0
          for review in data['reviews']:
              touched = False
              for item in review['files']:
                  if item['path'] != path:
                      continue
                  assert item['targetDigest'] == old_digest, 'Historical target is not the reviewed source baseline'
                  item['targetDigest'] = new_digest
                  item['reason'] += ' 本次追加生产模型签名配置发布、双进程读回及记忆索引事务装配，不新增数据库结构或数据变更；见生产模型在线发布运行时装配审核。'
                  touched = True
                  updated += 1
              if touched and evidence not in review['evidence']:
                  review['evidence'].append(evidence)
          assert updated > 0
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          paths = set(json.loads(Path('/tmp/production-model-integration-paths.json').read_text()))
          paths.update([str(p), document, 'scripts/release/config-publication-release.test.mjs'])
          Path('/tmp/production-model-integration-paths.json').write_text(json.dumps(sorted(paths)))
          print('Preserved historical classifications and rebound', updated, 'runtime reviews', old_digest, new_digest)
          PY
      - name: Typechecks, production saves, real Worker restart and bundles
        run: |
          set -euo pipefail
          exec 3>&1
          trap 'tail -n 160 /tmp/production-model-publication-verification.log >&3' EXIT
          {
            node --test scripts/release/config-publication.test.mjs scripts/release/config-publication-release.test.mjs
            pnpm -F @agent/shared typecheck
            pnpm -F server typecheck
            pnpm -F web typecheck
            pnpm -F server exec vitest run \
              productionModelPublication memoryIndexRuntimeUpdate sharedConfigRefresher adminRunner \
              src/__tests__/modelsAdminProductionWritePolicy.test.ts \
              src/__tests__/modelsAdmin.test.ts src/__tests__/modelsAdminQuotaSource.test.ts \
              src/__tests__/modelsAdminGuardrailDisable.test.ts src/__tests__/adminConfigMutationService.test.ts \
              src/app/modelResolvers.test.ts src/app/configRuntimeRecovery.integration.test.ts src/runtime/configIdentityRuntime.test.ts
            pnpm -F web exec vitest run src/components/ModelManager/index.test.tsx src/components/ModelManager/writePolicy.test.tsx src/components/ModelManager/productionSave.test.tsx
            pnpm -F server build
            pnpm -F web build
            git diff --check
          } > /tmp/production-model-publication-verification.log 2>&1
      - name: Commit verified integration only to the original PR branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/models-production-write-policy-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/production-model-integration-paths.json'))
          paths += [
            'scripts/release/config-publication.mjs', 'scripts/release/config-publication.d.mts', 'scripts/release/config-publication.test.mjs',
            'server/src/config/productionModelPublisher.ts', 'server/src/app/productionConfigIdentity.ts',
            'server/src/app/productionModelPublication.ts', 'server/src/app/memoryIndexRuntimeUpdate.ts',
            'server/src/release/configPublicationCli.ts', 'server/src/app/memoryIndexRuntimeUpdate.test.ts',
            'server/src/__tests__/helpers/productionPublicationRig.ts', 'server/src/__tests__/helpers/productionPublicationWorker.ts',
            'server/src/__tests__/productionModelPublication.test.ts', 'server/src/__tests__/productionModelPublication.process.test.ts',
            'web/src/components/ModelManager/productionSave.test.tsx',
          ]
          subprocess.run(['git', 'add', '--', *sorted(set(paths))], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(models): wire verified signed production save and dual-process application'
          git push origin HEAD:refs/heads/fix/models-production-write-policy-20260908
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Retain test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-model-publication-verification-${{ github.run_id }}
          path: /tmp/production-model-publication-verification.log
          if-no-files-found: ignore
          retention-days: 1
