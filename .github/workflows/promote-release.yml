name: 生产环境发布

# 与 CI/ACS 兼容直发共享互斥组，覆盖基线读取、分阶段切换和最终 readback。

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: '已通过 Staging 确定性门禁的 RC ID'
        required: true
        type: string
      reason:
        description: '生产晋级原因与人工验收结论（写入 approval attestation）'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  deployments: write

# 生产切换与自动收尾共用本次锁，并与 compatibility App/ACS 串行。
concurrency:
  group: production-runtime
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  PRODUCTION_WEB_OSS_URI: oss://agent-saas-web
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REPO_ID: crr-csx99pbexlsw5qqv
  ACR_REGION_ID: cn-shenzhen
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox

jobs:
  promote:
    name: 晋级已批准的不可变产物
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RELEASE_RECORD_OSS_URI: ${{ vars.RELEASE_RECORD_OSS_URI }}
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      RELEASE_ID_INPUT: ${{ inputs.release_id }}
      PROMOTION_REASON: ${{ inputs.reason }}

    steps:
      - name: 校验生产发布触发参数
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_ID_INPUT" =~ ^rc-[0-9]{8}-[0-9]{2,}$ ]]
          test -n "$(printf '%s' "$PROMOTION_REASON" | tr -d '[:space:]')"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID_INPUT" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装阿里云 CLI
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: 下载不可变 RC 证据
        id: release_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/attestations"
          gh release download "$RELEASE_ID" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json --pattern artifact-index.json --pattern 'attestation-*.jsonl'
          mv "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/manifest.json"
          node scripts/release/attestation-snapshot.mjs select \
            "$RUNNER_TEMP/release"/attestation-*.jsonl \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts "$RUNNER_TEMP/manifest.json" "$RELEASE_ID"
          node scripts/release/verify-promotion-entry.mjs "$RUNNER_TEMP/manifest.json"
          release_sha="$(jq -r .releaseSha "$RUNNER_TEMP/manifest.json")"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/manifest.json")"
          git fetch --no-tags origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          test "$(git rev-parse "$RELEASE_ID^{commit}")" = "$release_sha"
          tag_object="$(git rev-parse "$RELEASE_ID^{tag}")"
          git cat-file -p "$tag_object" | grep -Fx "manifest-digest: $manifest_digest"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          test "$(jq -r .migrationPlan.contract "$RUNNER_TEMP/manifest.json")" = separate_release
          migration_phase="$(jq -r .migrationPlan.phase "$RUNNER_TEMP/manifest.json")"
          migration_confirmation="$(jq -r .migrationPlan.confirmation "$RUNNER_TEMP/manifest.json")"
          case "$migration_phase:$migration_confirmation" in
            none:not_required|expand:required_after_observation) ;;
            *) echo 'Invalid expand/confirm/contract migration plan' >&2; exit 1 ;;
          esac
          finalization_mode="$(node scripts/release/promotion-finalization-mode.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$GITHUB_RUN_ID")"
          if [ "$finalization_mode" != promote ]; then
            deployment_id="$(node scripts/release/promotion-finalization-mode.mjs \
              "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$GITHUB_RUN_ID" --deployment-id)"
            echo "PRODUCTION_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          fi
          {
            echo "RELEASE_SHA=$release_sha"
            echo "MANIFEST_DIGEST=$manifest_digest"
            echo "PROMOTION_FINALIZATION_MODE=$finalization_mode"
            echo "MIGRATION_PHASE=$migration_phase"
          } >> "$GITHUB_ENV"

      - name: 以失败关闭方式复核确定性测试环境证据并记录人工批准
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          # 上一次 runner 若在 durable promoting marker 与最终 outcome 之间中断，
          # 生产可能未写入、部分写入或已写入；统一先形成可审计 needs_human 尾部，
          # 再由本次受保护的 production environment 审核进入 retry_after_change。
          latest_state="$(tail -n1 "$log" | jq -r .state)"
          if [ "$latest_state" = promoting ]; then
            marker_reason="$(jq -nc --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              '{summary:"previous promotion ended after the durable promoting marker without a final outcome; production mutation may have started",runId:$runId,runAttempt:$runAttempt,recoveryMode:"retry_after_change"}')"
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state needs_human --operation "recover-promoting:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
              --actor "$GITHUB_ACTOR" --reason "$marker_reason"
            marker_snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
              "$log" "$RUNNER_TEMP/attestation-snapshots")"
            marker_snapshot_path="$(printf '%s' "$marker_snapshot_json" | jq -r .path)"
            bash scripts/release/upload-github-release-asset-immutable.sh \
              "$RELEASE_ID" "$marker_snapshot_path"
            bash scripts/release/upload-oss-object-immutable.sh "$marker_snapshot_path" \
              "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$marker_snapshot_path")"
          fi
          # 允许 verified 首次晋级、已证明未写入的重试，或人工审核后的精确前缀恢复。
          retry_evidence="$(node scripts/release/assert-promotion-retry.mjs "$log")"
          retry_mode="$(printf '%s' "$retry_evidence" | jq -r .mode)"
          latest_state="$(tail -n1 "$log" | jq -r .state)"
          if { [ "$retry_mode" = retry_before_change ] && [ "$latest_state" != failed_before_change ]; } || \
             { [ "$retry_mode" = retry_after_change ] && [ "$latest_state" = approved ]; }; then
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state failed_before_change \
              --operation "retry-normalize:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
              --actor "$GITHUB_ACTOR" --reason "$retry_evidence"
          fi
          staging="$(jq -c 'select(.state=="staging_deployed")' "$log" | tail -n1)"
          test -n "$staging"
          staging_reason="$(printf '%s' "$staging" | jq -r .reason)"
          deployment_id="$(printf '%s' "$staging_reason" | jq -r .stagingDeploymentId)"
          staging_run_id="$(printf '%s' "$staging_reason" | jq -r .stagingRunId)"
          verification_summary="$(printf '%s' "$staging_reason" | jq -c .verificationSummary)"
          staging_runtime_path="$(jq -r '.artifacts.stagingRuntimeAssets?.path // empty' \
            "$RUNNER_TEMP/release/artifact-index.json")"
          test "$(printf '%s' "$verification_summary" | jq -r .schemaVersion)" = 1
          test "$(printf '%s' "$verification_summary" | jq -r .mode)" = deterministic-deployment-gates-v1
          test "$(printf '%s' "$verification_summary" | jq -r .status)" = passed
          expected_checks='["acs-health","api-readiness","immutable-artifacts","migration-readback","reverse-isolation","runtime-identity","web-readback"]'
          test "$(printf '%s' "$verification_summary" | jq -c '.checks | sort')" = "$expected_checks"
          printf '%s' "$deployment_id" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$staging_run_id" | grep -Eq '^[1-9][0-9]*$'
          test "$(printf '%s' "$staging_reason" | jq -r .manifestDigest)" = "$MANIFEST_DIGEST"
          # 仅 #349 之后的 RC 拥有独立 Staging runtime evidence；旧 RC 沿用既有 verified 证据。
          if [ -n "$staging_runtime_path" ]; then
            runtime_summary="$(printf '%s' "$staging_reason" | jq -ce \
              '.runtimeSummary | select(type=="object")')"
            expected_runtime_summary="$(jq -nc \
              --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
              --arg serverDigest "$(jq -r .components.api.artifactDigest "$RUNNER_TEMP/manifest.json")" \
              --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
              --arg acsOrchestratorDigest "$(jq -r .components.acs.orchestratorArtifactDigest "$RUNNER_TEMP/manifest.json")" \
              --arg acsImageDigest "$(jq -r .components.acs.sandboxImageDigest "$RUNNER_TEMP/manifest.json")" \
              --arg stagingRuntimeAssetsDigest "$(jq -r .artifacts.stagingRuntimeAssets.digest "$RUNNER_TEMP/release/artifact-index.json")" \
              '{schemaVersion:1,releaseId:$releaseId,manifestDigest:$manifestDigest,serverDigest:$serverDigest,webDigest:$webDigest,acsOrchestratorDigest:$acsOrchestratorDigest,acsImageDigest:$acsImageDigest,stagingRuntimeAssetsDigest:$stagingRuntimeAssetsDigest}')"
            test "$(printf '%s' "$runtime_summary" | jq -S .)" = \
              "$(printf '%s' "$expected_runtime_summary" | jq -S .)"
          fi
          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id")"
          test "$(printf '%s' "$deployment" | jq -r .environment)" = staging
          test "$(printf '%s' "$deployment" | jq -r .sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$deployment" | jq -r .payload.releaseId)" = "$RELEASE_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state')" = success
          staging_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$staging_run_id")"
          test "$(printf '%s' "$staging_run" | jq -r .head_sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$staging_run" | jq -r .conclusion)" = success
          test "$(printf '%s' "$staging_run" | jq -r .path)" = .github/workflows/deploy-staging.yml
          approval_reason="$(jq -nc \
            --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg stagingDeploymentId "$deployment_id" --arg stagingRunId "$staging_run_id" \
            --argjson verificationSummary "$verification_summary" \
            --arg triggeredAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg recoveryMode "$retry_mode" \
            --arg reason "$PROMOTION_REASON" \
            '{releaseId:$releaseId,manifestDigest:$manifestDigest,stagingDeploymentId:$stagingDeploymentId,stagingRunId:$stagingRunId,verificationSummary:$verificationSummary,triggeredAt:$triggeredAt,recoveryMode:$recoveryMode,reason:$reason}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state approved --operation "approval:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_ACTOR" \
            --reason "$approval_reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          echo 'APPROVAL_RECORDED=true' >> "$GITHUB_ENV"
          echo "PROMOTION_RETRY_MODE=$retry_mode" >> "$GITHUB_ENV"

      - name: 配置生产环境 SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing ECS_HOST}"; : "${ECS_USER:?Missing ECS_USER}"; : "${ECS_SSH_KEY:?Missing ECS_SSH_KEY}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          ssh-keyscan -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/production-known-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/production-known-host" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/production-known-host" >> ~/.ssh/known_hosts

      - name: 写入前读取权威在线生产前缀
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          remote="/tmp/release-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs scripts/release/read-runtime-identity.mjs \
            scripts/release/verify-installed-release.mjs scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          api_action="$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")"
          worker_action="$(jq -r .components.runtimeWorker.action "$RUNNER_TEMP/manifest.json")"
          baseline_plan="$(node scripts/release/promotion-config-identity-state.mjs plan \
            --retry-mode "$PROMOTION_RETRY_MODE" --api-action "$api_action" \
            --runtime-worker-action "$worker_action")"
          reader="$(printf '%s' "$baseline_plan" | jq -r .reader)"
          reader_stage="$(printf '%s' "$baseline_plan" | jq -r .configIdentityStage)"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/$reader' --config-identity-stage '$reader_stage' --output '$remote/production-before.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-before.json" \
            "$RUNNER_TEMP/production-before.json"
          # This gate is deliberately before promotionGate, payload prefetch, the durable promoting
          # marker, receipts, and every production mutation.
          node scripts/release/promotion-config-identity-state.mjs assert-write-gate \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --production-state "$RUNNER_TEMP/production-before.json"
          pnpm exec tsx server/src/release/promotionGateCli.ts \
            --manifest "$RUNNER_TEMP/manifest.json" --attestation-root "$RUNNER_TEMP/attestations" \
            --production-state "$RUNNER_TEMP/production-before.json" \
            --recovery-mode "$PROMOTION_RETRY_MODE"
          production_already_target=false
          if [ "$PROMOTION_RETRY_MODE" = retry_after_change ]; then
            jq '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' \
              "$RUNNER_TEMP/manifest.json" > "$RUNNER_TEMP/production-target.json"
            if diff -q <(jq -S .components "$RUNNER_TEMP/production-before.json") \
                <(jq -S . "$RUNNER_TEMP/production-target.json") >/dev/null; then
              production_already_target=true
            fi
          fi
          echo "PRODUCTION_ALREADY_TARGET=$production_already_target" >> "$GITHUB_ENV"

      - name: 校验 OSS 中的不可变清单、产物索引与 Release 记录
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          : "${RELEASE_RECORD_OSS_URI:?Missing production variable RELEASE_RECORD_OSS_URI}"
          case "$RELEASE_RECORD_OSS_URI" in oss://*) ;; *) exit 1 ;; esac
          record_uri="$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID"
          mkdir -p "$RUNNER_TEMP/oss-record"
          aliyun --secure oss cp "$record_uri/manifest.json" \
            "$RUNNER_TEMP/oss-record/manifest.json" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$record_uri/artifact-index.json" \
            "$RUNNER_TEMP/oss-record/artifact-index.json" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$record_uri/record.json" \
            "$RUNNER_TEMP/oss-record/record.json" --region "$RELEASE_RECORD_OSS_REGION"
          diff -u <(jq -S . "$RUNNER_TEMP/manifest.json") \
            <(jq -S . "$RUNNER_TEMP/oss-record/manifest.json")
          diff -u <(jq -S . "$RUNNER_TEMP/release/artifact-index.json") \
            <(jq -S . "$RUNNER_TEMP/oss-record/artifact-index.json")
          # Release record 必须与同一 immutable Manifest 和 artifact index 成组验证。
          node scripts/release/verify-release-record.mjs \
            "$RUNNER_TEMP/oss-record/record.json" \
            "$RUNNER_TEMP/oss-record/manifest.json" \
            "$RUNNER_TEMP/oss-record/artifact-index.json"
          test "$(jq -r .releaseId "$RUNNER_TEMP/oss-record/record.json")" = "$RELEASE_ID"
          test "$(jq -r .releaseSha "$RUNNER_TEMP/oss-record/record.json")" = "$RELEASE_SHA"
          test "$(jq -r .manifestDigest "$RUNNER_TEMP/oss-record/record.json")" = "$MANIFEST_DIGEST"
          test "$(jq -r .artifactDigest "$RUNNER_TEMP/oss-record/record.json")" = \
            "$(jq -r .aggregateDigest "$RUNNER_TEMP/release/artifact-index.json")"

      - name: 预取、校验并安全解压清单选定产物与 ACS 身份
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/built" "$RUNNER_TEMP/selected"
          fetch() { case "$1" in oss://*) aliyun --secure oss cp "$1" "$2" --region "$RELEASE_RECORD_OSS_REGION" ;; https://*) curl -fsSL --retry 3 "$1" -o "$2" ;; *) return 1 ;; esac; }
          cp "$RUNNER_TEMP/release/artifact-index.json" "$RUNNER_TEMP/built/artifact-index.json"
          built_base="$RELEASE_RECORD_OSS_URI/$RELEASE_ID"
          while IFS= read -r artifact_path; do
            [[ "$artifact_path" =~ ^[A-Za-z0-9._-]+$ ]]
            fetch "$built_base/$artifact_path" "$RUNNER_TEMP/built/$artifact_path"
          done < <(jq -r '.artifacts[] | .path' "$RUNNER_TEMP/built/artifact-index.json")
          sbom_path="$(jq -r .sbom.path "$RUNNER_TEMP/built/artifact-index.json")"
          [[ "$sbom_path" =~ ^[A-Za-z0-9._-]+$ ]]
          fetch "$built_base/$sbom_path" "$RUNNER_TEMP/built/$sbom_path"
          # 历史 v1 index 早于 Runtime Dependency Identity，仍保留审计兼容。
          if [ "$(jq -r .schemaVersion "$RUNNER_TEMP/built/artifact-index.json")" = 2 ]; then
            runtime_path="$(jq -r .runtimeDependencies.path "$RUNNER_TEMP/built/artifact-index.json")"
            [[ "$runtime_path" =~ ^[A-Za-z0-9._-]+$ ]]
            fetch "$built_base/$runtime_path" "$RUNNER_TEMP/built/$runtime_path"
          fi
          node scripts/release/verify-artifact.mjs \
            "$RUNNER_TEMP/built/artifact-index.json" "$RELEASE_SHA"
          for pair in 'serverBundle server-bundle.tgz' 'webAssets web-assets.tgz' 'acsOrchestrator acs-orchestrator.tgz'; do
            set -- $pair
            uri="$(jq -r ".artifacts.$1.uri" "$RUNNER_TEMP/manifest.json")"
            fetch "$uri" "$RUNNER_TEMP/selected/$2"
          done

          if [ "$(jq -r .schemaVersion "$RUNNER_TEMP/manifest.json")" = 2 ]; then
            fetch "$(jq -r .artifacts.runtimeDependencies.server.uri "$RUNNER_TEMP/manifest.json")" \
              "$RUNNER_TEMP/selected/runtime-dependencies-server.json"
            fetch "$(jq -r .artifacts.runtimeDependencies.acs.uri "$RUNNER_TEMP/manifest.json")" \
              "$RUNNER_TEMP/selected/runtime-dependencies-acs.json"
          fi
          node scripts/release/verify-selected-release-artifacts.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/selected"
          mkdir -p "$RUNNER_TEMP/selected-units"
          extract_control_file() {
            local archive="$1" member="$2" target="$3" raw candidate
            raw="$(tar -tzf "$archive" | awk -v member="$member" \
              '$0 == member || $0 == "./" member { matches[++count] = $0 } END { if (count != 1) exit 1; print matches[1] }')"
            candidate="$target.candidate"
            rm -f "$candidate"
            tar -xOf "$archive" -- "$raw" > "$candidate"
            test -s "$candidate"
            install -m 0444 "$candidate" "$target"
            rm -f "$candidate"
          }
          schema_version="$(jq -r .schemaVersion "$RUNNER_TEMP/manifest.json")"
          app_action="$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")"
          acs_action="$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")"
          if [ "$schema_version" = 2 ]; then
            if [ "$app_action" = deploy ]; then
              extract_control_file "$RUNNER_TEMP/selected/server-bundle.tgz" \
                server/daemon-packaging/systemd/agent-saas-server@.service.template \
                "$RUNNER_TEMP/selected-units/agent-saas-server@.service.template"
              extract_control_file "$RUNNER_TEMP/selected/server-bundle.tgz" \
                server/daemon-packaging/systemd/agent-saas-runtime-worker@.service.template \
                "$RUNNER_TEMP/selected-units/agent-saas-runtime-worker@.service.template"
            fi
            if [ "$acs_action" = deploy ]; then
              extract_control_file "$RUNNER_TEMP/selected/acs-orchestrator.tgz" \
                acs-orchestrator/daemon-packaging/systemd/agent-saas-acs-orchestrator.service.template \
                "$RUNNER_TEMP/selected-units/agent-saas-acs-orchestrator.service.template"
            fi
          fi
          expected_repository="$ACR_REGISTRY/$ACR_REPOSITORY"
          node scripts/release/verify-promotion-acs-selection.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/built/artifact-index.json" \
            "$expected_repository"

      - name: 生产写入前标记并持久化发布已开始状态
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_json="$(jq -cS .components "$RUNNER_TEMP/production-before.json")"
          target_json="$(jq -cS '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' "$RUNNER_TEMP/manifest.json")"
          before_digest="sha256:$(printf '%s' "$before_json" | sha256sum | cut -d' ' -f1)"
          target_digest="sha256:$(printf '%s' "$target_json" | sha256sum | cut -d' ' -f1)"
          promoting_reason="$(jq -nc --arg releaseId "$RELEASE_ID" --arg releaseSha "$RELEASE_SHA" \
            --arg manifestDigest "$MANIFEST_DIGEST" --arg migrationPhase "$MIGRATION_PHASE" \
            --arg migrationPlanDigest "$(jq -r .migrationPlan.planDigest "$RUNNER_TEMP/manifest.json")" \
            --arg productionBeforeDigest "$before_digest" --arg productionTargetDigest "$target_digest" \
            '{releaseId:$releaseId,releaseSha:$releaseSha,manifestDigest:$manifestDigest,migrationPhase:$migrationPhase,migrationPlanDigest:$migrationPlanDigest,productionBeforeDigest:$productionBeforeDigest,productionTargetDigest:$productionTargetDigest}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state promoting --operation "promoting:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$promoting_reason"
          # 该标志必须先于任一 snapshot 上传落盘；上传失败时最终 outcome 仍会
          # 追加 needs_human，runner 硬中断则由下一次 dispatch 收敛悬空 promoting。
          echo 'PROMOTION_STARTED=true' >> "$GITHUB_ENV"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")" \
            || echo "::warning title=OSS attestation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 创建 GitHub 生产部署记录
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg ref "$RELEASE_SHA" --arg releaseId "$RELEASE_ID" \
            '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],payload:{releaseId:$releaseId}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          test "$id" -gt 0
          echo "PRODUCTION_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null

      - name: 上传不可变部署载荷与 RC 绑定的托管单元
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          remote="/tmp/agent-saas-promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_archive="$remote.upload.tgz"
          root_archive="/run/agent-saas-locks/promotion-payload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz"
          upload_root="$RUNNER_TEMP/promotion-upload"
          echo "PROMOTION_REMOTE=$remote" >> "$GITHUB_ENV"
          rm -rf "$upload_root"
          mkdir -p "$upload_root/artifacts"
          cp "$RUNNER_TEMP/manifest.json" \
            scripts/release/deploy-production-release.sh scripts/release/write-production-identity.mjs \
            scripts/release/verify-installed-release.mjs \
            scripts/release/read-live-production-components.mjs scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs scripts/release/verify-promotion-phase-state.mjs \
            scripts/release/artifact-lib.mjs scripts/release/reuse-promotion-artifacts.mjs \
            "$upload_root/"
          if [ "$PRODUCTION_ALREADY_TARGET" != true ]; then
            reusable_list="$RUNNER_TEMP/reusable-artifacts.txt"
            : > "$reusable_list"
            node scripts/release/reuse-promotion-artifacts.mjs plan "$RUNNER_TEMP/manifest.json" \
              > "$RUNNER_TEMP/reusable-artifact-plan.tsv"
            while IFS=$'\t' read -r filename digest source; do
              if ssh -n -o ConnectTimeout=10 -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
                "sudo test -f '$source' && sudo test ! -L '$source' && test \"\$(sudo sha256sum '$source' | cut -d' ' -f1)\" = '$digest'"; then
                printf '%s\n' "$filename" >> "$reusable_list"
              fi
            done < "$RUNNER_TEMP/reusable-artifact-plan.tsv"
            for archive in "$RUNNER_TEMP/selected/"*.tgz; do
              if grep -Fx "$(basename "$archive")" "$reusable_list" >/dev/null; then
                echo "Reusing digest-verified production archive: $(basename "$archive")"
              else
                cp "$archive" "$upload_root/artifacts/"
              fi
            done
            unit_files=("$RUNNER_TEMP/selected-units/"*)
            if [ -e "${unit_files[0]}" ]; then
              cp "${unit_files[@]}" "$upload_root/"
            fi
          fi
          tar -C "$upload_root" -czf "$RUNNER_TEMP/promotion-upload.tgz" .
          archive_digest="$(sha256sum "$RUNNER_TEMP/promotion-upload.tgz" | cut -d' ' -f1)"
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/promotion-upload.tgz" \
            "$ECS_USER@$ECS_HOST:$remote_archive"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "test ! -L '/run/agent-saas-locks' && \
             sudo install -d -o root -g root -m 0700 '/run/agent-saas-locks' && \
             sudo install -m 0400 '$remote_archive' '$root_archive' && \
             rm -f '$remote_archive' && \
             test \"\$(sudo sha256sum '$root_archive' | cut -d' ' -f1)\" = '$archive_digest' && \
             sudo rm -rf '$remote' && sudo install -d -m 0700 '$remote' && \
             sudo tar --no-same-owner --no-same-permissions -xzf '$root_archive' -C '$remote' && \
             { [ '$PRODUCTION_ALREADY_TARGET' = true ] || sudo node '$remote/reuse-promotion-artifacts.mjs' hydrate '$remote/manifest.json' '$remote'; } && \
             sudo chown -R root:root '$remote' && sudo chmod -R a-w '$remote' && \
             sudo test -f '$remote/deploy-production-release.sh' && \
             sudo test ! -L '$remote/deploy-production-release.sh' && \
             test \"\$(sudo stat -c '%u:%g' '$remote/deploy-production-release.sh')\" = 0:0 && \
             test -z \"\$(sudo find '$remote' -perm /222 -print -quit)\" && \
             sudo rm -f '$root_archive' || { \
               rm -f '$remote_archive'; \
               sudo rm -rf '$remote' '$root_archive'; \
               exit 1; \
             }"

