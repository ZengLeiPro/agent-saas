name: 生产环境发布

# 与 CI Web-only 兼容发布共享互斥组；RC 晋级与冷备恢复是互斥操作，不共享部署逻辑。

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'promote 晋级 RC；web-recovery-audit 审计冷备；web-recovery-repair 按已审阅计划修复冷备'
        type: choice
        default: promote
        required: true
        options: [promote, web-recovery-audit, web-recovery-repair]
      release_id:
        description: 'promote 必填：已通过 Staging 确定性门禁的 RC ID；冷备操作必须留空'
        required: false
        type: string
      recovery_mode:
        description: 'normal 正常晋级；repair 允许旧 App 未就绪但安装字节与配置必须可验证'
        required: true
        type: choice
        default: normal
        options: [normal, repair]
      reason:
        description: '操作原因；RC 晋级时包含人工验收结论并写入 approval attestation'
        required: true
        type: string
      expected_plan_digest:
        description: 'web-recovery-repair 必填：已审阅 audit 报告中的 planDigest'
        type: string
        default: ''
        required: false
      confirm_recovery_only:
        description: '仅冷备修复时勾选；不修改 OSS、DNS、API 或可信身份'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: read
  deployments: write

# 生产切换、自动收尾及冷备恢复共用本次锁，并与 CI Web-only 兼容发布串行。
concurrency:
  group: production-runtime
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  PRODUCTION_WEB_OSS_URI: oss://agent-saas-web
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REPO_ID: crr-csx99pbexlsw5qqv
  ACR_REGION_ID: cn-shenzhen
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox

jobs:
  dispatch:
    name: 校验生产操作与互斥参数
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.validate.outputs.operation }}
      recovery_mode: ${{ steps.validate.outputs.recovery_mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 在读取生产凭据前拒绝无效或混用的参数
        id: validate
        run: node scripts/release/production-operation.mjs

  promote:
    name: 晋级已批准的不可变产物
    needs: dispatch
    if: github.ref == 'refs/heads/main' && needs.dispatch.outputs.operation == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    env:
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RELEASE_RECORD_OSS_URI: ${{ vars.RELEASE_RECORD_OSS_URI }}
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      RELEASE_ID_INPUT: ${{ inputs.release_id }}
      PROMOTION_REASON: ${{ inputs.reason }}
      PRODUCTION_RECOVERY_MODE: ${{ inputs.recovery_mode || 'normal' }}

    steps:
      - name: 校验生产发布触发参数
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          case "$PRODUCTION_RECOVERY_MODE" in normal|repair) ;; *) exit 1 ;; esac
          [[ "$RELEASE_ID_INPUT" =~ ^rc-[0-9]{8}-[0-9]{2,}$ ]]
          test -n "$(printf '%s' "$PROMOTION_REASON" | tr -d '[:space:]')"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID_INPUT" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 pnpm
        uses: ./.github/actions/setup-pnpm
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装阿里云 CLI
        run: |
          set -euo pipefail
          bash scripts/release/install-aliyun-cli.sh
          # hash 静态资源沿用兼容发布的 create-only + gzip 契约：SDK 条件写，ossutil 2.1.2 只做 stat/readback。
          curl -sL https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -o -q /tmp/ossutil.zip -d /tmp
          sudo install /tmp/ossutil-2.1.2-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version | grep -F '2.1.2'
          ossutil cp --help > "$RUNNER_TEMP/ossutil-cp-help.txt"
          ossutil stat --help > "$RUNNER_TEMP/ossutil-stat-help.txt"
          grep -Eq -- '(^|[[:space:],])-f([[:space:],]|$)' "$RUNNER_TEMP/ossutil-cp-help.txt"
          grep -Eq -- '(^|[[:space:],])--region([=[:space:],]|$)' "$RUNNER_TEMP/ossutil-cp-help.txt"
          grep -Eq -- '(^|[[:space:],])--region([=[:space:],]|$)' "$RUNNER_TEMP/ossutil-stat-help.txt"
          node scripts/release/put-web-asset-create-only.mjs --self-check

      - name: 下载不可变 RC 证据
        id: release_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/attestations"
          gh release download "$RELEASE_ID" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json --pattern artifact-index.json --pattern 'attestation-*.jsonl'
          mv "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/manifest.json"
          node scripts/release/attestation-snapshot.mjs select \
            "$RUNNER_TEMP/release"/attestation-*.jsonl \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts "$RUNNER_TEMP/manifest.json" "$RELEASE_ID"
          node scripts/release/verify-promotion-entry.mjs "$RUNNER_TEMP/manifest.json"
          release_sha="$(jq -r .releaseSha "$RUNNER_TEMP/manifest.json")"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/manifest.json")"
          git fetch --no-tags origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          test "$(git rev-parse "$RELEASE_ID^{commit}")" = "$release_sha"
          tag_object="$(git rev-parse "$RELEASE_ID^{tag}")"
          git cat-file -p "$tag_object" | grep -Fx "manifest-digest: $manifest_digest"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          test "$(jq -r .migrationPlan.contract "$RUNNER_TEMP/manifest.json")" = separate_release
          migration_phase="$(jq -r .migrationPlan.phase "$RUNNER_TEMP/manifest.json")"
          migration_confirmation="$(jq -r .migrationPlan.confirmation "$RUNNER_TEMP/manifest.json")"
          case "$migration_phase:$migration_confirmation" in
            none:not_required|expand:required_after_observation) ;;
            *) echo 'Invalid expand/confirm/contract migration plan' >&2; exit 1 ;;
          esac
          finalization_mode="$(node scripts/release/promotion-finalization-mode.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$GITHUB_RUN_ID")"
          if [ "$finalization_mode" != promote ]; then
            deployment_id="$(node scripts/release/promotion-finalization-mode.mjs \
              "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$GITHUB_RUN_ID" --deployment-id)"
            echo "PRODUCTION_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          fi
          {
            echo "RELEASE_SHA=$release_sha"
            echo "MANIFEST_DIGEST=$manifest_digest"
            echo "PROMOTION_FINALIZATION_MODE=$finalization_mode"
            echo "MIGRATION_PHASE=$migration_phase"
          } >> "$GITHUB_ENV"

      - name: 以失败关闭方式复核确定性测试环境证据并记录人工批准
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          # 上一次 runner 若在 durable promoting marker 与最终 outcome 之间中断，
          # 生产可能未写入、部分写入或已写入；统一先形成可审计 needs_human 尾部，
          # 再由本次受保护的 production environment 审核进入 retry_after_change。
          latest_state="$(tail -n1 "$log" | jq -r .state)"
          if [ "$latest_state" = promoting ]; then
            marker_reason="$(jq -nc --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              '{summary:"previous promotion ended after the durable promoting marker without a final outcome; production mutation may have started",runId:$runId,runAttempt:$runAttempt,recoveryMode:"retry_after_change"}')"
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state needs_human --operation "recover-promoting:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
              --actor "$GITHUB_ACTOR" --reason "$marker_reason"
            marker_snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
              "$log" "$RUNNER_TEMP/attestation-snapshots")"
            marker_snapshot_path="$(printf '%s' "$marker_snapshot_json" | jq -r .path)"
            bash scripts/release/upload-github-release-asset-immutable.sh \
              "$RELEASE_ID" "$marker_snapshot_path"
            bash scripts/release/upload-oss-object-immutable.sh "$marker_snapshot_path" \
              "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$marker_snapshot_path")"
          fi
          # 允许 verified 首次晋级、已证明未写入的重试，或人工审核后的精确前缀恢复。
          retry_evidence="$(node scripts/release/assert-promotion-retry.mjs "$log")"
          retry_mode="$(printf '%s' "$retry_evidence" | jq -r .mode)"
          latest_state="$(tail -n1 "$log" | jq -r .state)"
          if { [ "$retry_mode" = retry_before_change ] && [ "$latest_state" != failed_before_change ]; } || \
             { [ "$retry_mode" = retry_after_change ] && [ "$latest_state" = approved ]; }; then
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state failed_before_change \
              --operation "retry-normalize:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
              --actor "$GITHUB_ACTOR" --reason "$retry_evidence"
          fi
          node scripts/release/migration-postconditions.mjs "$RUNNER_TEMP/manifest.json"
          staging="$(jq -c 'select(.state=="staging_deployed")' "$log" | tail -n1)"
          test -n "$staging"
          staging_reason="$(printf '%s' "$staging" | jq -r .reason)"
          deployment_id="$(printf '%s' "$staging_reason" | jq -r .stagingDeploymentId)"
          staging_run_id="$(printf '%s' "$staging_reason" | jq -r .stagingRunId)"
          verification_summary="$(printf '%s' "$staging_reason" | jq -c .verificationSummary)"
          staging_runtime_path="$(jq -r '.artifacts.stagingRuntimeAssets?.path // empty' \
            "$RUNNER_TEMP/release/artifact-index.json")"
          test "$(printf '%s' "$verification_summary" | jq -r .schemaVersion)" = 1
          test "$(printf '%s' "$verification_summary" | jq -r .mode)" = deterministic-deployment-gates-v2 || {
            echo 'Historical v1 RC cannot be promoted normally; create a new RC with core smoke evidence' >&2
            exit 1
          }
          test "$(printf '%s' "$verification_summary" | jq -r .status)" = passed
          expected_checks='["acs-health","api-readiness","core-business-smoke","immutable-artifacts","migration-readback","reverse-isolation","runtime-identity","web-readback"]'
          test "$(printf '%s' "$verification_summary" | jq -c '.checks | sort')" = "$expected_checks"
          printf '%s' "$deployment_id" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$staging_run_id" | grep -Eq '^[1-9][0-9]*$'
          test "$(printf '%s' "$staging_reason" | jq -r .manifestDigest)" = "$MANIFEST_DIGEST"
          # 仅 #349 之后的 RC 拥有独立 Staging runtime evidence；旧 RC 沿用既有 verified 证据。
          if [ -n "$staging_runtime_path" ]; then
            runtime_summary="$(printf '%s' "$staging_reason" | jq -ce \
              '.runtimeSummary | select(type=="object")')"
            expected_runtime_summary="$(jq -nc \
              --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
              --arg serverDigest "$(jq -r .components.api.artifactDigest "$RUNNER_TEMP/manifest.json")" \
              --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
              --arg acsOrchestratorDigest "$(jq -r .components.acs.orchestratorArtifactDigest "$RUNNER_TEMP/manifest.json")" \
              --arg acsImageDigest "$(jq -r .components.acs.sandboxImageDigest "$RUNNER_TEMP/manifest.json")" \
              --arg stagingRuntimeAssetsDigest "$(jq -r .artifacts.stagingRuntimeAssets.digest "$RUNNER_TEMP/release/artifact-index.json")" \
              '{schemaVersion:1,releaseId:$releaseId,manifestDigest:$manifestDigest,serverDigest:$serverDigest,webDigest:$webDigest,acsOrchestratorDigest:$acsOrchestratorDigest,acsImageDigest:$acsImageDigest,stagingRuntimeAssetsDigest:$stagingRuntimeAssetsDigest}')"
            test "$(printf '%s' "$runtime_summary" | jq -S .)" = \
              "$(printf '%s' "$expected_runtime_summary" | jq -S .)"
          fi
          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id")"
          test "$(printf '%s' "$deployment" | jq -r .environment)" = staging
          test "$(printf '%s' "$deployment" | jq -r .sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$deployment" | jq -r .payload.releaseId)" = "$RELEASE_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state')" = success
          staging_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$staging_run_id")"
          test "$(printf '%s' "$staging_run" | jq -r .head_sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$staging_run" | jq -r .conclusion)" = success
          test "$(printf '%s' "$staging_run" | jq -r .path)" = .github/workflows/deploy-staging.yml
          staging_run_attempt="$(printf '%s' "$staging_run" | jq -r .run_attempt)"
          printf '%s' "$staging_run_attempt" | grep -Eq '^[1-9][0-9]*$'
          if ! gh run download "$staging_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "staging-evidence-$RELEASE_ID-$staging_run_attempt" \
            --dir "$RUNNER_TEMP/staging-attempt-evidence"; then
            echo 'Core smoke evidence is missing or expired; deploy and verify a new RC before promotion' >&2
            exit 1
          fi
          node scripts/release/staging-core-smoke-evidence.mjs \
            "$RUNNER_TEMP/staging-attempt-evidence/staging-core-smoke.json" \
            "$RUNNER_TEMP/manifest.json" "$staging_run_id" "$staging_run_attempt"
          approval_reason="$(jq -nc \
            --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg stagingDeploymentId "$deployment_id" --arg stagingRunId "$staging_run_id" \
            --argjson verificationSummary "$verification_summary" \
            --arg triggeredAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg recoveryMode "$retry_mode" \
            --arg reason "$PROMOTION_REASON" \
            '{releaseId:$releaseId,manifestDigest:$manifestDigest,stagingDeploymentId:$stagingDeploymentId,stagingRunId:$stagingRunId,verificationSummary:$verificationSummary,triggeredAt:$triggeredAt,recoveryMode:$recoveryMode,reason:$reason}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state approved --operation "approval:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_ACTOR" \
            --reason "$approval_reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          echo 'APPROVAL_RECORDED=true' >> "$GITHUB_ENV"
          echo "PROMOTION_RETRY_MODE=$retry_mode" >> "$GITHUB_ENV"

      - name: 配置生产环境 SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing ECS_HOST}"; : "${ECS_USER:?Missing ECS_USER}"; : "${ECS_SSH_KEY:?Missing ECS_SSH_KEY}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          ssh-keyscan -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/production-known-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/production-known-host" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/production-known-host" >> ~/.ssh/known_hosts
          # Reuse the authenticated connection across lock-fenced phases and both readbacks.
          # Host key pinning above remains authoritative for the shared connection.
          install -d -m 700 "$RUNNER_TEMP/production-ssh"
          cat >> ~/.ssh/config <<EOF
          Host $ECS_HOST
            ControlMaster auto
            ControlPath $RUNNER_TEMP/production-ssh/%C
            ControlPersist 60
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: 写入前读取权威在线生产前缀
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          remote="/tmp/release-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs scripts/release/read-runtime-identity.mjs scripts/release/config-publication.mjs \
            scripts/release/verify-installed-release.mjs scripts/release/artifact-lib.mjs \
            scripts/release/read-production-recovery-state.mjs scripts/release/production-checkpoint.mjs \
            "$RUNNER_TEMP/manifest.json" "$ECS_USER@$ECS_HOST:$remote/"
          api_action="$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")"
          worker_action="$(jq -r .components.runtimeWorker.action "$RUNNER_TEMP/manifest.json")"
          baseline_plan="$(node scripts/release/promotion-config-identity-state.mjs plan \
            --retry-mode "$PROMOTION_RETRY_MODE" --api-action "$api_action" \
            --runtime-worker-action "$worker_action")"
          reader="$(printf '%s' "$baseline_plan" | jq -r .reader)"
          reader_stage="$(printf '%s' "$baseline_plan" | jq -r .configIdentityStage)"
          if ! ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/$reader' --config-identity-stage '$reader_stage' --output '$remote/production-before.json' >/dev/null"; then
            test "$PRODUCTION_RECOVERY_MODE" = repair
            ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
              "sudo node '$remote/read-production-recovery-state.mjs' --manifest '$remote/manifest.json' --output '$remote/production-before.json' >/dev/null"
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo cat '$remote/production-before.json'" > "$RUNNER_TEMP/production-before.json"
          # This gate is deliberately before promotionGate, payload prefetch, the durable promoting
          # marker, receipts, and every production mutation.
          node scripts/release/promotion-config-identity-state.mjs assert-write-gate \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --production-state "$RUNNER_TEMP/production-before.json" \
            --recovery-mode "$PRODUCTION_RECOVERY_MODE"
          pnpm exec tsx server/src/release/promotionGateCli.ts \
            --manifest "$RUNNER_TEMP/manifest.json" --attestation-root "$RUNNER_TEMP/attestations" \
            --production-state "$RUNNER_TEMP/production-before.json" \
            --recovery-mode "$PROMOTION_RETRY_MODE"
          production_already_target=false
          acs_already_target=false
          app_already_target=false
          web_already_target=false
          if [ "$PROMOTION_RETRY_MODE" = retry_after_change ]; then
            jq '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' \
              "$RUNNER_TEMP/manifest.json" > "$RUNNER_TEMP/production-target.json"
            if diff -q <(jq -S '.components.acs' "$RUNNER_TEMP/production-before.json") \
                <(jq -S '.acs' "$RUNNER_TEMP/production-target.json") >/dev/null; then
              acs_already_target=true
            fi
            if diff -q <(jq -S '.components | {api,runtimeWorker}' "$RUNNER_TEMP/production-before.json") \
                <(jq -S '{api,runtimeWorker}' "$RUNNER_TEMP/production-target.json") >/dev/null; then
              app_already_target=true
            fi
            if diff -q <(jq -S '.components.web' "$RUNNER_TEMP/production-before.json") \
                <(jq -S '.web' "$RUNNER_TEMP/production-target.json") >/dev/null; then
              web_already_target=true
            fi
            if diff -q <(jq -S .components "$RUNNER_TEMP/production-before.json") \
                <(jq -S . "$RUNNER_TEMP/production-target.json") >/dev/null; then
              production_already_target=true
            fi
          fi
          echo "PRODUCTION_ALREADY_TARGET=$production_already_target" >> "$GITHUB_ENV"
          echo "ACS_ALREADY_TARGET=$acs_already_target" >> "$GITHUB_ENV"
          echo "APP_ALREADY_TARGET=$app_already_target" >> "$GITHUB_ENV"
          echo "WEB_ALREADY_TARGET=$web_already_target" >> "$GITHUB_ENV"

      - name: 校验 OSS 中的不可变清单、产物索引与 Release 记录
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          : "${RELEASE_RECORD_OSS_URI:?Missing production variable RELEASE_RECORD_OSS_URI}"
          case "$RELEASE_RECORD_OSS_URI" in oss://*) ;; *) exit 1 ;; esac
          record_uri="$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID"
          mkdir -p "$RUNNER_TEMP/oss-record"
          aliyun --secure oss cp "$record_uri/manifest.json" \
            "$RUNNER_TEMP/oss-record/manifest.json" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$record_uri/artifact-index.json" \
            "$RUNNER_TEMP/oss-record/artifact-index.json" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$record_uri/record.json" \
            "$RUNNER_TEMP/oss-record/record.json" --region "$RELEASE_RECORD_OSS_REGION"
          diff -u <(jq -S . "$RUNNER_TEMP/manifest.json") \
            <(jq -S . "$RUNNER_TEMP/oss-record/manifest.json")
          diff -u <(jq -S . "$RUNNER_TEMP/release/artifact-index.json") \
            <(jq -S . "$RUNNER_TEMP/oss-record/artifact-index.json")
          # Release record 必须与同一 immutable Manifest 和 artifact index 成组验证。
          node scripts/release/verify-release-record.mjs \
            "$RUNNER_TEMP/oss-record/record.json" \
            "$RUNNER_TEMP/oss-record/manifest.json" \
            "$RUNNER_TEMP/oss-record/artifact-index.json"
          test "$(jq -r .releaseId "$RUNNER_TEMP/oss-record/record.json")" = "$RELEASE_ID"
          test "$(jq -r .releaseSha "$RUNNER_TEMP/oss-record/record.json")" = "$RELEASE_SHA"
          test "$(jq -r .manifestDigest "$RUNNER_TEMP/oss-record/record.json")" = "$MANIFEST_DIGEST"
          test "$(jq -r .artifactDigest "$RUNNER_TEMP/oss-record/record.json")" = \
            "$(jq -r .aggregateDigest "$RUNNER_TEMP/release/artifact-index.json")"

      - name: 预取、校验并安全解压清单选定产物与 ACS 身份
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          node scripts/release/prefetch-promotion-artifacts.mjs \
            "$RUNNER_TEMP/release/artifact-index.json" "$RUNNER_TEMP/manifest.json" \
            "$RELEASE_RECORD_OSS_URI/$RELEASE_ID" "$RUNNER_TEMP" "$RELEASE_RECORD_OSS_REGION"
          node scripts/release/verify-artifact.mjs \
            "$RUNNER_TEMP/built/artifact-index.json" "$RELEASE_SHA"
          node scripts/release/verify-selected-release-artifacts.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/selected"
          mkdir -p "$RUNNER_TEMP/selected-units"
          extract_control_file() {
            local archive="$1" member="$2" target="$3" raw candidate
            raw="$(tar -tzf "$archive" | awk -v member="$member" \
              '$0 == member || $0 == "./" member { matches[++count] = $0 } END { if (count != 1) exit 1; print matches[1] }')"
            candidate="$target.candidate"
            rm -f "$candidate"
            tar -xOf "$archive" -- "$raw" > "$candidate"
            test -s "$candidate"
            install -m 0444 "$candidate" "$target"
            rm -f "$candidate"
          }
          schema_version="$(jq -r .schemaVersion "$RUNNER_TEMP/manifest.json")"
          app_action="$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")"
          acs_action="$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")"
          if [ "$schema_version" = 2 ]; then
            if [ "$app_action" = deploy ]; then
              extract_control_file "$RUNNER_TEMP/selected/server-bundle.tgz" \
                server/daemon-packaging/systemd/agent-saas-server@.service.template \
                "$RUNNER_TEMP/selected-units/agent-saas-server@.service.template"
              extract_control_file "$RUNNER_TEMP/selected/server-bundle.tgz" \
                server/daemon-packaging/systemd/agent-saas-runtime-worker@.service.template \
                "$RUNNER_TEMP/selected-units/agent-saas-runtime-worker@.service.template"
            fi
            if [ "$acs_action" = deploy ]; then
              extract_control_file "$RUNNER_TEMP/selected/acs-orchestrator.tgz" \
                acs-orchestrator/daemon-packaging/systemd/agent-saas-acs-orchestrator.service.template \
                "$RUNNER_TEMP/selected-units/agent-saas-acs-orchestrator.service.template"
            fi
          fi
          expected_repository="$ACR_REGISTRY/$ACR_REPOSITORY"
          node scripts/release/verify-promotion-acs-selection.mjs \
            "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/built/artifact-index.json" \
            "$expected_repository"

      - name: 生产写入前标记并持久化发布已开始状态
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_json="$(jq -cS .components "$RUNNER_TEMP/production-before.json")"
          target_json="$(jq -cS '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' "$RUNNER_TEMP/manifest.json")"
          before_digest="sha256:$(printf '%s' "$before_json" | sha256sum | cut -d' ' -f1)"
          target_digest="sha256:$(printf '%s' "$target_json" | sha256sum | cut -d' ' -f1)"
          promoting_reason="$(jq -nc --arg releaseId "$RELEASE_ID" --arg releaseSha "$RELEASE_SHA" \
            --arg manifestDigest "$MANIFEST_DIGEST" --arg migrationPhase "$MIGRATION_PHASE" \
            --arg migrationPlanDigest "$(jq -r .migrationPlan.planDigest "$RUNNER_TEMP/manifest.json")" \
            --arg productionBeforeDigest "$before_digest" --arg productionTargetDigest "$target_digest" \
            '{releaseId:$releaseId,releaseSha:$releaseSha,manifestDigest:$manifestDigest,migrationPhase:$migrationPhase,migrationPlanDigest:$migrationPlanDigest,productionBeforeDigest:$productionBeforeDigest,productionTargetDigest:$productionTargetDigest}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state promoting --operation "promoting:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$promoting_reason"
          # 该标志必须先于任一 snapshot 上传落盘；上传失败时最终 outcome 仍会
          # 追加 needs_human，runner 硬中断则由下一次 dispatch 收敛悬空 promoting。
          echo 'PROMOTION_STARTED=true' >> "$GITHUB_ENV"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")" \
            || echo "::warning title=OSS attestation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 创建 GitHub 生产部署记录
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg ref "$RELEASE_SHA" --arg releaseId "$RELEASE_ID" \
            '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],payload:{releaseId:$releaseId}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          test "$id" -gt 0
          echo "PRODUCTION_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null

      - name: 上传不可变部署载荷与 RC 绑定的托管单元
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        run: |
          set -euo pipefail
          remote="/tmp/agent-saas-promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_archive="$remote.upload.tgz"
          root_archive="/run/agent-saas-locks/promotion-payload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz"
          upload_root="$RUNNER_TEMP/promotion-upload"
          echo "PROMOTION_REMOTE=$remote" >> "$GITHUB_ENV"
          rm -rf "$upload_root"
          mkdir -p "$upload_root/artifacts"
          cp "$RUNNER_TEMP/manifest.json" \
            scripts/release/deploy-production-release.sh scripts/release/write-production-identity.mjs \
            scripts/release/acs-deployment-drain.sh \
            scripts/release/verify-installed-release.mjs \
            scripts/release/read-live-production-components.mjs scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs scripts/release/config-publication.mjs scripts/release/verify-promotion-phase-state.mjs \
            scripts/release/read-production-recovery-state.mjs scripts/release/production-checkpoint.mjs \
            scripts/release/artifact-lib.mjs scripts/release/reuse-promotion-artifacts.mjs \
            "$upload_root/"
          if [ "$PRODUCTION_ALREADY_TARGET" != true ]; then
            reusable_list="$RUNNER_TEMP/reusable-artifacts.txt"
            : > "$reusable_list"
            node scripts/release/reuse-promotion-artifacts.mjs plan "$RUNNER_TEMP/manifest.json" \
              > "$RUNNER_TEMP/reusable-artifact-plan.tsv"
            while IFS=$'\t' read -r filename digest source; do
              if ssh -n -o ConnectTimeout=10 -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
                "sudo test -f '$source' && sudo test ! -L '$source' && test \"\$(sudo sha256sum '$source' | cut -d' ' -f1)\" = '$digest'"; then
                printf '%s\n' "$filename" >> "$reusable_list"
              fi
            done < "$RUNNER_TEMP/reusable-artifact-plan.tsv"
            for archive in "$RUNNER_TEMP/selected/"*.tgz; do
              if grep -Fx "$(basename "$archive")" "$reusable_list" >/dev/null; then
                echo "Reusing digest-verified production archive: $(basename "$archive")"
              else
                cp "$archive" "$upload_root/artifacts/"
              fi
            done
            unit_files=("$RUNNER_TEMP/selected-units/"*)
            if [ -e "${unit_files[0]}" ]; then
              cp "${unit_files[@]}" "$upload_root/"
            fi
          fi
          tar -C "$upload_root" -czf "$RUNNER_TEMP/promotion-upload.tgz" .
          archive_digest="$(sha256sum "$RUNNER_TEMP/promotion-upload.tgz" | cut -d' ' -f1)"
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/promotion-upload.tgz" \
            "$ECS_USER@$ECS_HOST:$remote_archive"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "test ! -L '/run/agent-saas-locks' && \
             sudo install -d -o root -g root -m 0700 '/run/agent-saas-locks' && \
             sudo install -m 0400 '$remote_archive' '$root_archive' && \
             rm -f '$remote_archive' && \
             test \"\$(sudo sha256sum '$root_archive' | cut -d' ' -f1)\" = '$archive_digest' && \
             sudo rm -rf '$remote' && sudo install -d -m 0700 '$remote' && \
             sudo tar --no-same-owner --no-same-permissions -xzf '$root_archive' -C '$remote' && \
             { [ '$PRODUCTION_ALREADY_TARGET' = true ] || sudo node '$remote/reuse-promotion-artifacts.mjs' hydrate '$remote/manifest.json' '$remote'; } && \
             sudo chown -R root:root '$remote' && sudo chmod -R a-w '$remote' && \
             sudo test -f '$remote/deploy-production-release.sh' && \
             sudo test ! -L '$remote/deploy-production-release.sh' && \
             test \"\$(sudo stat -c '%u:%g' '$remote/deploy-production-release.sh')\" = 0:0 && \
             test -z \"\$(sudo find '$remote' -perm /222 -print -quit)\" && \
             sudo rm -f '$root_archive' || { \
               rm -f '$remote_archive'; \
               sudo rm -rf '$remote' '$root_archive'; \
               exit 1; \
             }"

      - name: 持久化 ACS 操作开始回执
        if: env.PROMOTION_FINALIZATION_MODE == 'promote'
        id: start_acs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=started
          [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$ACS_ALREADY_TARGET" = true ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component acs \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-acs-start" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")" \
            || echo "::warning title=OSS operation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 优先部署精确的 ACS 编排器与沙箱摘要
        id: deploy_acs
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (steps.start_acs.outcome == 'success')
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            echo 'ACS already equals the frozen production baseline; keep without restart'
            exit 0
          fi
          if [ "$ACS_ALREADY_TARGET" = true ]; then
            echo 'ACS already equals the immutable target; keep without restart'
            exit 0
          fi
          rollback_output="$RUNNER_TEMP/deploy-acs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          rollback_local_marker="$RUNNER_TEMP/rollback-attempted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-acs"
          rollback_sentinel="AGENT_SAAS_ROLLBACK_ATTEMPTED PHASE=acs GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          rm -f "$rollback_output" "$rollback_local_marker"
          set +e
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PRODUCTION_RECOVERY_MODE=$PRODUCTION_RECOVERY_MODE PHASE=acs RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' READ_LIVE_COMPONENTS_SCRIPT='$PROMOTION_REMOTE/read-live-production-components.mjs' VERIFY_PROMOTION_PHASE_SCRIPT='$PROMOTION_REMOTE/verify-promotion-phase-state.mjs' ACS_UNIT_TEMPLATE='$PROMOTION_REMOTE/agent-saas-acs-orchestrator.service.template' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' ROLLBACK_ATTEMPTED_MARKER='$PROMOTION_REMOTE/rollback-attempted-acs' ROLLBACK_ATTEMPTED_RECEIPT_PATH='$PROMOTION_REMOTE/rollback-acs.attempted' ROLLBACK_SUCCEEDED_RECEIPT_PATH='$PROMOTION_REMOTE/rollback-acs.succeeded' bash '$PROMOTION_REMOTE/deploy-production-release.sh'" \
            2>&1 | tee "$rollback_output"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if grep -Fx -- "$rollback_sentinel" "$rollback_output" >/dev/null; then
            if ! install -m 0600 /dev/null "$rollback_local_marker"; then
              echo 'WARN: failed to persist ACS runner rollback-attempted fallback marker' >&2
            fi
          fi
          if [ "${pipeline_status[0]}" -ne 0 ]; then exit "${pipeline_status[0]}"; fi
          exit "${pipeline_status[1]}"

      - name: 持久化 ACS 操作回执
        id: receipt_acs
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (always() && env.PROMOTION_STARTED == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.deploy_acs.outcome }}
        run: |
          set -euo pipefail
          outcome=failed
          [ "$STEP_OUTCOME" = success ] && outcome=succeeded
          [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$ACS_ALREADY_TARGET" = true ] && outcome=skipped
          [ "$STEP_OUTCOME" = skipped ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component acs \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-acs" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")" \
            || echo "::warning title=OSS operation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 持久化 API 与 Worker 操作开始回执
        id: start_app
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (steps.deploy_acs.outcome == 'success' && steps.receipt_acs.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for component in api runtimeWorker; do
            outcome=started
            [ "$(jq -r ".components.$component.action" "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
            [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
            receipt_json="$(node scripts/release/write-operation-receipt.mjs \
              --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component "$component" \
              --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$component-start" \
              --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
            receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
            bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
            bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
              "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")" \
            || echo "::warning title=OSS operation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"
          done

      - name: 蓝绿部署 API 并交接运行时 Worker
        id: deploy_app
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (steps.start_app.outcome == 'success')
        continue-on-error: true
        run: |
          set -euo pipefail
          verify_only=false
          resume_handoff=false
          if [ "$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            test "$(jq -r .components.runtimeWorker.action "$RUNNER_TEMP/manifest.json")" = keep
            echo 'API and Runtime Worker already equal the frozen production baseline; verify without cutover'
            verify_only=true
          fi
          if [ "$APP_ALREADY_TARGET" = true ]; then
            verify_only=true
            if [ "$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")" = deploy ]; then
              resume_handoff=true
            fi
            echo 'App target already committed; verify it and complete any retired-generation handoff'
          fi
          rollback_output="$RUNNER_TEMP/deploy-app-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          rollback_local_marker="$RUNNER_TEMP/rollback-attempted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-app"
          rollback_sentinel="AGENT_SAAS_ROLLBACK_ATTEMPTED PHASE=app GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          rm -f "$rollback_output" "$rollback_local_marker"
          set +e
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PRODUCTION_RECOVERY_MODE=$PRODUCTION_RECOVERY_MODE PHASE=app VERIFY_ONLY='$verify_only' RESUME_HANDOFF='$resume_handoff' RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' READ_LIVE_COMPONENTS_SCRIPT='$PROMOTION_REMOTE/read-live-production-components.mjs' VERIFY_PROMOTION_PHASE_SCRIPT='$PROMOTION_REMOTE/verify-promotion-phase-state.mjs' SERVER_UNIT_TEMPLATE='$PROMOTION_REMOTE/agent-saas-server@.service.template' WORKER_UNIT_TEMPLATE='$PROMOTION_REMOTE/agent-saas-runtime-worker@.service.template' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' ROLLBACK_ATTEMPTED_MARKER='$PROMOTION_REMOTE/rollback-attempted-app' ROLLBACK_ATTEMPTED_RECEIPT_PATH='$PROMOTION_REMOTE/rollback-app.attempted' ROLLBACK_SUCCEEDED_RECEIPT_PATH='$PROMOTION_REMOTE/rollback-app.succeeded' bash '$PROMOTION_REMOTE/deploy-production-release.sh'" \
            2>&1 | tee "$rollback_output"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if grep -Fx -- "$rollback_sentinel" "$rollback_output" >/dev/null; then
            if ! install -m 0600 /dev/null "$rollback_local_marker"; then
              echo 'WARN: failed to persist App runner rollback-attempted fallback marker' >&2
            fi
          fi
          if [ "${pipeline_status[0]}" -ne 0 ]; then exit "${pipeline_status[0]}"; fi
          if [ "${pipeline_status[1]}" -ne 0 ]; then exit "${pipeline_status[1]}"; fi
          if [ "$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")" = deploy ]; then
            ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
              "sudo cat '$PROMOTION_REMOTE/app-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json'" \
              > "$RUNNER_TEMP/app-handoff.json"
            jq -e --arg releaseId "$RELEASE_ID" --arg digest "$MANIFEST_DIGEST" \
              --arg runId "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
              '.schemaVersion==1 and .status=="acknowledged" and .releaseId==$releaseId and .manifestDigest==$digest and .runId==$runId and .runAttempt==$attempt' \
              "$RUNNER_TEMP/app-handoff.json" >/dev/null
          fi

      - name: 持久化 API 与 Worker 操作回执
        id: receipt_app
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (always() && env.PROMOTION_STARTED == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.deploy_app.outcome }}
        run: |
          set -euo pipefail
          for component in api runtimeWorker; do
            outcome=failed
            if [ "$STEP_OUTCOME" = success ]; then
              outcome=succeeded
              [ "$(jq -r ".components.$component.action" "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
            fi
            [ "$STEP_OUTCOME" = skipped ] && outcome=skipped
            receipt_json="$(node scripts/release/write-operation-receipt.mjs \
              --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component "$component" \
              --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$component" \
              --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
            receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
            bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
            bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
              "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")" \
            || echo "::warning title=OSS operation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"
          done

      - name: 持久化 Web 操作开始回执
        id: start_web
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (steps.deploy_app.outcome == 'success' && steps.receipt_app.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=started
          [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$WEB_ALREADY_TARGET" = true ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component web \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-web-start" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")" \
            || echo "::warning title=OSS operation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 最后发布 Web 入口并保留旧版哈希资源
        id: deploy_web
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (steps.start_web.outcome == 'success')
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            echo 'Web already equals the frozen production baseline; keep the current entry'
            exit 0
          fi
          if [ "$WEB_ALREADY_TARGET" = true ]; then
            echo 'Web already equals the immutable target; keep the current entry'
            exit 0
          fi
          web_lock_ready="$PROMOTION_REMOTE/web-lock-ready"
          web_lock_release="$PROMOTION_REMOTE/web-lock-release"
          web_lock_log="$RUNNER_TEMP/web-lock.log"
          web_lock_pid=''
          web_lock_ready_confirmed=false
          web_backup_ready=false
          web_committed=false
          recovery_started=false
          web_operation_deadline=0
          web_lock_is_alive() {
            [ -n "$web_lock_pid" ] && kill -0 "$web_lock_pid" 2>/dev/null
          }
          run_control_ssh() {
            timeout --signal=TERM --kill-after=5 10 ssh \
              -o ConnectTimeout=5 -o ServerAliveInterval=2 -o ServerAliveCountMax=2 \
              -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "$1"
          }
          # hash 静态资源的 SDK/ossutil 凭据与区域：与兼容发布同一 helper、同一契约。
          export OSS_REGION="$RELEASE_RECORD_OSS_REGION"
          export OSS_ACCESS_KEY_ID="$ALIBABACLOUD_ACCESS_KEY_ID" OSS_ACCESS_KEY_SECRET="$ALIBABACLOUD_ACCESS_KEY_SECRET"
          # ── 冷备（ECS 恢复站）与 OSS 同一事务：快照 → 发布并验证 OSS → 同步冷备并回读 → 提交。
          #    任一步失败都在同一主机锁内先回滚冷备、再恢复 OSS 入口。helper 通过 export -f 交给
          #    run_with_web_lock 的子进程执行；子进程 stdin 为 /dev/null，脚本与归档均显式重定向。
          recovery_web_root=/opt/agent-saas-web-recovery
          production_staging_root=/run/agent-saas-production-staging
          recovery_run_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          recovery_remote="$production_staging_root/recovery-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          recovery_release_id="$(jq -r .components.web.sourceSha "$RUNNER_TEMP/manifest.json")"
          printf '%s' "$recovery_release_id" | grep -Eq '^[a-f0-9]{40}$'
          export recovery_web_root production_staging_root recovery_run_id recovery_remote recovery_release_id
          recovery_ssh() {
            ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "$@"
          }
          snapshot_recovery_web() {
            set -euo pipefail
            recovery_ssh "set -e; \
              target=\$(readlink -f '$recovery_web_root/current'); \
              case \"\$target\" in '$recovery_web_root'/releases/*) ;; \
                *) echo 'recovery Web current target is not an immutable release' >&2; exit 1 ;; \
              esac; \
              for f in manifest.webmanifest release-identity.json index.html sw.js; do \
                test -s \"\$target/\$f\" || { echo \"recovery Web before target is missing \$f\" >&2; exit 1; }; \
              done; \
              jq -e '.schemaVersion == 1 and .environment == \"production\" and .releaseId and .releaseSha and .webDigest' \
                \"\$target/release-identity.json\" >/dev/null; \
              printf '%s\\n' \"\$target\"" \
              > "$RUNNER_TEMP/recovery-web-target.before"
            test -s "$RUNNER_TEMP/recovery-web-target.before"
          }
          publish_recovery_web() {
            set -euo pipefail
            local archive="$RUNNER_TEMP/agent-saas-recovery-web-$recovery_run_id.tgz" digest before_q
            tar -C "$RUNNER_TEMP/web-assets" -czf "$archive" .
            digest="$(sha256sum "$archive" | cut -d' ' -f1)"
            recovery_ssh "sudo rm -rf -- '$recovery_remote' && \
              sudo install -d -m 0700 '$recovery_remote' && \
              sudo tee '$recovery_remote/recovery-web.tgz' >/dev/null" < "$archive"
            recovery_ssh "sudo env STAGED_PAYLOAD_ALLOWED_ROOT='$production_staging_root' \
              bash -s -- verify '$digest' '$recovery_remote/recovery-web.tgz' '$recovery_remote'" \
              < scripts/release/seal-root-staged-payload.sh
            printf -v before_q '%q' "$(cat "$RUNNER_TEMP/recovery-web-target.before")"
            recovery_ssh "sudo env RECOVERY_WEB_ROOT='$recovery_web_root' \
              RECOVERY_WEB_BEFORE_TARGET=$before_q \
              RELEASE_ID='$recovery_release_id' RUN_ID='$recovery_run_id' \
              ARCHIVE='$recovery_remote/recovery-web.tgz' bash -s" \
              < scripts/deploy-recovery-web.sh
          }
          verify_recovery_web() {
            set -euo pipefail
            local ip
            ip="$(getent ahostsv4 "$ECS_HOST" | awk 'NR == 1 { print $1 }')"
            : "${ip:?Cannot resolve ECS_HOST to IPv4}"
            curl -fsS --resolve "agent.kaiyan.net:443:$ip" -H 'cache-control: no-cache' \
              -D "$RUNNER_TEMP/recovery-web.headers" -o "$RUNNER_TEMP/recovery-web.index.html" \
              "https://agent.kaiyan.net/?recovery_probe=$recovery_run_id"
            grep -Eqi '^x-agent-saas-recovery:[[:space:]]*true' "$RUNNER_TEMP/recovery-web.headers"
            cmp "$RUNNER_TEMP/web-assets/index.html" "$RUNNER_TEMP/recovery-web.index.html"
            curl -fsS --resolve "agent.kaiyan.net:443:$ip" -H 'cache-control: no-cache' \
              -o "$RUNNER_TEMP/recovery-web.release-identity.json" \
              "https://agent.kaiyan.net/release-identity.json?recovery_probe=$recovery_run_id"
            cmp "$RUNNER_TEMP/web-assets/release-identity.json" "$RUNNER_TEMP/recovery-web.release-identity.json"
            recovery_ssh "sudo grep -Fx 'state=activated' \
              '$recovery_web_root/transactions/$recovery_run_id.activation' >/dev/null && \
              sudo rm -rf -- '$recovery_remote'"
            echo "recovery Web endpoint matches the published OSS build"
          }
          rollback_recovery_web() {
            set -euo pipefail
            local before_q
            printf -v before_q '%q' "$(cat "$RUNNER_TEMP/recovery-web-target.before")"
            recovery_ssh "sudo env RECOVERY_WEB_ROOT='$recovery_web_root' \
              RECOVERY_WEB_BEFORE_TARGET=$before_q RUN_ID='$recovery_run_id' bash -s" \
              < scripts/rollback-recovery-web.sh
            recovery_ssh "sudo rm -rf -- '$recovery_remote'"
          }
          export -f recovery_ssh snapshot_recovery_web publish_recovery_web verify_recovery_web rollback_recovery_web
          run_with_web_lock() {
            if ! web_lock_is_alive; then
              cat "$web_lock_log" >&2
              return 1
            fi
            local remaining=$((web_operation_deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo 'Web publication operation deadline expired while the host lock was held' >&2
              return 1
            fi
            setsid timeout --signal=TERM --kill-after=10 "$remaining" "$@" &
            local command_pid=$!
            while kill -0 "$command_pid" 2>/dev/null; do
              if ! web_lock_is_alive; then
                kill -TERM -- "-$command_pid" 2>/dev/null || true
                sleep 1
                kill -KILL -- "-$command_pid" 2>/dev/null || true
                wait "$command_pid" 2>/dev/null || true
                cat "$web_lock_log" >&2
                return 1
              fi
              sleep 1
            done
            local command_status=0
            wait "$command_pid" || command_status=$?
            if ! web_lock_is_alive; then
              cat "$web_lock_log" >&2
              return 1
            fi
            return "$command_status"
          }
          terminate_web_lock() {
            [ -n "$web_lock_pid" ] || return 0
            kill -TERM -- "-$web_lock_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$web_lock_pid" 2>/dev/null || true
            wait "$web_lock_pid" 2>/dev/null || true
            web_lock_pid=''
          }
          release_web_lock() {
            [ -n "$web_lock_pid" ] || return 0
            if [ "$web_lock_ready_confirmed" != true ]; then
              terminate_web_lock
              return 0
            fi
            if ! run_control_ssh "sudo touch '$web_lock_release'"; then
              terminate_web_lock
              return 1
            fi
            local lock_status=0
            wait "$web_lock_pid" || lock_status=$?
            web_lock_pid=''
            if [ "$lock_status" -ne 0 ]; then
              cat "$web_lock_log" >&2
              return "$lock_status"
            fi
          }
          # 单一 EXIT trap 同时负责回滚与释放/保留主机锁，禁止在后文覆盖。
          cleanup_web_on_exit() {
            local deploy_status=$?
            trap - EXIT
            set +e
            local rollback_status=0
            if [ "$web_committed" = false ] && [ "$web_backup_ready" = true ]; then
              if web_lock_is_alive; then
                web_operation_deadline=$((SECONDS + 300))
                if [ "${recovery_started:-false}" = true ]; then
                  run_with_web_lock bash -euo pipefail -c rollback_recovery_web || rollback_status=$?
                fi
                restore_web_entry || rollback_status=$?
              else
                echo 'Web lock was lost; refusing an unlocked rollback' >&2
                rollback_status=1
              fi
            fi
            if [ "$rollback_status" -eq 0 ]; then
              release_web_lock || rollback_status=$?
            elif web_lock_is_alive; then
              echo 'Web rollback failed; retaining the production lock until its lease expires' >&2
              wait "$web_lock_pid" 2>/dev/null || true
              web_lock_pid=''
            fi
            [ "$rollback_status" -eq 0 ] || deploy_status=1
            exit "$deploy_status"
          }
          trap cleanup_web_on_exit EXIT
          setsid timeout --signal=TERM --kill-after=10 1810 ssh \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "timeout --signal=TERM --kill-after=10 1800 sudo PHASE=web RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' READ_LIVE_COMPONENTS_SCRIPT='$PROMOTION_REMOTE/read-live-production-components.mjs' VERIFY_PROMOTION_PHASE_SCRIPT='$PROMOTION_REMOTE/verify-promotion-phase-state.mjs' WEB_LOCK_READY='$web_lock_ready' WEB_LOCK_RELEASE='$web_lock_release' WEB_LOCK_TIMEOUT_SECONDS=1700 GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash '$PROMOTION_REMOTE/deploy-production-release.sh'" \
            >"$web_lock_log" 2>&1 &
          web_lock_pid=$!
          lock_ready=false
          lock_ready_deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$lock_ready_deadline" ]; do
            if run_control_ssh "sudo test -f '$web_lock_ready'"; then
              lock_ready=true
              break
            fi
            if ! kill -0 "$web_lock_pid" 2>/dev/null; then
              wait "$web_lock_pid" 2>/dev/null || true
              web_lock_pid=''
              cat "$web_lock_log" >&2
              exit 1
            fi
            sleep 1
          done
          test "$lock_ready" = true
          web_lock_ready_confirmed=true
          web_operation_deadline=$((SECONDS + 1200))
          # 任何 OSS/冷备 mutation 之前先快照冷备 current；deploy/rollback-recovery-web.sh 都以它为准。
          run_with_web_lock bash -euo pipefail -c snapshot_recovery_web
          mkdir -p "$RUNNER_TEMP/web-assets" "$RUNNER_TEMP/web-before"
          tar -xzf "$RUNNER_TEMP/selected/web-assets.tgz" -C "$RUNNER_TEMP/web-assets"
          test -s "$RUNNER_TEMP/web-assets/index.html"
          jq -n --arg releaseId "$RELEASE_ID" --arg releaseSha "$(jq -r .components.web.sourceSha "$RUNNER_TEMP/manifest.json")" \
            --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg configFingerprint "$MANIFEST_DIGEST" \
            '{schemaVersion:1,environment:"production",releaseId:$releaseId,releaseSha:$releaseSha,webDigest:$webDigest,configFingerprint:$configFingerprint}' \
            > "$RUNNER_TEMP/web-assets/release-identity.json"
          web_rollback_attempted_marker="$RUNNER_TEMP/rollback-attempted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-web"
          rm -f "$web_rollback_attempted_marker"
          # stat 还会读取对象 ACL；备份只需要 GetObject 与已有 ListObjects 权限。
          web_object_present() {
            local target="$1" listing
            listing="$(run_with_web_lock aliyun --secure oss ls "$target" \
              --limited-num 2 --region "$RELEASE_RECORD_OSS_REGION")" || return 1
            printf '%s\n' "$listing" | awk -v target="$target" \
              '$NF == target { found = 1 } END { print found ? "true" : "false" }'
          }
          run_with_web_lock aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/index.html" \
            "$RUNNER_TEMP/web-before/index.html" --region "$RELEASE_RECORD_OSS_REGION"
          had_identity="$(web_object_present "$PRODUCTION_WEB_OSS_URI/release-identity.json")"
          if [ "$had_identity" = true ]; then
            run_with_web_lock aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/release-identity.json" \
              "$RUNNER_TEMP/web-before/release-identity.json" --region "$RELEASE_RECORD_OSS_REGION"
          fi
          restore_web_entry() {
            local failed=0 readback="$RUNNER_TEMP/web-rollback-readback"
            if ! install -m 0600 /dev/null "$web_rollback_attempted_marker"; then
              echo "WARN: failed to persist Web rollback-attempted marker" >&2
            fi
            printf '%s\n' "web:$RELEASE_ID" > "$RUNNER_TEMP/rollback-web.attempted"
            rm -rf "$readback"
            mkdir -p "$readback"
            if [ "$had_identity" = true ]; then
              if ! run_with_web_lock aliyun --secure oss cp "$RUNNER_TEMP/web-before/release-identity.json" \
                  "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force \
                  --region "$RELEASE_RECORD_OSS_REGION"; then
                failed=1
              fi
            elif ! run_with_web_lock aliyun --secure oss rm \
                "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force \
                --region "$RELEASE_RECORD_OSS_REGION"; then
              failed=1
            fi
            if ! run_with_web_lock aliyun --secure oss cp "$RUNNER_TEMP/web-before/index.html" \
                "$PRODUCTION_WEB_OSS_URI/index.html" --force \
                --region "$RELEASE_RECORD_OSS_REGION"; then
              failed=1
            fi
            if [ "$had_identity" = true ]; then
              if ! run_with_web_lock aliyun --secure oss cp \
                  "$PRODUCTION_WEB_OSS_URI/release-identity.json" \
                  "$readback/release-identity.json" --region "$RELEASE_RECORD_OSS_REGION" || \
                 ! cmp "$RUNNER_TEMP/web-before/release-identity.json" \
                  "$readback/release-identity.json"; then
                failed=1
              fi
            else
              local identity_present
              if ! identity_present="$(web_object_present "$PRODUCTION_WEB_OSS_URI/release-identity.json")" || \
                 [ "$identity_present" != false ]; then
                failed=1
              fi
            fi
            if ! run_with_web_lock aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/index.html" \
                "$readback/index.html" --region "$RELEASE_RECORD_OSS_REGION" || \
               ! cmp "$RUNNER_TEMP/web-before/index.html" "$readback/index.html"; then
              failed=1
            fi
            if [ "$failed" -ne 0 ]; then
              echo 'Web rollback did not restore and verify both entry objects' >&2
              return 1
            fi
            printf '%s\n' "web:$RELEASE_ID" > "$RUNNER_TEMP/rollback-web.succeeded"
          }
          web_backup_ready=true
          # 1) hash 静态资源：与兼容发布同一 create-only + gzip 契约（禁止覆盖既有对象键；
          #    冷备与 repair-web-recovery.py 的 storageContract 均以该字节为准）。
          web_oss_credentials="$RUNNER_TEMP/web-oss-sdk-credentials.json"
          (
            umask 077
            jq -n --arg accessKeyId "$ALIBABACLOUD_ACCESS_KEY_ID" \
              --arg accessKeySecret "$ALIBABACLOUD_ACCESS_KEY_SECRET" \
              '{accessKeyId:$accessKeyId,accessKeySecret:$accessKeySecret}' > "$web_oss_credentials"
          )
          test -d "$RUNNER_TEMP/web-assets/assets"
          run_with_web_lock bash scripts/release/upload-web-assets-immutable.sh \
            "$RUNNER_TEMP/web-assets/assets" "$PRODUCTION_WEB_OSS_URI/assets" "$web_oss_credentials"
          # 2) 其余壳文件（sw.js、manifest、图标等）保持原有覆盖式上传；入口两键最后写。
          rm -rf "$RUNNER_TEMP/web-shell"
          mkdir -p "$RUNNER_TEMP/web-shell"
          tar -C "$RUNNER_TEMP/web-assets" --exclude=./assets -cf - . | tar -C "$RUNNER_TEMP/web-shell" -xf -
          test ! -e "$RUNNER_TEMP/web-shell/assets"
          run_with_web_lock aliyun --secure oss cp "$RUNNER_TEMP/web-shell/" \
            "$PRODUCTION_WEB_OSS_URI/" --recursive --force --exclude index.html \
            --exclude release-identity.json --region "$RELEASE_RECORD_OSS_REGION"
          run_with_web_lock aliyun --secure oss cp "$RUNNER_TEMP/web-assets/release-identity.json" \
            "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force \
            --region "$RELEASE_RECORD_OSS_REGION"
          run_with_web_lock aliyun --secure oss cp "$RUNNER_TEMP/web-assets/index.html" \
            "$PRODUCTION_WEB_OSS_URI/index.html" --force \
            --region "$RELEASE_RECORD_OSS_REGION"
          rm -rf "$RUNNER_TEMP/web-oss-readback"
          mkdir -p "$RUNNER_TEMP/web-oss-readback"
          export WEB_ASSETS_ROOT="$RUNNER_TEMP/web-assets"
          export WEB_OSS_READBACK_ROOT="$RUNNER_TEMP/web-oss-readback"
          export PRODUCTION_WEB_OSS_URI RELEASE_RECORD_OSS_REGION
          # 单对象 CLI 启动约有固定网络开销；保持逐文件字节校验，但与 Staging 一致限为 8 路。
          # 整批仍由一个 run_with_web_lock 监管，锁丢失或总截止时间到达会终止整个进程组。
          # assets/ 已由 upload-web-assets-immutable.sh 以 SDK GET 逐对象按存储字节回读并校验公开 headers；
          # aliyun `oss cp` 会对 Content-Encoding: gzip 对象透明解压并因 CRC 不一致失败，故这里只回读壳文件。
          run_with_web_lock xargs -0 -r -P 8 -n 1 bash -euo pipefail -c '
            source="$1"
            relative="${source#"$WEB_ASSETS_ROOT/"}"
            target="$WEB_OSS_READBACK_ROOT/$relative"
            mkdir -p "$(dirname "$target")"
            aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/$relative" \
              "$target" --region "$RELEASE_RECORD_OSS_REGION"
            cmp "$source" "$target"
          ' _ < <(find "$WEB_ASSETS_ROOT" -type f -not -path "$WEB_ASSETS_ROOT/assets/*" -print0)
          run_with_web_lock curl -fsS --retry 10 -H 'cache-control: no-cache' \
            "https://agent.kaiyan.net/release-identity.json?release=$RELEASE_ID" \
            -o "$RUNNER_TEMP/web-release-identity-readback.json"
          jq -e --arg digest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            '.webDigest==$digest' "$RUNNER_TEMP/web-release-identity-readback.json"
          run_with_web_lock node scripts/release/verify-public-web.mjs \
            "$RUNNER_TEMP/web-assets" "https://agent.kaiyan.net" "$RUNNER_TEMP/production-public-web.json"
          # 3) 冷备：OSS 验证通过后，同一主机锁内把同一份 web-assets 装进 ECS 恢复站并按字节回读；
          #    未通过前不提交，失败由 cleanup_web_on_exit 先回滚冷备、再恢复 OSS 入口。
          recovery_started=true
          run_with_web_lock bash -euo pipefail -c publish_recovery_web
          run_with_web_lock bash -euo pipefail -c verify_recovery_web
          web_lock_is_alive
          web_committed=true
          release_web_lock
          trap - EXIT

      - name: 持久化 Web 操作回执
        id: receipt_web
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (always() && env.PROMOTION_STARTED == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.deploy_web.outcome }}
        run: |
          set -euo pipefail
          outcome=failed
          [ "$STEP_OUTCOME" = success ] && outcome=succeeded
          [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$WEB_ALREADY_TARGET" = true ] && outcome=skipped
          [ "$STEP_OUTCOME" = skipped ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component web \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-web" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")" \
            || echo "::warning title=OSS operation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 读取全部在线组件并仅在完全收敛后提交可信身份
        id: readback
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (always() && env.PROMOTION_STARTED == 'true')
        continue-on-error: true
        run: |
          set -euo pipefail
          # 复用 durable promoting 之前已上传的只读 reader，并重新取得共享主机锁；
          # live read、identity commit 与现场确认必须处于同一锁租约，避免 TOCTOU。
          remote="$PROMOTION_REMOTE"
          api_action="$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")"
          config_identity_readback_stage=steady-state
          [ "$api_action" = deploy ] && config_identity_readback_stage=candidate-readback
          identity_lock_ready="/tmp/agent-saas-promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-identity-lock.ready"
          identity_lock_release="/tmp/agent-saas-promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-identity-lock.release"
          identity_lock_log="$RUNNER_TEMP/identity-lock.log"
          identity_lock_pid=''
          identity_lock_ready_confirmed=false
          identity_lock_is_alive() {
            [ -n "$identity_lock_pid" ] && kill -0 "$identity_lock_pid" 2>/dev/null
          }
          terminate_identity_lock() {
            [ -n "$identity_lock_pid" ] || return 0
            kill -TERM -- "-$identity_lock_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$identity_lock_pid" 2>/dev/null || true
            wait "$identity_lock_pid" 2>/dev/null || true
            identity_lock_pid=''
          }
          release_identity_lock() {
            [ -n "$identity_lock_pid" ] || return 0
            if [ "$identity_lock_ready_confirmed" != true ]; then
              terminate_identity_lock
              return 0
            fi
            timeout --signal=TERM --kill-after=5 10 ssh \
              -o ConnectTimeout=5 -o ServerAliveInterval=2 -o ServerAliveCountMax=2 \
              -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
              "sudo touch '$identity_lock_release'"
            local lock_status=0
            wait "$identity_lock_pid" || lock_status=$?
            identity_lock_pid=''
            if [ "$lock_status" -ne 0 ]; then
              cat "$identity_lock_log" >&2
              return "$lock_status"
            fi
          }
          cleanup_identity_lock() {
            local operation_status=$?
            trap - EXIT
            set +e
            release_identity_lock || operation_status=1
            exit "$operation_status"
          }
          run_identity_ssh() {
            identity_lock_is_alive || { cat "$identity_lock_log" >&2; return 1; }
            setsid timeout --signal=TERM --kill-after=10 120 ssh \
              -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
              -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "$1" &
            local command_pid=$!
            while kill -0 "$command_pid" 2>/dev/null; do
              if ! identity_lock_is_alive; then
                kill -TERM -- "-$command_pid" 2>/dev/null || true
                sleep 1
                kill -KILL -- "-$command_pid" 2>/dev/null || true
                wait "$command_pid" 2>/dev/null || true
                cat "$identity_lock_log" >&2
                return 1
              fi
              sleep 1
            done
            local command_status=0
            wait "$command_pid" || command_status=$?
            identity_lock_is_alive || { cat "$identity_lock_log" >&2; return 1; }
            return "$command_status"
          }
          trap cleanup_identity_lock EXIT
          setsid timeout --signal=TERM --kill-after=10 970 ssh \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "timeout --signal=TERM --kill-after=10 960 sudo PHASE=web RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' READ_LIVE_COMPONENTS_SCRIPT='$PROMOTION_REMOTE/read-live-production-components.mjs' VERIFY_PROMOTION_PHASE_SCRIPT='$PROMOTION_REMOTE/verify-promotion-phase-state.mjs' WEB_LOCK_READY='$identity_lock_ready' WEB_LOCK_RELEASE='$identity_lock_release' WEB_LOCK_TIMEOUT_SECONDS=900 GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash '$PROMOTION_REMOTE/deploy-production-release.sh'" \
            >"$identity_lock_log" 2>&1 &
          identity_lock_pid=$!
          lock_ready=false
          lock_ready_deadline=$((SECONDS + 75))
          while [ "$SECONDS" -lt "$lock_ready_deadline" ]; do
            if timeout --signal=TERM --kill-after=5 10 ssh \
                -o ConnectTimeout=5 -o ServerAliveInterval=2 -o ServerAliveCountMax=2 \
                -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
                "sudo test -f '$identity_lock_ready'"; then
              lock_ready=true
              break
            fi
            identity_lock_is_alive || break
            sleep 1
          done
          if [ "$lock_ready" != true ]; then
            terminate_identity_lock
            cat "$identity_lock_log" >&2
            exit 1
          fi
          identity_lock_ready_confirmed=true

          run_identity_ssh "sudo node '$remote/read-live-production-components.mjs' --config-identity-stage '$config_identity_readback_stage'" \
            > "$RUNNER_TEMP/production-after.json"
          jq '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' \
            "$RUNNER_TEMP/manifest.json" > "$RUNNER_TEMP/production-target.json"
          if ! diff -u <(jq -S .components "$RUNNER_TEMP/production-after.json") \
              <(jq -S . "$RUNNER_TEMP/production-target.json"); then
            echo 'target_match=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r .configIdentity.status "$RUNNER_TEMP/production-after.json")" = consistent
          expected_config_release_id="$RELEASE_ID"
          if [ "$api_action" = keep ]; then
            expected_config_release_id="$(jq -r .configIdentity.releaseId "$RUNNER_TEMP/production-before.json")"
          fi
          test "$expected_config_release_id" != null
          test "$(jq -r .configIdentity.releaseId "$RUNNER_TEMP/production-after.json")" = "$expected_config_release_id"
          if [ -n "${PRODUCTION_DEPLOYMENT_ID:-}" ]; then
            run_identity_ssh \
              "sudo node '$PROMOTION_REMOTE/write-production-identity.mjs' '$PROMOTION_REMOTE/manifest.json'"
          fi
          run_identity_ssh \
            "sudo node '$remote/read-production-state.mjs' --config-identity-stage steady-state" \
            > "$RUNNER_TEMP/production-confirmed.json"
          test "$(jq -r .configIdentity.status "$RUNNER_TEMP/production-confirmed.json")" = consistent
          test "$(jq -r .configIdentity.releaseId "$RUNNER_TEMP/production-confirmed.json")" = \
            "$expected_config_release_id"
          config_identity_projection='.configIdentity | {schemaVersion,status,expected,observed,releaseId}'
          diff -u \
            <(jq -S "$config_identity_projection" "$RUNNER_TEMP/production-confirmed.json") \
            <(jq -S "$config_identity_projection" "$RUNNER_TEMP/production-after.json")
          identity_projection='{web:{gitSha:.components.web.gitSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.gitSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.gitSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.gitSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}'
          diff -u <(jq -S "$identity_projection" "$RUNNER_TEMP/production-confirmed.json") \
            <(jq -S "$identity_projection" "$RUNNER_TEMP/production-after.json")
          echo 'target_match=true' >> "$GITHUB_OUTPUT"
          release_identity_lock
          trap - EXIT

      - name: 核对组件结果
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (always() && env.PROMOTION_STARTED == 'true')
        run: |
          set -euo pipefail
          observation_complete=false
          observed=null
          if [ -s "$RUNNER_TEMP/production-after.json" ]; then
            observation_complete=true
            observed="$(jq -c .components "$RUNNER_TEMP/production-after.json")"
          fi
          config_identity_confirmed=false
          if [ "${{ steps.readback.outcome }}" = success ] && \
             [ "${{ steps.readback.outputs.target_match }}" = true ]; then
            config_identity_confirmed=true
          fi
          target="$(jq -c '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' "$RUNNER_TEMP/manifest.json")"
          before="$(jq -c .components "$RUNNER_TEMP/production-before.json")"
          external_side_effects=none_observed
          if [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = deploy ] && \
             [ "${{ steps.deploy_acs.outcome }}" != skipped ]; then
            external_side_effects=unknown
          fi
          web_attempted=false
          web_succeeded=false
          [ ! -s "$RUNNER_TEMP/rollback-web.attempted" ] || web_attempted=true
          [ ! -s "$RUNNER_TEMP/rollback-web.succeeded" ] || web_succeeded=true
          remote_receipt_exists() {
            local path="$1" rc
            set +e
            ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "test -s '$path'"
            rc=$?
            set -e
            case "$rc" in
              0) printf '%s' true ;;
              1) printf '%s' false ;;
              *)
                echo "remote rollback receipt query failed for $path (ssh rc=$rc)" >&2
                return "$rc"
                ;;
            esac
          }
          acs_attempted="$(remote_receipt_exists "$PROMOTION_REMOTE/rollback-acs.attempted")"
          acs_succeeded="$(remote_receipt_exists "$PROMOTION_REMOTE/rollback-acs.succeeded")"
          app_attempted="$(remote_receipt_exists "$PROMOTION_REMOTE/rollback-app.attempted")"
          app_succeeded="$(remote_receipt_exists "$PROMOTION_REMOTE/rollback-app.succeeded")"
          rollback_receipts="$(jq -nc \
            --argjson webAttempted "$web_attempted" --argjson webSucceeded "$web_succeeded" \
            --argjson acsAttempted "$acs_attempted" --argjson acsSucceeded "$acs_succeeded" \
            --argjson appAttempted "$app_attempted" --argjson appSucceeded "$app_succeeded" \
            '{web:{attempted:$webAttempted,succeeded:$webSucceeded},acs:{attempted:$acsAttempted,succeeded:$acsSucceeded},app:{attempted:$appAttempted,succeeded:$appSucceeded}}')"
          jq -n --arg releaseId "$RELEASE_ID" --argjson before "$before" --argjson target "$target" \
            --argjson observed "$observed" --argjson observationComplete "$observation_complete" \
            --argjson configIdentityConfirmed "$config_identity_confirmed" \
            --arg externalSideEffects "$external_side_effects" \
            --argjson rollbackReceipts "$rollback_receipts" \
            --arg databaseChange "$MIGRATION_PHASE" \
            '{releaseId:$releaseId,before:$before,target:$target,observed:$observed,observationComplete:$observationComplete,configIdentityConfirmed:$configIdentityConfirmed,externalSideEffects:$externalSideEffects,rollbackReceipts:$rollbackReceipts,databaseChange:$databaseChange}' \
            > "$RUNNER_TEMP/reconcile-input.json"
          node scripts/release/reconcile-promotion.mjs "$RUNNER_TEMP/reconcile-input.json" "$RUNNER_TEMP/reconcile.json"

      - name: 记录真实最终结果
        id: final_outcome
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (always() && env.PROMOTION_STARTED == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=needs_human
          reason='promotion did not produce complete reconciliation evidence'
          if [ -s "$RUNNER_TEMP/reconcile.json" ]; then
            outcome="$(jq -r .outcome "$RUNNER_TEMP/reconcile.json")"
            reason="$(jq -r .reason "$RUNNER_TEMP/reconcile.json")"
          fi
          if [ "$outcome" = completed ] && { \
            [ "${{ steps.receipt_acs.outcome }}" != success ] || \
            [ "${{ steps.receipt_app.outcome }}" != success ] || \
            [ "${{ steps.receipt_web.outcome }}" != success ]; \
          }; then
            outcome=needs_human
            reason='component convergence lacks one or more durable operation receipts'
          fi
          if [ "$outcome" = completed ] && { \
            [ "${{ steps.deploy_acs.outcome }}" != success ] || \
            [ "${{ steps.deploy_app.outcome }}" != success ] || \
            [ "${{ steps.deploy_web.outcome }}" != success ]; \
          }; then
            outcome=needs_human
            reason='component identity convergence does not prove successful deployment and generation handoff'
          fi
          if [ "$outcome" = completed ] && { \
            [ "${{ steps.readback.outcome }}" != success ] || \
            [ "${{ steps.readback.outputs.target_match }}" != true ]; \
          }; then
            outcome=needs_human
            reason='component convergence lacks a confirmed trusted production identity'
          fi
          migration_confirmation=not_required
          if [ "$MIGRATION_PHASE" = expand ]; then
            migration_confirmation=automatic_readback_required
            if [ "$outcome" = completed ]; then
              outcome=awaiting_expand_confirmation
              reason='expand migration is physically converged; automatic finalization follows'
            fi
          fi
          reason="$(jq -nc --arg summary "$reason" --arg migrationPhase "$MIGRATION_PHASE" \
            --arg migrationConfirmation "$migration_confirmation" \
            --arg productionDeploymentId "${PRODUCTION_DEPLOYMENT_ID:-}" \
            '{summary:$summary,productionDeploymentId:$productionDeploymentId,migration:{phase:$migrationPhase,confirmation:$migrationConfirmation,contractExecuted:false},acceptance:{mode:"optional_staging_acceptance",blocking:false,workflow:"测试环境验收"}}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state "$outcome" --operation "outcome:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")" \
            || echo "::warning title=OSS attestation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"
          state=failure
          case "$outcome" in completed) state=success ;; awaiting_expand_confirmation) state=in_progress ;; esac
          if printf '%s' "${PRODUCTION_DEPLOYMENT_ID:-}" | grep -Eq '^[0-9]+$'; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$PRODUCTION_DEPLOYMENT_ID/statuses" \
              -f state="$state" -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null
          fi
          echo "PROMOTION_OUTCOME=$outcome" >> "$GITHUB_ENV"
          if [ "$outcome" = awaiting_expand_confirmation ]; then echo "expand=true" >> "$GITHUB_OUTPUT"; fi
          case "$outcome" in completed|awaiting_expand_confirmation) ;; *) exit 1 ;; esac

      - name: 自动核验扩展迁移并完成发布
        id: finalize_expand
        if: >-
          always() && !cancelled() && steps.release_evidence.outcome == 'success' &&
          (steps.final_outcome.outputs.expand == 'true' ||
           env.PROMOTION_FINALIZATION_MODE == 'confirm' || env.PROMOTION_FINALIZATION_MODE == 'repair')
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION_REASON: ${{ env.PROMOTION_REASON }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10 1800 bash scripts/release/finalize-expand-migration.sh
          echo 'PROMOTION_OUTCOME=completed' >> "$GITHUB_ENV"

      - name: 记录扩展迁移自动收尾结果
        if: always() && steps.finalize_expand.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          if [ "${{ steps.finalize_expand.outcome }}" = success ]; then state=success; fi
          if printf '%s' "${PRODUCTION_DEPLOYMENT_ID:-}" | grep -Eq '^[0-9]+$'; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$PRODUCTION_DEPLOYMENT_ID/statuses" \
              -f state="$state" -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null
          fi
          test "$state" = success

      - name: 保存可恢复的最近成功生产基线
        if: success() && env.PROMOTION_OUTCOME == 'completed'
        run: |
          set -euo pipefail
          checkpoint_remote="/tmp/release-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$checkpoint_remote'"
          scp -i ~/.ssh/production_key scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs scripts/release/config-publication.mjs scripts/release/artifact-lib.mjs \
            scripts/release/production-checkpoint.mjs scripts/release/save-production-checkpoint.sh \
            "$RUNNER_TEMP/manifest.json" "$ECS_USER@$ECS_HOST:$checkpoint_remote/"
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" \
            "$ECS_USER@$ECS_HOST:$checkpoint_remote/attestations.jsonl"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo bash '$checkpoint_remote/save-production-checkpoint.sh' '$checkpoint_remote' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo cat '$checkpoint_remote/checkpoint.json'" > "$RUNNER_TEMP/production-checkpoint.json"

      - name: 在生产变更前记录失败关闭结果
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (failure() && env.APPROVAL_RECORDED == 'true' && env.PROMOTION_STARTED != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary='promotion failed before the durable promoting marker and before production mutation'
          if [ "$PROMOTION_RETRY_MODE" = retry_after_change ]; then
            summary='recovery attempt failed before a new promoting marker; prior post-mutation recovery remains required'
          fi
          reason="$(jq -nc --arg summary "$summary" --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg recoveryMode "$PROMOTION_RETRY_MODE" \
            '{summary:$summary,runId:$runId,runAttempt:$runAttempt,recoveryMode:$recoveryMode}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state failed_before_change --operation "failed-before-change:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")" \
            || echo "::warning title=OSS attestation mirror::GitHub Release is authoritative; retry OSS mirror maintenance separately"

      - name: 上传生产发布证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-${{ env.RELEASE_ID }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/production-before.json
            ${{ runner.temp }}/production-after.json
            ${{ runner.temp }}/production-confirmed.json
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/app-handoff.json
            ${{ runner.temp }}/app-retirement*.json
            ${{ runner.temp }}/migration-confirmation*.json
            ${{ runner.temp }}/production-live*.json
            ${{ runner.temp }}/production-api-ready*.json
            ${{ runner.temp }}/attestations/

  web_recovery:
    name: 审计或修复生产 Web 冷备
    needs: dispatch
    if: github.ref == 'refs/heads/main' && (needs.dispatch.outputs.operation == 'web-recovery-audit' || needs.dispatch.outputs.operation == 'web-recovery-repair')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      RECOVERY_MODE: ${{ needs.dispatch.outputs.recovery_mode }}
      EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
      CONFIRM_RECOVERY_ONLY: ${{ inputs.confirm_recovery_only }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_WEB_DEPLOY_AK_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_WEB_DEPLOY_AK_SECRET }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      PRODUCTION_LOCK_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-web-recovery-repair
      PRODUCTION_LOCK_SCRIPT: /run/agent-saas-locks/web-recovery-${{ github.run_id }}-${{ github.run_attempt }}.sh

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: pnpm
      - name: Install dependencies for the ali-oss readback helper
        run: pnpm install --frozen-lockfile
      - name: Validate repair confirmation and run offline regression tests
        run: |
          set -euo pipefail
          node scripts/release/put-web-asset-create-only.mjs --self-check
          case "$RECOVERY_MODE" in
            audit) ;;
            repair)
              test "$CONFIRM_RECOVERY_ONLY" = true
              printf '%s' "$EXPECTED_PLAN_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
              ;;
            *) exit 1 ;;
          esac
          node --test scripts/release/web-recovery-repair.test.mjs
      - name: Install release clients and pin recovery SSH identity
        run: |
          set -euo pipefail
          bash scripts/release/install-aliyun-cli.sh
          curl -fLsS https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip -o "$RUNNER_TEMP/ossutil.zip"
          unzip -oq "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/ossutil-2.1.2-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version | grep -Fx '2.1.2'
          : "${OSS_ACCESS_KEY_ID:?Missing OSS_ACCESS_KEY_ID}"
          : "${OSS_ACCESS_KEY_SECRET:?Missing OSS_ACCESS_KEY_SECRET}"
          # Stored-bytes readback helper reads a runner-private credentials file, never argv or env.
          (
            umask 077
            jq -n --arg accessKeyId "$OSS_ACCESS_KEY_ID" --arg accessKeySecret "$OSS_ACCESS_KEY_SECRET" \
              '{accessKeyId:$accessKeyId,accessKeySecret:$accessKeySecret}' > "$RUNNER_TEMP/web-oss-sdk-credentials.json"
          )
          : "${ECS_HOST:?Missing ECS_HOST}"
          : "${ECS_USER:?Missing ECS_USER}"
          : "${ECS_SSH_KEY:?Missing ECS_SSH_KEY}"
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned SSH fingerprint}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/web_recovery_key
          chmod 600 ~/.ssh/web_recovery_key
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/recovery-host-key"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/recovery-host-key" -E sha256 | awk '{print $2}')" = "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/recovery-host-key" >> ~/.ssh/known_hosts
          echo "PRODUCTION_LOCK_SSH_KEY=$HOME/.ssh/web_recovery_key" >> "$GITHUB_ENV"
      - name: Acquire the shared Production host lock before observing any baseline
        run: |
          set -euo pipefail
          upload="/tmp/web-recovery-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -i "$PRODUCTION_LOCK_SSH_KEY" scripts/release/production-lock-lease.sh "$ECS_USER@$ECS_HOST:$upload"
          ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
            "sudo mkdir -p /run/agent-saas-locks; sudo install -m 0500 '$upload' '$PRODUCTION_LOCK_SCRIPT'; rm -f '$upload'; \
             nohup sudo env PRODUCTION_LOCK_TIMEOUT_SECONDS=1800 bash '$PRODUCTION_LOCK_SCRIPT' hold '$PRODUCTION_LOCK_TOKEN' \
             >'/tmp/$PRODUCTION_LOCK_TOKEN.log' 2>&1 </dev/null &"
          for _ in $(seq 1 60); do
            if ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
              "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'" >/dev/null 2>&1; then
              echo "RECOVERY_LOCK_ACQUIRED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Audit or repair only the cold-standby Web
        run: |
          set -euo pipefail
          bash scripts/release/run-with-production-lock-guard.sh \
            python3 scripts/release/repair-web-recovery.py
      - name: Retain bounded, content-free audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-recovery-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-recovery-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Release only this transaction's Production host lock
        if: always() && env.RECOVERY_LOCK_ACQUIRED == 'true'
        run: |
          set -euo pipefail
          ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' release '$PRODUCTION_LOCK_TOKEN'"
          ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
            "sudo rm -f '$PRODUCTION_LOCK_SCRIPT'; rm -f '/tmp/$PRODUCTION_LOCK_TOKEN.log'"
