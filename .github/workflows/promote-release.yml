      - name: 持久化 Web 操作开始回执
        id: start_web
        if: env.PROMOTION_FINALIZATION_MODE == 'promote' && (steps.deploy_app.outcome == 'success' && steps.receipt_app.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=started
          [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
