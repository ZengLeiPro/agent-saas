          fi
          if [ "$PRODUCTION_ALREADY_TARGET" = true ]; then
            echo 'ACS already equals the immutable target; keep without restart'
            exit 0
          fi
          rollback_output="$RUNNER_TEMP/deploy-acs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          rollback_local_marker="$RUNNER_TEMP/rollback-attempted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-acs"
          rollback_sentinel="AGENT_SAAS_ROLLBACK_ATTEMPTED PHASE=acs GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          rm -f "$rollback_output" "$rollback_local_marker"
          set +e
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PHASE=acs RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' READ_LIVE_COMPONENTS_SCRIPT='$PROMOTION_REMOTE/read-live-production-components.mjs' VERIFY_PROMOTION_PHASE_SCRIPT='$PROMOTION_REMOTE/verify-promotion-phase-state.mjs' ACS_UNIT_TEMPLATE='$PROMOTION_REMOTE/agent-saas-acs-orchestrator.service.template' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' ROLLBACK_ATTEMPTED_MARKER='$PROMOTION_REMOTE/rollback-attempted-acs' ROLLBACK_ATTEMPTED_RECEIPT_PATH='$PROMOTION_REMOTE/rollback-acs.attempted' ROLLBACK_SUCCEEDED_RECEIPT_PATH='$PROMOTION_REMOTE/rollback-acs.succeeded' bash '$PROMOTION_REMOTE/deploy-production-release.sh'" \
            2>&1 | tee "$rollback_output"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if grep -Fx -- "$rollback_sentinel" "$rollback_output" >/dev/null; then
            if ! install -m 0600 /dev/null "$rollback_local_marker"; then
              echo 'WARN: failed to persist ACS runner rollback-attempted fallback marker' >&2
