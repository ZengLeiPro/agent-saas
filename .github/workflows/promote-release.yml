name: Promote Staging RC to Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: '已通过 Staging 验收的 RC ID'
        required: true
        type: string
      reason:
        description: '生产晋级原因与人工验收结论'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  deployments: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PRODUCTION_WEB_OSS_URI: oss://agent-saas-web
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REPO_ID: crr-csx99pbexlsw5qqv
  ACR_REGION_ID: cn-shenzhen
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox

jobs:
  promote:
    name: Promote approved immutable artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_OBSERVATION_TOKEN: ${{ secrets.PRODUCTION_OBSERVATION_TOKEN }}
      PRODUCTION_OBSERVATION_URL: ${{ vars.PRODUCTION_OBSERVATION_URL }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}

    steps:
      - name: Validate promotion dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          printf '%s' "${{ inputs.release_id }}" | grep -Eq '^rc-[0-9]{8}-[0-9]{2,}$'
          echo "RELEASE_ID=${{ inputs.release_id }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download immutable RC evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/attestations"
          gh release download "$RELEASE_ID" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json --pattern artifact-index.json --pattern "$RELEASE_ID.jsonl"
          mv "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/release/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestations/"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts "$RUNNER_TEMP/manifest.json" "$RELEASE_ID"
          release_sha="$(jq -r .releaseSha "$RUNNER_TEMP/manifest.json")"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/manifest.json")"
          test "$(git rev-parse "$RELEASE_ID^{commit}")" = "$release_sha"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          test "$(jq -r .promotionPolicy.appAcsCompatibility "$RUNNER_TEMP/manifest.json")" = n_and_n_plus_1
          jq -e '.promotionPolicy.compatibilityEvidenceDigest | test("^sha256:[a-f0-9]{64}$")' \
            "$RUNNER_TEMP/manifest.json" >/dev/null
          test "$(jq -r .migrationPlan.contract "$RUNNER_TEMP/manifest.json")" = separate_release
          migration_phase="$(jq -r .migrationPlan.phase "$RUNNER_TEMP/manifest.json")"
          migration_confirmation="$(jq -r .migrationPlan.confirmation "$RUNNER_TEMP/manifest.json")"
          case "$migration_phase:$migration_confirmation" in
            none:not_required|expand:required_after_observation) ;;
            *) echo 'Invalid expand/confirm/contract migration plan' >&2; exit 1 ;;
          esac
          {
            echo "RELEASE_SHA=$release_sha"
            echo "MANIFEST_DIGEST=$manifest_digest"
            echo "MIGRATION_PHASE=$migration_phase"
          } >> "$GITHUB_ENV"

      - name: Validate Staging evidence and record human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          test "$(tail -n1 "$log" | jq -r .state)" = verified
          staging="$(jq -c 'select(.state=="staging_deployed")' "$log" | tail -n1)"
          test -n "$staging"
          staging_reason="$(printf '%s' "$staging" | jq -r .reason)"
          deployment_id="$(printf '%s' "$staging_reason" | jq -r .stagingDeploymentId)"
          e2e_run_id="$(printf '%s' "$staging_reason" | jq -r .e2eRunId)"
          printf '%s' "$deployment_id" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$e2e_run_id" | grep -Eq '^[1-9][0-9]*$'
          test "$(printf '%s' "$staging_reason" | jq -r .manifestDigest)" = "$MANIFEST_DIGEST"
          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id")"
          test "$(printf '%s' "$deployment" | jq -r .environment)" = staging
          test "$(printf '%s' "$deployment" | jq -r .sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$deployment" | jq -r .payload.releaseId)" = "$RELEASE_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state')" = success
          e2e_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$e2e_run_id")"
          test "$(printf '%s' "$e2e_run" | jq -r .head_sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$e2e_run" | jq -r .conclusion)" = success
          test "$(printf '%s' "$e2e_run" | jq -r .path)" = .github/workflows/deploy-staging.yml
          approval_reason="$(jq -nc \
            --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg stagingDeploymentId "$deployment_id" --arg e2eRunId "$e2e_run_id" \
            --arg triggeredAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg reason "${{ inputs.reason }}" \
            '{releaseId:$releaseId,manifestDigest:$manifestDigest,stagingDeploymentId:$stagingDeploymentId,e2eRunId:$e2eRunId,triggeredAt:$triggeredAt,reason:$reason}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state approved --operation "approval:$GITHUB_RUN_ID" --actor "$GITHUB_ACTOR" \
            --reason "$approval_reason"

      - name: Configure production SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing ECS_HOST}"; : "${ECS_USER:?Missing ECS_USER}"; : "${ECS_SSH_KEY:?Missing ECS_SSH_KEY}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          ssh-keyscan -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/production-known-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/production-known-host" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/production-known-host" >> ~/.ssh/known_hosts

      - name: Read authoritative production baseline before any write
        run: |
          set -euo pipefail
          remote="/tmp/release-preflight-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key scripts/release/read-production-state.mjs \
            scripts/release/read-runtime-identity.mjs scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/read-production-state.mjs' --output '$remote/production-before.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-before.json" \
            "$RUNNER_TEMP/production-before.json"
          pnpm exec tsx server/src/release/promotionGateCli.ts \
            --manifest "$RUNNER_TEMP/manifest.json" --attestation-root "$RUNNER_TEMP/attestations" \
            --production-state "$RUNNER_TEMP/production-before.json"

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: Prefetch and verify all selected artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected"
          fetch() { case "$1" in oss://*) aliyun oss cp "$1" "$2" ;; https://*) curl -fsSL --retry 3 "$1" -o "$2" ;; *) return 1 ;; esac; }
          for pair in 'serverBundle server-bundle.tgz' 'webAssets web-assets.tgz' 'acsOrchestrator acs-orchestrator.tgz'; do
            set -- $pair
            uri="$(jq -r ".artifacts.$1.uri" "$RUNNER_TEMP/manifest.json")"
            digest="$(jq -r ".artifacts.$1.digest" "$RUNNER_TEMP/manifest.json")"
            fetch "$uri" "$RUNNER_TEMP/selected/$2"
            test "sha256:$(sha256sum "$RUNNER_TEMP/selected/$2" | cut -d' ' -f1)" = "$digest"
          done
          expected_repository="$ACR_REGISTRY/$ACR_REPOSITORY"
          test "$(jq -r .artifacts.acsImage.repository "$RUNNER_TEMP/manifest.json")" = \
            "$expected_repository"
          expected_image_digest="$(jq -r .artifacts.acsImage.digest "$RUNNER_TEMP/manifest.json")"
          expected_image_digest="${expected_image_digest#sha256:}"
          page=1; image_found=false
          while true; do
            aliyun cr ListRepoTag --region "$ACR_REGION_ID" --InstanceId "$ACR_INSTANCE_ID" \
              --RepoId "$ACR_REPO_ID" --PageNo "$page" --PageSize 100 \
              > "$RUNNER_TEMP/acr-tags-$page.json"
            if jq -e --arg digest "$expected_image_digest" \
              '.Images[] | select(.Digest==$digest and .Status=="NORMAL")' \
              "$RUNNER_TEMP/acr-tags-$page.json" >/dev/null; then
              image_found=true
              break
            fi
            total="$(jq -r .TotalCount "$RUNNER_TEMP/acr-tags-$page.json")"
            [ $((page * 100)) -lt "$total" ] || break
            page=$((page + 1))
          done
          test "$image_found" = true

      - name: Create GitHub Production Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg ref "$RELEASE_SHA" --arg releaseId "$RELEASE_ID" \
            '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],payload:{releaseId:$releaseId}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          test "$id" -gt 0
          echo "PRODUCTION_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null

      - name: Mark promotion started
        run: |
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state promoting --operation "promoting:$GITHUB_RUN_ID" --actor "$GITHUB_ACTOR"

      - name: Upload immutable deploy payload and managed units
        run: |
          set -euo pipefail
          remote="/tmp/agent-saas-promotion-$GITHUB_RUN_ID"
          echo "PROMOTION_REMOTE=$remote" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote/artifacts'"
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/selected/"*.tgz "$ECS_USER@$ECS_HOST:$remote/artifacts/"
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/manifest.json" \
            scripts/release/deploy-production-release.sh scripts/release/write-production-identity.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          scp -i ~/.ssh/production_key \
            daemon-packaging/systemd/agent-saas-server@.service.template \
            daemon-packaging/systemd/agent-saas-runtime-worker@.service.template \
            daemon-packaging/systemd/agent-saas-acs-orchestrator.service.template \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo install -m 0644 '$remote/agent-saas-server@.service.template' /etc/systemd/system/agent-saas-server@.service && \
             sudo install -m 0644 '$remote/agent-saas-runtime-worker@.service.template' /etc/systemd/system/agent-saas-runtime-worker@.service && \
             sudo install -m 0644 '$remote/agent-saas-acs-orchestrator.service.template' /etc/systemd/system/agent-saas-acs-orchestrator.service && \
             sudo systemctl daemon-reload"

      - name: Deploy exact ACS Orchestrator and Sandbox digest first
        id: deploy_acs
        continue-on-error: true
        run: |
          if [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            echo 'ACS already equals the frozen production baseline; keep without restart'
            exit 0
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PHASE=acs RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash '$PROMOTION_REMOTE/deploy-production-release.sh'"

      - name: Deploy API blue-green and hand off Runtime Worker
        id: deploy_app
        if: steps.deploy_acs.outcome == 'success'
        continue-on-error: true
        run: |
          if [ "$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            test "$(jq -r .components.runtimeWorker.action "$RUNNER_TEMP/manifest.json")" = keep
            echo 'API and Runtime Worker already equal the frozen production baseline; keep without cutover'
            exit 0
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PHASE=app RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash '$PROMOTION_REMOTE/deploy-production-release.sh'"

      - name: Publish Web entry last and retain prior hashed assets
        id: deploy_web
        if: steps.deploy_acs.outcome == 'success' && steps.deploy_app.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            echo 'Web already equals the frozen production baseline; keep the current entry'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/web-assets" "$RUNNER_TEMP/web-before"
          tar -xzf "$RUNNER_TEMP/selected/web-assets.tgz" -C "$RUNNER_TEMP/web-assets"
          test -s "$RUNNER_TEMP/web-assets/index.html"
          jq -n --arg releaseId "$RELEASE_ID" --arg releaseSha "$(jq -r .components.web.sourceSha "$RUNNER_TEMP/manifest.json")" \
            --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg configFingerprint "$MANIFEST_DIGEST" \
            '{schemaVersion:1,environment:"production",releaseId:$releaseId,releaseSha:$releaseSha,webDigest:$webDigest,configFingerprint:$configFingerprint}' \
            > "$RUNNER_TEMP/web-assets/release-identity.json"
          had_index=false; had_identity=false
          if aliyun oss stat "$PRODUCTION_WEB_OSS_URI/index.html" >/dev/null 2>&1; then
            aliyun oss cp "$PRODUCTION_WEB_OSS_URI/index.html" "$RUNNER_TEMP/web-before/index.html"
            had_index=true
          fi
          test "$had_index" = true
          if aliyun oss stat "$PRODUCTION_WEB_OSS_URI/release-identity.json" >/dev/null 2>&1; then
            aliyun oss cp "$PRODUCTION_WEB_OSS_URI/release-identity.json" "$RUNNER_TEMP/web-before/release-identity.json"
            had_identity=true
          fi
          restore_web_entry() {
            if [ "$had_identity" = true ]; then
              aliyun oss cp "$RUNNER_TEMP/web-before/release-identity.json" "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force || true
            else
              aliyun oss rm "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force || true
            fi
            if [ "$had_index" = true ]; then
              aliyun oss cp "$RUNNER_TEMP/web-before/index.html" "$PRODUCTION_WEB_OSS_URI/index.html" --force || true
            fi
          }
          web_committed=false
          cleanup_web_on_exit() {
            [ "$web_committed" = true ] || restore_web_entry
          }
          trap cleanup_web_on_exit EXIT
          aliyun oss cp "$RUNNER_TEMP/web-assets/" "$PRODUCTION_WEB_OSS_URI/" --recursive --force \
            --exclude index.html --exclude release-identity.json
          aliyun oss cp "$RUNNER_TEMP/web-assets/release-identity.json" "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force
          aliyun oss cp "$RUNNER_TEMP/web-assets/index.html" "$PRODUCTION_WEB_OSS_URI/index.html" --force
          curl -fsS --retry 10 -H 'cache-control: no-cache' \
            "https://agent.kaiyan.net/release-identity.json?release=$RELEASE_ID" \
            | jq -e --arg digest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" '.webDigest==$digest'
          web_committed=true
          trap - EXIT

      - name: Read every live component and commit trusted identity only on complete convergence
        id: readback
        if: always() && env.PRODUCTION_DEPLOYMENT_ID != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          remote="/tmp/release-readback-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs scripts/release/read-runtime-identity.mjs \
            scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/read-live-production-components.mjs' --output '$remote/production-after.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-after.json" "$RUNNER_TEMP/production-after.json"
          jq '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' \
            "$RUNNER_TEMP/manifest.json" > "$RUNNER_TEMP/production-target.json"
          if ! diff -u <(jq -S .components "$RUNNER_TEMP/production-after.json") \
              <(jq -S . "$RUNNER_TEMP/production-target.json"); then
            echo 'target_match=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$PROMOTION_REMOTE/write-production-identity.mjs' '$PROMOTION_REMOTE/manifest.json'"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/read-production-state.mjs' --output '$remote/production-confirmed.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-confirmed.json" \
            "$RUNNER_TEMP/production-confirmed.json"
          diff -u <(jq -S .components "$RUNNER_TEMP/production-confirmed.json") \
            <(jq -S .components "$RUNNER_TEMP/production-after.json")
          echo 'target_match=true' >> "$GITHUB_OUTPUT"

      - name: Reconcile component outcome
        if: always() && env.MANIFEST_DIGEST != ''
        run: |
          set -euo pipefail
          observation_complete=false
          observed=null
          if [ -s "$RUNNER_TEMP/production-after.json" ]; then
            observation_complete=true
            observed="$(jq -c .components "$RUNNER_TEMP/production-after.json")"
          fi
          target="$(jq -c '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' "$RUNNER_TEMP/manifest.json")"
          before="$(jq -c .components "$RUNNER_TEMP/production-before.json")"
          external_side_effects=none_observed
          if [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = deploy ]; then
            external_side_effects=unknown
          fi
          jq -n --arg releaseId "$RELEASE_ID" --argjson before "$before" --argjson target "$target" \
            --argjson observed "$observed" --argjson observationComplete "$observation_complete" \
            --arg externalSideEffects "$external_side_effects" \
            --arg databaseChange "$MIGRATION_PHASE" \
            '{releaseId:$releaseId,before:$before,target:$target,observed:$observed,observationComplete:$observationComplete,externalSideEffects:$externalSideEffects,rollbackAttempted:false,databaseChange:$databaseChange}' \
            > "$RUNNER_TEMP/reconcile-input.json"
          node scripts/release/reconcile-promotion.mjs "$RUNNER_TEMP/reconcile-input.json" "$RUNNER_TEMP/reconcile.json"

      - name: Observe production for at least fifteen minutes
        id: observe
        if: steps.readback.outcome == 'success' && steps.readback.outputs.target_match == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${PRODUCTION_OBSERVATION_URL:?Missing production variable PRODUCTION_OBSERVATION_URL}"
          : "${PRODUCTION_OBSERVATION_TOKEN:?Missing production observation token}"
          printf '%s' "$PRODUCTION_OBSERVATION_TOKEN" > "$RUNNER_TEMP/observation-token"
          chmod 600 "$RUNNER_TEMP/observation-token"
          node scripts/release/observe-production.mjs --url "$PRODUCTION_OBSERVATION_URL" \
            --token-file "$RUNNER_TEMP/observation-token" --release-id "$RELEASE_ID" \
            --manifest-digest "$MANIFEST_DIGEST" --duration-ms 900000 --interval-ms 30000 \
            --output "$RUNNER_TEMP/production-observation.json"

      - name: Record truthful final outcome
        if: always() && env.MANIFEST_DIGEST != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=needs_human
          reason='promotion did not produce complete reconciliation evidence'
          if [ -s "$RUNNER_TEMP/reconcile.json" ]; then
            outcome="$(jq -r .outcome "$RUNNER_TEMP/reconcile.json")"
            reason="$(jq -r .reason "$RUNNER_TEMP/reconcile.json")"
          fi
          if [ "$outcome" = completed ] && [ "${{ steps.observe.outcome }}" != success ]; then
            outcome=needs_human
            reason='component deployment completed but the production observation window failed'
          fi
          migration_confirmation=not_required
          if [ "$MIGRATION_PHASE" = expand ]; then
            migration_confirmation=required_after_observation
            if [ "$outcome" = completed ] && [ "${{ steps.observe.outcome }}" = success ]; then
              migration_confirmation=confirmed_after_observation
            fi
          fi
          reason="$(jq -nc --arg summary "$reason" --arg migrationPhase "$MIGRATION_PHASE" \
            --arg migrationConfirmation "$migration_confirmation" \
            '{summary:$summary,migration:{phase:$migrationPhase,confirmation:$migrationConfirmation,contractExecuted:false}}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state "$outcome" --operation "outcome:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$reason"
          gh release upload "$RELEASE_ID" "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" --clobber
          state=failure
          [ "$outcome" = completed ] && state=success
          if printf '%s' "${PRODUCTION_DEPLOYMENT_ID:-}" | grep -Eq '^[0-9]+$'; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$PRODUCTION_DEPLOYMENT_ID/statuses" \
              -f state="$state" -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null
          fi
          echo "PROMOTION_OUTCOME=$outcome" >> "$GITHUB_ENV"
          test "$outcome" = completed

      - name: Upload production promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-${{ inputs.release_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/production-before.json
            ${{ runner.temp }}/production-after.json
            ${{ runner.temp }}/production-confirmed.json
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/production-observation.json
