name: Promote Staging RC to Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: '已通过 Staging 确定性门禁的 RC ID'
        required: true
        type: string
      reason:
        description: '生产晋级原因与人工验收结论'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  deployments: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PRODUCTION_WEB_OSS_URI: oss://agent-saas-web
  ACR_INSTANCE_ID: cri-tapxtcyd6odwj3m4
  ACR_REPO_ID: crr-csx99pbexlsw5qqv
  ACR_REGION_ID: cn-shenzhen
  ACR_REGISTRY: agentsaasacrprod-registry-vpc.cn-shenzhen.cr.aliyuncs.com
  ACR_REPOSITORY: agent-saas/acs-sandbox

jobs:
  promote:
    name: Promote approved immutable artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      RELEASE_RECORD_OSS_URI: ${{ vars.RELEASE_RECORD_OSS_URI }}
      RELEASE_RECORD_OSS_REGION: cn-shenzhen
      RELEASE_ID_INPUT: ${{ inputs.release_id }}
      PROMOTION_REASON: ${{ inputs.reason }}

    steps:
      - name: Validate promotion dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_ID_INPUT" =~ ^rc-[0-9]{8}-[0-9]{2,}$ ]]
          test -n "$(printf '%s' "$PROMOTION_REASON" | tr -d '[:space:]')"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID_INPUT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o "$RUNNER_TEMP/aliyun.tgz"
          tar xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: Download immutable RC evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/attestations"
          gh release download "$RELEASE_ID" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json --pattern artifact-index.json --pattern 'attestation-*.jsonl'
          mv "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/manifest.json"
          node scripts/release/attestation-snapshot.mjs select \
            "$RUNNER_TEMP/release"/attestation-*.jsonl \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          pnpm exec tsx server/src/release/validateReleaseManifestCli.ts "$RUNNER_TEMP/manifest.json" "$RELEASE_ID"
          release_sha="$(jq -r .releaseSha "$RUNNER_TEMP/manifest.json")"
          manifest_digest="$(jq -r .digest "$RUNNER_TEMP/manifest.json")"
          git fetch --no-tags origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          test "$(git rev-parse "$RELEASE_ID^{commit}")" = "$release_sha"
          tag_object="$(git rev-parse "$RELEASE_ID^{tag}")"
          git cat-file -p "$tag_object" | grep -Fx "manifest-digest: $manifest_digest"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          test "$(jq -r .migrationPlan.contract "$RUNNER_TEMP/manifest.json")" = separate_release
          migration_phase="$(jq -r .migrationPlan.phase "$RUNNER_TEMP/manifest.json")"
          migration_confirmation="$(jq -r .migrationPlan.confirmation "$RUNNER_TEMP/manifest.json")"
          case "$migration_phase:$migration_confirmation" in
            none:not_required|expand:required_after_observation) ;;
            *) echo 'Invalid expand/confirm/contract migration plan' >&2; exit 1 ;;
          esac
          {
            echo "RELEASE_SHA=$release_sha"
            echo "MANIFEST_DIGEST=$manifest_digest"
            echo "MIGRATION_PHASE=$migration_phase"
          } >> "$GITHUB_ENV"

      - name: Validate deterministic Staging evidence and record human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl"
          retry_evidence="$(node scripts/release/assert-promotion-retry.mjs "$log")"
          retry_mode="$(printf '%s' "$retry_evidence" | jq -r .mode)"
          if [ "$(printf '%s' "$retry_evidence" | jq -r .mode)" = retry_before_change ] && \
             [ "$(tail -n1 "$log" | jq -r .state)" != failed_before_change ]; then
            pnpm exec tsx server/src/release/releaseAttestationCli.ts \
              --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
              --state failed_before_change --operation "retry-before-change:$GITHUB_RUN_ID" \
              --actor "$GITHUB_ACTOR" --reason "$retry_evidence"
          fi
          staging="$(jq -c 'select(.state=="staging_deployed")' "$log" | tail -n1)"
          test -n "$staging"
          staging_reason="$(printf '%s' "$staging" | jq -r .reason)"
          deployment_id="$(printf '%s' "$staging_reason" | jq -r .stagingDeploymentId)"
          staging_run_id="$(printf '%s' "$staging_reason" | jq -r .stagingRunId)"
          verification_summary="$(printf '%s' "$staging_reason" | jq -c .verificationSummary)"
          runtime_summary="$(printf '%s' "$staging_reason" | jq -c .runtimeSummary)"
          test "$(printf '%s' "$verification_summary" | jq -r .schemaVersion)" = 1
          test "$(printf '%s' "$verification_summary" | jq -r .mode)" = deterministic-deployment-gates-v1
          test "$(printf '%s' "$verification_summary" | jq -r .status)" = passed
          expected_checks='["acs-health","api-readiness","immutable-artifacts","migration-readback","reverse-isolation","runtime-identity","web-readback"]'
          test "$(printf '%s' "$verification_summary" | jq -c '.checks | sort')" = "$expected_checks"
          printf '%s' "$deployment_id" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$staging_run_id" | grep -Eq '^[1-9][0-9]*$'
          test "$(printf '%s' "$staging_reason" | jq -r .manifestDigest)" = "$MANIFEST_DIGEST"
          expected_runtime_summary="$(jq -nc \
            --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg serverDigest "$(jq -r .components.api.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg acsOrchestratorDigest "$(jq -r .components.acs.orchestratorArtifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg acsImageDigest "$(jq -r .components.acs.sandboxImageDigest "$RUNNER_TEMP/manifest.json")" \
            --arg stagingRuntimeAssetsDigest "$(jq -r .artifacts.stagingRuntimeAssets.digest "$RUNNER_TEMP/release/artifact-index.json")" \
            '{schemaVersion:1,releaseId:$releaseId,manifestDigest:$manifestDigest,serverDigest:$serverDigest,webDigest:$webDigest,acsOrchestratorDigest:$acsOrchestratorDigest,acsImageDigest:$acsImageDigest,stagingRuntimeAssetsDigest:$stagingRuntimeAssetsDigest}')"
          test "$(printf '%s' "$runtime_summary" | jq -S .)" = \
            "$(printf '%s' "$expected_runtime_summary" | jq -S .)"
          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id")"
          test "$(printf '%s' "$deployment" | jq -r .environment)" = staging
          test "$(printf '%s' "$deployment" | jq -r .sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$deployment" | jq -r .payload.releaseId)" = "$RELEASE_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state')" = success
          staging_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$staging_run_id")"
          test "$(printf '%s' "$staging_run" | jq -r .head_sha)" = "$RELEASE_SHA"
          test "$(printf '%s' "$staging_run" | jq -r .conclusion)" = success
          test "$(printf '%s' "$staging_run" | jq -r .path)" = .github/workflows/deploy-staging.yml
          approval_reason="$(jq -nc \
            --arg releaseId "$RELEASE_ID" --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg stagingDeploymentId "$deployment_id" --arg stagingRunId "$staging_run_id" \
            --argjson verificationSummary "$verification_summary" \
            --arg triggeredAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg recoveryMode "$retry_mode" \
            --arg reason "$PROMOTION_REASON" \
            '{releaseId:$releaseId,manifestDigest:$manifestDigest,stagingDeploymentId:$stagingDeploymentId,stagingRunId:$stagingRunId,verificationSummary:$verificationSummary,triggeredAt:$triggeredAt,recoveryMode:$recoveryMode,reason:$reason}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state approved --operation "approval:$GITHUB_RUN_ID" --actor "$GITHUB_ACTOR" \
            --reason "$approval_reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          echo 'APPROVAL_RECORDED=true' >> "$GITHUB_ENV"
          echo "PROMOTION_RETRY_MODE=$retry_mode" >> "$GITHUB_ENV"

      - name: Configure production SSH
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing ECS_HOST}"; : "${ECS_USER:?Missing ECS_USER}"; : "${ECS_SSH_KEY:?Missing ECS_SSH_KEY}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned Production SSH host key fingerprint}"
          ssh-keyscan -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/production-known-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/production-known-host" -E sha256 | awk '{print $2}')" = \
            "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/production-known-host" >> ~/.ssh/known_hosts

      - name: Read authoritative production baseline before any write
        run: |
          set -euo pipefail
          remote="/tmp/release-preflight-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs scripts/release/read-runtime-identity.mjs \
            scripts/release/verify-installed-release.mjs scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          reader=read-production-state.mjs
          [ "$PROMOTION_RETRY_MODE" = retry_after_change ] && reader=read-live-production-components.mjs
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/$reader' --output '$remote/production-before.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-before.json" \
            "$RUNNER_TEMP/production-before.json"
          pnpm exec tsx server/src/release/promotionGateCli.ts \
            --manifest "$RUNNER_TEMP/manifest.json" --attestation-root "$RUNNER_TEMP/attestations" \
            --production-state "$RUNNER_TEMP/production-before.json" \
            --recovery-mode "$PROMOTION_RETRY_MODE"
          production_already_target=false
          if [ "$PROMOTION_RETRY_MODE" = retry_after_change ]; then
            jq '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' \
              "$RUNNER_TEMP/manifest.json" > "$RUNNER_TEMP/production-target.json"
            if diff -q <(jq -S .components "$RUNNER_TEMP/production-before.json") \
                <(jq -S . "$RUNNER_TEMP/production-target.json") >/dev/null; then
              production_already_target=true
            fi
          fi
          echo "PRODUCTION_ALREADY_TARGET=$production_already_target" >> "$GITHUB_ENV"

      - name: Verify immutable Manifest and artifact index from OSS record
        run: |
          set -euo pipefail
          : "${RELEASE_RECORD_OSS_URI:?Missing production variable RELEASE_RECORD_OSS_URI}"
          case "$RELEASE_RECORD_OSS_URI" in oss://*) ;; *) exit 1 ;; esac
          record_uri="$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID"
          mkdir -p "$RUNNER_TEMP/oss-record"
          aliyun --secure oss cp "$record_uri/manifest.json" \
            "$RUNNER_TEMP/oss-record/manifest.json" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$record_uri/artifact-index.json" \
            "$RUNNER_TEMP/oss-record/artifact-index.json" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$record_uri/record.json" \
            "$RUNNER_TEMP/oss-record/record.json" --region "$RELEASE_RECORD_OSS_REGION"
          diff -u <(jq -S . "$RUNNER_TEMP/manifest.json") \
            <(jq -S . "$RUNNER_TEMP/oss-record/manifest.json")
          diff -u <(jq -S . "$RUNNER_TEMP/release/artifact-index.json") \
            <(jq -S . "$RUNNER_TEMP/oss-record/artifact-index.json")
          test "$(jq -r .releaseId "$RUNNER_TEMP/oss-record/record.json")" = "$RELEASE_ID"
          test "$(jq -r .releaseSha "$RUNNER_TEMP/oss-record/record.json")" = "$RELEASE_SHA"
          test "$(jq -r .manifestDigest "$RUNNER_TEMP/oss-record/record.json")" = "$MANIFEST_DIGEST"
          test "$(jq -r .artifactDigest "$RUNNER_TEMP/oss-record/record.json")" = \
            "$(jq -r .aggregateDigest "$RUNNER_TEMP/release/artifact-index.json")"

      - name: Prefetch and verify all selected artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/built" "$RUNNER_TEMP/selected"
          fetch() { case "$1" in oss://*) aliyun --secure oss cp "$1" "$2" --region "$RELEASE_RECORD_OSS_REGION" ;; https://*) curl -fsSL --retry 3 "$1" -o "$2" ;; *) return 1 ;; esac; }
          cp "$RUNNER_TEMP/release/artifact-index.json" "$RUNNER_TEMP/built/artifact-index.json"
          built_base="$RELEASE_RECORD_OSS_URI/$RELEASE_ID"
          while IFS= read -r artifact_path; do
            [[ "$artifact_path" =~ ^[A-Za-z0-9._-]+$ ]]
            fetch "$built_base/$artifact_path" "$RUNNER_TEMP/built/$artifact_path"
          done < <(jq -r '.artifacts[] | .path' "$RUNNER_TEMP/built/artifact-index.json")
          sbom_path="$(jq -r .sbom.path "$RUNNER_TEMP/built/artifact-index.json")"
          [[ "$sbom_path" =~ ^[A-Za-z0-9._-]+$ ]]
          fetch "$built_base/$sbom_path" "$RUNNER_TEMP/built/$sbom_path"
          node scripts/release/verify-artifact.mjs \
            "$RUNNER_TEMP/built/artifact-index.json" "$RELEASE_SHA"
          for pair in 'serverBundle server-bundle.tgz' 'webAssets web-assets.tgz' 'acsOrchestrator acs-orchestrator.tgz'; do
            set -- $pair
            uri="$(jq -r ".artifacts.$1.uri" "$RUNNER_TEMP/manifest.json")"
            digest="$(jq -r ".artifacts.$1.digest" "$RUNNER_TEMP/manifest.json")"
            fetch "$uri" "$RUNNER_TEMP/selected/$2"
            test "sha256:$(sha256sum "$RUNNER_TEMP/selected/$2" | cut -d' ' -f1)" = "$digest"
          done
          expected_repository="$ACR_REGISTRY/$ACR_REPOSITORY"
          test "$(jq -r .artifacts.acsImage.repository "$RUNNER_TEMP/manifest.json")" = \
            "$expected_repository"
          expected_image_digest="$(jq -r .artifacts.acsImage.digest "$RUNNER_TEMP/manifest.json")"
          test "$(jq -r .acsImage.sourceSha "$RUNNER_TEMP/built/artifact-index.json")" = \
            "$RELEASE_SHA"
          test "$(jq -r .acsImage.digest "$RUNNER_TEMP/built/artifact-index.json")" = \
            "$expected_image_digest"
          test "$(jq -r .acsImage.reference "$RUNNER_TEMP/built/artifact-index.json")" = \
            "$expected_repository@$expected_image_digest"

      - name: Mark and persist promotion started before any production write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state promoting --operation "promoting:$GITHUB_RUN_ID" --actor "$GITHUB_ACTOR"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")"
          echo 'PROMOTION_STARTED=true' >> "$GITHUB_ENV"

      - name: Create GitHub Production Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg ref "$RELEASE_SHA" --arg releaseId "$RELEASE_ID" \
            '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],payload:{releaseId:$releaseId}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          test "$id" -gt 0
          echo "PRODUCTION_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null

      - name: Upload immutable deploy payload and managed units
        run: |
          set -euo pipefail
          remote="/tmp/agent-saas-promotion-$GITHUB_RUN_ID"
          echo "PROMOTION_REMOTE=$remote" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote/artifacts'"
          if [ "$PRODUCTION_ALREADY_TARGET" = true ]; then
            scp -i ~/.ssh/production_key "$RUNNER_TEMP/manifest.json" \
              scripts/release/write-production-identity.mjs \
              "$ECS_USER@$ECS_HOST:$remote/"
            exit 0
          fi
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/selected/"*.tgz "$ECS_USER@$ECS_HOST:$remote/artifacts/"
          scp -i ~/.ssh/production_key "$RUNNER_TEMP/manifest.json" \
            scripts/release/deploy-production-release.sh scripts/release/write-production-identity.mjs \
            scripts/release/verify-installed-release.mjs scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          scp -i ~/.ssh/production_key \
            daemon-packaging/systemd/agent-saas-server@.service.template \
            daemon-packaging/systemd/agent-saas-runtime-worker@.service.template \
            daemon-packaging/systemd/agent-saas-acs-orchestrator.service.template \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo install -m 0644 '$remote/agent-saas-server@.service.template' /etc/systemd/system/agent-saas-server@.service && \
             sudo install -m 0644 '$remote/agent-saas-runtime-worker@.service.template' /etc/systemd/system/agent-saas-runtime-worker@.service && \
             sudo install -m 0644 '$remote/agent-saas-acs-orchestrator.service.template' /etc/systemd/system/agent-saas-acs-orchestrator.service && \
             sudo systemctl daemon-reload"

      - name: Persist ACS operation start receipt
        id: start_acs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=started
          [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component acs \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-acs-start" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")"

      - name: Deploy exact ACS Orchestrator and Sandbox digest first
        id: deploy_acs
        if: steps.start_acs.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            echo 'ACS already equals the frozen production baseline; keep without restart'
            exit 0
          fi
          if [ "$PRODUCTION_ALREADY_TARGET" = true ]; then
            echo 'ACS already equals the immutable target; keep without restart'
            exit 0
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PHASE=acs RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash '$PROMOTION_REMOTE/deploy-production-release.sh'"

      - name: Persist ACS operation receipt
        id: receipt_acs
        if: always() && env.PROMOTION_STARTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.deploy_acs.outcome }}
        run: |
          set -euo pipefail
          outcome=failed
          [ "$STEP_OUTCOME" = success ] && outcome=succeeded
          [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
          [ "$STEP_OUTCOME" = skipped ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component acs \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-acs" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")"

      - name: Persist API and Worker operation start receipts
        id: start_app
        if: steps.deploy_acs.outcome == 'success' && steps.receipt_acs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for component in api runtimeWorker; do
            outcome=started
            [ "$(jq -r ".components.$component.action" "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
            [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
            receipt_json="$(node scripts/release/write-operation-receipt.mjs \
              --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component "$component" \
              --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$component-start" \
              --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
            receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
            bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
            bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
              "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")"
          done

      - name: Deploy API blue-green and hand off Runtime Worker
        id: deploy_app
        if: steps.start_app.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(jq -r .components.api.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            test "$(jq -r .components.runtimeWorker.action "$RUNNER_TEMP/manifest.json")" = keep
            echo 'API and Runtime Worker already equal the frozen production baseline; keep without cutover'
            exit 0
          fi
          if [ "$PRODUCTION_ALREADY_TARGET" = true ]; then
            echo 'API and Runtime Worker already equal the immutable target; keep without cutover'
            exit 0
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo PHASE=app RELEASE_DIR='$PROMOTION_REMOTE/artifacts' MANIFEST_PATH='$PROMOTION_REMOTE/manifest.json' EXPECTED_MANIFEST_DIGEST='$MANIFEST_DIGEST' VERIFY_INSTALLED_SCRIPT='$PROMOTION_REMOTE/verify-installed-release.mjs' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash '$PROMOTION_REMOTE/deploy-production-release.sh'"

      - name: Persist API and Worker operation receipts
        id: receipt_app
        if: always() && env.PROMOTION_STARTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.deploy_app.outcome }}
        run: |
          set -euo pipefail
          for component in api runtimeWorker; do
            outcome=failed
            [ "$STEP_OUTCOME" = success ] && outcome=succeeded
            [ "$(jq -r ".components.$component.action" "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
            [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
            [ "$STEP_OUTCOME" = skipped ] && outcome=skipped
            receipt_json="$(node scripts/release/write-operation-receipt.mjs \
              --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component "$component" \
              --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$component" \
              --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
            receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
            bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
            bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
              "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")"
          done

      - name: Persist Web operation start receipt
        id: start_web
        if: steps.deploy_app.outcome == 'success' && steps.receipt_app.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=started
          [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component web \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-web-start" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")"

      - name: Publish Web entry last and retain prior hashed assets
        id: deploy_web
        if: steps.start_web.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ]; then
            echo 'Web already equals the frozen production baseline; keep the current entry'
            exit 0
          fi
          if [ "$PRODUCTION_ALREADY_TARGET" = true ]; then
            echo 'Web already equals the immutable target; keep the current entry'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/web-assets" "$RUNNER_TEMP/web-before"
          tar -xzf "$RUNNER_TEMP/selected/web-assets.tgz" -C "$RUNNER_TEMP/web-assets"
          test -s "$RUNNER_TEMP/web-assets/index.html"
          jq -n --arg releaseId "$RELEASE_ID" --arg releaseSha "$(jq -r .components.web.sourceSha "$RUNNER_TEMP/manifest.json")" \
            --arg webDigest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" \
            --arg configFingerprint "$MANIFEST_DIGEST" \
            '{schemaVersion:1,environment:"production",releaseId:$releaseId,releaseSha:$releaseSha,webDigest:$webDigest,configFingerprint:$configFingerprint}' \
            > "$RUNNER_TEMP/web-assets/release-identity.json"
          aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/index.html" \
            "$RUNNER_TEMP/web-before/index.html" --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/release-identity.json" \
            "$RUNNER_TEMP/web-before/release-identity.json" --region "$RELEASE_RECORD_OSS_REGION"
          restore_web_entry() {
            aliyun --secure oss cp "$RUNNER_TEMP/web-before/release-identity.json" \
              "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force \
              --region "$RELEASE_RECORD_OSS_REGION" || true
            aliyun --secure oss cp "$RUNNER_TEMP/web-before/index.html" \
              "$PRODUCTION_WEB_OSS_URI/index.html" --force \
              --region "$RELEASE_RECORD_OSS_REGION" || true
          }
          web_committed=false
          cleanup_web_on_exit() {
            [ "$web_committed" = true ] || restore_web_entry
          }
          trap cleanup_web_on_exit EXIT
          aliyun --secure oss cp "$RUNNER_TEMP/web-assets/" "$PRODUCTION_WEB_OSS_URI/" \
            --recursive --force --exclude index.html --exclude release-identity.json \
            --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$RUNNER_TEMP/web-assets/release-identity.json" \
            "$PRODUCTION_WEB_OSS_URI/release-identity.json" --force \
            --region "$RELEASE_RECORD_OSS_REGION"
          aliyun --secure oss cp "$RUNNER_TEMP/web-assets/index.html" \
            "$PRODUCTION_WEB_OSS_URI/index.html" --force \
            --region "$RELEASE_RECORD_OSS_REGION"
          rm -rf "$RUNNER_TEMP/web-oss-readback"
          mkdir -p "$RUNNER_TEMP/web-oss-readback"
          while IFS= read -r -d '' source; do
            relative="${source#"$RUNNER_TEMP/web-assets/"}"
            mkdir -p "$RUNNER_TEMP/web-oss-readback/$(dirname "$relative")"
            aliyun --secure oss cp "$PRODUCTION_WEB_OSS_URI/$relative" \
              "$RUNNER_TEMP/web-oss-readback/$relative" --region "$RELEASE_RECORD_OSS_REGION"
            cmp "$source" "$RUNNER_TEMP/web-oss-readback/$relative"
          done < <(find "$RUNNER_TEMP/web-assets" -type f -print0)
          curl -fsS --retry 10 -H 'cache-control: no-cache' \
            "https://agent.kaiyan.net/release-identity.json?release=$RELEASE_ID" \
            | jq -e --arg digest "$(jq -r .components.web.artifactDigest "$RUNNER_TEMP/manifest.json")" '.webDigest==$digest'
          web_committed=true
          trap - EXIT

      - name: Persist Web operation receipt
        id: receipt_web
        if: always() && env.PROMOTION_STARTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.deploy_web.outcome }}
        run: |
          set -euo pipefail
          outcome=failed
          [ "$STEP_OUTCOME" = success ] && outcome=succeeded
          [ "$(jq -r .components.web.action "$RUNNER_TEMP/manifest.json")" = keep ] && outcome=skipped
          [ "$PRODUCTION_ALREADY_TARGET" = true ] && outcome=skipped
          [ "$STEP_OUTCOME" = skipped ] && outcome=skipped
          receipt_json="$(node scripts/release/write-operation-receipt.mjs \
            --manifest "$RUNNER_TEMP/manifest.json" --digest "$MANIFEST_DIGEST" --component web \
            --outcome "$outcome" --operation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-web" \
            --actor "$GITHUB_ACTOR" --output "$RUNNER_TEMP/operation-receipts")"
          receipt_path="$(printf '%s' "$receipt_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$receipt_path"
          bash scripts/release/upload-oss-object-immutable.sh "$receipt_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/operations/$(basename "$receipt_path")"

      - name: Read every live component and commit trusted identity only on complete convergence
        id: readback
        if: always() && env.PRODUCTION_DEPLOYMENT_ID != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          remote="/tmp/release-readback-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/production_key scripts/release/read-live-production-components.mjs \
            scripts/release/read-production-state.mjs scripts/release/read-runtime-identity.mjs \
            scripts/release/verify-installed-release.mjs scripts/release/artifact-lib.mjs \
            "$ECS_USER@$ECS_HOST:$remote/"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/read-live-production-components.mjs' --output '$remote/production-after.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-after.json" "$RUNNER_TEMP/production-after.json"
          jq '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' \
            "$RUNNER_TEMP/manifest.json" > "$RUNNER_TEMP/production-target.json"
          if ! diff -u <(jq -S .components "$RUNNER_TEMP/production-after.json") \
              <(jq -S . "$RUNNER_TEMP/production-target.json"); then
            echo 'target_match=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "sudo node '$PROMOTION_REMOTE/write-production-identity.mjs' '$PROMOTION_REMOTE/manifest.json'"
          ssh -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST" \
            "node '$remote/read-production-state.mjs' --output '$remote/production-confirmed.json' >/dev/null"
          scp -i ~/.ssh/production_key "$ECS_USER@$ECS_HOST:$remote/production-confirmed.json" \
            "$RUNNER_TEMP/production-confirmed.json"
          identity_projection='{web:{gitSha:.components.web.gitSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.gitSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.gitSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.gitSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}'
          diff -u <(jq -S "$identity_projection" "$RUNNER_TEMP/production-confirmed.json") \
            <(jq -S "$identity_projection" "$RUNNER_TEMP/production-after.json")
          echo 'target_match=true' >> "$GITHUB_OUTPUT"

      - name: Reconcile component outcome
        if: always() && env.PROMOTION_STARTED == 'true'
        run: |
          set -euo pipefail
          observation_complete=false
          observed=null
          if [ -s "$RUNNER_TEMP/production-after.json" ]; then
            observation_complete=true
            observed="$(jq -c .components "$RUNNER_TEMP/production-after.json")"
          fi
          target="$(jq -c '{web:{gitSha:.components.web.sourceSha,artifactDigest:.components.web.artifactDigest},api:{gitSha:.components.api.sourceSha,artifactDigest:.components.api.artifactDigest},runtimeWorker:{gitSha:.components.runtimeWorker.sourceSha,artifactDigest:.components.runtimeWorker.artifactDigest},acs:{gitSha:.components.acs.sourceSha,orchestratorArtifactDigest:.components.acs.orchestratorArtifactDigest,sandboxImageDigest:.components.acs.sandboxImageDigest}}' "$RUNNER_TEMP/manifest.json")"
          before="$(jq -c .components "$RUNNER_TEMP/production-before.json")"
          external_side_effects=none_observed
          if [ "$(jq -r .components.acs.action "$RUNNER_TEMP/manifest.json")" = deploy ]; then
            external_side_effects=unknown
          fi
          rollback_attempted=false
          if [ "${{ steps.deploy_acs.outcome }}" = failure ] || \
             [ "${{ steps.deploy_app.outcome }}" = failure ] || \
             [ "${{ steps.deploy_web.outcome }}" = failure ]; then
            rollback_attempted=true
          fi
          jq -n --arg releaseId "$RELEASE_ID" --argjson before "$before" --argjson target "$target" \
            --argjson observed "$observed" --argjson observationComplete "$observation_complete" \
            --arg externalSideEffects "$external_side_effects" \
            --argjson rollbackAttempted "$rollback_attempted" \
            --arg databaseChange "$MIGRATION_PHASE" \
            '{releaseId:$releaseId,before:$before,target:$target,observed:$observed,observationComplete:$observationComplete,externalSideEffects:$externalSideEffects,rollbackAttempted:$rollbackAttempted,databaseChange:$databaseChange}' \
            > "$RUNNER_TEMP/reconcile-input.json"
          node scripts/release/reconcile-promotion.mjs "$RUNNER_TEMP/reconcile-input.json" "$RUNNER_TEMP/reconcile.json"

      - name: Record truthful final outcome
        if: always() && env.PROMOTION_STARTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outcome=needs_human
          reason='promotion did not produce complete reconciliation evidence'
          if [ -s "$RUNNER_TEMP/reconcile.json" ]; then
            outcome="$(jq -r .outcome "$RUNNER_TEMP/reconcile.json")"
            reason="$(jq -r .reason "$RUNNER_TEMP/reconcile.json")"
          fi
          if [ "$outcome" = completed ] && { \
            [ "${{ steps.receipt_acs.outcome }}" != success ] || \
            [ "${{ steps.receipt_app.outcome }}" != success ] || \
            [ "${{ steps.receipt_web.outcome }}" != success ]; \
          }; then
            outcome=needs_human
            reason='component convergence lacks one or more durable operation receipts'
          fi
          migration_confirmation=not_required
          if [ "$MIGRATION_PHASE" = expand ]; then
            migration_confirmation=separate_confirmation_required
            if [ "$outcome" = completed ]; then
              outcome=needs_human
              reason='expand migration requires separate deterministic confirmation before completion'
            fi
          fi
          reason="$(jq -nc --arg summary "$reason" --arg migrationPhase "$MIGRATION_PHASE" \
            --arg migrationConfirmation "$migration_confirmation" \
            '{summary:$summary,migration:{phase:$migrationPhase,confirmation:$migrationConfirmation,contractExecuted:false},acceptance:{mode:"optional_staging_acceptance",blocking:false,workflow:"Staging Acceptance"}}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state "$outcome" --operation "outcome:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")"
          state=failure
          [ "$outcome" = completed ] && state=success
          if printf '%s' "${PRODUCTION_DEPLOYMENT_ID:-}" | grep -Eq '^[0-9]+$'; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$PRODUCTION_DEPLOYMENT_ID/statuses" \
              -f state="$state" -f environment=production -f environment_url=https://agent.kaiyan.net >/dev/null
          fi
          echo "PROMOTION_OUTCOME=$outcome" >> "$GITHUB_ENV"
          test "$outcome" = completed

      - name: Record fail-closed outcome before production mutation
        if: failure() && env.APPROVAL_RECORDED == 'true' && env.PROMOTION_STARTED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reason="$(jq -nc --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{summary:"promotion failed before the durable promoting marker and before production mutation",runId:$runId,runAttempt:$runAttempt}')"
          pnpm exec tsx server/src/release/releaseAttestationCli.ts \
            --root "$RUNNER_TEMP/attestations" --release-id "$RELEASE_ID" --digest "$MANIFEST_DIGEST" \
            --state failed_before_change --operation "failed-before-change:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --reason "$reason"
          snapshot_json="$(node scripts/release/attestation-snapshot.mjs create \
            "$RUNNER_TEMP/attestations/$RELEASE_ID.jsonl" "$RUNNER_TEMP/attestation-snapshots")"
          snapshot_path="$(printf '%s' "$snapshot_json" | jq -r .path)"
          bash scripts/release/upload-github-release-asset-immutable.sh "$RELEASE_ID" "$snapshot_path"
          bash scripts/release/upload-oss-object-immutable.sh "$snapshot_path" \
            "$RELEASE_RECORD_OSS_URI/records/$RELEASE_ID/attestations/$(basename "$snapshot_path")"

      - name: Upload production promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-${{ env.RELEASE_ID }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/production-before.json
            ${{ runner.temp }}/production-after.json
            ${{ runner.temp }}/production-confirmed.json
            ${{ runner.temp }}/reconcile.json
