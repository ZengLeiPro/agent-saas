name: Production Web Recovery Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit only, or repair the cold-standby from the verified current Web artifact'
        type: choice
        options: [audit, repair]
        default: audit
        required: true
      expected_plan_digest:
        description: 'repair only: planDigest from a reviewed audit report'
        type: string
        default: ''
        required: false
      confirm_recovery_only:
        description: 'Confirm recovery-only repair; never change OSS, DNS, API, or trusted identity'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      RECOVERY_MODE: ${{ inputs.mode }}
      EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
      CONFIRM_RECOVERY_ONLY: ${{ inputs.confirm_recovery_only }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_WEB_DEPLOY_AK_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_WEB_DEPLOY_AK_SECRET }}
      ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
      PRODUCTION_LOCK_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-web-recovery-repair
      PRODUCTION_LOCK_SCRIPT: /run/agent-saas-locks/web-recovery-${{ github.run_id }}-${{ github.run_attempt }}.sh

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          # 本工作流只用 node --test 与 python3，不安装依赖；setup-node@v5 默认按 packageManager 自动启用 pnpm 缓存，
          # 而这里没有执行 ./.github/actions/setup-pnpm，会因找不到 pnpm 直接失败（run 34307920167）。
          package-manager-cache: false
      - name: Validate repair confirmation and run offline regression tests
        run: |
          set -euo pipefail
          case "$RECOVERY_MODE" in
            audit) ;;
            repair)
              test "$CONFIRM_RECOVERY_ONLY" = true
              printf '%s' "$EXPECTED_PLAN_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
              ;;
            *) exit 1 ;;
          esac
          node --test scripts/release/web-recovery-repair.test.mjs
      - name: Install release clients and pin recovery SSH identity
        run: |
          set -euo pipefail
          bash scripts/release/install-aliyun-cli.sh
          curl -fLsS https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip -o "$RUNNER_TEMP/ossutil.zip"
          unzip -oq "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/ossutil-2.1.2-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version | grep -Fx '2.1.2'
          : "${ECS_HOST:?Missing ECS_HOST}"
          : "${ECS_USER:?Missing ECS_USER}"
          : "${ECS_SSH_KEY:?Missing ECS_SSH_KEY}"
          : "${PRODUCTION_SSH_HOST_KEY_SHA256:?Missing pinned SSH fingerprint}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/web_recovery_key
          chmod 600 ~/.ssh/web_recovery_key
          ssh-keyscan -T 10 -t ed25519 -H "$ECS_HOST" > "$RUNNER_TEMP/recovery-host-key"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/recovery-host-key" -E sha256 | awk '{print $2}')" = "$PRODUCTION_SSH_HOST_KEY_SHA256"
          cat "$RUNNER_TEMP/recovery-host-key" >> ~/.ssh/known_hosts
          echo "PRODUCTION_LOCK_SSH_KEY=$HOME/.ssh/web_recovery_key" >> "$GITHUB_ENV"
      - name: Acquire the shared Production host lock before observing any baseline
        run: |
          set -euo pipefail
          upload="/tmp/web-recovery-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -i "$PRODUCTION_LOCK_SSH_KEY" scripts/release/production-lock-lease.sh "$ECS_USER@$ECS_HOST:$upload"
          ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
            "sudo mkdir -p /run/agent-saas-locks; sudo install -m 0500 '$upload' '$PRODUCTION_LOCK_SCRIPT'; rm -f '$upload'; \
             nohup sudo env PRODUCTION_LOCK_TIMEOUT_SECONDS=1800 bash '$PRODUCTION_LOCK_SCRIPT' hold '$PRODUCTION_LOCK_TOKEN' \
             >'/tmp/$PRODUCTION_LOCK_TOKEN.log' 2>&1 </dev/null &"
          for _ in $(seq 1 60); do
            if ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
              "sudo bash '$PRODUCTION_LOCK_SCRIPT' assert '$PRODUCTION_LOCK_TOKEN'" >/dev/null 2>&1; then
              echo "RECOVERY_LOCK_ACQUIRED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Audit or repair only the cold-standby Web
        run: |
          set -euo pipefail
          bash scripts/release/run-with-production-lock-guard.sh \
            python3 scripts/release/repair-web-recovery.py
      - name: Retain bounded, content-free audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-recovery-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-recovery-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Release only this transaction's Production host lock
        if: always() && env.RECOVERY_LOCK_ACQUIRED == 'true'
        run: |
          set -euo pipefail
          ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
            "sudo bash '$PRODUCTION_LOCK_SCRIPT' release '$PRODUCTION_LOCK_TOKEN'"
          ssh -i "$PRODUCTION_LOCK_SSH_KEY" "$ECS_USER@$ECS_HOST" \
            "sudo rm -f '$PRODUCTION_LOCK_SCRIPT'; rm -f '/tmp/$PRODUCTION_LOCK_TOKEN.log'"
