appId: ${APP_ID}
---
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "login-sms-mode"
- tapOn:
    id: "login-phone-input"
- inputText: ${E2E_ACCOUNT_A_PHONE}
- tapOn:
    id: "login-send-otp"
- extendedWaitUntil:
    visible:
      id: "login-otp-input"
    timeout: 5000
- tapOn:
    id: "login-otp-input"
- inputText: ${E2E_OTP}
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "chat-session-list"
    timeout: 15000
