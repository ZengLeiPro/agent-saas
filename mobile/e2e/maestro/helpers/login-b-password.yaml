appId: ${APP_ID}
---
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "login-password-mode"
- tapOn:
    id: "login-username-input"
- inputText: ${E2E_ACCOUNT_B_USERNAME}
- tapOn:
    id: "login-password-input"
- inputText: ${E2E_ACCOUNT_B_PASSWORD}
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "chat-session-list"
    timeout: 15000
