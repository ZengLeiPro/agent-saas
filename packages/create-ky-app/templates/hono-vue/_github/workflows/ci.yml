name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyapp
          POSTGRES_PASSWORD: kyapp
          POSTGRES_DB: kyapp_test
        options: >-
          --health-cmd "pg_isready -U kyapp -d kyapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432
    env:
      TEST_DATABASE_URL: postgresql://kyapp:kyapp@127.0.0.1:5433/kyapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run secret-scan
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 安装一致性测试用的浏览器
        run: pnpm exec playwright install --with-deps chromium
      # §9.3 十六章：数据库用 GitHub service（--pg url），浏览器用 chromium。
      - run: pnpm exec ky-app doctor --pg url --browser on --report doctor-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-report
          path: doctor-report.json
